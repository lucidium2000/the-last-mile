  ctx.fillStyle = k.col; ctx.fillRect(cx - w/2, y - 15, 4, 28);
  txt(k.name, cx + 2, y, 15, k.col);
}

function drawTamPickup(col, sy){
  var cx = col*TILE + TILE*0.5, phase = col * 1.7;
  var bob = Math.sin(G.t*2.1 + phase) * 10;
  var pul = 0.5 + 0.5*Math.sin(G.t*2.6 + phase);
  var ground = sy - ROW_H*0.46;

  // beam of light
  ctx.save();
  ctx.translate(cx, ground);
  ctx.globalAlpha = 0.80 + 0.20*pul;
  ctx.fillStyle = tamBeamGrad;
  ctx.fillRect(-46, -360, 92, 360);
  ctx.globalAlpha = 0.30 + 0.22*pul;
  ctx.fillRect(-13, -360, 26, 360);
  ctx.restore();

  // glow pool on the pavement
  ctx.globalAlpha = 0.20 + 0.12*pul; ctx.fillStyle = C.pw5;
  ctx.beginPath();
  ctx.ellipse(cx, ground, 54 + 8*pul, 20 + 3*pul, 0, 0, Math.PI*2);
  ctx.fill();

  // two pulsing rings
  ctx.lineWidth = 3;
  for (var i = 0; i < 2; i++){
    var ph = (G.t*0.55 + i*0.5) % 1;
    ctx.globalAlpha = (1 - ph) * 0.55;
    ctx.strokeStyle = i ? C.brand : C.pw5;
    ctx.beginPath();
    ctx.ellipse(cx, ground, 26 + ph*46, 10 + ph*17, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  blit(S.pw_tam, col*TILE, sy - 14 - bob);

  // rising sparks, deterministic from the clock so they need no state
  ctx.fillStyle = C.pw5;
  for (var k = 0; k < 7; k++){
    var t = ((G.t*0.45) + k/7) % 1;
    var sx2 = cx + Math.sin(k*2.1 + G.t*0.8) * 30;
    var sy2 = ground - 18 - t*150;
    ctx.globalAlpha = (1 - t) * 0.85;
    var sz = 5 - t*2.5;
    ctx.fillRect(sx2 - sz/2, sy2 - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;

  // the brand mark above it, and a label so it reads at a distance
  var eyeY = sy - 182 - bob*0.6;
  ctx.globalAlpha = 0.86 + 0.14*pul;
  drawEye(cx, eyeY, 21 + 2*pul, C.pw5, "#2a1400", C.brand);
  ctx.globalAlpha = 1;
  ctx.font = 'bold 22px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var lw = ctx.measureText("TAM").width + 34;
  plate(cx - lw/2, eyeY - 62, lw, 30, "rgba(10,6,4,0.80)", 6);
  txt("TAM", cx, eyeY - 46, 22, C.pw5);
}

/* The booth itself. Drawn over him rather than instead of him, because seeing
   the silhouette turning behind the glass is the whole gag - a solid box with
   somebody's word that he is in there is just a box. */
function drawBooth(pp){
  var B = G.booth, age = B.t;
  var cx = pp.col * TILE + TILE / 2;
  var base = rowScreenY(pp.row) - 6;

  var W = 128, H = 248;
  /* Arrives fast and overshoots, the way something heavy dropped from a crane
     does. Leaves by coming apart, so after BOOTH_OUT the shell is gone and
     only the pieces are drawn. */
  var drop = age < BOOTH_IN
    ? -(1 - age / BOOTH_IN) * (1 - age / BOOTH_IN) * 520
    : Math.sin((age - BOOTH_IN) * 26) * 5 * Math.max(0, 1 - (age - BOOTH_IN) * 4);
  var top = base - H + drop, open = Math.max(0, age - BOOTH_OUT);

  if (age < BOOTH_OUT){
    // shadow it casts while it is still coming down
    ctx.globalAlpha = 0.34 * Math.min(1, age / BOOTH_IN);
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(cx, base + 4, W * 0.52, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // the glass: light enough to see him through, dark enough to be glass
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = "#9fd0e8";
    ctx.fillRect(cx - W/2 + 9, top + 34, W - 18, H - 44);
    ctx.globalAlpha = 1;

    /* He is changing, and all you see is the spin. Two bands of blue sweeping
       round the inside at different rates read as rotation; one band reads as
       a stripe. */
    if (age > BOOTH_IN){
      var spin = (age - BOOTH_IN) * 9;
      for (var b = 0; b < 2; b++){
        var ph = spin + b * Math.PI;
        var sxw = Math.cos(ph) * (W / 2 - 14);
        ctx.globalAlpha = 0.30 + 0.30 * Math.max(0, Math.cos(ph));
        ctx.fillStyle = b ? "#8fc2ff" : BLAZER;
        ctx.fillRect(cx + sxw - 9, top + 44, 18, H - 62);
        ctx.globalAlpha = 1;
      }
      // and the room light flaring as the jacket changes colour
      var flare = Math.max(0, Math.sin((age - BOOTH_IN) * 13));
      ctx.globalAlpha = 0.20 * flare;
      ctx.fillStyle = "#cfe6ff";
      ctx.fillRect(cx - W/2 + 9, top + 34, W - 18, H - 44);
      ctx.globalAlpha = 1;
    }

    // frame: uprights, rails, and the folding door split up the middle
    ctx.fillStyle = "#2b3a4a";
    ctx.fillRect(cx - W/2, top + 30, 11, H - 30);
    ctx.fillRect(cx + W/2 - 11, top + 30, 11, H - 30);
    ctx.fillRect(cx - W/2, base - 9, W, 9);
    ctx.fillStyle = "#1f2b38";
    ctx.fillRect(cx - 3, top + 44, 6, H - 56);
    ctx.fillRect(cx - W/2 + 9, top + 118, W - 18, 5);

    // the red cap, and the word that makes it the right box
    ctx.fillStyle = "#b8202f"; ctx.fillRect(cx - W/2 - 5, top, W + 10, 32);
    ctx.fillStyle = "#8e141f"; ctx.fillRect(cx - W/2 - 5, top + 26, W + 10, 6);
    txt("TELEPHONE", cx, top + 22, 17, "#f6efe2");
  }

  if (open > 0){
    /* The panels going. Each gets its own direction and a spin, and the whole
       lot fades over the last third of a second. */
    var k = Math.min(1, open / (BOOTH_SECS - BOOTH_OUT));
    ctx.globalAlpha = 1 - k;
    var shards = [[-1,-0.7,-0.5],[1,-0.8,0.6],[-1,0.25,0.9],[1,0.3,-0.7],[-0.35,-1.1,0.3],[0.4,-1.15,-0.4]];
    for (var i = 0; i < shards.length; i++){
      var sx2 = cx + shards[i][0] * k * 320;
      var sy2 = base - H*0.55 + shards[i][1] * k * 260 + k * k * 180;
      ctx.save();
      ctx.translate(sx2, sy2); ctx.rotate(shards[i][2] * k * 5);
      ctx.fillStyle = i % 3 === 0 ? "#b8202f" : "#9fd0e8";
      ctx.fillRect(-26, -40, 52, 80);
      ctx.fillStyle = "#2b3a4a"; ctx.fillRect(-26, -40, 7, 80);
      ctx.restore();
    }
    // the flash it leaves behind
    ctx.globalAlpha = Math.max(0, 1 - k * 3) * 0.8;
    ctx.fillStyle = "#eaf4ff";
    ctx.beginPath(); ctx.ellipse(cx, base - H*0.5, 150 * (1 + k), 180 * (1 + k), 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------- SUITING UP ---
   Both hands up, a jump, and the blazer colour thrown out as rings. Drawn
   over the sprite like the other reactions, for the same reason: drawPlayer
   returns early in three places. */
/* ------------------------------------------------------ THE PHONE BOOTH ---
   A TAM does not land on you, you go and get changed. A booth drops over him,
   the glass lights up while he spins inside, the panels blow off and he comes
   out flying. It is the one power-up that visibly changes who he is, so it is
   the one that gets a transformation instead of a pickup noise.

   Three beats inside BOOTH_SECS: it arrives, he changes, it comes apart. */
var BOOTH_SECS = 1.45, BOOTH_IN = 0.26, BOOTH_OUT = 1.06;
var CHEER_SECS = 1.75;
function cheerLiftNow(){
  if (G.cheerT <= 0) return 0;
  var age = CHEER_SECS - G.cheerT;
  if (age < 0.30) return Math.sin((age/0.30) * Math.PI * 0.5) * 30;   // spring up
  if (age < 1.05) return 30 - Math.sin((age-0.30) * 9) * 4;           // hang, bob
  return Math.max(0, 30 * (1 - (age - 1.05) / 0.45));                 // down
}
function drawCheer(cx, topY){
  var t = G.cheerT, age = CHEER_SECS - t;
  var a = Math.max(0, Math.min(1, t / 0.35));
  var open = Math.min(1, age / 0.26);

  // rings of blazer blue going out
  var i;
  for (i = 0; i < 3; i++){
    var rp = (age * 0.85 + i * 0.33) % 1;
    if (age < 0.1) continue;
    ctx.globalAlpha = a * (1 - rp) * 0.5;
    ctx.strokeStyle = i % 2 ? BLAZER : "#8fc2ff"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(cx, topY + 74, 30 + rp * 150, 12 + rp * 56, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = a;

  // both arms up in a V, fists at the top
  var coat = shade(BLAZER, -0.18);
  for (i = -1; i <= 1; i += 2){
    var x0 = cx + i * 24, y0 = topY + 50;
    var x1 = cx + i * (30 + 26 * open), y1 = y0 - (26 + 40 * open);
    ctx.strokeStyle = coat; ctx.lineWidth = 12; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = "#e9b98c";
    ctx.beginPath(); ctx.arc(x1, y1 - 4, 8, 0, Math.PI * 2); ctx.fill();
  }

  // sparks off the top
  for (i = 0; i < 7; i++){
    var sp = (age * 1.1 + i * 0.14) % 1;
    ctx.globalAlpha = a * (1 - sp) * 0.85;
    ctx.fillStyle = i % 3 ? "#bcd9ff" : BLAZER;
    var sx2 = cx + Math.sin(i * 2.1) * (18 + sp * 44);
    ctx.fillRect(sx2, topY - 10 - sp * 80, 5, 9);
  }
  ctx.globalAlpha = 1;
}

var EAT_AT = null;
/* A speech bubble over his head, once, the first time he goes under. Drawn
   with the overlays rather than baked, because it is a one-off and it has to
   sit above everything he is wearing. */
function drawNeedFood(cx, topY){
  var a = Math.min(1, G.needFood / 0.3, (2.6 - G.needFood) * 6);
  if (a <= 0) return;
  var hx = cx + 0.43 * SKEW;
  var rise = Math.min(1, (2.6 - G.needFood) * 5) * 8;
  /* "NEED FOOD!" at 26px is about 150px of text, which was exactly the width
     of the bubble - the letters sat on the border at both ends. Wider box,
     slightly smaller type, and a maxWidth so it can never happen again
     whatever the font falls back to. */
  var bw = 208, bh = 50, bx = hx - bw / 2, by = topY - 68 - rise;

  ctx.globalAlpha = a;
  plate(bx, by, bw, bh, "#f6efe2", 10);
  ctx.fillStyle = "#f6efe2";                       // the tail
  ctx.beginPath();
  ctx.moveTo(hx - 9, by + bh - 1);
  ctx.lineTo(hx + 9, by + bh - 1);
  ctx.lineTo(hx + 1, by + bh + 14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.danger; ctx.lineWidth = 3;
  rr(bx, by, bw, bh, 10); ctx.stroke();
  txt("NEED FOOD!", hx, by + 33, 24, "#1d1a16", "center", bw - 34);
  ctx.globalAlpha = 1;
}

/* Orange shoes while a TAM is engaged. Drawn ON the figure rather than over
   it: each shoe is the same box the model bakes, re-projected through the
   player's actual draw rect, so it lands on his feet at any scale and under
   any of the seven faces without baking a single extra sprite.

   The alternative was a shod variant of every face in both directions with
   and without the shield - twenty-eight more baked canvases on a device whose
   sprite memory is already the thing to watch. */
function drawTamShoes(){
  var A = EAT_AT;
  if (!A || A.px == null) return;
  function at(x, y, z){
    var q = proj(x, y, z);
    return [A.px + q[0] * A.kx, A.py + q[1] * A.ky];
  }
  function box(x0, x1, y0, y1, z, top, side, front){
    var a = at(x0, y0, z), b = at(x1, y0, z), c = at(x1, y1, z), d = at(x0, y1, z);
    ctx.fillStyle = top;                       // the top of the shoe
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
    ctx.closePath(); ctx.fill();
    // and the sole below the near edge
    var e = at(x0, y1, 0), f = at(x1, y1, 0);
    ctx.fillStyle = front;
    ctx.beginPath();
    ctx.moveTo(d[0], d[1]); ctx.lineTo(c[0], c[1]);
    ctx.lineTo(f[0], f[1]); ctx.lineTo(e[0], e[1]);
    ctx.closePath(); ctx.fill();
    // the outer cheek, which is what stops it reading as a flat tab
    var g = at(x1, y0, 0);
    ctx.fillStyle = side;
    ctx.beginPath();
    ctx.moveTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
    ctx.lineTo(f[0], f[1]); ctx.lineTo(g[0], g[1]);
    ctx.closePath(); ctx.fill();
  }
  var orange = "#ff7a1f";
  box(0.28, 0.44, 0.46, 0.59, 0.065, orange, shade(orange, -0.22), "#f6efe2");
  box(0.56, 0.72, 0.46, 0.59, 0.065, orange, shade(orange, -0.22), "#f6efe2");
}

function drawEatOverlay(){
  if (G.hp < HP_WORN && G.state === ST_PLAY && EAT_AT) drawWorn(EAT_AT.x, EAT_AT.y);
  if (G.needFood > 0 && G.state === ST_PLAY && EAT_AT) drawNeedFood(EAT_AT.x, EAT_AT.y);
  // and the orange shoes, if the subscription is live
  if (G.tam && G.state === ST_PLAY && G.flyA < 0.15) drawTamShoes();
  if (G.yumT > 0 && EAT_AT) drawEat(EAT_AT.x, EAT_AT.y);
  if (G.cheerT > 0 && EAT_AT) drawCheer(EAT_AT.x, EAT_AT.y);
  EAT_AT = null;
}

/* How far gone he is: 0 at the 20% threshold, 1 at nothing left. One place,
   because the face, the sweat, the slump and his walking speed all have to
   agree about it. */
function wornK(){
  if (G.hp >= HP_WORN || G.state !== ST_PLAY) return 0;
  return Math.max(0, Math.min(1, (HP_WORN - G.hp) / HP_WORN));
}
/* One breath clock, so the chest, the puff of breath and the red pulse are
   all on the same lungs. Quick in, long out - about 37 a minute, which is a
   man who has been walking too far too fast, not a man asleep.

   Returns 1 at the top of the inhale and 0 at the bottom of the exhale. */
function wornBreath(){
  var bp = (G.t * 0.62) % 1;
  return bp < 0.34 ? Math.sin((bp / 0.34) * Math.PI * 0.5)
                   : Math.cos(((bp - 0.34) / 0.66) * Math.PI * 0.5);
}
/* He sinks on his feet, and his chest lifts him on every breath. The first
   pass used a flat sine worth a couple of pixels, which read as a man gently
   bobbing rather than one fighting for air. */
function wornSag(){
  var k = wornK();
  if (!k) return 0;
  return -(3 + k * 5) + wornBreath() * (2.5 + k * 5.5);
}

/* Running on empty. The face is baked (see FACE_WORN); this is everything
   that has to move: sweat coming off him, laboured breath, and the heat
   coming off a man who has walked sixty blocks without eating.

   It gets heavier the lower he goes, so the player can read how bad it is
   without looking away from the road to check the bar. */
function drawWorn(cx, topY){
  var k = wornK();
  var a = 0.35 + k * 0.5;
  /* The anchor every overlay gets is the middle of his TILE, which is the
     model at x=0.5 on the y=0 plane. His head is on the face plane, y=0.43,
     and the projection shifts x by y*SKEW - so the head sits about twelve
     pixels to the right of the anchor and the sweat was running down the air
     beside his ear. */
  var hx = cx + 0.43 * SKEW;

  /* Sweat. Each bead hangs at the brow, swells, then flicks off and falls -
     restarting on its own cycle so they never drip in step. */
  var beads = 2 + Math.round(k * 2), i;
  for (i = 0; i < beads; i++){
    var ph = (G.t * (0.75 + i * 0.13) + i * 0.37) % 1;
    var side = i % 2 ? 1 : -1;
    /* Down the temples rather than over the middle of his face - the head is
       31px across, so +-9 and +-14 put them on the sides where sweat runs. */
    var bx = hx + side * (9 + (i >> 1) * 5);
    var by = topY + 20 + ph * ph * 58;
    ctx.globalAlpha = Math.min(1, a * 1.5) * (1 - ph * ph);
    ctx.fillStyle = "#cfe6f4";
    var r = ph < 0.25 ? 2 + ph * 8 : 4;
    ctx.fillRect(bx - r / 2, by, r, r * 1.6);
    ctx.globalAlpha = 1;
  }

  /* The puff leaves on the EXHALE, not on a clock of its own - watching a man
     heave and breathe out on different beats is worse than no breath at all. */
  var bp = (G.t * 0.62) % 1;
  var br = bp < 0.34 ? 0 : (bp - 0.34) / 0.66;
  ctx.globalAlpha = a * (bp < 0.34 ? 0 : 0.34 * (1 - br));
  ctx.fillStyle = "#dfe9f2";
  var dir = G.facing > 0 ? 1 : -1;
  for (i = 0; i < 3; i++){
    var pr = br + i * 0.06;
    ctx.beginPath();
    ctx.ellipse(hx + dir * (17 + pr * 42), topY + 40 - pr * 12,
                6 + pr * 14, 4 + pr * 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* Heat coming OFF him, so it belongs above his head and not across his
     eyes, where the first pass put it. */
  if (k > 0.45){
    ctx.globalAlpha = (k - 0.45) * 0.34;
    ctx.fillStyle = "#ff8c6a";
    for (i = 0; i < 4; i++){
      var wv = Math.sin(G.t * 5 + i * 1.7) * 5;
      ctx.fillRect(hx - 16 + wv, topY - 26 + i * 7, 32, 2);
    }
    ctx.globalAlpha = 1;
  }
}
/* ------------------------------------------------------- THE RED PULSE ---
 Tinting a baked sprite needs a composite op, and `source-atop` applies to
 the whole canvas - run it on the main context and it would wash everything
 already drawn behind him. So the silhouette is built on one scratch canvas,
 reused for the life of the page, and blitted over him at the pulse alpha.

 A tinted variant per face would have been four more baked sprites for every
 expression, and sprite memory on a panel is already up. This costs one
 canvas and four calls on the frames it is actually needed. */
var TINT_CV = null, TINT_CX = null;
function tintCanvas(sp, col){
if (!sp || !sp.img || !sp.img.width) return null;
if (!TINT_CV){
  TINT_CV = document.createElement("canvas");
  TINT_CX = TINT_CV.getContext("2d");
}
// only ever grow: resizing clears it, and it is reused every frame
if (TINT_CV.width < sp.img.width || TINT_CV.height < sp.img.height){
  TINT_CV.width = Math.max(TINT_CV.width, sp.img.width);
  TINT_CV.height = Math.max(TINT_CV.height, sp.img.height);
}
var g = TINT_CX;
g.globalCompositeOperation = "source-over";
g.globalAlpha = 1;
g.clearRect(0, 0, TINT_CV.width, TINT_CV.height);
g.drawImage(sp.img, 0, 0);
g.globalCompositeOperation = "source-atop";   // only where he already is
g.fillStyle = col;
g.fillRect(0, 0, sp.img.width, sp.img.height);
g.globalCompositeOperation = "source-over";
return TINT_CV;
}

/* He goes over when he dies. A knocked figure that simply vanishes under a
   panel has not been hit by anything, so he takes the hit, hangs for a tenth
   of a second, and then topples - accelerating, the way something that has
   stopped holding itself up falls.

   The pivot is the model origin, which blitScaled already treats as the point
   under his feet, so rotating about it swings him round his heels rather than
   round his middle. */
/* Flying is not standing in the air with a cape on. While he is actually
   crossing a gap he pitches over into the dive and comes back up as he
   lands, which is the difference between a man in flight and a man being
   carried.

   A sideways step is the one the projection can really show, so that gets
   the full lean; a step straight up the screen gets a token amount in the
   direction he faces, because bolt upright mid-flight was the whole
   complaint. Both scale with pp.sq, which is the sine of the hop - zero at
   both ends, one at the top of the arc - and with flyA, so it eases in and
   out with the transformation rather than snapping on. */
var FLY_PITCH_SIDE = 0.62, FLY_PITCH_FWD = 0.24;
function flyPitch(){
  if (G.flyA < 0.05 || G.state !== ST_PLAY) return 0;
  return Math.abs(G.flyTilt) < 0.004 ? 0 : G.flyTilt;
}

function deathTilt(){
  if (G.state !== ST_DEAD) return 0;
  /* Thrown the way the thing that hit him was going. Only a death with no
     hazard behind it - running out of road, or missing the train - falls back
     on the way he was facing, because there is nothing else to go on. */
  var dir = G.deathPush || (G.facing > 0 ? 1 : -1);
  var t = G.deadFor;
  if (t < 0.09) return -0.14 * (t / 0.09) * dir;        // the jolt, against it
  var k = Math.max(0, Math.min(1, (t - 0.09) / 0.46));
  var e = 1 - Math.pow(1 - k, 2.4);
  return (e * Math.PI * 0.5 - 0.14 * (1 - e)) * dir;
}

/* The tilt on its own was a hinge: his feet stayed exactly where they were
   and he swung down like a gate. Getting hit by something moving does not
   leave you standing in the same spot - it takes you with it. So he also
   travels, and he leaves the ground on the way.

   Both run off the same push direction the tilt uses, which means they are
   always AWAY from whatever caught him rather than whichever way he happened
   to be facing. The slide eases out - all the speed is in the contact and
   the rest is scrubbing off against the road - and the hop is half a sine,
   up off the impact and back down well before he lands flat. */
var DEATH_SLIDE = 36;      // px between where he was standing and where he lies
var DEATH_HOP   = 11;      // px of air at the top of it
function deathPushDir(){
  return G.deathPush || (G.facing > 0 ? 1 : -1);
}
function deathSlideX(){
  if (G.state !== ST_DEAD) return 0;
  var k = Math.max(0, Math.min(1, G.deadFor / 0.52));
  return deathPushDir() * DEATH_SLIDE * (1 - Math.pow(1 - k, 2.6));
}
function deathSlideY(){
  if (G.state !== ST_DEAD) return 0;
  var t = G.deadFor;
  if (t >= 0.30) return 0;
  return -DEATH_HOP * Math.sin((t / 0.30) * Math.PI);
}

function drawPlayer(pp){
  /* The cape follows FLIGHT, not the TAM. He suits back up the moment the
     initial five seconds lapse, and only transforms again when a TAM win hands
     him another two. Driving it off G.flyA (which eases 0..1 either side of
     flight) gives the change for free, and the grounded hero becomes the
     transition frame: suit -> cape -> airborne on the way up, and the reverse
     on the way down. */
  var right = G.facing > 0, s;
  if (G.flyA > 0.45)      s = right ? S.heroFly_r : S.heroFly_l;
  else if (G.flyA > 0.02) s = right ? S.hero_r    : S.hero_l;
  else {
    /* Which face he is wearing. Chewing alternates with the smile at about
       3Hz once the bites start, which is a jaw working rather than a flicker;
       anything faster read as a glitch. */
    var face = 0;
    if (G.sadT > 0) face = FACE_SAD;
    else if (G.yumT > 0){
      var eage = EAT_SECS - G.yumT;
      face = (eage >= EAT_BITE0 && Math.sin(eage * 19) > 0) ? FACE_CHEW : FACE_SMILE;
    }
    /* Lowest priority: a reaction to something in front of him beats the
       state he is in, and eating is the thing that fixes it anyway. Below
       that, the resting face is just a read-out of his health. */
    else if (G.state === ST_PLAY){
      /* The proud face belongs to the orange suit, not to the subscription -
         and the suit has its own sprite, so it is baked into heroModel rather
         than selected here. What is left is the health read-out. */
      face = G.hp < HP_WORN  ? FACE_WORN
           : G.hp < HP_LEVEL ? FACE_MEH
           : G.hp < HP_HAPPY ? FACE_FLAT
           : FACE_OK;
    }
    var suffix = (G.shield >= 2 ? "P" : G.shield ? "S" : "") + (right ? "_r" : "_l");
    s = face ? S["pf" + face + suffix]
             : (G.shield >= 2 ? (right ? S.playerP_r : S.playerP_l)
                : G.shield      ? (right ? S.playerS_r : S.playerS_l)
                                : (right ? S.player_r  : S.player_l));
  }
  if (!s) s = right ? S.player_r : S.player_l;
  var sx = pp.col*TILE, sy = rowScreenY(pp.row);
  var fly = G.flyA, flyLift = fly * 78;
  // the shadow tracks the height he is actually at, nothing per-step
  var k = (1 - pp.sq*0.07) * (1 - fly*0.45);
  ctx.globalAlpha = (0.34 - pp.sq*0.024) * (1 - fly*0.45);
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(sx + TILE*0.5, sy - ROW_H*0.46, 29*k, 11*k, 0, 0, Math.PI*2);
  ctx.fill(); ctx.globalAlpha = 1;

  if (fly > 0.02){
    // pulsing lift ring under the feet, and a warning flicker as it runs out
    var low = G.flyT > 0 && G.flyT < FLY_WARN;
    var pul = 0.5 + 0.5*Math.sin(G.t * (low ? 20 : 7));
    ctx.globalAlpha = fly * (0.30 + 0.35*pul);
    ctx.strokeStyle = low ? C.danger : C.pw5; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(sx + TILE*0.5, sy - ROW_H*0.46 - flyLift*0.22,
                34 + 10*pul, 13 + 4*pul, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = fly * 0.16; ctx.fillStyle = C.pw5;
    ctx.beginPath();
    ctx.ellipse(sx + TILE*0.5, sy - ROW_H*0.46 - flyLift*0.22, 44, 17, 0, 0, Math.PI*2);
    ctx.fill(); ctx.globalAlpha = 1;
  }
  if (G.shield || G.invulnT > 0){
    var pulse = 0.55 + 0.45*Math.sin(G.t*9);
    ctx.globalAlpha = (G.shield ? 0.8 : 0.45) * pulse;
    ctx.strokeStyle = BLAZER; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(sx + TILE*0.5, sy - ROW_H*0.46 - pp.lift*0.3, 40, 17, 0, 0, Math.PI*2);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // grows into the hero as he transforms, rather than popping
  var hk = 1 + 0.09 * G.flyA;
  var lift = cheerLiftNow() + wornSag();
  var topY = sy - pp.lift - lift - G.flyA * 78 - s.oy * ((1 + pp.sq * 0.14) * hk);
  EAT_AT = { x: sx + TILE * 0.5, y: topY };
  if (G.yumT > 0){
    /* He leans out to hand the money over, then settles back to eat. The food
       itself is NOT drawn here: drawPlayer blits the sprite after this point
       and returns early in three places (hurt flicker, flight blink, head
       shake), so anything drawn here ends up behind him or not at all. The
       anchor is recorded and the caller paints it once the sprite is down. */
    var reach = Math.max(0, 1 - (EAT_SECS - G.yumT) / EAT_TAKEN);
    sx += Math.sin(reach * Math.PI) * 9 * (G.yumDir || 1);
    EAT_AT.x = sx + TILE * 0.5;
  }
  if (G.wowT > 0) drawWow(sx + TILE * 0.5, topY, G.wowT);
  if (G.nahT > 0){
    drawSay("NO METRO CARD", sx + TILE * 0.5, topY, G.nahT);
    drawHandsUp(sx + TILE * 0.5, topY, G.nahT);
  }
  if (G.hurtT > 0){
    // flicker, and reel sideways
    if (Math.floor(G.hurtT * 26) % 2 === 0) return;
    sx += Math.sin(G.hurtT * 46) * 9;
  }
  /* Flight about to lapse: blink, quickening as it runs down. The shadow and
     the lift ring stay drawn, so you can still see where you are while the
     figure itself cuts in and out. */
  if (G.flyT > 0 && G.flyT < FLY_WARN){
    var blink = 9 + (1 - G.flyT/FLY_WARN) * 17;
    if (Math.floor(G.t * blink) % 2 === 0) return;
  }
  var dy = sy - pp.lift - lift - flyLift;
  /* The stretch belonged to a jump, and there is no jump left in the game:
     on foot it would fight the walk and in the air it put a pulse back into
     exactly the thing that was being smoothed out. A fifth of it is enough
     to stop a stride looking rigid. */
  var kx = (1 - pp.sq*0.022) * hk, ky = (1 + pp.sq*0.031) * hk;

/* A head shake, for the turnstile with no card in the wallet. The figure is
     baked as one sprite, so shaking it whole reads as a stumble; what reads as
     "no" is the head alone. Two clipped passes do it without erasing anything:
     the band below the neck draws where it always did, and the band above it
     draws a few pixels to the side. The sliver of background that opens up
     behind the head is correct - the head moved. */
  /* Every blit of the player goes through here, so the red pulse cannot be
     missed on one of the paths that returns early. It beats with the same
     lungs as the chest and the screen edges. */
  function put(sprite, px, py){
    /* Gated on the state rather than on the tilt being non-zero: the tilt is
       exactly 0 on the first frame of the fall, and the slide and the hop
       have already started by then. */
    if (G.state === ST_DEAD){
      ctx.save();
      ctx.translate(px + deathSlideX(), py + deathSlideY());
      ctx.rotate(deathTilt());
      blitScaled(sprite, 0, 0, kx, ky);
      ctx.restore();
      return;                       // nothing else belongs on a man on the floor
    }
    /* The dive. Pivoted on his middle rather than his heels - rotating
       about the origin swung him round his feet, which is a man falling
       over, not a man flying. */
    var pitch = flyPitch();
    if (pitch){
      var cy2 = py - sprite.oy * ky * 0.55;
      ctx.save();
      ctx.translate(px, cy2); ctx.rotate(pitch); ctx.translate(-px, -cy2);
      blitScaled(sprite, px, py, kx, ky);
      ctx.restore();
      if (EAT_AT){ EAT_AT.px = px; EAT_AT.py = py; EAT_AT.kx = kx; EAT_AT.ky = ky; }
      return;
    }
    blitScaled(sprite, px, py, kx, ky);
    /* Where the model's origin landed, and at what scale. A model point
       (x, y, z) projects to (mx, my) and then sits at (px + mx*kx,
       py + my*ky) on screen, because blitScaled offsets by the same ox/oy
       the projection measured from. Anything that wants to draw ON the
       figure rather than over it needs these four numbers. */
    if (EAT_AT){ EAT_AT.px = px; EAT_AT.py = py; EAT_AT.kx = kx; EAT_AT.ky = ky; }
    var wk = wornK();
    if (!wk) return;
    var tc = tintCanvas(sprite, "#ff2130");
    if (!tc) return;
    ctx.globalAlpha = (0.20 + wk * 0.45) * (0.26 + 0.74 * wornBreath());
    ctx.drawImage(tc, 0, 0, sprite.img.width, sprite.img.height,
                  px - sprite.ox*kx, py - sprite.oy*ky, sprite.w*kx, sprite.h*ky);
    ctx.globalAlpha = 1;
  }

  if (G.nahT > 0){
    var ox = sx - s.ox*kx, oy = dy - s.oy*ky, w = s.w*kx, h = s.h*ky;
    var neck = h * 0.30;                       // head is the top third of him
    var off = Math.sin(G.nahT * 32) * 7 * Math.min(1, G.nahT / 0.25);
    ctx.save();
    ctx.beginPath(); ctx.rect(ox - 2, oy + neck, w + 4, h - neck + 2); ctx.clip();
    put(s, sx, dy);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(ox - 18, oy - 2, w + 36, neck + 2); ctx.clip();
    put(s, sx + off, dy);
    ctx.restore();
    return;
  }

  var W2 = walkStride();
  if (W2){
    /* A model point (x, y, z) lands on screen at sx + (x*TILE + y*SKEW)*kx,
       dy - (y*ROW_H + z*ZH)*ky, because blitScaled offsets by the same ox/oy
       the projection measured from. That is how the band edges below are
       derived rather than guessed: y = 0.45 is the plane the arms and legs
       sit on, z = 0.30 is mid-trouser and z = 0.56 is just under the
       shoulders, and x = 0.245 / 0.755 are the inside edges of the sleeves. */
    var lx = sx - s.ox*kx, ly2 = dy - s.oy*ky, lw3 = s.w*kx;
    var bot   = ly2 + s.h*ky + 6;
    /* The leg band starts at the JACKET HEM, z = 0.33, not mid-thigh. Cut
       lower and the trouser shears against itself halfway down; cut here and
       the whole exposed leg travels as one piece with the hem covering where
       it joins. The arm band starts just under the shoulders at z = 0.56,
       one unit above the top of the sleeve, so a sleeve on the way up loses
       its top edge to the clip instead of parting from the shoulder. */
    var hip   = dy - (0.45*ROW_H + 0.330*ZH) * ky;
    var shldr = dy - (0.45*ROW_H + 0.560*ZH) * ky;
    var aL    = sx + (0.245*TILE + 0.45*SKEW) * kx;
    var aR    = sx + (0.755*TILE + 0.45*SKEW) * kx;
    var legM  = sx + (0.500*TILE + 0.45*SKEW) * kx;
    function band(x0, y0, x1, y1, oy){
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
      put(s, sx, dy + oy);
      ctx.restore();
    }
    /* Head, shoulders and torso in one pass, as a T: the full width down to
       the shoulders, then the middle only, stopping at the hem so the legs
       are not drawn twice. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(lx - 2, ly2 - 2, lw3 + 4, shldr - ly2 + 2);
    ctx.rect(aL, shldr, aR - aL, hip - shldr);
    ctx.clip();
    put(s, sx, dy);
    ctx.restore();
    band(lx - 2, shldr, aL,           bot, W2.armL);  // arm, hand, and the case
    band(aR,     shldr, lx + lw3 + 2, bot, W2.armR);
    band(aL,     hip,   legM,         bot, W2.legL);
    band(legM,   hip,   aR,           bot, W2.legR);
    return;
  }
  put(s, sx, dy);
}

function drawTicker(){
  var T = G.ticker, t = T.t;
  var pct = T.pct, K = pct / 10;
  var headline = "+" + pct.toFixed(2) + "%";
  var axis = [pct, pct * 0.5, 0];
  var LO = -0.16 * pct - 0.3, HI = 1.16 * pct + 0.4;
  var fin = Math.min(1, t / 0.28), fout = Math.min(1, (TICKER_SECS - t) / 0.3);
  var a = Math.max(0, Math.min(fin, fout));
  var rise = (1 - fin) * 46;                       // slides up as it fades in

  ctx.globalAlpha = a * 0.72; ctx.fillStyle = "#05060a";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.globalAlpha = a;

  var W = 1120, H = 730, X = (LOGICAL_W - W) / 2, Y = 176 + rise;
  plate(X, Y, W, H, "#131314", 26);
  rr(X, Y, W, H, 26); ctx.strokeStyle = "#35373b"; ctx.lineWidth = 2; ctx.stroke();

  var L = X + 52;                                  // the card's left margin
  /* No logo tile. A drawn-from-paths wordmark next to a real ticker is the
     one place on the card where a mock starts to look like a claim, and the
     ticker says who it is anyway. The name is the symbol for the same
     reason. */
  gtxt(CSCO.name, L, Y + 86, 48, "#e8eaed", "500");
  gtxt(CSCO.mkt, L + 2, Y + 128, 25, "#9aa0a6", "normal");
  ctx.fillStyle = "#9aa0a6";
  for (var d = 0; d < 3; d++) ctx.fillRect(L + 208, Y + 114 + d * 9, 4, 4);

  // the Following pill, right-aligned
  var fw = 268, fx = X + W - 52 - fw;
  rr(fx, Y + 66, fw, 62, 31); ctx.strokeStyle = "#5f6368"; ctx.lineWidth = 2; ctx.stroke();
  gtxt("\u2713  Following", fx + fw / 2, Y + 105, 26, "#e8eaed", "500", "center");

  // the number: the move itself, in green, where the price would sit
  gtxt(headline, L, Y + 236, 84, "#81c995", "500");
  var pw = ctx.measureText(headline).width;
  var gx = L + pw + 32;
  ctx.font = '500 30px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var gw = ctx.measureText(CSCO.pill).width + 44;
  plate(gx, Y + 198, gw, 54, "#1e3b29", 10);
  gtxt(CSCO.pill, gx + gw / 2, Y + 234, 30, "#81c995", "500", "center");
  gtxt(CSCO.chg, gx + gw + 24, Y + 234, 30, "#9aa0a6", "normal");

  // timestamp, disclaimer, after hours
  gtxt(CSCO.asOf + "  \u00B7  ", L, Y + 288, 24, "#9aa0a6", "normal");
  var aw = ctx.measureText(CSCO.asOf + "  \u00B7  ").width;
  gtxt("Disclaimer", L + aw, Y + 288, 24, "#8ab4f8", "normal");
  ctx.fillRect(L + aw, Y + 294, ctx.measureText("Disclaimer").width, 1);
  gtxt("After hours  +" + (pct * 0.042).toFixed(2) + "%", L, Y + 326, 24,
       "#81c995", "normal");

  // the range tabs
  var tabW = (W - 104) / CSCO.tabs.length, ty = Y + 392;
  for (var i = 0; i < CSCO.tabs.length; i++){
    var tx = L + tabW * i + tabW / 2;
    gtxt(CSCO.tabs[i], tx, ty, 26, i === 0 ? "#8ab4f8" : "#9aa0a6",
         i === 0 ? "500" : "normal", "center");
    if (i === 0){ ctx.fillStyle = "#8ab4f8"; ctx.fillRect(tx - 24, ty + 24, 48, 4); }
  }
  ctx.fillStyle = "#2e3033"; ctx.fillRect(L, ty + 26, W - 104, 2);

  /* The chart. The session runs green with a fill under it, the after-hours
     tail runs flat grey, and the cursor sits on the close between them -
     which is exactly where the real card puts it. */
  var cx0 = L + 88, cy0 = Y + 462, cw2 = W - 104 - 88, ch = 186;
  var n = CSCO.session.length + CSCO.tail.length;
  function px(i){ return cx0 + (i / (n - 1)) * cw2; }
  function py(v){ return cy0 + ch - ((v * K - LO) / (HI - LO)) * ch; }

  for (var g = 0; g < axis.length; g++){
    var yy = cy0 + ch - ((axis[g] - LO) / (HI - LO)) * ch;
    ctx.fillStyle = "#26282b"; ctx.fillRect(cx0, yy, cw2, 1);
    gtxt((axis[g] > 0 ? "+" : "") + axis[g].toFixed(1) + "%", L, yy + 8, 22,
         "#9aa0a6", "normal");
  }
  // the open, the dotted baseline the real card draws at the previous close
  ctx.setLineDash([5, 7]); ctx.strokeStyle = "#5f3f3f"; ctx.lineWidth = 2;
  var zeroY = cy0 + ch - ((0 - LO) / (HI - LO)) * ch;
  ctx.beginPath(); ctx.moveTo(cx0, zeroY); ctx.lineTo(cx0 + cw2, zeroY);
  ctx.stroke(); ctx.setLineDash([]);

  var cut = CSCO.session.length - 1, j;
  ctx.beginPath(); ctx.moveTo(px(0), py(CSCO.session[0]));
  for (j = 1; j < CSCO.session.length; j++) ctx.lineTo(px(j), py(CSCO.session[j]));
  ctx.strokeStyle = "#34a853"; ctx.lineWidth = 3; ctx.stroke();
  ctx.lineTo(px(cut), cy0 + ch); ctx.lineTo(px(0), cy0 + ch); ctx.closePath();
  ctx.globalAlpha = a * 0.16; ctx.fillStyle = "#34a853"; ctx.fill();
  ctx.globalAlpha = a;

  ctx.beginPath(); ctx.moveTo(px(cut), py(CSCO.session[cut]));
  for (j = 0; j < CSCO.tail.length; j++)
    ctx.lineTo(px(cut + 1 + j), py(CSCO.tail[j]));
  ctx.strokeStyle = "#9aa0a6"; ctx.lineWidth = 3; ctx.stroke();

  // the cursor, its dot, and the tooltip above it
  var hx = px(cut), hy = py(CSCO.session[cut]);
  ctx.setLineDash([4, 6]); ctx.strokeStyle = "#747579"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx, cy0); ctx.lineTo(hx, cy0 + ch); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(hx, hy, 8, 0, Math.PI * 2);
  ctx.fillStyle = "#bdc1c6"; ctx.fill();

  /* The tooltip lives INSIDE the chart, left of the cursor. Floated above the
     frame it landed on the range tabs and swallowed "Max". */
  ctx.font = 'bold 26px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var t1 = ctx.measureText(headline).width;
  ctx.font = 'normal 26px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var t2 = ctx.measureText(CSCO.tipTime).width, tw = t1 + t2 + 76;
  var tx0 = Math.max(cx0 + 6, Math.min(hx - tw * 0.62, cx0 + cw2 - tw - 6));
  var ty0 = Math.max(cy0 + 6, hy - 64);
  plate(tx0, ty0, tw, 48, "#2a2b2e", 8);
  gtxt(headline, tx0 + 22, ty0 + 32, 26, "#81c995", "bold");
  gtxt(CSCO.tipTime, tx0 + 22 + t1 + 32, ty0 + 32, 26, "#9aa0a6", "normal");

  // the one line that is ours, not Google's
  gtxt("CHUCK BUCKS  \u00B7  +" + cash(CHUCK_BONUS) + " ON THE NUMBER",
       X + W / 2, Y + H - 34, 26, C.brand, "bold", "center");
  ctx.globalAlpha = 1;
  drawChuck(t);
}

/* ---------------------------------------------------------------- CHUCK --
   He pops up out of the bottom-right corner, holds, and drops back out -
   the Mortal Kombat "Toasty" beat, which only works if it is fast, in the
   corner, and gone before you can look straight at it.

   To use the real photograph: base64-encode it and paste it into CHUCK_SRC
   as a complete data URI. Nothing else changes. Left empty, the pop-in draws

var CHUCK_IMG = null;
if (CHUCK_SRC){
  CHUCK_IMG = new Image();

  CHUCK_IMG.src = CHUCK_SRC;

var CHUCK_IN = 0.30, CHUCK_UP = 0.52, CHUCK_OUT = 2.30, CHUCK_GONE = 2.60;
function drawChuck(t){
  if (t < CHUCK_IN || t > CHUCK_GONE) return;
  var k;
  if (t < CHUCK_UP){ k = (t - CHUCK_IN) / (CHUCK_UP - CHUCK_IN); k = 1 - (1-k)*(1-k); }
  else if (t < CHUCK_OUT) k = 1;
  else k = 1 - (t - CHUCK_OUT) / (CHUCK_GONE - CHUCK_OUT);
  k = Math.max(0, Math.min(1, k));

  var w = 334, h = 325, x = LOGICAL_W - w - 26;   // 455:443, the photo's aspect
  /* He rises from a line 84px up, not from the very bottom: the full-screen
     control lives in that corner and was cutting across his collar. */
  var base = LOGICAL_H - 84, y = base - h * k;

  ctx.save();
  ctx.beginPath(); ctx.rect(x - 14, 0, w + 28, base); ctx.clip();
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(x + 8, y + 10, w, h);
  ctx.fillStyle = "#0d0b10";          ctx.fillRect(x - 10, y - 10, w + 20, h + 20);
  ctx.fillStyle = C.brand;            ctx.fillRect(x - 10, y - 10, w + 20, 8);

  if (CHUCK_IMG && CHUCK_IMG.complete && CHUCK_IMG.naturalWidth > 0){
    ctx.drawImage(CHUCK_IMG, x, y, w, h);
  } else {
    // the placard that stands in until the photograph is dropped in
    ctx.fillStyle = "#15121a"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#211b26";
    for (var i = 0; i < 20; i++) ctx.fillRect(x, y + i * 18, w, 9);
    ctx.fillStyle = C.brand;
    txt("$", x + w / 2, y + h * 0.42, 150, C.brand);
    txt("CHUCK", x + w / 2, y + h * 0.70, 54, C.text);
    txt("BUCKS", x + w / 2, y + h * 0.84, 38, C.textDim);
  }
  /* The brand wash ties the placard to the rest of the HUD, but over a
     photograph it just turns a face orange, so it only goes on the stand-in. */
  if (!(CHUCK_IMG && CHUCK_IMG.complete && CHUCK_IMG.naturalWidth > 0)){
    ctx.fillStyle = "rgba(255,106,19,0.14)"; ctx.fillRect(x, y, w, h);
  }
  ctx.restore();
}

/* A smile and what he is smiling at, over his head. At this scale his own
   face is twenty pixels of baked voxel, so the expression has to live in a
   bubble to be read at all - the lean below is what the body contributes. */
/* One bubble shape for every reaction, so the smile, the shrug and the blown
   mind read as the same character doing three things rather than three
   unrelated effects. Returns the box so the caller can draw into it. */
function bubble(cx, topY, bw, bh, t, hold){
  var a = Math.min(1, t / 0.18) * Math.min(1, (hold - t) / 0.22 + 1);
  a = Math.max(0, Math.min(1, a));
  var pop = 1 - Math.min(1, t / 0.16);
  var bx = cx - bw / 2, by = topY - bh - 26 + pop * 12;
  ctx.globalAlpha = a;
  ctx.fillStyle = "#f6efe2";
  ctx.beginPath(); ctx.arc(cx - 16, by + bh + 12, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - 26, by + bh + 26, 4, 0, Math.PI * 2); ctx.fill();
  plate(bx, by, bw, bh, "#f6efe2", 16);
  return { x:bx, y:by, w:bw, h:bh, a:a };
}

/* "NO METRO CARD", with his hands in the air under it */
function drawSay(str, cx, topY, t){
  ctx.font = 'bold 27px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var bw = ctx.measureText(str).width + 52;
  var b = bubble(cx, topY, bw, 62, t, 0.85);
  txt(str, cx, b.y + 38, 27, "#1d1a16");
  ctx.globalAlpha = 1;
}
/* Both arms thrown up. The sprite is baked with his arms down, so this is two
   sleeves and two hands drawn over the shoulders - at this size that is the
   whole gesture. */
function drawHandsUp(cx, topY, t){
  var up = Math.sin(Math.min(1, t / 0.9) * Math.PI);
  var coat = G.shield >= 2 ? shade(BLAZER2, -0.20)
           : G.shield      ? shade(BLAZER, -0.24) : "#19222f";
  var sy2 = topY + 46, len = 30 + up * 16;
  ctx.globalAlpha = Math.min(1, t / 0.15);
  for (var k = -1; k <= 1; k += 2){
    var x0 = cx + k * 26, x1 = cx + k * (40 + up * 8), y1 = sy2 - len;
    ctx.strokeStyle = coat; ctx.lineWidth = 11; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, sy2); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = "#e9b98c";
    ctx.beginPath(); ctx.arc(x1, y1 - 3, 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
/* The newsstand headline takes the top of his head off. */
function drawWow(cx, topY, t){
  var p = 1 - Math.min(1, t / 1.3), i;
  ctx.globalAlpha = Math.min(1, t / 0.12) * (1 - p * p) + 0.001;
  // rays off the top of his head
  ctx.strokeStyle = C.brand; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (i = 0; i < 9; i++){
    var ang = -Math.PI / 2 + (i - 4) * 0.32;
    var r0 = 26 + p * 46, r1 = r0 + 20 + p * 26;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r0, topY + 8 + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang) * r1, topY + 8 + Math.sin(ang) * r1);
    ctx.stroke();
  }
  // two rings going out
  for (i = 0; i < 2; i++){
    var rp = (p + i * 0.5) % 1;
    ctx.globalAlpha = (1 - rp) * 0.55;
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, topY + 10, 24 + rp * 104, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // and the face that goes with it
  var b = bubble(cx, topY - 56, 148, 78, t, 1.3);
  var fx = b.x + b.w / 2, fy = b.y + b.h / 2;
  ctx.fillStyle = "#1d1a16";
  for (i = -1; i <= 1; i += 2){
    ctx.beginPath(); ctx.arc(fx + i * 30, fy - 8, 10, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#f6efe2";
  for (i = -1; i <= 1; i += 2){
    ctx.beginPath(); ctx.arc(fx + i * 30 + 3, fy - 11, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#1d1a16";                       // the open mouth
  ctx.beginPath(); ctx.ellipse(fx, fy + 18, 11, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#1d1a16"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  for (i = -1; i <= 1; i += 2){                    // raised brows
    ctx.beginPath();
    ctx.arc(fx + i * 30, fy - 6, 19, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------- EATING --
   Walk into a cart and the whole transaction plays out: a five-dollar bill
   goes across to the vendor, the food comes back, and he eats it in three
   bites. The beats are driven off one clock so the sound and the picture
   cannot drift apart. */
var EAT_SECS = 1.95;
var EAT_PAY = 0.55, EAT_TAKEN = 0.80, EAT_BACK = 1.15;
var EAT_BITE0 = 1.15, EAT_BITES = 3, EAT_BITE_EV = 0.20;

/* The food itself, centred on (fx, fy) and drawn at scale k. */
function foodGlyph(kind, fx, fy, k){
  ctx.save(); ctx.translate(fx, fy); ctx.scale(k, k);
  if (kind === "hotdog"){
    ctx.fillStyle = "#e0b572";
    ctx.beginPath(); ctx.ellipse(0, 0, 27, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a8432c";
    ctx.beginPath(); ctx.ellipse(0, -2, 24, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#f0c93c"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    for (var z = 0; z < 5; z++){
      var zx = -20 + z * 10;
      if (z === 0) ctx.moveTo(zx, -5); else ctx.lineTo(zx, -5 + (z % 2 ? 6 : 0));
    }
    ctx.stroke();
  } else if (kind === "pizza"){
    ctx.fillStyle = "#f2c84b";
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(21, 12);
    ctx.lineTo(-21, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#b02030";
    ctx.beginPath(); ctx.arc(-7, 1, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 5, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -8, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b5752e"; plate(-22, 10, 44, 9, "#b5752e", 4);
  } else {
    /* A bagel is a ring, and a ring has to be stroked - a filled circle with a
       hole would need to know what is behind it. */
    ctx.strokeStyle = "#d9a85e"; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#c08f45"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 21.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#6b5330";
    for (var q = 0; q < 7; q++){
      var an = q * 0.9;
      ctx.beginPath();
      ctx.arc(Math.cos(an) * 15, Math.sin(an) * 15, 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawEat(cx, topY){
  var age = EAT_SECS - G.yumT, dir = G.yumDir || 1;
  var cart = cx + dir * TILE * 0.9, fy = topY - 10;
  ctx.globalAlpha = Math.min(1, G.yumT / 0.25);

  if (age < EAT_TAKEN){
    // the five goes across
    var k = Math.min(1, age / EAT_PAY);
    var bx = cx + (cart - cx) * k, by = fy + 16 - Math.sin(k * Math.PI) * 18;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(age * 16) * 0.18);
    plate(-21, -13, 42, 26, "#3f8f5a", 3);
    plate(-17, -9, 34, 18, "#57a76f", 2);
    txt("$" + foodPrice(G.yumKind), 0, 5, 17, "#eaf6ee");
    ctx.restore();
  } else if (age < EAT_BACK){
    // vendor has it: the amount floats off
    var r = (age - EAT_TAKEN) / (EAT_BACK - EAT_TAKEN);
    ctx.globalAlpha = (1 - r) * Math.min(1, G.yumT / 0.25);
    txt("-$" + foodPrice(G.yumKind), cart, fy - r * 34, 24, "#7fd49a");
    ctx.globalAlpha = Math.min(1, G.yumT / 0.25);
    // and the food starts back
    var fk = Math.max(0, (age - EAT_TAKEN - 0.12) / (EAT_BACK - EAT_TAKEN - 0.12));
    if (fk > 0) foodGlyph(G.yumKind, cart + (cx - cart) * fk, fy, 0.6 + fk * 0.4);
  } else {
    // three bites, from the side he is facing
    var eaten = G.yumBite / EAT_BITES, remain = 1 - eaten;
    var chew = Math.sin(age * 26) * 2.5;
    if (remain > 0.001){
      var half = 34;
      ctx.save(); ctx.beginPath();
      if (dir > 0) ctx.rect(cx - half, fy - half, half * 2 * remain, half * 2);
      else         ctx.rect(cx + half - half * 2 * remain, fy - half, half * 2 * remain, half * 2);
      ctx.clip();
      foodGlyph(G.yumKind, cx, fy + chew, 1);
      ctx.restore();
    }
    // crumbs off the last bite
    for (var c = 0; c < 4; c++){
      var cp = ((age - EAT_BITE0) * 1.6 + c * 0.25) % 1;
      ctx.globalAlpha = (1 - cp) * 0.7 * Math.min(1, G.yumT / 0.25);
      ctx.fillStyle = "#c9a36a";
      ctx.fillRect(cx - 14 + c * 9, fy + 6 + cp * 30, 3, 3);
    }
    ctx.globalAlpha = Math.min(1, G.yumT / 0.25);
    /* The satisfied beat used to be an emoji bubble floating over his head.
       He smiles himself now - see the `smiling` variant in playerModel - so
       there is nothing to draw here. */
  }
  ctx.globalAlpha = 1;
}

/* The screen edges pulse red once he is under 20%, in time with his own
   breathing, and harder the lower he gets. It is the only thing in the game
   that tells him off continuously, which is the point: the health bar is at
   the bottom of the screen and his eyes are on the traffic.

   An edge pulse rather than a full wash, because a wash over the whole
   playfield is the one thing that would make the crossing harder to read at
   exactly the moment he can least afford it. */
function drawLowHealth(){
  var k = wornK();
  if (!k || G.hurtT > 0) return;               // a real hit owns the screen
  var beat = 0.35 + 0.65 * wornBreath();
  var a = (0.16 + k * 0.40) * beat;
  var w = 26 + k * 54;

  ctx.globalAlpha = a * 0.5;
  ctx.fillStyle = "#8c0a1c";
  ctx.fillRect(0, 0, LOGICAL_W, w); ctx.fillRect(0, LOGICAL_H - w, LOGICAL_W, w);
  ctx.fillRect(0, 0, w, LOGICAL_H); ctx.fillRect(LOGICAL_W - w, 0, w, LOGICAL_H);
  ctx.globalAlpha = a;
  ctx.fillStyle = "#ff1f3a";
  var t2 = w * 0.42;
  ctx.fillRect(0, 0, LOGICAL_W, t2); ctx.fillRect(0, LOGICAL_H - t2, LOGICAL_W, t2);
  ctx.fillRect(0, 0, t2, LOGICAL_H); ctx.fillRect(LOGICAL_W - t2, 0, t2, LOGICAL_H);
  ctx.globalAlpha = 1;
}

function drawHurt(){
  if (G.hurtT <= 0) return;
  var f = G.hurtT / 0.6;
  ctx.globalAlpha = 0.34 * f;
  ctx.fillStyle = "#ff1f3a";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  // a bright rim that snaps in and drops away
  ctx.globalAlpha = 0.55 * f * f;
  ctx.fillStyle = "#ff8fa0";
  ctx.fillRect(0, 0, LOGICAL_W, 16); ctx.fillRect(0, LOGICAL_H-16, LOGICAL_W, 16);
  ctx.fillRect(0, 0, 16, LOGICAL_H); ctx.fillRect(LOGICAL_W-16, 0, 16, LOGICAL_H);
  ctx.globalAlpha = 1;
}
function drawHaze(){ ctx.fillStyle = hazeGrad; ctx.fillRect(0, HORIZON - 16, LOGICAL_W, 246); }
/* ===================== INTERNET INSIGHTS ==================================
   Paints every lane with the live risk of standing in it - seconds until a
   vehicle would reach that cell. Red is occupied or imminent, amber close,
   green clear. The product's whole proposition rendered as a mechanic: not a
   hint, but the measured state of every hop at once. */
function cellRisk(row, col){
  var p0 = col + 0.14, p1 = col + 0.86, best = 99, i;
  if (row.blocked && row.blocked[col]) return 0;
  if (row.type === "sweep") return row.phase === "idle" ? Math.max(0, row.idleFor - row.t) : 0;
  var w = row.eff || 1;
  function consider(x, v){
    if (x < p1 && x + w > p0){ best = 0; return; }
    if (!v) return;
    var t = -1;
    if (v > 0 && x + w <= p0)  t = (p0 - w - x) / v;
    else if (v < 0 && x >= p1) t = (p1 - x) / v;
    if (t >= 0 && t < best) best = t;
  }
  for (i = 0; i < row.cars.length; i++){
    var c = row.cars[i];
    consider(carX(row, c), (c.stopped || row.halt > 0) ? 0
                          : row.speed * row.dir * (row.rv || 1));
  }
  for (i = 0; i < row.parked.length; i++){
    var px = row.parked[i].col;
    if (px < p1 && px + HAZ.boxtruck.w > p0) return 0;
  }
  if (row.rogue) consider(rogueX(row), -row.speed * row.dir);
  return best;
}
/* ------------------------------------------------- INTERNET INSIGHTS ------
   The world drops to 0.28x and the screen has to say so without getting in
   the way of the thing you are trying to read. A cool wash, scanlines, a
   frame and one bright band sweeping down at normal speed - the band is what
   sells it, because it is the only thing still moving at the old rate.

   An earlier version put Matrix-style glyph rain over all of this. It looked
   the part and it was distracting, which for an overlay you play underneath
   is the only verdict that matters. */
function drawSlowTint(){
  if (G.slowT <= 0) return;
  var a = Math.min(1, G.slowT, (POWERS.insight.secs - G.slowT) * 3);
  if (a <= 0) return;

  // a cool wash, enough to say the world changed, not enough to hide it
  ctx.globalAlpha = 0.20 * a;
  ctx.fillStyle = "#050a14"; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  /* Scanlines, and a slow bright band sweeping down. The band is what sells
     the slowness: it is the only thing on screen moving at a normal rate. */
  ctx.globalAlpha = 0.09 * a; ctx.fillStyle = "#000";
  for (var y = 0; y < LOGICAL_H; y += 4) ctx.fillRect(0, y, LOGICAL_W, 2);
  var band = ((G.t * 0.22) % 1) * (LOGICAL_H + 300) - 150;
  for (var b = 0; b < 26; b++){
    ctx.globalAlpha = a * 0.045 * (1 - b / 26);
    ctx.fillStyle = "#cfe6ff";
    ctx.fillRect(0, band + b * 5, LOGICAL_W, 5);
    ctx.fillRect(0, band - b * 5, LOGICAL_W, 5);
  }

  // and a frame, so it reads as a mode rather than a filter
  ctx.globalAlpha = 0.45 * a; ctx.strokeStyle = POWERS.insight.col; ctx.lineWidth = 3;
  ctx.strokeRect(10, 10, LOGICAL_W - 20, LOGICAL_H - 20);
  ctx.globalAlpha = 0.85 * a;
  txt("SLOW MOTION", LOGICAL_W / 2, LOGICAL_H - 36, 22, POWERS.insight.col);
  ctx.globalAlpha = 1;
}
function drawRisk(){
  if (G.riskT <= 0) return;
  var fade = Math.min(1, G.riskT / 1.5);
  var lo = Math.floor(G.camRow) - 1, hi = Math.floor(G.camRow) + ROWS_AHEAD;
  for (var r = lo; r <= hi; r++){
    var row = rows[r];
    if (!row || row.type === "safe") continue;
    var sy = rowScreenY(r);
    if (sy < HORIZON || sy - ROW_H > LOGICAL_H) continue;
    for (var c = 0; c < COLS; c++){
      var t = cellRisk(row, c), col2, a;
      /* Weighted hard toward danger. Painting every safe cell at the same
         strength turned the road into a quilt and buried the traffic itself. */
      if (t <= 0.05){ col2 = "#ff2f4e"; a = 0.44; }
      else if (t < 0.5){ col2 = "#ff6a13"; a = 0.30; }
      else if (t < 1.2){ col2 = "#ffc23d"; a = 0.18; }
      else if (t < 2.4){ col2 = "#9ad84f"; a = 0.09; }
      else             { col2 = "#2fd47a"; a = 0.05; }
      ctx.globalAlpha = a * fade; ctx.fillStyle = col2;
      ctx.fillRect(c*TILE + 3, sy - ROW_H + 3, TILE - 6, ROW_H - 6);
    }
    /* A lane that just turned away gets a band and an arrow pair, so the
       player sees the cause and not only the result. Without it the traffic
       simply appears to change its mind for no reason. */
    /* A lane that has just stood on the brakes gets a band and the word for
       it. It used to show a trio of arrows saying which way it had turned,
       which is no longer what happens to it. */
    if (row.flinch > 0){
      var f = Math.min(1, row.flinch / 0.55);
      ctx.globalAlpha = f * 0.55 * fade; ctx.fillStyle = POWERS.traffic.col;
      ctx.fillRect(0, sy - ROW_H, LOGICAL_W, ROW_H);
      ctx.globalAlpha = f * 0.9 * fade;
      txt("—  STOPPED  —", LOGICAL_W/2, sy - ROW_H*0.34, 38, "#eafcff");
    }
    /* And while it is held, a steady bar along the kerb: the band is a flash,
       and he needs to know the lane is still holding for him. */
    if (row.halt > 0 && row.flinch <= 0){
      ctx.globalAlpha = 0.30 * fade; ctx.fillStyle = POWERS.traffic.col;
      ctx.fillRect(0, sy - 5, LOGICAL_W, 5);
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------------------------- HUD */
function rr(x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function plate(x,y,w,h,col,rad){ rr(x,y,w,h,rad===undefined?14:rad); ctx.fillStyle = col; ctx.fill(); }
function txt(s,x,y,size,col,align,maxW){
  ctx.font = "bold " + size + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign = align || "center"; ctx.fillStyle = col;
  if (maxW) ctx.fillText(s,x,y,maxW); else ctx.fillText(s,x,y);
}

/* A shield, drawn as a path rather than a glyph: straight across the top,
   shoulders, and a point at the bottom. It breathes, so it reads as live. */
function drawShieldBadge(x, y, w, h){
  /* Two agents, two shields: the badge doubles up so the number of free hits
     left is countable at a glance rather than inferred from the colour. */
  var two = G.shield >= 2;
  var col = two ? BLAZER2 : BLAZER;
  var glow = two ? "#d3a6ff" : "#8fc2ff";
  var edge = two ? "#e6ccff" : "#bcd9ff";
  var pul = 0.5 + 0.5 * Math.sin(G.t * 2.4);
  plate(x, y, w, h, C.ink, 12);
  var cx = x + w / 2, top = y + 10, bot = y + h - 9, hw = w * (two ? 0.26 : 0.33);

  function shield(sx, sy2, sw, sh2){
    ctx.beginPath();
    ctx.moveTo(sx - sw, sy2);
    ctx.lineTo(sx + sw, sy2);
    ctx.lineTo(sx + sw, sy2 + sh2 * 0.46);
    ctx.quadraticCurveTo(sx + sw, sy2 + sh2 * 0.86, sx, sy2 + sh2);
    ctx.quadraticCurveTo(sx - sw, sy2 + sh2 * 0.86, sx - sw, sy2 + sh2 * 0.46);
    ctx.closePath();
  }

  function one(ox, c, lit){
    ctx.globalAlpha = 0.22 + 0.18 * pul;        // the glow behind it
    ctx.fillStyle = glow;
    shield(cx + ox, top - 3, hw + 4, bot - top + 6); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = c;
    shield(cx + ox, top, hw, bot - top); ctx.fill();
    ctx.fillStyle = shade(c, 0.26);             // the lit half
    ctx.save(); ctx.beginPath();
    ctx.rect(cx + ox - hw, top, hw, bot - top); ctx.clip();
    shield(cx + ox, top, hw, bot - top); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = lit; ctx.lineWidth = 2;
    shield(cx + ox, top, hw, bot - top); ctx.stroke();
  }
  if (two){
    // the blue one behind, the purple one in front and slightly proud of it
    one(-11, BLAZER, "#bcd9ff");
    one(9, BLAZER2, edge);
    txt("E", cx + 9, top + (bot - top) * 0.60, 20, "#f3eaff");
  } else {
    one(0, col, edge);
    txt("E", cx, top + (bot - top) * 0.60, 24, "#eaf2ff");
  }
}

function drawHealth(x, y, w, h){
  var f = Math.max(0, Math.min(1, G.hp / HP_MAX));
  var low = G.hp <= HP_LOW;
  var col = G.hp > 50 ? C.good : (low ? C.danger : C.amber);
  if (low && Math.sin(G.t * 9) < 0) col = C.text;

  plate(x, y, w, h, C.ink, 12);
  txt("HEALTH", x + 22, y + 39, 25, C.textDim, "left");

  var bx = x + 136, bw = w - 136 - 104, by = y + 16, bh = h - 32;
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = col;
  ctx.fillRect(bx, by, bw * f, bh);
  /* Ticks every 25% - one meal - so you can read how many lunches you are
     down without doing arithmetic mid-crossing. */
  ctx.fillStyle = "rgba(10,6,4,0.55)";
  for (var m = 1; m < 4; m++) ctx.fillRect(bx + bw * (m / 4) - 1, by, 2, bh);
  txt(Math.round(G.hp) + "%", x + w - 22, y + 41, 30, col, "right");

  // what the last meal was worth, floating off the bar
  if (G.hpGain){
    var a = Math.min(1, G.hpGain.life / 0.4), rise = (1.5 - G.hpGain.life) * 30;
    ctx.globalAlpha = a;
    txt("+" + G.hpGain.amt + "%", bx + bw * f, y - 6 - rise, 30, C.good);
    ctx.globalAlpha = 1;
  }
}

function drawHud(){
  plate(28, 26, 470, 104, C.ink);
  txt("PIPELINE", 52, 58, 26, C.textDim, "left");
  txt(cash(pipeline()), 52, 98, 56, C.text, "left");

  // where you are, in blocks
  plate(514, 26, 250, 104, C.ink);
  txt(G.leg > 0 ? "BLOCK" : "BACK TO PENN 1", 538, 58, 26,
      G.leg > 0 ? C.textDim : C.good, "left");
  txt("W " + G.street + " ST", 538, 98, 42, C.amber, "left");

  if (G.leg < 0){
    /* Spell the countdown out: "W 68 ST" ticking down is only obvious if you
       were watching it tick up. It sits on the right of the top band - put
       beside the street it ran straight through the departure board, which
       owns the middle. */
    var togo = Math.max(0, G.street - START_ST);
    txt("BLOCKS TO PENN 1", 1740, 58, 26, C.textDim, "right");
    txt(String(togo), 1740, 100, 46, togo <= 10 ? C.good : C.amber, "right");
    /* The numbers fall while he still walks up the screen, and once the notice
       has gone this is the only thing left saying so. On the right, under the
       counter, where there is nothing else to collide with. */
    var ay2 = 158 + Math.sin(G.t * 3) * 2;
    ctx.fillStyle = C.good;
    ctx.beginPath();
    ctx.moveTo(1536, ay2 - 15);
    ctx.lineTo(1547, ay2);
    ctx.lineTo(1541, ay2);
    ctx.lineTo(1541, ay2 + 15);
    ctx.lineTo(1531, ay2 + 15);
    ctx.lineTo(1531, ay2);
    ctx.lineTo(1525, ay2);
    ctx.closePath(); ctx.fill();
    txt("STILL WALK UP", 1740, 152, 20, C.good, "right");
    txt("the numbers count down", 1740, 176, 18, C.textDim, "right");
  }

  // the departure board - the real reason you are hurrying
  var secs = Math.max(0, Math.ceil(G.trainT));
  var urgent = G.trainT < 12;
  plate(LOGICAL_W/2 - 250, 26, 500, 78, C.ink);
  txt(G.trainLine + "  ·  " + pad2(G.trainHH % 12 || 12) + ":" + pad2(G.trainMM) +
      "  ·  " + G.trainDest, LOGICAL_W/2, 50, 20, C.textDim, "center", 460);
  var tcol = urgent ? C.danger : C.amber;
  if (urgent && Math.sin(G.t*9) < 0) tcol = C.text;
  txt("DEPARTS  " + Math.floor(secs/60) + ":" + pad2(secs%60), LOGICAL_W/2, 82, 34, tcol);

  var b = best();
  if (b > 0){
    plate(LOGICAL_W-400, 26, 372, 104, C.ink);
    txt("BEST WALK", LOGICAL_W-52, 58, 26, C.textDim, "right");
    txt(cash(b), LOGICAL_W-52, 98, 44, C.good, "right");
  }

  var chips = [];
  if (G.flyT > 0)    chips.push(["T", "FLYING", C.pw5, Math.min(1, G.flyT / FLY_SECS)]);
  if (G.slowT > 0)   chips.push(["I", "INSIGHTS",       C.pw2, G.slowT / POWERS.insight.secs]);
  if (G.revealT > 0) chips.push(["P", "PATH VIS",       C.pw3,   G.revealT / POWERS.path.secs]);
  if (G.riskT > 0)   chips.push(["TI","TRAFFIC INS",    "#8fd3e8", G.riskT / POWERS.traffic.secs]);
  if (G.po)          chips.push(["PO", "PURCHASE ORDER", C.good, 0]);
  if (G.metro > 0)   chips.push([G.metro > 1 ? "M" + G.metro : "M",
                                 G.metro > 1 ? "METROCARD x" + G.metro : "METROCARD",
                                 "#ffd24a", 0]);
  /* Compact squares rather than labelled bars: four of the old chips reached
     x=1014 and ran into the arrow pad. The letter and colour identify each
     power-up, and its name was announced in full when it was collected. */
  for (var i=0;i<chips.length;i++){
    var cx = 28 + i*86, cy = CHIP_Y;
    plate(cx, cy, 76, 76, C.ink, 14);
    plate(cx+8, cy+8, 60, 60, chips[i][2], 11);
    txt(chips[i][0], cx+38, cy+41, chips[i][0].length > 1 ? 24 : 32, "#1a0a02");
    if (chips[i][3] > 0){
      var low = (chips[i][1] === "FLYING" && G.flyT < FLY_WARN);
      ctx.fillStyle = "rgba(255,255,255,0.16)"; ctx.fillRect(cx+8, cy+62, 60, 6);
      ctx.fillStyle = low && Math.sin(G.t*20) < 0 ? C.danger : chips[i][2];
      ctx.fillRect(cx+8, cy+62, 60*chips[i][3], 6);
      if (chips[i][1] === "FLYING"){
        txt(G.flyT.toFixed(1)+"s", cx+38, cy+94, 20, low ? C.danger : C.pw5);
      }
    }
  }

  /* Health, across the bottom middle. The power-up chips run along the
     bottom left and the TAM badge and the full-screen button sit bottom
     right, so the centre of that row is the one piece of furniture-free
     space on the board - and it is the number that decides whether the walk
     ends, so it gets a bar of its own rather than a chip. */
  var hbX = (LOGICAL_W - 560) / 2;
  drawHealth(hbX, 986, 560, 62);
  /* The Endpoint shield sits against the health bar rather than in the chip
     row, because what it does is take one hit instead of the bar taking it.
     Putting it with the other power-ups said nothing about which number it
     was protecting. */
  if (G.shield > 0) drawShieldBadge(hbX + 560 + 12, 986, 66, 62);

  /* Once engaged the TAM never lapses, so it gets a standing badge rather
     than a timed chip. The counter is the point: it keeps delivering. */
  if (G.tam){
    var bw = 300, bx = LOGICAL_W - bw - 28, by = CHIP_Y;
    plate(bx, by, bw, 60, C.ink, 12);
    plate(bx+10, by+10, 40, 40, C.pw5, 10);
    txt("T", bx+30, by+31, 24, "#2a1400");
    txt("TAM ENGAGED", bx+60, by+24, 20, C.pw5, "left", 230);
    txt(Math.ceil(G.tamLeft) + "s  \u00B7  " + G.tamWins +
        (G.tamWins === 1 ? " win" : " wins"), bx+60, by+44, 17,
        G.tamLeft < 12 ? C.danger : C.textDim, "left", 230);
  }

  /* Nothing shouts over the train. drawHud runs on top of drawRide, so a
     banner raised just before the turnstile - or on the single frame a ride
     ends - sat across the carriage. The ride is its own scene; let it be one. */
  if (G.ride) return;

  /* Both message bands sit ABOVE the horizon, over the skyline rather than
     over the road. They used to sit at y=380, in the clear part of the
     playfield, which hid the traffic you were about to cross. A flash
     suppresses the milestone banner rather than stacking on top of it. */
  if (G.toast && G.toast.a > 0.01 && !G.flash && !G.tamWin && !G.addonWin){
    ctx.globalAlpha = G.toast.a;
    var w = 820, x = (LOGICAL_W-w)/2;
    plate(x, MSG_Y, w, 118, "rgba(255,106,19,0.16)");
    ctx.fillStyle = C.brand; ctx.fillRect(x, MSG_Y, 8, 118);
    txt(G.toast.name,  LOGICAL_W/2, MSG_Y+34, 38, C.text,      "center", w-60);
    txt(G.toast.stage, LOGICAL_W/2, MSG_Y+68, 23, C.amber,     "center", w-60);
    txt(G.toast.line,  LOGICAL_W/2, MSG_Y+98, 21, C.brandPale, "center", w-60);
    ctx.globalAlpha = 1;
  }

  /* The TAM payout gets its own banner rather than the ordinary flash: it is
     the headline event of the power-up, it carries a number, and at 26px in a
     880-wide plate nobody was reading it. Wider, taller, slower, and the
     amount is set large on its own side of a rule. */
  if (G.tamWin){
    var W = G.tamWin, age = W.max - W.life;
    ctx.globalAlpha = Math.max(0, Math.min(1, age/0.22, W.life/0.5));
    var tw = 1280, tx = (LOGICAL_W - tw)/2, ty = MSG_Y - 14 - (1 - Math.min(1, age/0.22)) * 26;
    plate(tx, ty, tw, 174, "rgba(10,6,4,0.90)", 18);
    ctx.fillStyle = C.brand; ctx.fillRect(tx, ty, 10, 174);
    // the TAM chip
    plate(tx + 36, ty + 30, 104, 50, C.brand, 10);
    txt("TAM", tx + 88, ty + 58, 30, "#1a0a02");
    txt(W.name, tx + 172, ty + 56, 40, C.pw5, "left", 700);
    txt(W.line, tx + 172, ty + 104, 26, C.text, "left", 760);
    txt("ENGAGED  \u00B7  WIN #" + G.tamWins, tx + 172, ty + 142, 20, C.textDim, "left");
    // the number, on its own side of a rule
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.fillRect(tx + tw - 332, ty + 28, 2, 118);
    txt("ADDED TO PIPELINE", tx + tw - 166, ty + 56, 20, C.textDim);
    txt("+" + cash(W.amt), tx + tw - 166, ty + 108, 48, C.good);
    ctx.globalAlpha = 1;

  /* The attach banner. Deliberately the TAM banner's twin - same plate, same
     rule, same ADDED TO PIPELINE on the right - because they are the same
     kind of event and the player should not have to learn a second layout to
     read a number. The TAM outranks it if both land on the same frame. */
  if (G.addonWin && !G.tamWin){
    var A = G.addonWin, aage = A.max - A.life;
    ctx.globalAlpha = Math.max(0, Math.min(1, aage/0.22, A.life/0.5));
    var aw2 = 1280, ax = (LOGICAL_W - aw2)/2;
    var ay = MSG_Y - 14 - (1 - Math.min(1, aage/0.22)) * 26;
    plate(ax, ay, aw2, 174, "rgba(4,10,14,0.90)", 18);
    ctx.fillStyle = POWERS.path.col; ctx.fillRect(ax, ay, 10, 174);
    plate(ax + 36, ay + 30, 104, 50, POWERS.path.col, 10);
    txt("TE", ax + 88, ay + 58, 30, "#06161c");
    txt("TE-ADDON ATTACHED", ax + 172, ay + 56, 40, POWERS.path.col, "left", 700);
    txt(POWERS.path.line, ax + 172, ay + 104, 26, C.text, "left", 760);

    ctx.fillStyle = "rgba(255,255,255,0.14)";

    txt("ADDED TO PIPELINE", ax + aw2 - 166, ay + 56, 20, C.textDim);
    txt("+" + cash(ADDON_BONUS), ax + aw2 - 166, ay + 108, 48, C.good);
    ctx.globalAlpha = 1;
  }
  if (G.flash && !G.tamWin && !G.addonWin){
    ctx.globalAlpha = Math.min(1, G.flash.life/0.4);
    var fw = 880, fx = (LOGICAL_W-fw)/2;
    plate(fx, MSG_Y, fw, 96, C.ink);
    ctx.fillStyle = G.flash.col; ctx.fillRect(fx, MSG_Y, 8, 96);
    txt(G.flash.name, LOGICAL_W/2, MSG_Y+32, 26, G.flash.col, "center", fw-60);
    txt(G.flash.line, LOGICAL_W/2, MSG_Y+68, 21, C.text,      "center", fw-60);
    ctx.globalAlpha = 1;
  }
}

/* The brand mark, drawn from paths: an eye, because the product is about
   seeing the path. A motif in ThousandEyes' colour, not their official logo -
   swap in the real asset when you have it (it would need to be inlined as a
   data URI or redrawn here; the viewer blocks external images). */
function drawEye(cx, cy, r, col, iris, lid){
  ctx.beginPath();
  ctx.moveTo(cx - r, cy);
  ctx.quadraticCurveTo(cx, cy - r*0.92, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy + r*0.92, cx - r, cy);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if (lid){ ctx.lineWidth = Math.max(2, r*0.09); ctx.strokeStyle = lid; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(cx, cy, r*0.33, 0, Math.PI*2);
  ctx.fillStyle = iris; ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r*0.11, cy - r*0.11, r*0.10, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fill();
}

/* small persistent lockup, so the game is branded during play and not only on
   the menus. Drawn only - it has no hit test, so it never steals a hop. */

/* The mark at logo scale: a stroked lens with a solid iris, which holds its
   shape far better than a filled blob when it is large. */
function drawLogoEye(cx, cy, r){
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - r, cy);
  ctx.quadraticCurveTo(cx, cy - r * 0.78, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy + r * 0.78, cx - r, cy);
  ctx.closePath();
  ctx.lineWidth = r * 0.135; ctx.strokeStyle = C.brand; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.30, 0, Math.PI * 2);
  ctx.fillStyle = C.brand; ctx.fill();
}

function drawLockup(){
  ctx.globalAlpha = 0.68;
  drawLogoEye(52, LOGICAL_H - 46, 16);
  ctx.globalAlpha = 1;
}

function drawMuteBtn(){

  ctx.lineTo(cx + 4,  cy + 23); ctx.lineTo(cx - 11, cy + 9);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  if (on){
    for (var i=1;i<=2;i++){

    }
