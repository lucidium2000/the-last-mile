/* The readout. Lines slide in one at a time and count up, the total lands last
   and large, then the stats and the rank. Everything is driven off one clock
   (G.tally.t) so a tap can run the whole thing out at once. */
function drawTally(top, accent){
  var T = G.tally;
  if (!T){ return; }
  var W = 1080, X = (LOGICAL_W - W) / 2, y = top;

  plate(X, y, W, 58 + T.rows.length * 52 + 112, "rgba(10,6,4,0.84)", 16);
  ctx.fillStyle = accent; ctx.fillRect(X, y, 7, 58 + T.rows.length * 52 + 112);
  txt("THE TALLY", X + 34, y + 40, 22, C.textDim, "left");

  var ry = y + 74, i;
  for (i = 0; i < T.rows.length; i++){
    var R = T.rows[i], k = tallyAt(i);
    if (k <= 0) continue;
    /* Slide in from the left as it appears - a number that simply materialises
       at full opacity reads as a glitch rather than an arrival. */
    var slide = (1 - Math.min(1, k * 4)) * 40;
    ctx.globalAlpha = Math.min(1, k * 4);
    txt(R.label, X + 34 - slide, ry + i * 52, 29, C.textDim, "left");
    txt(R.note,  X + 430 - slide, ry + i * 52, 25, "rgba(253,244,238,0.40)", "left");
    var shown = Math.round(R.amt * ease(k));
    txt(cash(shown), X + W - 34, ry + i * 52, 34, k >= 1 ? R.col : C.textDim, "right");
    ctx.globalAlpha = 1;
  }

  var ly = ry + T.rows.length * 52 + 4;
  var tk = tallyTotalAt();
  if (tk > 0){
    ctx.globalAlpha = Math.min(1, tk * 5);
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.fillRect(X + 34, ly, (W - 68) * Math.min(1, tk * 2.2), 2);
    txt(G.won ? "PIPELINE BOOKED" : "PIPELINE BUILT", X + 34, ly + 56, 28, C.textDim, "left");
    /* The total overshoots its size on landing. It is the one number anybody
       repeats afterwards, so it gets the only piece of animation on the page
       that is purely for effect.

       Clamped at BOTH ends. A tap runs the tally out at once, which sets
       tk to 1 while T.t is still near zero, and the unclamped term then went
       to about 25 - a 3.5x total printed straight across the rows underneath
       it. It only showed up on a skip, which is the path nobody watches. */
    var landed = TALLY_T0 + T.rows.length*TALLY_GAP + 0.25 + TALLY_TOTAL;
    var pop = tk >= 1
      ? 1 + 0.10 * Math.max(0, Math.min(1, 1 - (T.t - landed) * 5))
      : 1;
    var big = Math.round(76 * pop);
    txt(cash(Math.round(T.total * ease(tk))), X + W - 34, ly + 66, big,
        tk >= 1 ? (G.won ? C.good : C.text) : C.textDim, "right");
    ctx.globalAlpha = 1;
  }

  // the things that are not money
  if (tallyOver()){
    var sy2 = ly + 112, line = "";
    for (i = 0; i < T.stats.length; i++)
      line += (i ? "   \u00B7   " : "") + T.stats[i][0] + " " + T.stats[i][1];
    txt(line, LOGICAL_W/2, sy2, 24, "rgba(253,244,238,0.52)", "center", W - 40);
    txt(rankFor(G.maxRow), LOGICAL_W/2, sy2 + 54, 38, C.brand);
    if (T.total > T.was && T.was > 0){
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 6);
      txt("NEW PERSONAL BEST", LOGICAL_W/2, sy2 + 96, 26, C.good);
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.t * 3);
    txt("TAP ANYWHERE TO PURSUE A NEW PROSPECT", LOGICAL_W/2, sy2 + 148, 34, C.brand);
    ctx.globalAlpha = 1;
  } else if (G.deadFor > 0.8){
    ctx.globalAlpha = 0.34;
    txt("TAP TO SKIP", LOGICAL_W/2, ly + 170, 22, C.textDim);
    ctx.globalAlpha = 1;
  }
}
/* Fast at first, settling at the end - a counter that climbs linearly and stops
   dead feels like a progress bar, not a till. */
function ease(k){ return 1 - Math.pow(1 - k, 3); }

/* The only way this screen appears is a signed order carried the whole way
   back to Penn 1, so it reads as an ending rather than a score card. */
function drawWon(){
  ctx.fillStyle = "rgba(6,10,8,0.88)";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  for (var i = 0; i < 60; i++){                       // it keeps raining
    var cp = (G.t * 0.32 + (i % 15) / 15) % 1;
    ctx.globalAlpha = (1 - cp) * 0.8;
    ctx.fillStyle = [C.brand, "#ffd166", "#7fd49a", "#8ab4f8"][i % 4];
    ctx.fillRect(40 + i * 31 + Math.sin(G.t * 2 + i) * 30, -40 + cp * 1160, 10, 20);
  }
  ctx.globalAlpha = 1;
  txt("BOOKED", LOGICAL_W/2, 212, 118, C.good);
  txt("PENN 1 \u00B7 THE PAPER IS ON THE DESK", LOGICAL_W/2, 296, 34, C.text);

  plate(LOGICAL_W/2-580, 344, 1160, 128, C.ink);
  ctx.fillStyle = C.good; ctx.fillRect(LOGICAL_W/2-580, 344, 8, 128);
  txt("You walked it uptown, you got the signature, and you walked it back.",
      LOGICAL_W/2, 390, 30, C.textDim, "center", 1080);
  txt("Nobody books a deal from a desk.", LOGICAL_W/2, 440, 30, C.text, "center", 1080);

  drawTally(496, C.good);
}

/* Dead centre, big, and it holds for seven and a half seconds, because the one
   thing a player must not miss is that a signature is not a booking. */
function drawNotice(){
  var N = G.notice, age = N.max - N.life;
  var a = Math.max(0, Math.min(1, age/0.25, N.life/0.6));
  var pop = 1 - Math.min(1, age/0.18);
  var w = 1340, h = 330, x = (LOGICAL_W - w)/2, y = (LOGICAL_H - h)/2 - 40 + pop*30;

  ctx.globalAlpha = a * 0.72; ctx.fillStyle = "#05060a";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.globalAlpha = a;
  plate(x, y, w, h, "rgba(8,6,5,0.96)", 20);
  rr(x, y, w, h, 20);
  ctx.strokeStyle = N.col; ctx.lineWidth = 5 + 3*Math.sin(G.t*4); ctx.stroke();

  txt(N.title, LOGICAL_W/2, y + 92, 56, N.col, "center", w - 90);
  ctx.fillStyle = "rgba(255,255,255,0.14)";
  ctx.fillRect(x + 90, y + 126, w - 180, 2);
  txt(N.line,  LOGICAL_W/2, y + 184, 42, C.text,    "center", w - 90);
  txt(N.body,  LOGICAL_W/2, y + 252, 27, C.textDim, "center", w - 120);
  /* One glyph instead of a diagram: he turns round, and then he keeps going
     the same way up the screen. The first version spelled that out with an
     arrow, a caption and four street numbers in a box, which was more
     explaining than the idea needed. */
  if (N.art === "downtown"){
    ctx.font = "bold 42px \"Helvetica Neue\",Helvetica,Arial,sans-serif";
    var lw = ctx.measureText(N.line).width;
    drawUTurn(LOGICAL_W/2 - lw/2 - 60, y + 170, C.good);
  }
  ctx.globalAlpha = 1;
}

/* A U-turn that finishes pointing UP: down the right side, round the bottom,
   back up the left, head on top. He has turned round and he is still walking
   the same way across the screen, which is the one thing about the second
   half that catches people out. */
function drawUTurn(cx, cy, col){
  // sized against the 42px line it sits beside, not against nothing
  var r = 16, top = cy - 24, bot = cy + 16;
  ctx.strokeStyle = col; ctx.lineWidth = 8;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(cx + r, top + 6);                 // the tail, coming down
  ctx.lineTo(cx + r, bot - r);
  ctx.arc(cx, bot - r, r, 0, Math.PI, false);  // round the bottom
  ctx.lineTo(cx - r, top + 13);                // and back up
  ctx.stroke();
  ctx.fillStyle = col;                         // the head, pointing up
  ctx.beginPath();
  ctx.moveTo(cx - r, top - 9);
  ctx.lineTo(cx - r + 14, top + 13);
  ctx.lineTo(cx - r - 14, top + 13);
  ctx.closePath(); ctx.fill();
}


/* ====================== INITIALS AND THE BOARD ============================ */
var BOARD_BTN = { x:60, y:LOGICAL_H - 176, w:360, h:88 };
var INI_BOX = { w:150, h:180, gap:40, y:418 };
function iniX(i){
  var total = INI_BOX.w*3 + INI_BOX.gap*2;
  return (LOGICAL_W - total)/2 + i*(INI_BOX.w + INI_BOX.gap);
}
var OK_BOX = { w:340, h:84, x:(LOGICAL_W-340)/2, y:716 };

/* Where a tap on the initials screen landed, in logical coordinates. */
function nameHit(lx, ly){
  var i, x;
  for (i = 0; i < 3; i++){
    x = iniX(i);
    if (lx >= x && lx <= x + INI_BOX.w){
      if (ly >= INI_BOX.y - 92 && ly < INI_BOX.y)                 return { i:i, d:1 };
      if (ly > INI_BOX.y + INI_BOX.h && ly <= INI_BOX.y + INI_BOX.h + 92) return { i:i, d:-1 };
      if (ly >= INI_BOX.y && ly <= INI_BOX.y + INI_BOX.h)         return { i:i, d:0 };
    }
  }
  if (lx >= OK_BOX.x && lx <= OK_BOX.x + OK_BOX.w &&
      ly >= OK_BOX.y && ly <= OK_BOX.y + OK_BOX.h)                return { ok:true };
  return null;
}

function drawName(){
  ctx.fillStyle = "rgba(6,5,4,0.90)"; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  var rec = G.rec || runRecord("---");
  txt(G.won ? "BOOKED" : "RUN OVER", LOGICAL_W/2, 150, 54, G.won ? C.good : C.danger);
  txt(cash(rec.score), LOGICAL_W/2, 236, 82, C.text);
  var rk = boardRank(rec.score);
  txt(rk ? ("THAT IS NUMBER " + rk + " ON THE BOARD") : "NOT A TOP SCORE \u2014 LOG IT ANYWAY",
      LOGICAL_W/2, 296, 26, rk && rk <= 3 ? C.brand : C.textDim);
  txt("YOUR INITIALS", LOGICAL_W/2, 362, 24, C.textDim);

  for (var i = 0; i < 3; i++){
    var x = iniX(i), on = (i === G.iniAt);
    plate(x, INI_BOX.y, INI_BOX.w, INI_BOX.h, on ? "rgba(255,106,19,0.16)" : C.ink, 14);
    if (on){
      rr(x, INI_BOX.y, INI_BOX.w, INI_BOX.h, 14);
      ctx.strokeStyle = C.brand; ctx.lineWidth = 4; ctx.stroke();
    }
    txt(INI_CHARS.charAt(G.ini[i]), x + INI_BOX.w/2, INI_BOX.y + 122, 104, C.text);
    // chevrons, which are also the tap targets
    ctx.fillStyle = on ? C.brand : C.textDim;
    var cx2 = x + INI_BOX.w/2;
    ctx.beginPath(); ctx.moveTo(cx2, INI_BOX.y - 56); ctx.lineTo(cx2 - 26, INI_BOX.y - 20);
    ctx.lineTo(cx2 + 26, INI_BOX.y - 20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx2, INI_BOX.y + INI_BOX.h + 56);
    ctx.lineTo(cx2 - 26, INI_BOX.y + INI_BOX.h + 20);
    ctx.lineTo(cx2 + 26, INI_BOX.y + INI_BOX.h + 20); ctx.closePath(); ctx.fill();
  }

  plate(OK_BOX.x, OK_BOX.y, OK_BOX.w, OK_BOX.h, C.brand, 14);
  txt("PUT ME ON THE BOARD", OK_BOX.x + OK_BOX.w/2, OK_BOX.y + 52, 28, "#1a0a02");
  txt("TAP THE ARROWS, OR TYPE THREE LETTERS AND PRESS ENTER",
      LOGICAL_W/2, 856, 22, C.textDim);
}

function statLine(st){
  if (!st) return "";
  return st.plays + (st.plays === 1 ? " run" : " runs") +
         "  \u00B7  " + st.wins + " booked" +
         "  \u00B7  " + st.steps.toLocaleString("en-US") + " steps" +
         "  \u00B7  " + st.rides + " subway rides";
}

function drawBoard(){
  ctx.fillStyle = "rgba(6,5,4,0.93)"; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  txt("THE BOARD", LOGICAL_W/2, 112, 56, C.brand);
  var badge = BOARD.state;
  var bw = 150;
  plate(LOGICAL_W/2 + 230, 86, bw, 38, C.ink, 8);
  txt(badge, LOGICAL_W/2 + 230 + bw/2, 110, 20,
      badge === "LIVE" ? C.good : (badge === "OFFLINE" ? C.danger : C.textDim));

  var x0 = 250, x1 = 1670, y = 178, rowH = 46;
  txt("#",        x0 + 36,  y, 20, C.textDim);
  txt("WHO",      x0 + 130, y, 20, C.textDim);
  txt("PIPELINE", x0 + 420, y, 20, C.textDim, "right");
  txt("BLOCKS",   x0 + 560, y, 20, C.textDim, "right");
  txt("STEPS",    x0 + 700, y, 20, C.textDim, "right");
  txt("POWER-UPS",x0 + 880, y, 20, C.textDim, "right");
  txt("RESULT",   x0 + 1180, y, 20, C.textDim, "right");
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(x0, y + 16, x1 - x0, 2);

  var list = BOARD.rows.slice(0, BOARD_SHOW), i;
  if (!list.length){
    txt("NOBODY HAS WALKED IT YET", LOGICAL_W/2, 360, 30, C.textDim);
  }
  for (i = 0; i < list.length; i++){
    var r = list[i], ry = y + 56 + i*rowH;
    var mine = G.rec && r.at === G.rec.at && r.ini === G.rec.ini;
    if (mine) plate(x0 - 10, ry - 30, x1 - x0 + 20, rowH - 4, "rgba(255,106,19,0.18)", 8);
    var col = mine ? C.brand : (i === 0 ? C.pw5 : C.text);
    txt(String(i + 1), x0 + 36, ry, 26, i < 3 ? C.brand : C.textDim);
    txt(r.ini,         x0 + 130, ry, 30, col);
    txt(cash(r.score), x0 + 420, ry, 26, col, "right");
    txt(String(r.rows),  x0 + 560, ry, 24, C.textDim, "right");
    txt((r.steps || 0).toLocaleString("en-US"), x0 + 700, ry, 24, C.textDim, "right");
    var pu = 0, k;
    for (k in r.powers) pu += r.powers[k] || 0;
    txt(String(pu), x0 + 880, ry, 24, C.textDim, "right");
    txt(r.won ? "BOOKED" : (r.cause || "\u2014"), x0 + 1180, ry, 22,
        r.won ? C.good : C.textDim, "right");
  }

  var st = statsRead();
  txt(BOARD.global ? "EVERYONE" : "THIS DEVICE", LOGICAL_W/2, 790, 20, C.textDim);
  txt(statLine(BOARD.global || st), LOGICAL_W/2, 828, 24, C.text);
  // same gate as the tap that acts on it, so the prompt is never a lie
  if (G.deadFor > DEATH_HOLD + 0.25){
    ctx.globalAlpha = 0.55 + 0.45*Math.sin(G.t*3);
    txt("TAP ANYWHERE TO PURSUE A NEW PROSPECT", LOGICAL_W/2, 898, 36, C.brand);
    ctx.globalAlpha = 1;
  }
}

/* --------------------------------------------------------------- main loop */
var fps = { acc:0, frames:0, value:0 };
function render(){
  var sx = 0, sy = 0;
  if (G.shake > 0){ sx = (Math.random()-0.5)*G.shake; sy = (Math.random()-0.5)*G.shake; }
  ctx.setTransform(scale, 0, 0, scale, sx*scale, sy*scale);
  drawSky();
  drawWorld();
  drawHaze();
  drawSlowTint();
  if (G.ride) drawRide();
  drawHurt();
  drawLowHealth();
  drawHud();
  if (G.state === ST_PLAY) drawLockup();
  if (G.state === ST_TITLE) drawTitle();
  if (G.state === ST_DEAD)  drawDead();
  if (G.state === ST_NAME)  drawName();
  if (G.state === ST_BOARD) drawBoard();
  // the arrival scenes sit over everything, HUD included - they are a
  // cutscene, not an overlay
  if (G.scene) drawScene();
  if (G.ticker) drawTicker();
  if (G.notice && !G.ride) drawNotice();
  drawMuteBtn();
  if (SHOW_FPS){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.font = "bold 24px monospace"; ctx.textAlign = "left";
    ctx.fillStyle = fps.value < 24 ? C.danger : C.good;
    ctx.fillText(fps.value.toFixed(0) + " fps  " + cv.width + "x" + cv.height +
                 "  dpr" + (window.devicePixelRatio||1).toFixed(2) +
                 "  bake" + BAKE.toFixed(2), 32, LOGICAL_H - 36);
  }
}

var STEP = 1/60, accum = 0, prev = performance.now(), paused = false;
function frame(now){
  requestAnimationFrame(frame);
  if (paused){ prev = now; return; }
  var delta = (now - prev)/1000; prev = now;
  if (delta > 0.1) delta = 0.1;
  accum += delta;
  var guard = 0;
  while (accum >= STEP && guard++ < 6){ update(STEP); accum -= STEP; }
  fps.frames++; fps.acc += delta;
  if (fps.acc >= 0.5){
    fps.value = fps.frames/fps.acc; fps.frames = 0; fps.acc = 0;
    AUDIO.sweep();            // twice a second, and it almost never has work
  }
  render();
}

document.addEventListener("visibilitychange", function(){
  paused = document.hidden; prev = performance.now(); accum = 0;
  if (paused) AUDIO.suspend();
});
window.addEventListener("pagehide", function(){ AUDIO.suspend(); });
window.addEventListener("blur",  function(){ accum = 0; });
window.addEventListener("focus", function(){ prev = performance.now(); accum = 0; });

layout();
bakeAll();
ready = true;
reset();
boardGET();                 // no-op unless BOARD_API is set
requestAnimationFrame(frame);
</script>
</body>
