<style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* ============================================================================
   THE LAST MILE  —  Penn 1 to the meeting, uptown through Midtown.
   A ThousandEyes / Cisco-sales game for Cisco RoomOS devices.

   DESIGN NOTE ON OBSTACLES
     Earlier versions labelled generic cars with objections ("NO BUDGET" on a
     money truck). The label did all the work and taught the player nothing.
     Here every hazard is a real Midtown hazard whose BEHAVIOUR already is the
     sales obstacle: the M34 stops at every block the way a PO sits in
     procurement; the sanitation truck is enormous and already full; the
     carriage is ancient and somehow still allowed. Vehicles carry real
     signage, and the sales parallel lands on the death screen, where a player
     is actually reading.

   GEOGRAPHY
     You walk north. Each road row is a numbered cross street starting at 35th.
     Midtown cross streets are one-way and alternate direction, so lane
     direction is derived from the real street grid (even = eastbound).
     34th / 42nd / 57th are two-way, generated as paired rows with opposite
     directions - the wide dangerous ones land where a Penn 1 seller expects.

   RENDERER
     Cabinet projection with a small camera yaw; every cuboid shows three faces
     (top / front / right) from one light direction plus an emissive rim.
       screenX = x*TILE + y*SKEW
       screenY = -(y*ROW_H) - (z*ZH)
     Models are built from small cuboids and BAKED once into offscreen
     canvases, so a frame is ~50 drawImage blits rather than ~2000 polygon
     fills. Rim lights, multi-pass glow and contact shadows are all bake-time.

   CONSTRAINTS (RoomOS WebEngine)
     canvas 2D only - no WebGL, no filter/blur/shadowBlur at runtime, no
     external assets, no network calls, touch-first, DPR capped, bake capped at
     1:1 to keep sprite memory near 6MB, instant restart.

   POWER-UPS
     Four common ThousandEyes capabilities, plus the TAM as the headline tier:
     5 seconds of flight, and unlike every other power-up it does not expire -
     once engaged it keeps paying out another 2 seconds every 8-14s,
     announcing something a real TAM actually did. Flight is the only thing in
     the game that ignores both traffic and solid props, so the landing is
     handled carefully (see landFromFlight) and total flight is capped.

     The TAM pickup is staged rather than just placed - beam, glow pool,
     rings, sparks and the brand mark overhead (see drawTamPickup) - so it
     reads as the premium item from several blocks away.

   ?fps=1   perf overlay
   ?safe=1  guest-safe mode: network hazards instead of sales objections
   ?mute=1  deploy silent
   Palette is a stand-in until official brand assets are approved.
   ========================================================================= */

/* ---------------------------------------------------------------- geometry */
var LOGICAL_W = 1920, LOGICAL_H = 1080;
var COLS = 16, TILE = LOGICAL_W / COLS;
var ROW_H = 72, SKEW = 27, ZH = 100;
/* The player sits low on screen so there is room for both a real skyline and
   enough readable rows ahead. Raising BASE_Y buys lookahead for free, where
   weakening the haze would have cost the horizon fade. */
/* Messages sit above the horizon so they never cover the road; chips sit
   below the player, over rows already crossed. */
var MSG_Y = 134, CHIP_Y = 892;
var BASE_Y = 858, HORIZON = 250;   // rows are culled above this; sky above it
var SKY_BASE = 254;                // skyline baseline, just under the cull line
var PAD = 4, SPAN = COLS + PAD * 2;
var ROWS_AHEAD = 15, ROWS_BEHIND = 6;
var HOP_MS = 135, DOLLARS_PER_ROW = 15000;   // row 70 ~= $1.05M

var SHOW_FPS  = /[?&]fps=1/.test(location.search);
var SAFE_MODE = /[?&]safe=1/.test(location.search);

/* ================================================================= BRAND ===
   Every ThousandEyes colour in the game resolves from this one block. The HUD,
   street grid, power-ups, kiosks, shield ring, stage banners, title and death
   screen all derive from it, so dropping the official hexes in here reskins
   the whole game in one edit.

   THESE ARE APPROXIMATIONS. They were picked to read correctly as a family on
   a dark Board at ten feet; they are NOT taken from an official brand sheet,
   because I have no way to verify the real values from here. Replace them.

   p1..p4 are the four power-up colours. They walk a red-orange -> gold ramp so
   the set reads as one branded family while staying tellable apart at a
   glance, and all four are light enough to carry dark text in the HUD chips. */
var BRAND = {
  core:  "#ff6a13",   // primary ThousandEyes orange
  deep:  "#c9480a",   // darker step: horizon, depth, environment glow
  light: "#ffa552",
  pale:  "#ffd9b8",   // warm near-white, for body copy on dark
  amber: "#ffc23d",
  p1:    "#ff5a1f",   // ENDPOINT AGENT
  p2:    "#ff8c2b",   // INTERNET INSIGHTS
  p3:    "#ffc23d",   // PATH VISUALIZATION
  p4:    "#ffe08a",   // EXECUTIVE SPONSOR
  p5:    "#fff0bd",   // TAM - brightest in the ramp, it is the premium tier
  cisco: "#00bceb"    // Cisco cyan, used once, for the attribution line
};

/* ------------------- palette: Midtown at dusk, ThousandEyes orange --------
   The ground stays neutral-dark and only warms toward the horizon. Orange is
   a warm hue, so it reads loudest against a cool/neutral field - warming the
   asphalt too would have muted the thing the brand is carried by. */
var C = {
  sky0:"#0a0708", sky1:"#161014", sky2:"#2a1b16",
  horizon:BRAND.deep,
  walk:"#232022", walkB:"#2a2526",          // concrete under sodium light
  curb:"#423630",
  road:"#0c0c0e", roadB:"#111113",          // asphalt
  lane:"#c9b24a",                            // NYC yellow lane line - stays
  laneGlow:"rgba(201,178,74,0.16)",
  gridGlow:"rgba(255,106,19,0.10)", gridCore:"rgba(255,106,19,0.36)",
  amber:BRAND.amber, amberGlow:"rgba(255,140,43,0.14)",
  brand:BRAND.core, brandDeep:BRAND.deep, brandLight:BRAND.light,
  brandPale:BRAND.pale, cisco:BRAND.cisco,
  pw1:BRAND.p1, pw2:BRAND.p2, pw3:BRAND.p3, pw4:BRAND.p4, pw5:BRAND.p5,
  signGreen:"#1f6b4a",                       // real NYC street-sign green
  good:"#8fe388", danger:"#ff4f7e",
  text:"#fdf4ee", textDim:"rgba(253,244,238,0.58)",
  ink:"rgba(10,6,4,0.76)"
};

/* ======================================================= procedural audio */
/* Every sound is synthesised at runtime - no files, no fetches. Three hard
   requirements for a shared RoomOS device:
     1. The AudioContext is created inside a real user gesture (autoplay
        policy); nothing is touched until the first tap.
     2. If Web Audio is missing or throws, `failed` latches and every call
        becomes a no-op. The game must behave identically with no audio at all.
     3. Low master gain and no music bed - this lives in an office hallway
        next to rooms that are in calls.
   Mute persists; ?mute=1 forces silence for a whole deployment. */
var AUDIO = (function(){
  var ac = null, master = null, noiseBuf = null;
  var avail = false, failed = false;
  var muted = (function(){
    if (/[?&](mute|silent)=1/.test(location.search)) return true;
    try { return localStorage.getItem("lastmile.mute") === "1"; } catch (e){ return false; }
  })();
  var ladder = 0;
  var PENT = [0, 2, 4, 7, 9];

  function ensure(){
    if (ac || failed) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC){ failed = true; return; }
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.32;
      master.connect(ac.destination);
      var n = Math.floor(ac.sampleRate * 0.35);
      noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      avail = true;
    } catch (e){ failed = true; avail = false; ac = null; }
  }
  function live(){
    if (!avail || muted || !ac) return false;
    if (ac.state === "closed") return false;
    if (ac.state === "suspended"){ try { ac.resume(); } catch (e){} }
    return true;
  }
  function tone(o){
    if (!live()) return;
    try {
      var t = ac.currentTime + (o.at || 0), dur = o.dur;
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || "triangle";
      osc.frequency.setValueAtTime(o.f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.g || 0.25, t + Math.min(0.02, dur * 0.3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      if (o.lp){
        var f = ac.createBiquadFilter();
        f.type = "lowpass"; f.frequency.value = o.lp;
        g.connect(f); f.connect(master);
      } else g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e){}
  }
  function hit(o){
    if (!live()) return;
    try {
      var t = ac.currentTime + (o.at || 0), dur = o.dur;
      var src = ac.createBufferSource(); src.buffer = noiseBuf;
      var g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = o.hp ? "highpass" : "lowpass";
      f.frequency.setValueAtTime(o.f, t);
      if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.to), t + dur);
      g.gain.setValueAtTime(o.g || 0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.02);
    } catch (e){}
  }
  function arp(notes, type, gain, lp){
    for (var i = 0; i < notes.length; i++){
      tone({ f:notes[i], dur:0.17, type:type, g:gain, at:i * 0.068, lp:lp });
    }
  }
  var POWER_ARP = {
    agent:   [[523.25, 659.25, 783.99], "sine",     0.22, 0],
    insight: [[392.00, 523.25, 622.25], "triangle", 0.22, 2600],
    path:    [[440.00, 554.37, 659.25], "square",   0.13, 2200],
    sponsor: [[349.23, 523.25, 698.46], "sawtooth", 0.17, 2000]
  };

  return {
    unlock: function(){ ensure(); if (ac && ac.state === "suspended"){ try { ac.resume(); } catch (e){} } },
    suspend: function(){ if (ac && ac.state === "running"){ try { ac.suspend(); } catch (e){} } },
    available: function(){ return avail; },
    isMuted: function(){ return muted; },
    toggle: function(){
      muted = !muted;
      try { localStorage.setItem("lastmile.mute", muted ? "1" : "0"); } catch (e){}
      if (!muted){ ensure(); this.ui(); }
      return muted;
    },
    resetLadder: function(){ ladder = 0; },
    hop: function(){
      if (ladder < 12) ladder++;          // caps ~1.3kHz; higher gets shrill
      var i = ladder % PENT.length, oct = Math.floor(ladder / PENT.length);
      var f = 261.63 * Math.pow(2, (PENT[i] + oct * 12) / 12);
      tone({ f:f, to:f * 1.06, dur:0.10, type:"triangle", g:0.20 });
      hit({ f:2600, hp:true, dur:0.035, g:0.07 });
    },
    step: function(){ ladder = 0; tone({ f:196, to:208, dur:0.08, type:"triangle", g:0.14 }); },
    bump: function(){
      hit({ f:320, to:120, dur:0.12, g:0.26 });
      tone({ f:92, to:62, dur:0.14, type:"sine", g:0.26 });
    },
    die: function(){
      ladder = 0;
      tone({ f:233, to:58,  dur:0.50, type:"sawtooth", g:0.26, lp:1200 });
      tone({ f:116, to:44,  dur:0.56, type:"square",   g:0.10, lp:600 });
      hit({ f:1800, to:160, dur:0.45, g:0.26 });
    },
    /* two-tone wail for the motorcade warning */
    siren: function(){
      for (var i = 0; i < 3; i++){
        tone({ f:740,  to:980, dur:0.19, type:"square", g:0.11, at:i*0.42, lp:2400 });
        tone({ f:980,  to:740, dur:0.19, type:"square", g:0.11, at:i*0.42+0.20, lp:2400 });
      }
    },
    /* air-brake hiss when a bus pulls up */
    hiss: function(){ hit({ f:5200, to:2200, hp:true, dur:0.26, g:0.07 }); },
    missedTrain: function(){
      tone({ f:392, to:196, dur:0.7, type:"sawtooth", g:0.22, lp:900 });
      tone({ f:261, to:130, dur:0.8, type:"triangle", g:0.16, at:0.1 });
    },
    power: function(kind){ var a = POWER_ARP[kind] || POWER_ARP.agent; arp(a[0], a[1], a[2], a[3]); },
    shield: function(){
      tone({ f:880,  to:1320, dur:0.18, type:"sine", g:0.22 });
      tone({ f:1324,          dur:0.22, type:"sine", g:0.12, at:0.02 });
      hit({ f:4200, hp:true,  dur:0.12, g:0.08 });
    },
    /* the TAM fanfare is deliberately the biggest sound in the game */
    tam: function(){
      var n = [392.00, 523.25, 659.25, 783.99, 1046.50];
      for (var i = 0; i < n.length; i++){
        tone({ f:n[i],     dur:0.26, type:"triangle", g:0.19, at:i*0.075 });
        tone({ f:n[i] * 2, dur:0.18, type:"sine",     g:0.07, at:i*0.075 + 0.02 });
      }
      hit({ f:6200, hp:true, dur:0.45, g:0.045, at:0.05 });
    },
    tamWin: function(){
      tone({ f:659.25, dur:0.14, type:"sine", g:0.15 });
      tone({ f:987.77, dur:0.18, type:"sine", g:0.11, at:0.075 });
    },
    /* turnstile swipe: the two-tone accept beep */
    subway: function(){
      tone({ f:1046.5, dur:0.09, type:"square", g:0.12, lp:3000 });
      tone({ f:1318.5, dur:0.11, type:"square", g:0.12, at:0.09, lp:3000 });
    },
    /* the train: rolling rumble under a door chime, then wheel squeal */
    train: function(){
      tone({ f:62, to:48, dur:1.9, type:"sawtooth", g:0.17, lp:260 });
      tone({ f:93, to:74, dur:1.9, type:"triangle", g:0.09, lp:400 });
      hit({ f:900, to:260, dur:1.8, g:0.09 });
      tone({ f:784, dur:0.16, type:"sine", g:0.13, at:0.05 });
      tone({ f:587, dur:0.22, type:"sine", g:0.12, at:0.22 });
      tone({ f:1480, to:2100, dur:0.3, type:"sine", g:0.05, at:1.25, lp:4000 });
    },
    stage: function(){ arp([523.25, 783.99, 1046.50], "triangle", 0.20, 0); },
    coach: function(){ tone({ f:659.25, dur:0.10, type:"sine", g:0.11 }); },
    ui:    function(){ tone({ f:740, to:880, dur:0.06, type:"square", g:0.12 }); }
  };
})();

/* ------------------------------------------------------------------ canvas */
var cv = document.getElementById("c");
var ctx = cv.getContext("2d", { alpha:false });
var scale = 1, BAKE = 1, ready = false;
var skyGrad = null, hazeGrad = null, tamBeamGrad = null;

function layout(){
  var vw = window.innerWidth || LOGICAL_W, vh = window.innerHeight || LOGICAL_H;
  var s = Math.min(vw / LOGICAL_W, vh / LOGICAL_H);
  var cssW = Math.max(1, Math.floor(LOGICAL_W * s));
  var cssH = Math.max(1, Math.floor(LOGICAL_H * s));
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  cv.style.left = Math.floor((vw - cssW) / 2) + "px";
  cv.style.top  = Math.floor((vh - cssH) / 2) + "px";
  cv.width = Math.floor(cssW * dpr); cv.height = Math.floor(cssH * dpr);

  scale = (cssW * dpr) / LOGICAL_W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.textBaseline = "middle";

  skyGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
  skyGrad.addColorStop(0, C.sky0);
  skyGrad.addColorStop(0.40, C.sky1);
  skyGrad.addColorStop(1, C.sky2);

  /* Street-level haze, and it earns its keep three ways: it hides the hard
     line where ground rows are culled, it veils the flat top of a tall vehicle
     clipped at the horizon, and it gives distance. Strong early then decaying
     fast, so as many near rows as possible stay fully readable. */
  hazeGrad = ctx.createLinearGradient(0, HORIZON - 16, 0, HORIZON + 230);
  hazeGrad.addColorStop(0,    "rgba(32,21,19,0.96)");
  hazeGrad.addColorStop(0.22, "rgba(32,21,19,0.80)");
  hazeGrad.addColorStop(0.55, "rgba(32,21,19,0.34)");
  hazeGrad.addColorStop(1,    "rgba(32,21,19,0)");

  // capped at 1:1 so sprite memory stays near 6MB on a 4K Board. HUD text
  // still renders at full device resolution; only sprites are upscaled.
  /* Beam gradient for the TAM pickup. Gradients are transformed by the CTM,
     so this is defined at the origin and translated into place per pickup. */
  tamBeamGrad = ctx.createLinearGradient(0, 0, 0, -360);
  tamBeamGrad.addColorStop(0,    "rgba(255,240,189,0.34)");
  tamBeamGrad.addColorStop(0.35, "rgba(255,170,60,0.16)");
  tamBeamGrad.addColorStop(1,    "rgba(255,170,60,0)");

  var nb = Math.max(0.5, Math.min(1, scale));
  if (!ready || Math.abs(nb - BAKE) > 0.02){ BAKE = nb; if (ready) bakeAll(); }
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", layout);

/* ------------------------------------------------------- voxel draw kernel */
function proj(x, y, z){ return [ x * TILE + y * SKEW, -(y * ROW_H) - z * ZH ]; }

function shade(hex, amt){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  if (amt > 0){ r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  else        { r *= (1+amt);     g *= (1+amt);     b *= (1+amt); }
  function h2(v){ v = Math.max(0, Math.min(255, v|0)).toString(16); return v.length<2 ? "0"+v : v; }
  return "#" + h2(r) + h2(g) + h2(b);
}
function quad(g, a, b, c, d, col){
  g.beginPath();
  g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.lineTo(d[0],d[1]);
  g.closePath(); g.fillStyle = col; g.fill();
}
function glowLine(g, a, b, col, core){
  g.lineCap = "round";
  g.globalAlpha = 0.18; g.lineWidth = 9; g.strokeStyle = col;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  g.globalAlpha = 0.34; g.lineWidth = 5;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  g.globalAlpha = 1;    g.lineWidth = 2; g.strokeStyle = core || col;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
}
function glowRect(g, x, y, w, h, col, core){
  g.globalAlpha = 0.14; g.fillStyle = col; g.fillRect(x-4, y-4, w+8, h+8);
  g.globalAlpha = 0.30;                    g.fillRect(x-2, y-2, w+4, h+4);
  g.globalAlpha = 1;    g.fillStyle = core || col; g.fillRect(x, y, w, h);
}
/* three visible faces; the left face is provably hidden at this yaw */
function cuboid(g, p){
  var x0=p.x, x1=p.x+p.w, y0=p.y, y1=p.y+p.d, z0=p.z, z1=p.z+p.h;
  quad(g, proj(x1,y0,z0), proj(x1,y1,z0), proj(x1,y1,z1), proj(x1,y0,z1), shade(p.c,-0.40));
  quad(g, proj(x0,y0,z1), proj(x1,y0,z1), proj(x1,y1,z1), proj(x0,y1,z1), shade(p.c, 0.18));
  quad(g, proj(x0,y0,z0), proj(x1,y0,z0), proj(x1,y0,z1), proj(x0,y0,z1), p.c);
  if (p.emit){
    glowLine(g, proj(x0,y0,z1), proj(x1,y0,z1), p.c, shade(p.c, 0.70));
  } else if (p.rim !== false && p.w > 0.12){
    var a = proj(x0,y0,z1), b = proj(x1,y0,z1);
    g.globalAlpha = 0.55; g.lineWidth = 2; g.strokeStyle = shade(p.c, 0.58);
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    g.globalAlpha = 1;
  }
}
function decal(g, d){
  var a = proj(d.x, d.y, d.z + d.h), b = proj(d.x + d.w, d.y, d.z);
  if (d.glow) glowRect(g, a[0], a[1], b[0]-a[0], b[1]-a[1], d.bg, d.core || d.bg);
  else { g.fillStyle = d.bg; g.fillRect(a[0], a[1], b[0]-a[0], b[1]-a[1]); }
  if (d.text){
    g.fillStyle = d.fg;
    g.font = "bold " + (d.size||20) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    g.textAlign = "center";
    g.fillText(d.text, (a[0]+b[0])/2, (a[1]+b[1])/2 + 1, (b[0]-a[0]) * 0.9);
  }
}
function bake(model){
  var pad = 14, minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9, i, a, b, c, p, q;
  function acc(pt){
    if (pt[0]<minX) minX=pt[0]; if (pt[0]>maxX) maxX=pt[0];
    if (pt[1]<minY) minY=pt[1]; if (pt[1]>maxY) maxY=pt[1];
  }
  var sh = null;
  if (model.shadow !== false){
    var x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
    for (i=0;i<model.parts.length;i++){
      p = model.parts[i];
      if (p.z > 0.25) continue;
      if (p.x < x0) x0 = p.x; if (p.x+p.w > x1) x1 = p.x+p.w;
      if (p.y < y0) y0 = p.y; if (p.y+p.d > y1) y1 = p.y+p.d;
    }
    if (x1 > x0){
      var ctr = proj((x0+x1)/2, (y0+y1)/2, 0);
      sh = { cx:ctr[0], cy:ctr[1], rx:(x1-x0)*TILE*0.54, ry:Math.max(6,(y1-y0)*ROW_H*0.46) };
      acc([sh.cx-sh.rx, sh.cy-sh.ry]); acc([sh.cx+sh.rx, sh.cy+sh.ry]);
    }
  }
  for (i=0;i<model.parts.length;i++){
    p = model.parts[i];
    var xs=[p.x,p.x+p.w], ys=[p.y,p.y+p.d], zs=[p.z,p.z+p.h];
    for (a=0;a<2;a++) for (b=0;b<2;b++) for (c=0;c<2;c++) acc(proj(xs[a],ys[b],zs[c]));
  }
  if (model.decals) for (i=0;i<model.decals.length;i++){
    q = model.decals[i];
    acc(proj(q.x, q.y, q.z)); acc(proj(q.x+q.w, q.y, q.z+q.h));
  }
  var lw = (maxX-minX)+pad*2, lh = (maxY-minY)+pad*2;
  var off = document.createElement("canvas");
  off.width  = Math.max(1, Math.ceil(lw*BAKE));
  off.height = Math.max(1, Math.ceil(lh*BAKE));
  var g = off.getContext("2d");
  g.setTransform(BAKE, 0, 0, BAKE, (-minX+pad)*BAKE, (-minY+pad)*BAKE);
  g.textBaseline = "middle"; g.lineJoin = "round";
  if (sh){
    g.globalAlpha = 0.34; g.fillStyle = "#000";
    g.beginPath(); g.ellipse(sh.cx, sh.cy, sh.rx, sh.ry, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
  var parts = model.parts.slice().sort(function(u,v){
    return (v.y+v.d) - (u.y+u.d) || u.z - v.z;
  });
  for (i=0;i<parts.length;i++) cuboid(g, parts[i]);
  if (model.decals) for (i=0;i<model.decals.length;i++) decal(g, model.decals[i]);
  return { img:off, ox:(-minX+pad), oy:(-minY+pad), w:lw, h:lh };
}
function blit(s, sx, sy){ ctx.drawImage(s.img, sx - s.ox, sy - s.oy, s.w, s.h); }
function blitScaled(s, sx, sy, kx, ky){
  ctx.drawImage(s.img, sx - s.ox*kx, sy - s.oy*ky, s.w*kx, s.h*ky);
}
function P(x,y,w,d,z,h,c){ return { x:x, y:y, w:w, d:d, z:z, h:h, c:c }; }
function E(x,y,w,d,z,h,c){ return { x:x, y:y, w:w, d:d, z:z, h:h, c:c, emit:true }; }
function flip(model, W){
  function fx(o){ var r={}; for (var k in o) r[k]=o[k]; r.x = W - o.x - o.w; return r; }
  return { parts:model.parts.map(fx), decals:(model.decals||[]).map(fx), shadow:model.shadow };
}

   trousers 0.21 -> shirt 0.47 -> skin 0.74, dark collar between the two. */

   The first pass gave both figures a head about a third of their height and
   nearly as wide as the torso, which made them read as blocks with a beige box
   on top. Head is now ~17% of height, there is a neck, the legs are longer and
   the shoulders are wider than the hips.

   Body depth is kept shallow (y+d = 0.58) for a second reason: the painter
   sort is far-edge-first, so the cape must sit at a greater y than the torso.
   The shallower the torso, the closer the cape can sit behind it, and the less
   the projection shoves the cape up the screen. */

/* TAM engaged: the suit comes off. Orange rather than red, T rather than S.

   Making the cape read took three things:
   1. A RED-ORANGE cape against the bright orange suit. The first attempt used
      a dark shade of the same orange and read as shadow, not fabric.
   2. FLARE: narrow at the collar, widest at the hem, so the silhouette says
      cape rather than slab.
   3. The hem drops to NEGATIVE z. Depth projects upward here, so a cape at the
      torso's depth with its hem at ground level floats ~16px above the boots.
      Letting it hang below the ground plane puts the hem back at the feet. */
function heroModel(dir, flying){
  var skin = "#e9b98c";
  var suit = "#ff7a1f", trim = "#d14a09";
  var cape = "#c22d08", capeIn = "#9d2206";
  var parts = [];

  /* Only the parts of the cape WIDER than the body are ever visible - the
     torso occludes the middle. So every section is wider than the body part it
     sits behind (shoulders span 0.19-0.81, chest 0.23-0.77, legs 0.30-0.70),
     which leaves a continuous red band down each side that widens toward the
     hem. The previous collar was narrower than the shoulders and so was
     invisible, leaving two disconnected panels that read as crates. */
  if (flying){
    /* Each row of depth pushes a part 72px UP the screen, so a cape trailed
       backwards at constant height climbs over the head - which is exactly
       what the first version did, reading as a mane. Dropping z by ~0.72 per
       unit of y cancels that; dropping it slightly faster makes the cape
       trail away and down, which is what a cape in flight does. */
    parts.push(P(0.10, 0.59, 0.80, 0.12, 0.42, 0.16, cape));
    parts.push(P(0.06, 0.70, 0.88, 0.12, 0.34, 0.15, capeIn));
    parts.push(P(0.09, 0.81, 0.82, 0.12, 0.26, 0.14, cape));
    parts.push(P(0.16, 0.92, 0.68, 0.11, 0.18, 0.12, capeIn));
    parts.push(P(0.26, 1.02, 0.48, 0.10, 0.11, 0.10, cape));
    parts.push(P(0.36, 1.11, 0.28, 0.09, 0.05, 0.08, capeIn));
  } else {
    // a real triangular flare: narrow at the collar, full width at the hem
    parts.push(P(0.15, 0.59, 0.70, 0.05, 0.46, 0.17, cape));      // collar
    parts.push(P(0.10, 0.60, 0.80, 0.05, 0.26, 0.21, capeIn));    // upper
    parts.push(P(0.05, 0.61, 0.90, 0.05, 0.08, 0.19, cape));      // lower
    parts.push(P(0.02, 0.62, 0.96, 0.05, -0.05, 0.14, capeIn));   // hem
  }

  parts.push(P(0.28, 0.46, 0.17, 0.13, 0,     0.15,  trim));      // tall boots
  parts.push(P(0.55, 0.46, 0.17, 0.13, 0,     0.15,  trim));
  parts.push(P(0.30, 0.45, 0.17, 0.14, 0.14,  0.19,  suit));      // legs
  parts.push(P(0.53, 0.45, 0.17, 0.14, 0.14,  0.19,  suit));
  parts.push(P(0.29, 0.44, 0.42, 0.15, 0.31,  0.08,  trim));      // trunks
  parts.push(P(0.23, 0.42, 0.54, 0.16, 0.38,  0.24,  suit));      // chest
  parts.push(P(0.22, 0.41, 0.56, 0.17, 0.55,  0.09,  shade(suit,0.08))); // shoulders
  parts.push(P(0.14, 0.45, 0.09, 0.12, 0.38,  0.20,  shade(suit,-0.22)));// arms
  parts.push(P(0.77, 0.45, 0.09, 0.12, 0.38,  0.20,  shade(suit,-0.22)));
  parts.push(P(0.42, 0.44, 0.16, 0.14, 0.635, 0.04,  shade(skin,-0.30))); // neck
  parts.push(P(0.37, 0.43, 0.26, 0.15, 0.675, 0.145, skin));
  parts.push(P(0.355, 0.42, 0.29, 0.17, 0.80, 0.075, "#2b1d14"));

  return { parts:parts, decals:[
    // shield: wide top, tapered bottom, with the T across it
    { x:0.32, y:0.42, w:0.36, z:0.46,  h:0.14,  bg:"#ffe9a8" },
    { x:0.37, y:0.42, w:0.26, z:0.405, h:0.06,  bg:"#ffe9a8" },
    { x:0.345, y:0.42, w:0.31, z:0.475, h:0.105, bg:suit, fg:"#5a1f02",
      text:"T", size:20 }
  ], shadow:false, W:1 };
}

/* ------------------------------------------------------------ ground strips */
function bakeStrip(kind, alt){
  var h = ROW_H + 2;
  var off = document.createElement("canvas");
  off.width = Math.ceil(LOGICAL_W*BAKE); off.height = Math.ceil(h*BAKE);
  var g = off.getContext("2d");
  g.setTransform(BAKE, 0, 0, BAKE, 0, 0);

  if (kind === "walk"){
    g.fillStyle = alt ? C.walkB : C.walk;
    g.fillRect(0, 0, LOGICAL_W, h);
    // concrete paver joints
    g.strokeStyle = "rgba(255,255,255,0.045)"; g.lineWidth = 2;
    g.beginPath();
    for (var j=0;j<=COLS;j++){ g.moveTo(j*TILE, 0); g.lineTo(j*TILE, h); }
    g.moveTo(0, h*0.5); g.lineTo(LOGICAL_W, h*0.5);
    g.stroke();
    // amber streetlight pools
    for (var p=0;p<5;p++) glowRect(g, 180+p*400, h*0.1, 240, h*0.8, C.amberGlow, "rgba(255,176,46,0.05)");
    // the curb: raised lip on the street side
    g.fillStyle = C.curb;              g.fillRect(0, h-9, LOGICAL_W, 6);
    g.fillStyle = "rgba(255,255,255,0.10)"; g.fillRect(0, h-9, LOGICAL_W, 2);
    g.fillStyle = "rgba(0,0,0,0.45)";  g.fillRect(0, h-3, LOGICAL_W, 3);
    glowRect(g, 0, 0, LOGICAL_W, 2, C.gridGlow, C.gridCore);
  } else {
    g.fillStyle = alt ? C.roadB : C.road;
    g.fillRect(0, 0, LOGICAL_W, h);
    g.fillStyle = "rgba(255,255,255,0.014)";
    g.fillRect(0, h*0.24, LOGICAL_W, h*0.14);
    g.fillRect(0, h*0.62, LOGICAL_W, h*0.14);
    // crosswalk ladder stripes - tells you this is a place you cross
    g.fillStyle = "rgba(235,242,250,0.085)";
    for (var x=0;x<LOGICAL_W;x+=TILE) g.fillRect(x+16, 4, TILE-32, h-10);
    g.fillStyle = "#1a222c"; g.fillRect(0, 0, LOGICAL_W, 3);
    g.fillStyle = "rgba(0,0,0,0.50)"; g.fillRect(0, h-3, LOGICAL_W, 3);
    for (var d=14;d<LOGICAL_W;d+=112) glowRect(g, d, h*0.48, 54, 3, C.laneGlow, C.lane);
  }
  return { img:off, ox:0, oy:0, w:LOGICAL_W, h:h };
}

/* ------------------------------------------------------------- world build */
var rows = {};
var genCursor = 0, roadRun = 0, safeRun = 0, lastPower = 0, lastTam = -99, nextStreet = START_ST + 1;
var lastSweep = -99, prevWasSafe = true;

/* MIN_WINDOW is the shortest time a column may stay clear. A hop is 135ms, so
   0.60s leaves room to read the gap and commit. MAX_SPEED keeps traffic
   trackable by eye on a Board at ten feet. */
var MIN_WINDOW = 0.60, MAX_SPEED = 6.2, SWEEP_SPEED = 16;

function difficulty(r){
  var t = Math.min(1, r/150);
  return { speed:1.5 + 3.1*t, gap:5.6 - 2.9*t, group:1 + Math.floor(Math.min(3.9, 1 + r/26)) };
}

/* Blocker columns, used by BOTH sidewalk props and parked trucks.
   A player at (R,c) is pinned when forward, left and right are all blocked:
     interior c -> needs blockers at c-1 AND c+1, i.e. two exactly 2 apart
     c = 0      -> needs a blocker at column 1
     c = COLS-1 -> needs a blocker at column COLS-2
   Minimum separation of 3 plus never using columns 1 and COLS-2 makes both
   unreachable, for any row type, with no backtracking required. Without this,
   generation soft-locked roughly 1 run in 4. */
var BLOCK_COLS = (function(){
  var a = []; for (var c=0;c<COLS;c++) if (c!==1 && c!==COLS-2) a.push(c); return a;
})();
var MIN_SEP = 3;
function placeBlockers(n){
  var chosen = [], tries = 0;
  while (chosen.length < n && tries++ < 40){
    var col = BLOCK_COLS[(Math.random()*BLOCK_COLS.length)|0], ok = true;
    for (var j=0;j<chosen.length;j++){
      if (Math.abs(chosen[j]-col) < MIN_SEP){ ok = false; break; }
    }
    if (ok) chosen.push(col);
  }
  return chosen;
}

function pickFleet(r){
  if (r < 8) return "cab";                           // tutorial: one type, slow
  var pool = ["cab","cab","citi"];
  if (r > 14) pool.push("bus","suv");
  if (r > 26) pool.push("dsny","ebike","cab");
  if (r > 40) pool.push("carriage","crowd","bus");
  if (r > 60) pool.push("crowd","dsny","ebike");
  return pool[(Math.random()*pool.length)|0];
}

function makeRoad(r, streetNo, dir){
  var d = difficulty(r), kind = pickFleet(r), spec = HAZ[kind];
  var speed = Math.min(MAX_SPEED, d.speed * spec.spd * (0.85 + Math.random()*0.3));

  /* A pack is placed as one super-vehicle so the minimum-gap guarantee still
     holds; the riders are drawn inside its footprint. */
  var packN = spec.pack || 1, packGap = 0.42;
  var eff = packN * spec.w + (packN - 1) * packGap;

  /* The gap has to be expressed in TIME, not tiles. Ramping speed up while
     ramping the tile gap down compounds: at depth the e-bike hit ~9 tiles/s
     against a 2.7 tile gap, which left zero landable columns on 75% of
     sampled instants. Requiring gap >= speed * MIN_WINDOW keeps the crossing
     window at any column from ever falling below MIN_WINDOW seconds, which
     only binds at high speed - mid-game spacing is unchanged. */
  var gap = Math.max(d.gap, speed * MIN_WINDOW);
  var n = Math.max(1, Math.floor(SPAN / (eff + gap)));
  var slot = SPAN / n, cars = [];
  for (var i=0;i<n;i++){
    cars.push({ p: i*slot + Math.random()*(slot-eff)*0.5,
                stop: spec.stops ? (Math.random()*5.2) : 0 });
  }

  var row = { type:"road", streetNo:streetNo, dir:dir, speed:speed, kind:kind,
              cars:cars, eff:eff, packN:packN, packGap:packGap,
              parked:[], blocked:{}, rogue:null };

  /* Double-parked box truck: a permanent blocker you route around.
     It is 2 tiles wide, so it blocks BOTH columns it covers - otherwise the
     player could legally step into the second one and die on arrival. A
     contiguous 2-wide run cannot satisfy the min-separation rule, so the
     invariant here is the more general one it was protecting: never leave a
     single free column with blocked neighbours on both sides, and keep
     columns 1 and COLS-2 free. Exactly one truck, starting in [2, COLS-4],
     satisfies both with gaps of >= 2 on each side. */
  if (r > 20 && Math.random() < 0.22){
    var tc = 2 + ((Math.random() * (COLS - 5)) | 0);     // 2 .. COLS-4
    row.parked.push({ col:tc });
    row.blocked[tc] = true;
    row.blocked[tc + 1] = true;
  }
  /* One wrong-way delivery bike, against the posted direction. It is an EXTRA
     hazard on top of the fleet, so it only rides slower fleets - adding it to
     fast traffic stacked two tight windows on one row. */
  if (r > 24 && spec.spd <= 1.2 && Math.random() < 0.26){
    row.rogue = { p: Math.random()*SPAN,
                  speed: Math.min(MAX_SPEED, d.speed * HAZ.ebike.spd * 1.05) };
  }
  return row;
}

/* Motorcade row: empty, then warning lights, then the street is gone.
   Generation requires a sidewalk immediately south so retreat always exists. */
function makeSweep(r, streetNo, dir){
  // absolute speed, not difficulty-scaled: the scaled version reached 29
  // tiles/s, which crossed the screen faster than the eye tracks
  return { type:"sweep", streetNo:streetNo, dir:dir, kind:"motorcade",
           phase:"idle", t:0, idleFor:3.4 + Math.random()*3.2,
           cars:[], parked:[], blocked:{}, rogue:null, speed:SWEEP_SPEED };
}

function makeWalk(r){
  var props = [], blocked = {};
  if (r >= 5){
    var n = [1,1,2,2,3][(Math.random()*5)|0];
    var cols = placeBlockers(n);
    for (var i=0;i<cols.length;i++){
      blocked[cols[i]] = true;
      props.push({ col:cols[i], kind:PROP_KINDS[(Math.random()*PROP_KINDS.length)|0] });
    }
  }
  var pickup = null;
  if (r >= 7 && r - lastPower >= 8 && Math.random() < 0.34){
    for (var t=0;t<14;t++){
      var pc = (Math.random()*COLS)|0;
      if (!blocked[pc]){
        // the TAM is the rare drop, gated by its own long cooldown
        var kind = (r > 7 && r - lastTam >= TAM_COOLDOWN_ROWS && Math.random() < 0.52)
                   ? "tam" : POWER_POOL[(Math.random()*POWER_POOL.length)|0];
        if (kind === "tam") lastTam = r;
        pickup = { col:pc, kind:kind };
        lastPower = r; break;
      }
    }
  }
  return { type:"safe", tone:(r%2), props:props, blocked:blocked, pickup:pickup };
}

function pushRow(row){ rows[genCursor++] = row; }

function ensureRows(upTo){
  while (genCursor <= upTo){
    var r = genCursor;
    if (r < 3){ pushRow(makeWalk(r)); safeRun++; prevWasSafe = true; continue; }

    var d = difficulty(r), wantRoad;
    if (roadRun >= d.group)  wantRoad = false;
    else if (safeRun >= 3)   wantRoad = true;
    else                     wantRoad = Math.random() < 0.62;

    if (!wantRoad){ pushRow(makeWalk(r)); safeRun++; roadRun = 0; prevWasSafe = true; continue; }

    var no = nextStreet++;
    // motorcade only on bigger streets, never back to back, and only with a
    // sidewalk behind it so stepping back is always possible
    if (no >= 40 && prevWasSafe && (no - lastSweep) >= 6 && Math.random() < 0.15){
      pushRow(makeSweep(r, no, streetDir(no)));
      lastSweep = no; roadRun = 99; safeRun = 0; prevWasSafe = false;
      continue;
    }
    if (isTwoWay(no)){
      // 42nd and 57th are two-way: paired rows, opposite directions
      pushRow(makeRoad(r, no,  1));
      pushRow(makeRoad(r + 1, no, -1));
      roadRun += 2;
    } else {
      pushRow(makeRoad(r, no, streetDir(no)));
      roadRun++;
    }
    safeRun = 0; prevWasSafe = false;
  }
}
function pruneRows(below){ for (var k in rows) if (+k < below) delete rows[k]; }
function carX(row, car){ return (row.dir > 0 ? car.p : SPAN - car.p) - PAD; }
function rogueX(row){ return (row.dir > 0 ? SPAN - row.rogue.p : row.rogue.p) - PAD; }

/* -------------------------------------------------------------- game state */
var ST_TITLE = 0, ST_PLAY = 1, ST_DEAD = 2;
var RANKS = [[0,"SDR INTERN"],[18,"AE IN RAMP"],[40,"QUOTA CARRIER"],
             [70,"PRESIDENT'S CLUB"],[110,"MIDTOWN LEGEND"]];
var TRAIN_MAX = 60, TRAIN_PER_HOP = 1.25;

var G = null;

function reset(){
  rows = {}; genCursor = 0; roadRun = 0; safeRun = 0; lastPower = 0;
  nextStreet = START_ST + 1; lastSweep = -99; prevWasSafe = true; lastTam = -99;
  ensureRows(ROWS_AHEAD);
  var tr = TRAINS[(Math.random()*TRAINS.length)|0];
  G = {
    state:ST_TITLE, row:0, col:COLS>>1, fromRow:0, fromCol:COLS>>1,
    hop:1, facing:1, maxRow:0, camRow:0, street:START_ST,
    stage:-1, coach:-1, toast:null, flash:null,
    shield:false, slowT:0, revealT:0, invulnT:0, powersUsed:0,
    flyT:0, flyA:0, tam:false, tamT:0, tamWins:0,
    metro:false, ride:null, trace:null, rides:0, bonus:0, tamLeft:0, riskT:0,
    trainT:TRAIN_MAX, trainLine:tr[0], trainDest:tr[1],
    trainHH:16 + ((Math.random()*3)|0), trainMM:(Math.random()*60)|0,
    missedTrain:false,
    shake:0, parts:[], deathName:"", deathObj:"", deathFix:"", deadFor:0,
    t:0, sweep:0
  };
  for (var i=0;i<30;i++) G.parts.push({ life:0, x:0, y:0, vx:0, vy:0, s:0, c:"#fff" });
  AUDIO.resetLadder();
}

function best(){
  try { return parseInt(localStorage.getItem("lastmile.best") || "0", 10) || 0; }
  catch (e){ return 0; }
}
function saveBest(v){ try { if (v > best()) localStorage.setItem("lastmile.best", String(v)); } catch (e){} }
function rankFor(r){ var n = RANKS[0][1]; for (var i=0;i<RANKS.length;i++) if (r >= RANKS[i][0]) n = RANKS[i][1]; return n; }
function money(r){ return "$" + (r*DOLLARS_PER_ROW).toLocaleString("en-US"); }
function cash(v){ return "$" + Math.round(v).toLocaleString("en-US"); }
/* rows walked, plus whatever Chuck handed over */
function pipeline(){ return G.maxRow*DOLLARS_PER_ROW + G.bonus; }
function flash(name, line, col){ G.flash = { life:2.2, name:name, line:line, col:col }; }

/* current street number, from the furthest road row crossed */
function streetAt(r){
  for (var i=r;i>=0;i--){ var w = rows[i]; if (w && w.streetNo) return w.streetNo; }
  return START_ST;
}
function progress(){
  var st = streetAt(G.maxRow);
  if (st !== G.street){
    G.street = st;
    var ms = MILESTONES[st];
    if (ms){
      AUDIO.stage();
      G.toast = { a:0, life:3.0, name:st + "th — " + ms[0], stage:ms[1], line:ms[2] };
    }
  }
  /* Rebuttals are the payload, but they live on the death screen - and the
     widest, slowest hazards get routed around rather than died to. Coaching
     lines fire between milestones so every objection gets read regardless of
     what kills you. */
  var m = Math.floor((G.maxRow - 6) / 12);
  if (G.maxRow >= 6 && m !== G.coach){
    G.coach = m;
    var k = ALL_HAZ[(Math.random()*ALL_HAZ.length)|0];
    AUDIO.coach();
    flash(lineOf(k)[0], lineOf(k)[1], C.good);
  }
}

/* ------------------------------------------------------------------- input */
function act(dir){
  if (G.state === ST_TITLE){ G.state = ST_PLAY; AUDIO.ui(); return; }
  if (G.state === ST_DEAD){
    if (G.deadFor > 0.45){ reset(); G.state = ST_PLAY; AUDIO.ui(); }
    return;
  }
  if (G.hop < 1) return;

  var nr = G.row, nc = G.col;
  if (dir === "f") nr++;
  else if (dir === "b") nr--;
  else if (dir === "l"){ nc--; G.facing = -1; }
  else if (dir === "r"){ nc++; G.facing = 1; }

  if (nc < 0 || nc > COLS-1){ AUDIO.bump(); return; }
  if (nr < 0 || nr < G.maxRow - 6){ AUDIO.bump(); return; }
  var target = rows[nr];
  /* A ThousandEyes Path terminal runs a trace for you. You do not step into
     it - you use it from where you stand - so the kiosk stays solid and is
     spent afterwards. */
  if (target && target.props){
    for (var ki = 0; ki < target.props.length; ki++){
      var kp = target.props[ki];
      if (kp.kind === "kiosk" && kp.col === nc && !kp.used){
        kp.used = true;
        G.revealT = Math.max(G.revealT, POWERS.path.secs);
        G.trace = buildTrace();
        AUDIO.power("path");
        flash("THOUSANDEYES PATH", POWERS.path.line, POWERS.path.col);
        burst(nc*TILE + TILE/2, rowScreenY(nr) - 40, POWERS.path.col);
        return;
      }
    }
  }
  // a card lets you swipe in at any subway entrance
  if (G.metro && !G.ride && target && target.props){
    for (var pi = 0; pi < target.props.length; pi++){
      if (target.props[pi].kind === "subway" && target.props[pi].col === nc){
        startRide(nr, nc); return;
      }
    }
  }
  // flying carries you over scaffolding, parked trucks, everything solid
  if (G.flyT <= 0 && target && target.blocked && target.blocked[nc]){ AUDIO.bump(); return; }

  if (dir === "f"){
    AUDIO.hop();
    G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP);
  } else AUDIO.step();

  G.fromRow = G.row; G.fromCol = G.col;
  G.row = nr; G.col = nc; G.hop = 0;
  if (nr > G.maxRow){ G.maxRow = nr; progress(); }
  ensureRows(G.maxRow + ROWS_AHEAD);
}

/* On-screen arrows. A cross in the bottom centre, below the player's row so
   it only ever covers blocks already crossed. 92px buttons are ~58mm on a 55"
   Board and ~16mm on a Desk Mini, both comfortably above the ~9mm minimum.
   Swipes and the invisible tap zones still work; the pad simply takes
   priority wherever it is hit. */
var MUTE_BTN = { x:LOGICAL_W - 146, y:LOGICAL_H - 146, w:114, h:114 };
function muteBtnActive(){ return G.state === ST_TITLE || G.state === ST_DEAD; }
function inMuteBtn(lx, ly){
  return muteBtnActive() &&
         lx > MUTE_BTN.x - 14 && lx < MUTE_BTN.x + MUTE_BTN.w + 14 &&
         ly > MUTE_BTN.y - 14 && ly < MUTE_BTN.y + MUTE_BTN.h + 14;
}

var ptr = null;
cv.addEventListener("pointerdown", function(e){
  e.preventDefault(); AUDIO.unlock();
  ptr = { sx:e.clientX, sy:e.clientY, used:false };
}, { passive:false });
cv.addEventListener("pointerup", function(e){
  e.preventDefault();
  if (!ptr) return;
  if (ptr.used){ ptr = null; return; }      // already handled on press
  var dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
  if (Math.sqrt(dx*dx + dy*dy) > 42){
    if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? "r" : "l");
    else                             act(dy < 0 ? "f" : "b");
  } else {
    var rect = cv.getBoundingClientRect();
    var px = (e.clientX-rect.left)/rect.width, py = (e.clientY-rect.top)/rect.height;
    if (inMuteBtn(px*LOGICAL_W, py*LOGICAL_H)){ AUDIO.toggle(); ptr = null; return; }
    /* A tap anywhere means forward. The old scheme split the screen into four
       invisible zones, so a tap meant for "cross" near the bottom corners moved
       you sideways instead. Sideways and back come from the arrows or a swipe,
       both of which are deliberate. */
    act("f");
  }
  ptr = null;
}, { passive:false });
cv.addEventListener("pointercancel", function(){ ptr = null; });
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

window.addEventListener("keydown", function(e){
  var k = e.key;
  if (k==="m" || k==="M"){ AUDIO.unlock(); AUDIO.toggle(); e.preventDefault(); return; }
  AUDIO.unlock();
  if (k==="ArrowUp"    || k==="w" || k===" "){ act("f"); e.preventDefault(); }
  if (k==="ArrowDown"  || k==="s"){ act("b"); e.preventDefault(); }
  if (k==="ArrowLeft"  || k==="a"){ act("l"); e.preventDefault(); }
  if (k==="ArrowRight" || k==="d"){ act("r"); e.preventDefault(); }
});

/* ----------------------------------------------------------------- powers */
function collect(){
  var row = rows[G.row];
  if (!row || !row.pickup || row.pickup.col !== G.col) return;
  var kind = row.pickup.kind, k = POWERS[kind];
  row.pickup = null;
  G.powersUsed++;
  if (kind === "tam") AUDIO.tam(); else AUDIO.power(kind);
  flash(k.name, kind === "chuck" ? ("+" + cash(CHUCK_BONUS) + " on the number.") : k.line, k.col);
  burst(G.col*TILE + TILE/2, rowScreenY(G.row) - 40, k.col);

  if (kind === "chuck"){
    G.bonus += CHUCK_BONUS;
    burst(G.col*TILE + TILE/2, rowScreenY(G.row) - 40, "#7fd49a");
  }
  else if (kind === "metro"){ G.metro = true; }
  else if (kind === "tam"){
    G.flyT = Math.min(FLY_MAX, Math.max(G.flyT, FLY_SECS));
    G.tam = true;
    /* First win lands at 3-6s, i.e. right as the initial flight runs out, so
       the SKU is seen delivering immediately rather than silently. Measured
       at 9-16s, most runs ended before a single win fired. */
    G.tamLeft = TAM_DURATION;
    G.tamT = 3 + Math.random()*3;
  }
  else if (kind === "agent")   G.shield = true;
  else if (kind === "insight") G.slowT = Math.max(G.slowT, k.secs);
  else if (kind === "traffic") G.riskT = Math.max(G.riskT, k.secs);
  else if (kind === "path"){
    G.revealT = Math.max(G.revealT, k.secs);
    G.trace = buildTrace();
  }
  else if (kind === "sponsor"){
    var adv = 0;
    for (var i=1;i<=3;i++){
      var w = rows[G.row+i];
      if (w && w.blocked && w.blocked[G.col]) break;
      adv = i;
    }
    if (adv > 0){
      G.fromRow = G.row; G.fromCol = G.col;
      G.row += adv; G.hop = 0; G.invulnT = Math.max(G.invulnT, 0.95);
      G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP*adv);
      if (G.row > G.maxRow){ G.maxRow = G.row; progress(); }
      ensureRows(G.maxRow + ROWS_AHEAD);
    }
  }
}

/* ===================== PATH VISUALIZATION ================================
   Modelled on a ThousandEyes path trace: a route of nodes joined by links,
   with a packet running along it. Unlike the product it does not show where
   you have been - it hands you a route forward, and that route is genuinely
   safe. While the trace is live you cannot be hit on any cell belonging to it,
   so it is four streets of guaranteed passage rather than a hint.

   The route only has to dodge PERMANENT blockers (props, parked trucks),
   because traffic cannot touch you on it. Sideways steps are inserted as their
   own nodes so the drawn path is always walkable hop by hop. */
function traceColClear(col, fromRow, rowsAhead){
  for (var r = fromRow + 1; r <= fromRow + rowsAhead; r++){
    var w = rows[r];
    if (!w) return false;
    if (w.blocked && w.blocked[col]) return false;
  }
  return true;
}

/* Walk forward from (r, col), dodging permanent blockers, until `streets`
   crossings have been made. Returns the list of cells, sideways steps
   included, so the drawn route is always walkable hop by hop. */
function traceRun(r, col, streets, cells){
  var crossed = 0, guard = 0;
  while (crossed < streets && guard++ < 90){
    var nr = r + 1, row = rows[nr];
    if (!row) break;
    if (row.blocked && row.blocked[col]){
      var tgt = -1;
      for (var d = 1; d < COLS; d++){
        if (col + d <= COLS-1 && !row.blocked[col + d]){ tgt = col + d; break; }
        if (col - d >= 0 && !row.blocked[col - d]){ tgt = col - d; break; }
      }
      if (tgt < 0) break;
      var step = tgt > col ? 1 : -1;
      while (col !== tgt){
        if (rows[r] && rows[r].blocked && rows[r].blocked[col + step]) break;
        col += step;
        cells.push({ r:r, c:col });
      }
      if (row.blocked && row.blocked[col]) break;
    }
    r = nr;
    cells.push({ r:r, c:col });
    if (row.type === "road" || row.type === "sweep") crossed++;
  }
  return { r:r, c:col };
}

/* An alternate route: diverge from the main path, run parallel for a few
   rows, then rejoin. This is what a real path trace looks like when traffic
   takes more than one way to the same place. */
function traceBranch(main){
  if (main.length < 6) return null;
  var i = 2 + ((Math.random() * (main.length - 5)) | 0);
  var from = main[i];
  var dir = Math.random() < 0.5 ? 1 : -1;
  var out = [{ r:from.r, c:from.c }];
  var col = from.c, r = from.r, k;

  var off = 1 + ((Math.random() * 2) | 0);
  for (k = 0; k < off; k++){
    var nc = col + dir;
    if (nc < 0 || nc > COLS-1) break;
    if (rows[r] && rows[r].blocked && rows[r].blocked[nc]) break;
    col = nc; out.push({ r:r, c:col });
  }
  if (col === from.c) return null;

  var len = 2 + ((Math.random() * 3) | 0);
  for (k = 0; k < len; k++){
    var nr = r + 1;
    if (!rows[nr] || (rows[nr].blocked && rows[nr].blocked[col])) break;
    r = nr; out.push({ r:r, c:col });
  }

  // rejoin the main line at whatever column it occupies on this row
  var joinCol = null;
  for (var m = 0; m < main.length; m++) if (main[m].r === r){ joinCol = main[m].c; break; }
  if (joinCol === null) return out.length > 3 ? out : null;
  var step2 = joinCol > col ? 1 : -1;
  var guard2 = 0;
  while (col !== joinCol && guard2++ < COLS){
    var nc2 = col + step2;
    if (rows[r] && rows[r].blocked && rows[r].blocked[nc2]) break;
    col = nc2; out.push({ r:r, c:col });
  }
  return out.length > 3 ? out : null;
}

function buildTrace(){
  ensureRows(G.row + 70);
  var streets = 6 + ((Math.random() * 3) | 0);          // 6-8 crossings
  var main = [{ r:G.row, c:G.col }];

  /* Now and then the route is dead straight - no lateral movement at all.
     Only claimed when a column really is clear the whole way, so "perfectly
     straight" is never a lie about what is safe. */
  var wantStraight = Math.random() < 0.45;
  var straightCol = -1;
  if (wantStraight){
    /* Only the player's own column counts. Allowing a lead-in of a few
       sideways steps first produced routes with three or four columns in them,
       which is not what "perfectly straight" means. */
    var reach = streets * 2 + 3;
    if (traceColClear(G.col, G.row, reach)) straightCol = G.col;
  }

  if (straightCol >= 0){
    var col = G.col, step = straightCol > col ? 1 : -1;
    while (col !== straightCol){
      if (rows[G.row] && rows[G.row].blocked && rows[G.row].blocked[col + step]) break;
      col += step; main.push({ r:G.row, c:col });
    }
    var rr = G.row, crossed = 0, guard = 0;
    while (crossed < streets && guard++ < 90){
      var row = rows[rr + 1];
      if (!row || (row.blocked && row.blocked[col])) break;
      rr++; main.push({ r:rr, c:col });
      if (row.type === "road" || row.type === "sweep") crossed++;
    }
    return { paths:[main], straight:true };
  }

  traceRun(G.row, G.col, streets, main);
  var paths = [main];
  var nb = Math.random() < 0.55 ? (Math.random() < 0.4 ? 2 : 1) : 0;
  for (var b = 0; b < nb; b++){
    var br = traceBranch(main);
    if (br) paths.push(br);
  }
  return { paths:paths, straight:false };
}

function onTrace(r, c){
  if (!G.trace) return false;
  for (var p = 0; p < G.trace.paths.length; p++){
    var path = G.trace.paths[p];
    for (var i = 0; i < path.length; i++){
      if (path[i].r === r && path[i].c === c) return true;
    }
  }
  return false;
}
/* does a span in row r touch any cell of the trace? */
function traceBlocks(r, x, w){
  if (!G.trace) return false;
  for (var p = 0; p < G.trace.paths.length; p++){
    var path = G.trace.paths[p];
    for (var i = 0; i < path.length; i++){
      var t = path[i];
      if (t.r !== r) continue;
      if (x < t.c + 0.95 && x + w > t.c + 0.05) return true;
    }
  }
  return false;
}

/* every hazard interval in a row over the next `secs`, used by the tests */
function colSafeFor(r, col, secs){
  var row = rows[r];
  if (!row) return true;
  if (row.blocked && row.blocked[col]) return false;
  if (row.type === "sweep") return row.phase === "idle";
  if (row.type !== "road") return true;
  var p0 = col+0.12, p1 = col+0.88;
  var k = (G.slowT > 0) ? 0.45 : 1;
  var spec = HAZ[row.kind], i;
  for (i=0;i<row.cars.length;i++){
    var x = carX(row, row.cars[i]);
    var v = row.speed * k * secs * (row.cars[i].stopped ? 0 : 1);
    var a = Math.min(x, x + row.dir*v), b = Math.max(x, x + row.dir*v) + row.eff;
    if (a < p1 && b > p0) return false;
  }
  if (row.rogue){
    var rx = rogueX(row), rv = row.rogue.speed * k * secs;
    var ra = Math.min(rx, rx - row.dir*rv), rb = Math.max(rx, rx - row.dir*rv) + HAZ.ebike.w;
    if (ra < p1 && rb > p0) return false;
  }
  return true;
}

/* ------------------------------------------------------------------ update */
function playerPos(){
  var e = G.hop >= 1 ? 1 : 1 - Math.pow(1-G.hop, 3);
  var s = G.hop >= 1 ? 0 : Math.sin(G.hop * Math.PI);
  return { col:G.fromCol + (G.col-G.fromCol)*e, row:G.fromRow + (G.row-G.fromRow)*e,
           lift:s*30, sq:s };
}
function burst(x, y, col){
  for (var i=0;i<G.parts.length;i++){
    var p = G.parts[i];
    p.life = 0.5 + Math.random()*0.4;
    p.x = x; p.y = y;
    p.vx = (Math.random()-0.5)*560; p.vy = -120 - Math.random()*420;
    p.s = 6 + Math.random()*13;
    p.c = col || ((Math.random()<0.5) ? C.brand : C.danger);
  }
}
function die(kind){
  var pair = lineOf(kind);
  AUDIO.die();
  G.state = ST_DEAD; G.deadFor = 0; G.shake = 16;
  G.deathName = hazName(kind);
  G.deathObj = pair[0]; G.deathFix = pair[1];
  var pp = playerPos();
  burst(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 36);
  saveBest(pipeline());
}
function missTrain(){
  AUDIO.missedTrain();
  G.state = ST_DEAD; G.deadFor = 0; G.shake = 10; G.missedTrain = true;
  G.deathName = "THE " + pad2(G.trainHH % 12 || 12) + ":" + pad2(G.trainMM);
  G.deathObj = "You stood on the corner too long.";
  G.deathFix = "Deals and trains both leave without you.";
  saveBest(pipeline());
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }

/* Coming down is the dangerous part. Flight carries you over solid props and
   straight through traffic, so when it expires you can be standing inside a
   scaffold or on top of a bus - either would be an instant death the player
   could not have avoided. So on landing: slide out of any solid cell to the
   nearest free column, and take a moment of grace on the way down. */
/* ============================== THE RIDE ==================================
   Swipe in at a subway entrance and you surface five to ten streets uptown,
   out of another one. Three phases: down the stairs, the train, up the stairs.
   The exit is forced to exist - a subway prop is planted at the destination if
   there is not one already - and its cell is unblocked on arrival so you step
   out of the stairwell rather than into it. Removing a blocker can never
   create a pin, so the generation guarantees still hold. */
function startRide(enterRow, enterCol){
  ensureRows(G.maxRow + 60);
  var fromSt = streetAt(enterRow);
  var wantSt = fromSt + 5 + ((Math.random()*6) | 0);     // 5..10 streets
  var dest = null;
  for (var r = enterRow + 3; r < enterRow + 80; r++){
    var w = rows[r];
    if (!w || w.type !== "safe") continue;
    if (streetAt(r) >= wantSt){ dest = r; break; }
  }
  if (dest === null){ AUDIO.bump(); return; }

  // find or plant the exit
  var exitCol = -1, dw = rows[dest], i;
  for (i = 0; i < dw.props.length; i++){
    if (dw.props[i].kind === "subway"){ exitCol = dw.props[i].col; break; }
  }
  if (exitCol < 0){
    var cand = placeBlockers(1);
    exitCol = cand.length ? cand[0] : (COLS >> 1);
    dw.props.push({ col:exitCol, kind:"subway" });
  }
  delete dw.blocked[exitCol];

  G.metro = false;                                       // single ride
  G.rides++;
  G.ride = { t:0, phase:"down", fromRow:enterRow, fromCol:enterCol,
             toRow:dest, toCol:exitCol, camFrom:G.camRow, streets:streetAt(dest) - fromSt };
  G.col = enterCol; G.fromCol = enterCol;
  G.row = enterRow; G.fromRow = enterRow; G.hop = 1;
  G.invulnT = Math.max(G.invulnT, 1.2);
  AUDIO.subway();
}

function updateRide(dt){
  var R = G.ride;
  R.t += dt;
  if (R.phase === "down"){
    if (R.t >= 0.55){ R.phase = "train"; R.t = 0; AUDIO.train(); }
  } else if (R.phase === "train"){
    var f = Math.min(1, R.t / 2.1);
    var e = f < 0.5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;   // ease in-out
    G.camRow = R.camFrom + (R.toRow - R.camFrom) * e;
    if (R.t >= 2.1){
      R.phase = "up"; R.t = 0;
      G.row = R.toRow; G.fromRow = R.toRow;
      G.col = R.toCol; G.fromCol = R.toCol; G.hop = 1;
      if (G.row > G.maxRow){
        G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP * (G.row - G.maxRow));
        G.maxRow = G.row; progress();
      }
      ensureRows(G.maxRow + ROWS_AHEAD);
    }
  } else {
    if (R.t >= 0.55){
      G.ride = null;
      G.invulnT = Math.max(G.invulnT, 0.8);
      flash("OUT AT W " + G.street + " ST", R.streets + " streets uptown.", "#ffd24a");
    }
  }
}

/* the subway car, drawn over the world while the camera races uptown */
function drawRide(){
  var R = G.ride;
  if (!R) return;
  if (R.phase === "down" || R.phase === "up"){
    var f = R.t / 0.55, a = (R.phase === "down") ? f : 1 - f;
    ctx.globalAlpha = Math.max(0, Math.min(1, a)) * 0.8;
    ctx.fillStyle = "#05070a";
    ctx.fillRect(0, HORIZON, LOGICAL_W, LOGICAL_H - HORIZON);
    ctx.globalAlpha = 1;
    return;
  }
  // full blackout, then the car
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, HORIZON, LOGICAL_W, LOGICAL_H - HORIZON);

  // tunnel lights streaking past
  var sp = (G.t * 1400) % 320;
  ctx.globalAlpha = 0.5; ctx.fillStyle = "#4a3a20";
  for (var x = -320; x < LOGICAL_W + 320; x += 320) ctx.fillRect(x + sp, 300, 6, 70);
  ctx.globalAlpha = 1;

  var cy = 560, ch = 300, cx0 = 150, cw = LOGICAL_W - 300;
  plate(cx0, cy, cw, ch, "#9aa3ab", 20);                 // car body
  plate(cx0+10, cy+10, cw-20, ch-20, "#2b3138", 16);
  ctx.fillStyle = "#1b4fa8"; ctx.fillRect(cx0+10, cy+ch-54, cw-20, 12);

  // windows, with the seller in one of them
  var wn = 5, ww = (cw - 80) / wn;
  for (var i = 0; i < wn; i++){
    var wx = cx0 + 40 + i*ww;
    plate(wx, cy+44, ww-26, 120, "#0c1016", 10);
    plate(wx+5, cy+49, ww-36, 110, "#17303f", 8);
    if (i === 2){
      var sp2 = S.player_r;
      ctx.drawImage(sp2.img, wx + (ww-26)/2 - sp2.w*0.46, cy+56, sp2.w*0.92, sp2.h*0.92);
    } else {
      ctx.globalAlpha = 0.55; ctx.fillStyle = "#3b4a56";
      ctx.fillRect(wx+22, cy+86, 26, 56); ctx.fillRect(wx+62, cy+94, 24, 48);
      ctx.globalAlpha = 1;
    }
  }
  plate(cx0+26, cy+196, cw-52, 54, "#1d2228", 10);
  txt("UPTOWN  \u00B7  " + R.streets + " STREETS", LOGICAL_W/2, cy+224, 26, "#ffd24a");
  ctx.globalAlpha = 0.35; ctx.fillStyle = "#000";
  ctx.fillRect(cx0, cy+ch, cw, 18); ctx.globalAlpha = 1;
}

function landFromFlight(){
  var row = rows[G.row];
  if (row && row.blocked && row.blocked[G.col]){
    for (var d = 1; d < COLS; d++){
      if (G.col + d <= COLS - 1 && !row.blocked[G.col + d]){ G.col += d; break; }
      if (G.col - d >= 0        && !row.blocked[G.col - d]){ G.col -= d; break; }
    }
    G.fromCol = G.col; G.hop = 1;
  }
  G.invulnT = Math.max(G.invulnT, 0.85);
  AUDIO.hiss();
}

function hitPlayer(kind, pp){
  if (G.invulnT > 0) return;
  if (G.shield){
    G.shield = false; G.invulnT = 1.1; G.shake = 11;
    AUDIO.shield();
    flash("OBJECTION HANDLED", "Endpoint Agent absorbed it.", C.pw1);
    burst(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 40, C.pw1);
  } else die(kind);
}

function update(dt){
  G.t += dt;
  if (G.ride){ updateRide(dt); if (G.ride) return; } G.sweep += dt*0.4; if (G.sweep > 1.7) G.sweep -= 1.7;
  if (G.hop < 1){
    G.hop += dt*1000 / (HOP_MS * (1 - 0.32*G.flyA));   // airborne is quicker
    if (G.hop >= 1){ G.hop = 1; collect(); }
  }
  if (G.slowT   > 0) G.slowT   = Math.max(0, G.slowT - dt);
  if (G.riskT > 0) G.riskT = Math.max(0, G.riskT - dt);
  if (G.revealT > 0){
    G.revealT = Math.max(0, G.revealT - dt);
    if (G.revealT === 0) G.trace = null;
  }
  if (G.invulnT > 0) G.invulnT = Math.max(0, G.invulnT - dt);

  /* Flight. The ascent and descent are eased off a single 0..1 value, so the
     lift, the faster hop and the shadow all stay in sync. */
  var wasFlying = G.flyT > 0;
  if (G.flyT > 0) G.flyT = Math.max(0, G.flyT - dt);
  if (wasFlying && G.flyT <= 0) landFromFlight();
  G.flyA += ((G.flyT > 0 ? 1 : 0) - G.flyA) * Math.min(1, dt * 7);
  if (G.flyA < 0.002) G.flyA = 0;

  /* An engaged TAM keeps delivering for the rest of the run. */
  if (G.tam && G.state === ST_PLAY){
    G.tamLeft -= dt;
    if (G.tamLeft <= 0){
      G.tam = false; G.tamLeft = 0;
      flash("TAM ENGAGEMENT ENDED", "Sixty seconds. Find another.", C.pw5);
    }
  }
  if (G.tam && G.state === ST_PLAY){
    G.tamT -= dt;
    if (G.tamT <= 0){
      // 8-14s, so an engaged TAM delivers 2-4 times in a typical run and the
      // win lines actually get read - they are the point of the power-up
      G.tamT = 8 + Math.random()*6;
      G.tamWins++;
      G.flyT = Math.min(FLY_MAX, G.flyT + TAM_BONUS_SECS);
      AUDIO.tamWin();
      flash(TAM_WINS[(Math.random()*TAM_WINS.length)|0],
            "+" + TAM_BONUS_SECS + "s of flight.", C.pw5);
    }
  }

  var pp = playerPos();
  G.camRow += (pp.row - G.camRow) * Math.min(1, dt*11);

  // the commute clock: only forward progress buys time back
  if (G.state === ST_PLAY){
    G.trainT -= dt;
    if (G.trainT <= 0){ G.trainT = 0; missTrain(); }
  }

  var lo = Math.floor(G.camRow) - ROWS_BEHIND, hi = Math.floor(G.camRow) + ROWS_AHEAD, r, i;
  var slowK = (G.slowT > 0) ? 0.45 : 1;   // Internet Insights slows the grid

  if (G.state !== ST_DEAD){
    for (r = lo; r <= hi; r++){
      var row = rows[r];
      if (!row) continue;

      if (row.type === "sweep"){
        row.t += dt;
        if (row.phase === "idle" && row.t >= row.idleFor){
          row.phase = "warn"; row.t = 0;
          if (Math.abs(r - G.row) < 9) AUDIO.siren();
        } else if (row.phase === "warn" && row.t >= 2.0){
          row.phase = "sweep"; row.t = 0;
          row.cars = [];
          var convoyW = HAZ.motorcade.w;
          for (i=0;i<4;i++) row.cars.push({ p: -(i*(convoyW+0.5)) - convoyW, stop:0 });
          row.eff = convoyW;
        } else if (row.phase === "sweep"){
          for (i=0;i<row.cars.length;i++) row.cars[i].p += row.speed * slowK * dt;
          if (row.cars.length && row.cars[0].p > SPAN + 2){
            row.phase = "idle"; row.t = 0; row.cars = [];
            row.idleFor = 3.4 + Math.random()*3.2;
          }
        }
        continue;
      }

      if (row.type !== "road") continue;
      var spec = HAZ[row.kind];
      for (i=0;i<row.cars.length;i++){
        var car = row.cars[i];
        if (spec.stops){
          // moves 3.6s, halts 1.6s - the M34 rhythm
          car.stop += dt;
          var cyc = car.stop % 5.2;
          var wasStopped = car.stopped;
          car.stopped = (cyc > 3.6);
          if (car.stopped && !wasStopped && Math.abs(r - G.row) < 6) AUDIO.hiss();
        }
        /* While a trace is live, anything that reaches it turns around. The
           player is already immune on the route; this exists to make that
           unmistakable. Guard is !(bounce > 0), not bounce <= 0: bounce starts
           undefined and `undefined <= 0` is false, which silently disabled the
           whole effect first time round. */
        if (car.bounce > 0) car.bounce -= dt;
        if (G.revealT > 0 && G.trace && !(car.bounce > 0) &&
            traceBlocks(r, carX(row, car), row.eff || 1)){
          car.rv = -(car.rv || 1);
          car.bounce = 1.4;
        }
        if (!car.stopped){
          car.p += row.speed * slowK * dt * (car.rv || 1);
          if (car.p >= SPAN) car.p -= SPAN;
          if (car.p < 0) car.p += SPAN;
        }
      }
      if (row.rogue){
        // against the posted direction, which is the whole joke
        row.rogue.p += row.rogue.speed * slowK * dt;
        if (row.rogue.p >= SPAN) row.rogue.p -= SPAN;
      }
    }
  }

  if (G.state === ST_PLAY && G.flyT <= 0){
    var cr = (G.hop < 0.5) ? G.fromRow : G.row;
    var crow = rows[cr];
    if (crow && (crow.type === "road" || crow.type === "sweep")){
      var p0 = pp.col+0.14, p1 = pp.col+0.86, hitKind = null;
      for (i=0;i<crow.cars.length;i++){
        var cx = carX(crow, crow.cars[i]);
        if (cx < p1 && cx + (crow.eff || HAZ[crow.kind].w) > p0){ hitKind = crow.kind; break; }
      }
      if (!hitKind && crow.parked){
        for (i=0;i<crow.parked.length;i++){
          var px0 = crow.parked[i].col;
          if (px0 < p1 && px0 + HAZ.boxtruck.w > p0){ hitKind = "boxtruck"; break; }
        }
      }
      if (!hitKind && crow.rogue){
        var rx = rogueX(crow);
        if (rx < p1 && rx + HAZ.ebike.w > p0) hitKind = "ebike";
      }
      // the traced route is genuine safe passage, not a hint
      if (hitKind && G.revealT > 0 && onTrace(cr, G.col)) hitKind = null;
      if (hitKind) hitPlayer(hitKind, pp);
    }
  }

  if (G.state === ST_DEAD) G.deadFor += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*46);

  if (G.toast){
    G.toast.life -= dt;
    G.toast.a += ((G.toast.life > 0.5 ? 1 : 0) - G.toast.a) * Math.min(1, dt*7);
    if (G.toast.life < -0.4) G.toast = null;
  }
  if (G.flash){ G.flash.life -= dt; if (G.flash.life <= 0) G.flash = null; }

  for (i=0;i<G.parts.length;i++){
    var pt = G.parts[i];
    if (pt.life <= 0) continue;
    pt.life -= dt; pt.vy += 1500*dt;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
  }
  pruneRows(Math.floor(G.camRow) - ROWS_BEHIND - 4);
}

/* -------------------------------------------------------------------- draw */
function rowScreenY(r){ return BASE_Y - (r - G.camRow) * ROW_H; }

/* =============================================================== SKYLINE ===
   Three layers above the horizon: a static far band, a nearer band, and a
   LANDMARK layer that changes as you walk uptown. Everything is plain rects,
   drawn fresh each frame (~400 fills) rather than baked, because a 1920x250
   bake per landmark set would have cost ~2MB each.

   Window lighting is hashed from integer pixel coords, so a given window is
   lit consistently every frame instead of strobing.
   ========================================================================= */
function winGrid(x, y, w, h, seed, a, stepX, stepY){
  if (w < 22 || h < 22) return;
  stepX = stepX || 18; stepY = stepY || 20;
  ctx.globalAlpha = a;
  ctx.fillStyle = "#ffae55";
  for (var wy = y + 9; wy < y + h - 11; wy += stepY){
    for (var wx = x + 7; wx < x + w - 9; wx += stepX){
      if ((((wx | 0) * 7 + (wy | 0) * 13 + seed * 31) % 17) < 6){
        ctx.fillRect(wx | 0, wy | 0, 6, 8);
      }
    }
  }
  ctx.globalAlpha = 1;
}
/* one box sitting on the skyline baseline */
function bldg(x, w, h, tone, a, seed, winA){
  ctx.globalAlpha = a; ctx.fillStyle = tone;
  ctx.fillRect(x, SKY_BASE - h, w, h);
  ctx.globalAlpha = 1;
  if (winA > 0) winGrid(x, SKY_BASE - h, w, h, seed, winA * a);
}
/* a box stacked at an arbitrary height, for setbacks and crowns */
function slab(x, y, w, h, tone, a){
  ctx.globalAlpha = a; ctx.fillStyle = tone;
  ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
}

/* ---- LANDMARKS -----------------------------------------------------------
   Street-level facades filling the band between the far skyline and the kerb,
   fading in and out by cross street so the city changes as you walk. All flat
   rects - no gradients, no per-pixel work - because fill rate is the scarce
   resource on a Board, not geometry. Two or three are up at once.
   ------------------------------------------------------------------------ */
function bandA(st, from, to, fade){
  if (st < from - fade || st > to + fade) return 0;
  if (st < from) return (st - (from - fade)) / fade;
  if (st > to)   return 1 - (st - to) / fade;
  return 1;
}

  ctx.globalAlpha = LA; ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
}
function lrA(x, y, w, h, col, a){
  ctx.globalAlpha = LA * a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
}
function lwin(x, y, w, h, cols, rws, seed, col){
  ctx.globalAlpha = LA * 0.75; ctx.fillStyle = col || "#ffae55";
  var cw = w/cols, ch = h/rws;
  for (var i = 0; i < cols; i++) for (var j = 0; j < rws; j++){
    if (((i*7 + j*13 + seed*31) % 17) < 7)
      ctx.fillRect(x + i*cw + cw*0.22, y + j*ch + ch*0.22, cw*0.56, ch*0.56);
  }
  ctx.globalAlpha = LA;
}
