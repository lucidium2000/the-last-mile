    if (k >= 1 && !T.done["r" + i]){ T.done["r" + i] = 1; if (T.rows[i].amt > 0) AUDIO.stage(); }
  }
  var tk = tallyTotalAt();
  if (tk > 0 && tk < 1) climbing = true;
  if (tk >= 1 && !T.done.total){ T.done.total = 1; AUDIO.tamWin(); }
  if (climbing){
    T.tick -= dt;
    if (T.tick <= 0){ T.tick = 0.055; AUDIO.coach(); }
  }
}

function endRun(){
  if (G.logged) return;
  G.logged = true;
  G.rec = runRecord(lastInitials() || "---");
  buildTally();
  statsBump(G.rec);
  var seed = lastInitials(), i;
  for (i = 0; i < 3; i++){
    var ch = seed.charAt(i) || "A";
    var at = INI_CHARS.indexOf(ch.toUpperCase());
    G.ini[i] = at < 0 ? 0 : at;
  }
}
function iniStep(d){
  G.ini[G.iniAt] = (G.ini[G.iniAt] + d + INI_CHARS.length) % INI_CHARS.length;
  AUDIO.coach();
}
function iniString(){
  return INI_CHARS.charAt(G.ini[0]) + INI_CHARS.charAt(G.ini[1]) + INI_CHARS.charAt(G.ini[2]);
}
function submitScore(){
  var ini = iniString().replace(/\s+$/, "") || "---";
  G.rec.ini = ini;
  rememberInitials(ini);
  boardPOST(G.rec);
  G.state = ST_BOARD; G.deadFor = 0;
  AUDIO.stage();
}
function inMuteBtn(lx, ly){
  return muteBtnActive() &&
         lx > MUTE_BTN.x - 14 && lx < MUTE_BTN.x + MUTE_BTN.w + 14 &&
         ly > MUTE_BTN.y - 14 && ly < MUTE_BTN.y + MUTE_BTN.h + 14;
}

var ptr = null;
cv.addEventListener("pointerdown", function(e){
  e.preventDefault(); AUDIO.unlock();
  ptr = { sx:e.clientX, sy:e.clientY, used:false };
}, { passive:false });
cv.addEventListener("pointerup", function(e){
  e.preventDefault();
  if (!ptr) return;
  if (ptr.used){ ptr = null; return; }      // already handled on press
  var dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
  if (Math.sqrt(dx*dx + dy*dy) > 42){
    if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? "r" : "l");
    else                             act(dy < 0 ? "f" : "b");
  } else {
    var rect = cv.getBoundingClientRect();
    var px = (e.clientX-rect.left)/rect.width, py = (e.clientY-rect.top)/rect.height;
    var lx = px*LOGICAL_W, ly = py*LOGICAL_H;
    if (inMuteBtn(lx, ly)){ AUDIO.toggle(); ptr = null; return; }
    if (G.state === ST_TITLE &&
        lx >= BOARD_BTN.x && lx <= BOARD_BTN.x + BOARD_BTN.w &&
        ly >= BOARD_BTN.y && ly <= BOARD_BTN.y + BOARD_BTN.h){
      G.state = ST_BOARD; G.deadFor = 0; G.rec = null; boardGET(); AUDIO.ui();
      ptr = null; return;
    }
    if (G.state === ST_NAME){
      var h = nameHit(lx, ly);
      if (h){
        if (h.ok) submitScore();
        else if (h.d) { G.iniAt = h.i; iniStep(h.d); }
        else { G.iniAt = h.i; AUDIO.step(); }
        ptr = null; return;
      }
    }
    /* A tap anywhere means forward. The old scheme split the screen into four
       invisible zones, so a tap meant for "cross" near the bottom corners moved
       you sideways instead. Sideways and back come from the arrows or a swipe,
       both of which are deliberate. */
    act("f");
  }
  ptr = null;
}, { passive:false });
cv.addEventListener("pointercancel", function(){ ptr = null; });
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

window.addEventListener("keydown", function(e){
  var k = e.key;
  if (k==="m" || k==="M"){ AUDIO.unlock(); AUDIO.toggle(); e.preventDefault(); return; }
  AUDIO.unlock();
  /* Typing your initials beats nudging a letter wheel, so on that one screen
     the keyboard is a keyboard. */
  if (G.state === ST_NAME){
    if (k === "Enter"){ submitScore(); e.preventDefault(); return; }
    if (k === "Backspace"){ G.iniAt = (G.iniAt + 2) % 3; AUDIO.step(); e.preventDefault(); return; }
    if (k && k.length === 1){
      var at = INI_CHARS.indexOf(k.toUpperCase());
      if (at >= 0){
        G.ini[G.iniAt] = at;
        if (G.iniAt < 2) G.iniAt++;
        AUDIO.coach(); e.preventDefault(); return;
      }
    }
  }
  if (k==="ArrowUp"    || k==="w" || k===" "){ act("f"); e.preventDefault(); }
  if (k==="ArrowDown"  || k==="s"){ act("b"); e.preventDefault(); }
  if (k==="ArrowLeft"  || k==="a"){ act("l"); e.preventDefault(); }
  if (k==="ArrowRight" || k==="d"){ act("r"); e.preventDefault(); }
});

/* ----------------------------------------------------------------- powers */
function collect(){
  var row = rows[G.row];
  if (!row || !row.pickup || row.pickup.col !== G.col) return;
  var kind = row.pickup.kind, k = POWERS[kind];
  row.pickup = null;
  G.powersUsed++;
  G.got[kind] = (G.got[kind] || 0) + 1;
  if (kind === "tam") AUDIO.tam();
  else if (kind === "agent") AUDIO.shieldUp();
  else AUDIO.power(kind);
  flash(k.name, kind === "chuck" ? ("+" + cash(CHUCK_BONUS) + " on the number.") : k.line, k.col);
  burst(G.col*TILE + TILE/2, rowScreenY(G.row) - 40, k.col);

  if (kind === "chuck"){
    G.bonus += CHUCK_BONUS; G.bonusChuck += CHUCK_BONUS;
    burst(G.col*TILE + TILE/2, rowScreenY(G.row) - 40, "#7fd49a");
    /* The card freezes the world rather than floating over it - at the size it
       needs to be readable it would otherwise cover the traffic you are
       standing in. */
    /* 0 to 10 percent, rolled fresh every time - the card is a celebration,
       not a quote, so the number may as well be a surprise. */
    G.ticker = { t:0, pct: 0.1 + Math.random() * 9.9 };
    AUDIO.dig();
  }
  /* Cards accumulate. Three in the wallet is three rides, which is what makes
     stacking them worth doing instead of riding the first train you find. */
  else if (kind === "metro"){ G.metro = Math.min(9, G.metro + 1); }
  else if (kind === "tam"){
    /* He does not simply take off. He gets changed first - see drawBooth.
       The flight is handed out when the booth opens, not here. */
    G.booth = { t:0, col:G.col, row:G.row };
    G.invulnT = Math.max(G.invulnT, BOOTH_SECS + 0.5);
    G.tam = true;
    /* First win lands at 3-6s, i.e. right as the initial flight runs out, so
       the SKU is seen delivering immediately rather than silently. Measured
       at 9-16s, most runs ended before a single win fired. */
    G.tamLeft = TAM_DURATION;
    G.tamT = 3 + Math.random()*3;
  }
  else if (kind === "agent"){
    /* The blazer going blue is the biggest visual change in the game and it
       used to happen in silence. Now he jumps, puts both hands up, and the
       sound says so. */
    /* A second set on top of the first stacks rather than being wasted. */
    var was = G.shield | 0;
    G.shield = Math.min(2, was + 1);
    G.cheerT = CHEER_SECS;
    if (G.shield > was && G.shield === 2)
      flash("ENDPOINT AGENTS \u00d72", "Purple. Two objections bounce off this.",
            BLAZER2);
  }
  else if (kind === "insight") G.slowT = Math.max(G.slowT, k.secs);
  else if (kind === "traffic") G.riskT = Math.max(G.riskT, k.secs);
  else if (kind === "path"){
    G.revealT = Math.max(G.revealT, k.secs);
    G.trace = buildTrace();
  }
  else if (kind === "sponsor"){
    var adv = 0;
    for (var i=1;i<=3;i++){
      var w = rows[G.row+i];
      if (w && w.blocked && w.blocked[G.col]) break;
      adv = i;
    }
    if (adv > 0){
      G.fromRow = G.row; G.fromCol = G.col;
      G.row += adv; G.hop = 0; G.invulnT = Math.max(G.invulnT, 0.95);
      G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP*adv);
      if (G.row > G.maxRow){ G.maxRow = G.row; progress(); }
      ensureRows(G.maxRow + ROWS_AHEAD);
    }
  }
}

/* ===================== PATH VISUALIZATION ================================
   Modelled on a ThousandEyes path trace: a route of nodes joined by links,
   with a packet running along it. Unlike the product it does not show where
   you have been - it hands you a route forward, and that route is genuinely
   safe. While the trace is live you cannot be hit on any cell belonging to it,
   so it is four streets of guaranteed passage rather than a hint.

   The route only has to dodge PERMANENT blockers (props, parked trucks),
   because traffic cannot touch you on it. Sideways steps are inserted as their
   own nodes so the drawn path is always walkable hop by hop. */
function traceColClear(col, fromRow, rowsAhead){
  for (var r = fromRow + 1; r <= fromRow + rowsAhead; r++){
    var w = rows[r];
    if (!w) return false;
    if (w.blocked && w.blocked[col]) return false;
  }
  return true;
}

/* Walk forward from (r, col), dodging permanent blockers, until `streets`
   crossings have been made. Returns the list of cells, sideways steps
   included, so the drawn route is always walkable hop by hop. */
function traceRun(r, col, streets, cells){
  var crossed = 0, guard = 0;
  while (crossed < streets && guard++ < 90){
    var nr = r + 1, row = rows[nr];
    if (!row) break;
    if (row.blocked && row.blocked[col]){
      var tgt = -1;
      for (var d = 1; d < COLS; d++){
        if (col + d <= COLS-1 && !row.blocked[col + d]){ tgt = col + d; break; }
        if (col - d >= 0 && !row.blocked[col - d]){ tgt = col - d; break; }
      }
      if (tgt < 0) break;
      var step = tgt > col ? 1 : -1;
      while (col !== tgt){
        if (rows[r] && rows[r].blocked && rows[r].blocked[col + step]) break;
        col += step;
        cells.push({ r:r, c:col });
      }
      if (row.blocked && row.blocked[col]) break;
    }
    r = nr;
    cells.push({ r:r, c:col });
    if (row.type === "road" || row.type === "sweep") crossed++;
  }
  return { r:r, c:col };
}

/* An alternate route: diverge from the main path, run parallel for a few
   rows, then rejoin. This is what a real path trace looks like when traffic
   takes more than one way to the same place. */
function traceBranch(main){
  if (main.length < 6) return null;
  var i = 2 + ((Math.random() * (main.length - 5)) | 0);
  var from = main[i];
  var dir = Math.random() < 0.5 ? 1 : -1;
  var out = [{ r:from.r, c:from.c }];
  var col = from.c, r = from.r, k;

  var off = 1 + ((Math.random() * 2) | 0);
  for (k = 0; k < off; k++){
    var nc = col + dir;
    if (nc < 0 || nc > COLS-1) break;
    if (rows[r] && rows[r].blocked && rows[r].blocked[nc]) break;
    col = nc; out.push({ r:r, c:col });
  }
  if (col === from.c) return null;

  var len = 2 + ((Math.random() * 3) | 0);
  for (k = 0; k < len; k++){
    var nr = r + 1;
    if (!rows[nr] || (rows[nr].blocked && rows[nr].blocked[col])) break;
    r = nr; out.push({ r:r, c:col });
  }

  // rejoin the main line at whatever column it occupies on this row
  var joinCol = null;
  for (var m = 0; m < main.length; m++) if (main[m].r === r){ joinCol = main[m].c; break; }
  if (joinCol === null) return out.length > 3 ? out : null;
  var step2 = joinCol > col ? 1 : -1;
  var guard2 = 0;
  while (col !== joinCol && guard2++ < COLS){
    var nc2 = col + step2;
    if (rows[r] && rows[r].blocked && rows[r].blocked[nc2]) break;
    col = nc2; out.push({ r:r, c:col });
  }
  return out.length > 3 ? out : null;
}

function buildTrace(){
  ensureRows(G.row + 70);
  var streets = 6 + ((Math.random() * 3) | 0);          // 6-8 crossings
  var main = [{ r:G.row, c:G.col }];

  /* Now and then the route is dead straight - no lateral movement at all.
     Only claimed when a column really is clear the whole way, so "perfectly
     straight" is never a lie about what is safe. */
  var wantStraight = Math.random() < 0.45;
  var straightCol = -1;
  if (wantStraight){
    /* Only the player's own column counts. Allowing a lead-in of a few
       sideways steps first produced routes with three or four columns in them,
       which is not what "perfectly straight" means. */
    var reach = streets * 2 + 3;
    if (traceColClear(G.col, G.row, reach)) straightCol = G.col;
  }

  if (straightCol >= 0){
    var col = G.col, step = straightCol > col ? 1 : -1;
    while (col !== straightCol){
      if (rows[G.row] && rows[G.row].blocked && rows[G.row].blocked[col + step]) break;
      col += step; main.push({ r:G.row, c:col });
    }
    var rr = G.row, crossed = 0, guard = 0;
    while (crossed < streets && guard++ < 90){
      var row = rows[rr + 1];
      if (!row || (row.blocked && row.blocked[col])) break;
      rr++; main.push({ r:rr, c:col });
      if (row.type === "road" || row.type === "sweep") crossed++;
    }
    return { paths:[main], straight:true };
  }

  traceRun(G.row, G.col, streets, main);
  var paths = [main];
  var nb = Math.random() < 0.55 ? (Math.random() < 0.4 ? 2 : 1) : 0;
  for (var b = 0; b < nb; b++){
    var br = traceBranch(main);
    if (br) paths.push(br);
  }
  return { paths:paths, straight:false };
}

function onTrace(r, c){
  if (!G.trace) return false;
  for (var p = 0; p < G.trace.paths.length; p++){
    var path = G.trace.paths[p];
    for (var i = 0; i < path.length; i++){
      if (path[i].r === r && path[i].c === c) return true;
    }
  }
  return false;
}
/* does a span in row r touch any cell of the trace? */
function traceBlocks(r, x, w){
  if (!G.trace) return false;
  for (var p = 0; p < G.trace.paths.length; p++){
    var path = G.trace.paths[p];
    for (var i = 0; i < path.length; i++){
      var t = path[i];
      if (t.r !== r) continue;
      if (x < t.c + 0.95 && x + w > t.c + 0.05) return true;
    }
  }
  return false;
}

/* every hazard interval in a row over the next `secs`, used by the tests */
function colSafeFor(r, col, secs){
  var row = rows[r];
  if (!row) return true;
  if (row.blocked && row.blocked[col]) return false;
  if (row.type === "sweep") return row.phase === "idle";
  if (row.type !== "road") return true;
  var p0 = col+0.12, p1 = col+0.88;
  /* A halted lane is genuinely safe, and the predictor has to know or it will
     paint a stopped street red and refuse to call a clear crossing clear. */
  var k = (row.halt > 0) ? 0 : ((G.slowT > 0) ? SLOW_K : 1);
  var spec = HAZ[row.kind], i;
  for (i=0;i<row.cars.length;i++){
    var x = carX(row, row.cars[i]);
    var v = row.speed * k * secs * (row.cars[i].stopped ? 0 : 1);
    var a = Math.min(x, x + row.dir*v), b = Math.max(x, x + row.dir*v) + row.eff;
    if (a < p1 && b > p0) return false;
  }
  if (row.rogue){
    var rx = rogueX(row), rv = row.rogue.speed * k * secs;
    var ra = Math.min(rx, rx - row.dir*rv), rb = Math.max(rx, rx - row.dir*rv) + HAZ.ebike.w;
    if (ra < p1 && rb > p0) return false;
  }
  return true;
}

/* ------------------------------------------------------------------ update */
/* He walks now. He used to hop - a 30px arc and an ease-out cubic that
   darted him out of the square and set him down - which made a man on his
   way to a meeting look like a frog.

   Two changes. The easing is a smoothstep rather than an ease-out, so the
   speed builds and settles instead of all of it being spent in the first
   third; and the arc is gone unless he is actually airborne, where it is
   deeper than ever because that one IS a flight. What is left on the ground
   is the bob of a walk: two footfalls a square, three and a half pixels. */
function playerPos(){
  var e = G.hop >= 1 ? 1 : G.hop*G.hop*(3 - 2*G.hop);
  var s = G.hop >= 1 ? 0 : Math.sin(G.hop * Math.PI);
  /* Airborne he rides at a height that depends on whether he is travelling,
     not on where he is between two squares. On foot it is the bob of a
     walk: two footfalls a square, three and a half pixels. */
  var air = G.flyA > 0.05 ? G.flyA : 0;
  /* Two footfalls a square while he walks, and a slow breath when he is not.
     A figure that is perfectly still between taps is a statue, and a statue
     is the other half of what reads as stiff. */
  var lift = air ? (6 + G.flyMove * 26) * air
           : Math.abs(Math.sin(G.walkPh)) * 3.4 * G.walkAmt
             + (1 - G.walkAmt) * 1.3 * (0.5 + 0.5 * Math.sin(G.t * 1.6));
  return { col:G.fromCol + (G.col-G.fromCol)*e, row:G.fromRow + (G.row-G.fromRow)*e,
           lift:lift, sq:s };
}

/* The stride. With the hop gone something has to say a step happened, and a
   figure sliding square to square says nothing at all. The sprite is one
   bake and there are already forty-two of them, so the limbs are separated
   by CLIPPING rather than by another eighty: the drawn figure is cut into
   five bands - head and torso, each arm, each leg - and each band is blitted
   from the same sprite at its own offset.

   Everything moves UP and only up, and that is not a shortcut - +y is away
   from the camera in this projection, so a limb swinging forward IS a limb
   moving up the screen. It also solves the seam: a band that only rises has
   its top edge cut off by its own clip and stays attached to the body,
   where one that dropped would open a strip of road between the shoulder
   and the sleeve. Sideways throw was tried and abandoned for the same
   reason - the sleeve's inner edge and the jacket's outer edge are the same
   line, so any lateral movement either clips the arm or detaches it.

   Arms run in opposition to the leg on the same side at a bit over half the
   throw, which is what arms do.

   The phase is G.walkPh, which is free-running and shared with the bob, so
   a second step picks up where the first left off instead of restarting the
   cycle; the amplitude is G.walkAmt, which eases out over about a tenth of
   a second so the legs settle rather than snap to attention. */
var STRIDE_LIFT = 9, STRIDE_ARM = 5;
function walkStride(){
  if (G.state !== ST_PLAY || G.ride) return null;
  if (G.flyA > 0.05) return null;            // flight has no footfalls
  var amt = G.walkAmt;
  if (amt < 0.012) return null;              // standing still costs one blit
  var a = Math.sin(G.walkPh);
  var up = Math.max(0, a) * amt, dn = Math.max(0, -a) * amt;
  return { legL: -up * STRIDE_LIFT, legR: -dn * STRIDE_LIFT,
           armL: -dn * STRIDE_ARM,  armR: -up * STRIDE_ARM };
}
function burst(x, y, col){
  for (var i=0;i<G.parts.length;i++){
    var p = G.parts[i];
    p.life = 0.5 + Math.random()*0.4;
    p.x = x; p.y = y;
    p.vx = (Math.random()-0.5)*560; p.vy = -120 - Math.random()*420;
    p.s = 6 + Math.random()*13;
    p.bill = false;
    p.c = col || ((Math.random()<0.5) ? C.brand : C.danger);
  }
}
/* What comes out of him when he goes down is money. He has been carrying
   that number in the HUD the whole way up Midtown, and the spray reads as
   blood for about a tenth of a second before you see what it actually is -
   which is the joke, and the point: the pipeline is what he bleeds.

   Notes are not sparks. They have a face, they tumble, and they do not drop
   like gravel, so a bill gets a third of the gravity, some drag, a spin and
   a sideways flutter. The pool is the same thirty objects either way; only
   the physics and the drawing fork on p.bill. */
var BILL_G = 470, BILL_DRAG = 1.5;
function burstMoney(x, y){
  for (var i=0;i<G.parts.length;i++){
    var p = G.parts[i];
    p.life = 0.80 + Math.random()*0.70;
    p.x = x + (Math.random()-0.5)*26;
    p.y = y + (Math.random()-0.5)*18;
    // up and out, but weighted upward - it is coming off him, not kicked
    var a = -Math.PI/2 + (Math.random()-0.5)*2.3;
    var sp = 200 + Math.random()*440;
    p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp;
    p.s = 12 + Math.random()*9;
    p.bill = true;
    p.rot = Math.random()*Math.PI*2;
    p.spin = (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random()*9);
    p.c = Math.random() < 0.28 ? "#4e9c62" : "#73c483";
  }
}
function die(kind){
  var pair = lineOf(kind);
  AUDIO.die();
  G.state = ST_DEAD; G.deadFor = 0; G.shake = 16;
  G.deathName = hazName(kind);
  G.deathObj = pair[0]; G.deathFix = pair[1];
  var pp = playerPos();
  burstMoney(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 36);
  saveBest(pipeline()); endRun();
}
/* Not hit by anything - just out of road. The one death with no hazard
   attached, so it gets its own copy rather than a hazard's objection pair. */
function dieTired(){
  G.deathPush = 0;                 // nothing threw him; he just stopped
  AUDIO.die();
  G.state = ST_DEAD; G.deadFor = 0; G.shake = 14;
  G.deathName = "EXHAUSTION";
  G.deathObj = "You worked the whole block list on an empty stomach.";
  G.deathFix = "Eat something. Long deals are won by the people still standing.";
  var pp = playerPos();
  burstMoney(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 36);
  saveBest(pipeline()); endRun();
}
function missTrain(){
  G.deathPush = 0;
  AUDIO.missedTrain();
  G.state = ST_DEAD; G.deadFor = 0; G.shake = 10; G.missedTrain = true;
  G.deathName = "THE " + pad2(G.trainHH % 12 || 12) + ":" + pad2(G.trainMM);
  G.deathObj = "You stood on the corner too long.";
  G.deathFix = "Deals and trains both leave without you.";
  saveBest(pipeline()); endRun();
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }
/* 42nd, not 42th. The toast had been bolting "th" onto everything. */
function ord(n){
  var t = n % 100;
  if (t >= 11 && t <= 13) return n + "th";
  return n + (["th","st","nd","rd"][n % 10] || "th");
}

/* Coming down is the dangerous part. Flight carries you over solid props and
   straight through traffic, so when it expires you can be standing inside a
   scaffold or on top of a bus - either would be an instant death the player
   could not have avoided. So on landing: slide out of any solid cell to the
   nearest free column, and take a moment of grace on the way down. */
/* ============================== THE RIDE ==================================
   Swipe in at a subway entrance and you surface five to ten streets uptown,
   out of another one. Three phases: down the stairs, the train, up the stairs.
   The exit is forced to exist - a subway prop is planted at the destination if
   there is not one already - and its cell is unblocked on arrival so you step
   out of the stairwell rather than into it. Removing a blocker can never
   create a pin, so the generation guarantees still hold. */
function startRide(enterRow, enterCol){
  /* Ten to twenty streets, so the generator has to run far enough ahead to
     hold them: twenty crossings is sixty-odd rows once the multi-lane streets
     are counted, and the search has to outrun that with room to spare. */
  ensureRows(G.maxRow + 160);
  var fromSt = streetAt(enterRow);
  /* Ten to twenty streets IN THE DIRECTION OF TRAVEL. On the way back the
     numbers descend, and the old test - streetAt(r) >= fromSt + 10 - could
     never be satisfied, so every ride on the return leg was refused with a
     bump. The subway was dead for the whole second half of the game. */
  var span = 10 + ((Math.random()*11) | 0);
  var wantSt = fromSt + legDir * span;
  /* Both ends of the walk are hard stops. Going up, the train may not carry
     you past the dinner at 81 - it is the pivot of the whole game, and a ride
     that flew over it left the player walking uptown forever with no turn and
     no ending. Coming back, it may not carry you past Penn. */
  if (legDir < 0) wantSt = Math.max(START_ST, wantSt);
  else            wantSt = Math.min(TURN_ST, wantSt);
  var dest = null, cap = null, r, w, sn;
  for (r = enterRow + 3; r < enterRow + 200; r++){
    w = rows[r];
    if (!w || w.type !== "safe" || w.park) continue;   // no station inside the park
    sn = streetAt(r);
    if (legDir > 0 && sn > TURN_ST) break;     // past the restaurant: stop looking
    if (legDir > 0) cap = r;                   // furthest row still short of it
    if (legDir > 0 ? (sn >= wantSt) : (sn <= wantSt)){ dest = r; break; }
  }
  // wanted to go further than 81 allows: get out as close to it as we can
  if (dest === null && legDir > 0 && cap !== null && streetAt(cap) > fromSt) dest = cap;
  if (dest === null){ AUDIO.bump(); return; }

  /* He comes up in the MIDDLE of the pavement, every time. It used to reuse
     whatever station entrance the row happened to have, or plant one wherever
     there was space, so he surfaced at a random column and the first thing
     the player had to do after a ride was work out where he was. The stair is
     the landmark; it belongs under the camera.

     Anything already standing in the middle column is moved aside rather than
     left to overlap the stair. */
  var dw = rows[dest], i;
  var exitCol = COLS >> 1;
  for (i = dw.props.length - 1; i >= 0; i--){
    if (dw.props[i].col === exitCol) dw.props.splice(i, 1);
  }
  // any station entrance the row already had is redundant now
  for (i = dw.props.length - 1; i >= 0; i--){
    if (dw.props[i].kind === "subway") dw.props.splice(i, 1);
  }
  /* Flagged as the one he came up. Stepping straight back into it put him
     on another train before he had taken a single step on the street, which
     is not a decision, it is a loop - and the ride is supposed to cost you
     the walk, not replace it. */
  dw.props.push({ col:exitCol, kind:"subway", exit:true });
  delete dw.blocked[exitCol];

  G.metro--;                             // one swipe, one fare
  G.rides++;
  /* The car is five standing positions wide. He starts in the middle; the
     other two slots are rolled per ride and never land on top of him or on
     each other, so there is always something to walk to. */
  var free = [0, 1, 3, 4], pull = function(){
    return free.length ? free.splice((Math.random()*free.length)|0, 1)[0] : -1;
  };
  var shady = Math.random() < 0.45 ? pull() : -1;
  var cash  = Math.random() < 0.55 ? pull() : -1;
  G.ride = { t:0, phase:"down", fromRow:enterRow, fromCol:enterCol,
             toRow:dest, toCol:exitCol, camFrom:G.camRow,
             streets:Math.abs(streetAt(dest) - fromSt),
             rock:0, slot:2, slotX:2, slotFrom:2, stepT:1,
             face:1, shady:shady, cash:cash, cashGot:false, met:false,
             shadyX:shady, knife:0, knifeSide:0, ko:0, koT:0, swing:0, brace:0,
             robbed:0, clack:0,
             hostile: Math.random() < SHADY_HOSTILE,
             tell:0, look:0, lurch:0, eyes:0,
             pause: 1 + Math.random() * 2 };
  G.col = enterCol; G.fromCol = enterCol;
  G.row = enterRow; G.fromRow = enterRow; G.hop = 1;
  G.invulnT = Math.max(G.invulnT, 1.2);
  AUDIO.subway();
}

/* The ride, at roughly twice its old length and in five beats:
     down     stairs, the street light closing over you
     platform the headlight growing out of the tunnel
     run      the car, rocking, tunnel lights and stations tearing past
     arrive   brakes, the station sign sliding in, doors opening
     up       back out into the street
   Each beat has its own sound. The camera races uptown through `run`. */
var RIDE_PHASES = { down:1.0, platform:1.5, run:5.4, arrive:1.0, up:0.7 };
var RIDE_SLOTS = 5;
/* The man at the far end of the car. He closes on you in a straight line at
   his own pace rather than in slot-sized hops - he is not playing the same
   game you are, and a mugger who moves on your grid looks like another
   commuter. Everything else here is the window you get once he is close. */
var RIDE_STEP = 0.20;      // how long he takes to cross from one slot to the next
/* And he does not have to cross a whole one. A full slot is a fifth of the
   car, which is a stride a man cannot take - he teleported from window to
   window. Half of that is a step, and because the stride time scales with
   the distance he walks at the same speed either way. */
var RIDE_SUB = 0.5;
var SHADY_SPEED = 0.52;    // slots a second, when he means it
/* Nine times in ten he is just a man on a train. He still gets on, he still
   watches, he may still drift up the car - but he does not draw anything and
   he does not take anything. The one time in ten that he does is worth
   something precisely because the other nine were nothing. */
var SHADY_HOSTILE = 0.10;
var SHADY_CREEP = 0.13;    // slots a second when he is only being odd about it
var SHADY_KEEP  = 1.35;    // and he never comes closer than this
/* The red eyes: how long one showing lasts, how much of that is the fade
   up, and how often one starts. 0.09 a second against a run phase of 5.4
   works out at a bit over a third of rides - often enough that it is a
   thing the game does, rare enough that it is never a cue. */
var EYES_SECS = 2.0, EYES_UP = 0.35, EYES_RATE = 0.09;
var KNIFE_NEAR  = 0.95;    // how close before the blade comes out
var KNIFE_GRACE = 1.70;    // how long you have to do something about it
var SWING_REACH = 1.30;    // how far the briefcase carries
var TRAIN_ROB   = 30;      // what standing still costs you

/* Chuck Bucks found on the train. Same payout as the pavement pickup, same
   card, same voice line - it is the identical event, just somewhere else. */
function chuckPayout(where, quiet){
  G.bonus += CHUCK_BONUS; G.bonusChuck += CHUCK_BONUS;
  /* Not on the train. The ticker card takes the whole screen and freezes the
     world behind it, and the ride is already a scene - stacking a second one
     on top threw the player out of the carriage mid-stride, which is exactly
     when the man at the other end is walking towards him. The money, the
     sound and the flash all still land. */
  if (!G.ride) G.ticker = { t:0, pct: 0.1 + Math.random() * 9.9 };
  /* `quiet` is for the moment the money is not the event. Knocking a man down
     and having him say "I know you're gonna dig this" over the top of it was
     the wrong voice for what just happened; the briefcase gets the sound. */
  /* Quiet means something else owns this moment - it keeps its own sound and
     its own banner, and the payout just adds the money. Raising a second
     flash here overwrote "BRIEFCASE, FULL SWING" a frame after it appeared,
     so the headline the player never got to read was the swing itself. */
  if (quiet) return;
  AUDIO.dig();
  flash("CHUCK BUCKS", where, POWERS.chuck.col);
}

/* Moving around inside the car. The ride owns the input while it is running:
   without this the taps fell through to world movement and quietly walked the
   player across streets he could not see. */
function rideAct(dir){
  var R = G.ride;
  if (R.phase === "down" || R.phase === "up") return;
  var d = (dir === "r" || dir === "f") ? 1 : -1;
  /* Walking INTO him while the blade is out is the answer. The briefcase has
     a laptop, a dock and two years of printed QBRs in it, and he is not
     expecting the commuter to be the one who swings first.

     Checked before the bounds test, because the swing is not a step: he can be
     cornered against the end of the car with nowhere to retreat and that is
     exactly when you need this to work. */
  if (R.shady >= 0 && !R.ko && R.knife > 0 && d === (R.knifeSide || 1) &&
      Math.abs(R.shadyX - rideManX(R)) <= SWING_REACH){
    R.ko = 1; R.koT = 0; R.swing = 0.42; R.knife = 0;
    R.face = d;
    R.brace = 0.55;                      // the hero's own follow-through
    AUDIO.heave();
    G.shake = 18;
    AUDIO.swing();
    chuckPayout("He dropped it on his way down.", true);
    flash("BRIEFCASE, FULL SWING",
          "He picked the wrong commuter.  +" + cash(CHUCK_BONUS), C.good);
    return;
  }

  var ns = R.slot + d * RIDE_SUB;
  if (ns < -0.001 || ns > RIDE_SLOTS - 1 + 0.001){ AUDIO.bump(); return; }
  ns = Math.max(0, Math.min(RIDE_SLOTS - 1, ns));
  /* The stride is a tween, not a jump. R.slot is where he is going and is
     what the logic uses; R.slotX is where he is, and is what gets drawn and
     what the man with the knife measures against. The duration scales with
     the distance, so half a slot takes half as long and the walking speed
     is the same whatever the step size is set to. */
  R.slotFrom = rideManX(R);
  R.stepDur = Math.max(0.06, RIDE_STEP * Math.abs(ns - R.slotFrom));
  R.slot = ns; R.stepT = 0; R.face = d;
  // any step at all buys a moment: the grace clock restarts from here
  if (R.knife > 0) R.knife = 0.0001;
  AUDIO.step();
  /* Within half a slot counts, because he no longer lands on the integers
     every time and a roll of notes you walk past without taking is worse
     than one that is not there. */
  if (R.cash >= 0 && !R.cashGot && Math.abs(ns - R.cash) <= RIDE_SUB){
    R.cashGot = true;
    chuckPayout("Someone left it on the seat.");
  }
  if (R.shady >= 0 && !R.met && Math.abs(ns - R.shady) <= RIDE_SUB){
    R.met = true;
    flash("HE IS WATCHING YOUR BAG", "Keep walking. Eyes forward.", "#9aa0a6");
    AUDIO.nope();
  }
  /* Walking into the one who is only being odd about it gets nothing. No
     knife means no swing, and a man who has done nothing does not get hit
     with a briefcase. */
}

/* His drawn position, which is not his logical one while he is mid-stride.
   Everything that asks "how close is he" reads this rather than R.slot, so the
   man with the knife is measuring the same gap the player can see. */
function rideManX(R){ return R.slotX == null ? R.slot : R.slotX; }

/* Where a slot sits on screen. One place, so the man and the people standing
   in the slots cannot disagree about it. */
function rideSlotX(x, cx0, cw){
  var ww = (cw - 90) / RIDE_SLOTS;
  return cx0 + 45 + x * ww + (ww - 30) / 2;
}

/* The car's own noise, driven off the ride clock. Every cue is scheduled
   once at the moment it is due rather than looped, so nothing has to be
   stopped later and nothing can be left running when the ride ends. */
function updateRideSound(dt){
  var R = G.ride;
  if (R.phase !== "run"){ R.clack = 0; return; }
  R.clack -= dt;
  if (R.clack <= 0){
    /* Every 0.62s, and every fourth one over a heavier joint. Slightly
       irregular, because perfectly even track does not exist. */
    R.clackN = (R.clackN || 0) + 1;
    R.clack = 0.56 + Math.random() * 0.12;
    AUDIO.clack(R.clackN % 4 === 0);
    if (R.clackN % 7 === 3) AUDIO.rail();
    if (R.clackN % 11 === 5) AUDIO.squeal();
  }
}

function updateShady(dt){
  var R = G.ride;
  if (R.shady < 0 || R.phase !== "run") return;
  /* The swing and the brace are the HERO's, and they are set on the same
     frame the man goes down - so they have to tick before the early return
     for him, or the player stays frozen mid-follow-through for the rest of
     the ride. */
  if (R.swing > 0) R.swing = Math.max(0, R.swing - dt);
  if (R.brace > 0) R.brace = Math.max(0, R.brace - dt);
  if (R.ko){ R.koT += dt; return; }

  // the red eyes, which are not a tell and are not connected to anything
  if (R.eyes > 0) R.eyes = Math.max(0, R.eyes - dt);
  else if (Math.random() < EYES_RATE * dt) R.eyes = EYES_SECS;

  /* The nine-in-ten version: he drifts up the car and stops a yard and a half
     short, with long pauses in between. Nothing happens. That is the whole
     point of him - the car feels wrong, and then you get off.

     He holds his ground rather than retreating if the player walks at him,
     which is more unsettling than either following or fleeing. */
  if (!R.hostile){
    /* Three things make the question live, and none of them ever turn into
       anything: a lurch, a tell, and the hood. The nine-in-ten man still
       does nothing at all - the point is that you cannot know that. */
    if (R.tell > 0) R.tell = Math.max(0, R.tell - dt);
    if (R.lurch > 0) R.lurch = Math.max(0, R.lurch - dt);

    R.pause -= dt;
    if (R.pause <= 0){
      R.moving = !R.moving;
      R.pause = R.moving ? 1.4 + Math.random() * 2.6 : 1.0 + Math.random() * 2.4;
      /* A quarter of the times he sets off he does it quickly - three times
         the creep for half a second - and then stops dead. That half second
         is the whole of him. */
      if (R.moving && Math.random() < 0.25){ R.lurch = 0.5; R.pause = 0.5; }
      /* And now and then, standing still, a hand comes out of the pocket
         with something in it. Then it goes back. */
      if (!R.moving && R.tell <= 0 && Math.random() < 0.30) R.tell = 0.9;
    }
    if (R.moving){
      var gapC = R.shadyX - rideManX(R);
      var wantC = rideManX(R) + (gapC >= 0 ? SHADY_KEEP : -SHADY_KEEP);
      var dC = wantC - R.shadyX;
      var stepC = SHADY_CREEP * (R.lurch > 0 ? 3 : 1) * dt;
      // only ever towards him, never away
      if ((dC > 0) === (gapC < 0)){
        if (Math.abs(dC) <= stepC) R.shadyX = wantC;
        else R.shadyX += (dC > 0 ? stepC : -stepC);
      }
    }
    /* The hood tracks him while anything is happening and drifts off when
       nothing is. Eased, because a head that snaps round is a jump scare and
       this is supposed to be worse than that. */
    var want = (R.moving || R.tell > 0) ? 1 : 0.15;
    R.look += (want - R.look) * Math.min(1, dt * 2.4);
    R.knife = 0;
    return;
  }

  // the one in ten. He means it, and he is looking straight at you.
  R.look += (1 - R.look) * Math.min(1, dt * 5);
  if (R.tell > 0) R.tell = Math.max(0, R.tell - dt);

  /* Robbed once, he has what he came for and backs off to where he started. */
  var to = R.robbed ? R.shady : rideManX(R);
  var dx = to - R.shadyX, step = SHADY_SPEED * dt;
  if (Math.abs(dx) <= step) R.shadyX = to;
  else R.shadyX += (dx > 0 ? step : -step);
  if (R.robbed) return;

  var gap = Math.abs(R.shadyX - rideManX(R));
  if (gap < KNIFE_NEAR){
    if (!R.knife){
      R.knife = 0.0001;
      R.knifeSide = R.shadyX >= rideManX(R) ? 1 : -1;
      AUDIO.knife();
      flash("HE HAS A KNIFE", "Move. Either way.", C.danger);
    } else {
      R.knife += dt;
      if (R.knife >= KNIFE_GRACE){
        /* Stood still long enough. He takes the bag, and whatever was lying
           on the seat goes with him. */
        R.robbed = 1; R.knife = 0;
        G.hp = Math.max(1, G.hp - TRAIN_ROB);
        var alsoCash = (R.cash >= 0 && !R.cashGot);
        if (alsoCash){ R.cashGot = true; R.cash = -1; }
        G.shake = 24; G.hurtT = 0.5;
        AUDIO.hurt();
        flash("HE TOOK YOUR BAG",
              alsoCash ? "And the roll off the seat. \u2212" + TRAIN_ROB + "% health."
                       : "\u2212" + TRAIN_ROB + "% health. Should have moved.",
              C.danger);
      }
    }
  } else if (R.knife){
    R.knife = 0;                 // he has drifted off again
  }
}

function updateRide(dt){
  var R = G.ride;
  R.t += dt;
  R.rock = (R.rock || 0) + dt;
  /* Ease out, so he leans off and settles rather than sliding at a constant
     rate - a figure crossing a train floor at a fixed speed looks towed. */
  if (R.stepT != null && R.stepT < 1){
    R.stepT = Math.min(1, R.stepT + dt / (R.stepDur || RIDE_STEP));
    var e = 1 - Math.pow(1 - R.stepT, 3);
    R.slotX = R.slotFrom + (R.slot - R.slotFrom) * e;
  } else if (R.slotX == null){
    R.slotX = R.slot;
  }
  updateShady(dt);
  updateRideSound(dt);
  if (R.phase === "down"){
    if (R.t >= RIDE_PHASES.down){ R.phase = "platform"; R.t = 0; AUDIO.trainIn(); }
    else if (!R.swiped && R.t > 0.25){ R.swiped = true; AUDIO.turnstile(); }
  } else if (R.phase === "platform"){
    if (!R.paged && R.t > 0.35){ R.paged = true; AUDIO.platformPA(); }
    if (R.t >= RIDE_PHASES.platform){
      R.phase = "run"; R.t = 0; AUDIO.doorsClose(); AUDIO.trainRun();
    }
  } else if (R.phase === "run"){
    var f = Math.min(1, R.t / RIDE_PHASES.run);
    var e = f < 0.5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;
    G.camRow = R.camFrom + (R.toRow - R.camFrom) * e;
    if (R.t >= RIDE_PHASES.run){ R.phase = "arrive"; R.t = 0; AUDIO.trainStop(); }
  } else if (R.phase === "arrive"){
    if (!R.opened && R.t > 0.35){ R.opened = true; AUDIO.doorsOpen(); }
    if (R.t >= RIDE_PHASES.arrive){
      R.phase = "up"; R.t = 0;
      G.row = R.toRow; G.fromRow = R.toRow;
      G.col = R.toCol; G.fromCol = R.toCol; G.hop = 1;
      if (G.row > G.maxRow){
        G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP * (G.row - G.maxRow));
        G.maxRow = G.row; progress();
      }
      ensureRows(G.maxRow + ROWS_AHEAD);
    }
  } else {
    if (R.t >= RIDE_PHASES.up){
      G.ride = null;
      G.invulnT = Math.max(G.invulnT, 0.8);
      flash("OUT AT W " + G.street + " ST",
            R.streets + (G.leg > 0 ? " streets uptown." : " streets closer to Penn."), "#ffd24a");
    }
  }
}

function tunnelLights(speed, y, h){
  var sp = (G.t * speed) % 340;
  ctx.globalAlpha = 0.55; ctx.fillStyle = "#4a3a20";
  for (var x = -340; x < LOGICAL_W + 340; x += 340) ctx.fillRect(x + sp, y, 7, h);
  ctx.globalAlpha = 0.18; ctx.fillStyle = "#ffcf8a";
  for (var x2 = -340; x2 < LOGICAL_W + 340; x2 += 340) ctx.fillRect(x2 + sp - 26, y, 60, h);
  ctx.globalAlpha = 1;
}

/* The briefcase going round. Drawn behind everybody so it reads as a swing
   through the scene rather than a rectangle stuck to the player. */
function drawSwing(px, cy, R){
  var k = 1 - R.swing / 0.42, side = R.face || 1;
  var ang = (-0.9 + k * 2.6) * side;
  ctx.save();
  ctx.translate(px, cy + 128); ctx.rotate(ang);
  ctx.globalAlpha = 0.30 * (1 - k);
  ctx.fillStyle = "#f6efe2";
  ctx.fillRect(side > 0 ? 0 : -150, -5, 150, 10);        // the arc it leaves
  ctx.globalAlpha = 1;
  ctx.translate(side * 112, 0);
  ctx.fillStyle = "#4a3524"; ctx.fillRect(-28, -20, 56, 40);
  ctx.fillStyle = "#5d442d"; ctx.fillRect(-28, -20, 56, 7);
  ctx.fillStyle = "#c9a227"; ctx.fillRect(-7, -4, 14, 9);
  ctx.restore();
}

/* The player, between slots. A step is a fifth of a second of easing out plus
   a small lift, so it reads as a stride across a moving floor rather than a
   sprite being dragged from one window to the next. */
/* Where everybody in the car stands. It was 78, which put the whole carriage
   up inside the window band with their feet somewhere on the glass. The
   windows run cy+66 to cy+198 and the floor below them to the blue stripe at
   cy+268, so 132 lands the soles at cy+232 - the middle of the floor, which
   is where people on a train actually stand.

   And one place that works it out, because the three of them have to agree
   about it to the pixel. `bake` pads every sprite by 14 a side, so the hero's
   soles are 14 * 0.92 above the bottom of the image drawRider places and his
   VISIBLE figure is (h - 28) * 0.92. The hooded man used to be fitted to that
   image bottom rather than to the soles - 13px into the floor - and scaled
   against the padded height, which left him 29% taller than the hero even
   after he was supposedly matched to him. */
var CAR_FLOOR = 132;
function carSole(){ return CAR_FLOOR + (S.player_r.h - 14) * 0.92; }
function carVis(){ return (S.player_r.h - 28) * 0.92; }
function drawRider(cx0, cw, cy){
  var R = G.ride;
  if (!R) return;
  var mx = rideSlotX(rideManX(R), cx0, cw);
  var lift = (R.stepT != null && R.stepT < 1) ? Math.sin(R.stepT * Math.PI) * 7 : 0;
  var sp = G.shield >= 2 ? (R.face < 0 ? S.playerP_l : S.playerP_r)
         : G.shield      ? (R.face < 0 ? S.playerS_l : S.playerS_r)
                         : (R.face < 0 ? S.player_l  : S.player_r);

  /* A stride leans. Without it he is a sprite being slid along a floor; with
     four degrees of it, into the direction of travel and back upright as he
     lands, he is walking. */
  var lean = 0;
  if (R.stepT != null && R.stepT < 1) lean = Math.sin(R.stepT * Math.PI) * 0.075 * (R.face || 1);

  /* And the swing throws him. He winds back, comes through hard, and is still
     settling for a third of a second after the case has landed. */
  var brace = R.brace > 0 ? R.brace / 0.55 : 0;
  if (brace){
    var phase = 1 - brace;                       // 0 at the moment of contact
    lean += (phase < 0.18 ? -0.22 + phase * 2.2 : 0.18 * Math.pow(1 - phase, 2))
            * (R.face || 1);
  }

  ctx.save();
  ctx.translate(mx, cy + CAR_FLOOR - lift + sp.h * 0.92);
  ctx.rotate(lean);
  ctx.drawImage(sp.img, -sp.w*0.46, -sp.h*0.92, sp.w*0.92, sp.h*0.92);
  ctx.restore();
}

/* The hooded figure. The old one had a face and a pair of sunglasses, which
   made him a man in sunglasses. What actually unsettles people is the absence:
   a hood with nothing in it at all.

   So the hood is an opening with no features inside - not a dark face, a void
   - and the only thing that reads inside it is the faint bounce of the car
   lights off the inside of the fabric, which makes it a hole rather than a
   black sticker. Grey-blue zip hoodie, hands down, shoulders square, slight
   forward set to the neck. */
/* He stood 153px tall against a hero drawn at 113 - a head and a half on
   him, which made him a monster rather than a man on a train, and a monster
   is not frightening in the way a stranger is. Fitted to the hero and stood
   on the same floor, both derived from the sprite rather than eyeballed:
   223 is the sole in his own coordinates and 70 is the top of the hood, so
   153 is his height and everything else follows. */
function hoodFit(){
  var scl = carVis() / 153;                // 153 is his own height, 70 to 223
  return { scl:scl, dy:carSole() - 223 * scl };
}
function drawHoodie(mx, cy, scl, alert, look, red){
  function R2(x, y, w, h, col){
    ctx.fillStyle = col;
    ctx.fillRect(mx + x * scl, cy + y * scl, w * scl, h * scl);
  }
  var cloth = "#5d6a74", clothD = "#49545d", clothL = "#6d7a85";

  // legs and shoes first, so the hem of the hoodie sits over them
  R2(-20, 190, 17, 30, "#2b3138");
  R2(4,   190, 17, 30, "#2b3138");
  R2(-23, 214, 22, 9, "#15181e");
  R2(3,   214, 22, 9, "#15181e");

  // body: the hoodie, with the pouch and the zip line
  R2(-30, 112, 60, 86, cloth);
  R2(-30, 112, 60, 10, clothL);                 // the light on the shoulders
  R2(-31, 152, 62, 34, clothD);                 // the kangaroo pocket
  R2(-1,  116, 2,  80, "#39434b");              // the zip
  R2(-33, 118, 10, 74, clothD);                 // arms, hanging
  R2(23,  118, 10, 74, clothD);
  R2(-34, 186, 12, 14, "#8a7a6c");              // the hands, barely lit
  R2(22,  186, 12, 14, "#8a7a6c");

  /* The hood. An outer shell, then the opening cut into it, and nothing in
     the opening except a hint of the lining catching the carriage light. */
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(mx - 29 * scl, cy + 124 * scl);
  ctx.quadraticCurveTo(mx - 33 * scl, cy + 74 * scl, mx, cy + 70 * scl);
  ctx.quadraticCurveTo(mx + 33 * scl, cy + 74 * scl, mx + 29 * scl, cy + 124 * scl);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = clothL;                       // light along the top of it
  ctx.beginPath();
  ctx.moveTo(mx - 20 * scl, cy + 82 * scl);
  ctx.quadraticCurveTo(mx, cy + 66 * scl, mx + 20 * scl, cy + 82 * scl);
  ctx.quadraticCurveTo(mx, cy + 76 * scl, mx - 20 * scl, cy + 82 * scl);
  ctx.closePath(); ctx.fill();

  /* The opening slides a few pixels toward whatever he is looking at. It is
     the only thing on him that can point, and a hood that turns to track
     you is worth more than any amount of menace standing still. */
  var lk = (look || 0) * 7 * scl;
  ctx.fillStyle = "#04060a";                    // the opening: nothing in it
  ctx.beginPath();
  ctx.ellipse(mx + lk, cy + 100 * scl, 21 * scl, 26 * scl, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#121820";                    // lining, catching a little
  ctx.beginPath();
  ctx.ellipse(mx + lk, cy + 86 * scl, 19 * scl, 10 * scl, 0, Math.PI, 0);
  ctx.fill();

  /* Once the blade is out, two points of light find him from inside the hood.
     Nothing like eyes until he means it. */
  if (alert){
    var g2 = (alert === 2 ? 0.28 : 0.55) + 0.45 * Math.sin(G.t * (alert === 2 ? 3 : 7));
    ctx.globalAlpha = Math.max(0, g2);
    ctx.fillStyle = "#c8d8e4";
    ctx.fillRect(mx + lk - 9 * scl, cy + 96 * scl, 5 * scl, 3 * scl);
    ctx.fillRect(mx + lk + 4 * scl, cy + 96 * scl, 5 * scl, 3 * scl);
    ctx.globalAlpha = 1;
  }

  /* And now and then, nothing to do with the knife and nothing to do with
     whether he is coming: two red points come up inside the hood, hold, and
     go out again. They never mean anything. They are not supposed to - the
     whole man is a question the game refuses to answer, and this is the
     part of him that cannot be read as a tell at all.

     A soft disc behind each one first, because a flat rect in a black
     opening reads as a sticker; two sizes of the same colour reads as
     something lit. */
  if (red > 0.01){
    var ey = cy + 95 * scl;
    ctx.globalAlpha = red * 0.22; ctx.fillStyle = "#ff2a2a";
    ctx.beginPath(); ctx.arc(mx + lk - 6.5*scl, ey + 2*scl, 7.5*scl, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + lk + 6.5*scl, ey + 2*scl, 7.5*scl, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = red * 0.92; ctx.fillStyle = "#ff4040";
    ctx.fillRect(mx + lk - 10 * scl, ey, 6 * scl, 4 * scl);
    ctx.fillRect(mx + lk +  4 * scl, ey, 6 * scl, 4 * scl);
    ctx.globalAlpha = red; ctx.fillStyle = "#ffb0a4";
    ctx.fillRect(mx + lk - 9 * scl, ey + 1 * scl, 2 * scl, 2 * scl);
    ctx.fillRect(mx + lk +  5 * scl, ey + 1 * scl, 2 * scl, 2 * scl);
    ctx.globalAlpha = 1;
  }

  // drawstrings
  R2(-9, 118, 2, 16, "#cfd6dd");
  R2(7,  118, 2, 13, "#cfd6dd");
}

/* The man at the far end of the car. Drawn at his own floating position
   rather than snapped to a slot, because the whole point of him is that he
   is closing on you between the beats. */
function drawShady(cx0, cw, cy){
  var R = G.ride;
  if (!R || R.shady < 0) return;
  var mx = rideSlotX(R.shadyX, cx0, cw);

  var F = hoodFit(), K = F.scl;
  function HY(v){ return cy + F.dy + v * K; }     // his own y, on the floor
  if (R.ko){
    /* Three beats, because a man who simply becomes horizontal has not been
       hit by anything. His head goes first, then his feet leave, then he
       lands and stops. */
    var away = R.face || 1;
    var snap = Math.min(1, R.koT / 0.09);        // head back
    var tip  = Math.max(0, Math.min(1, (R.koT - 0.07) / 0.30));
    var land = Math.max(0, Math.min(1, (R.koT - 0.37) / 0.14));
    var ease = 1 - Math.pow(1 - tip, 2);

    ctx.save();
    ctx.translate(mx + away * (14 * snap + 40 * ease) * K, HY(196));
    ctx.rotate(ease * Math.PI * 0.5 * away);
    ctx.translate(0, -(196 + (1 - ease) * 6) * K);
    ctx.globalAlpha = 1;
    drawHoodie(0, 0, K, false, 0, 0);
    ctx.restore();

    if (land > 0){
      // dust off the floor where he came down
      ctx.globalAlpha = (1 - land) * 0.4;
      ctx.fillStyle = "#8e969e";
      for (var d2 = 0; d2 < 5; d2++){
        var dx2 = (d2 - 2) * (12 + land * 26) * K;
        ctx.fillRect(mx + away * 40 * K + dx2, HY(214) - land * 10, 9 * K, 3);
      }
      ctx.globalAlpha = 1;
    }
    // and the little stars, because he is not hurt, he is out
    if (R.koT > 0.4){
      for (var st = 0; st < 3; st++){
        var sa = G.t * 2.2 + st * 2.09;
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = "#ffd24a";
        ctx.fillRect(mx + away * 54 * K + Math.cos(sa) * 30 * K - 4,
                     HY(150) + Math.sin(sa) * 10 - 4, 8, 8);
        ctx.globalAlpha = 1;
      }
    }
    return;
  }

  var sw = Math.sin(G.t * 1.6 + 1.1) * 3 * K;
  /* Three states in the hood instead of two. The blade out is the loud one;
     a tell is the quiet one - two points of light that come up slowly and
     go again, which is the moment the player cannot tell what is about to
     happen. The look is how far the opening has turned toward him. */
  var alert = R.knife > 0 ? 1 : ((R.tell || 0) > 0 ? 2 : 0);
  var look = (R.look || 0) * (rideManX(R) > R.shadyX ? 1 : -1);
  /* Up over EYES_UP and back down over the rest of it, so they arrive and
     leave rather than switching on. */
  var red = 0;
  if ((R.eyes || 0) > 0){
    var ep = 1 - R.eyes / EYES_SECS;
    red = ep < EYES_UP ? ep / EYES_UP : Math.max(0, (1 - ep) / (1 - EYES_UP));
  }
  drawHoodie(mx + sw, cy + F.dy, K, alert, look, red);

  /* A hand coming out of the pocket with something in it - and then not.
     It is the same metal as the blade and it lasts under a second. */
  if ((R.tell || 0) > 0){
    var tside = rideManX(R) >= R.shadyX ? 1 : -1;
    var ta = Math.min(1, R.tell / 0.22) * Math.min(1, (0.9 - R.tell) / 0.25 + 1);
    ctx.globalAlpha = Math.max(0, Math.min(1, ta)) * 0.9;
    ctx.fillStyle = "#8a7a6c";
    ctx.fillRect(mx + sw + tside * 20 * K, HY(170), 11 * K, 13 * K);
    ctx.fillStyle = "#aeb8c2";
    ctx.fillRect(mx + sw + tside * 23 * K, HY(166), 5 * K, 7 * K);
    ctx.globalAlpha = 1;
  }

  if (R.knife > 0){
    /* The blade comes out on the side he is approaching from, and the timer
       is drawn as a bar under him - this is a reaction test, and a reaction
       test with an invisible clock is just a trap. */
    var side = R.knifeSide || 1, hx = mx + sw - side * 30 * K;
    ctx.fillStyle = "#2b2f36";
    ctx.fillRect(hx - 5*K, HY(146), 10*K, 16*K);
    ctx.fillStyle = "#d8dde3";
    ctx.beginPath();
    ctx.moveTo(hx - 4*K, HY(146));
    ctx.lineTo(hx + 4*K, HY(146));
    ctx.lineTo(hx + (2 - side * 30)*K, HY(124));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(G.t * 18);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(hx - (2 + side * 16)*K, HY(131), 7*K, 5*K);
    ctx.globalAlpha = 1;

    /* The clock stays full size. Everything else about him shrank to human
       scale, but this is the reaction test and a reaction test you have to
       squint at is a trap. */
    var left = Math.max(0, 1 - R.knife / KNIFE_GRACE);
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(mx - 46, HY(236), 92, 9);
    ctx.fillStyle = left > 0.35 ? C.amber : C.danger;
    ctx.fillRect(mx - 46, HY(236), 92 * left, 9);
  }
}

/* the car, drawn at an arbitrary x offset and vertical rock */
/* The other people in the car. They were two flat rectangles and a head,
   which at this size read as furniture rather than as anybody, and the
   hooded man standing among them had nothing to be a stranger among.

   Still rectangles - everything in this file is - but enough of them to make
   a carriage: coats of two lengths in six colours, five skin tones, hair or
   a beanie, and one thing each of them is doing. Everything is derived from
   an integer seed, so nobody changes clothes between frames.

   One per slot rather than two. Two half-sized people in a window was the
   old problem in a different shape; one at the hero's own scale is a person. */
var PAX_COAT = ["#3b4a56","#55404a","#3f5547","#4a4660","#5b4a3c","#2f4a5c",
                "#6b4a52","#3c5a66"];
/* Seven tones across the whole range, not three browns. Penn 1 to 81st is
   about as mixed a stretch of pavement as there is, and a carriage of one
   complexion was a decision whether or not it was made on purpose. */
var PAX_SKIN = ["#f0cdae","#e2b58f","#d7a37c","#c79a74","#a87f5f","#8b6246",
                "#5e3c28"];
// black, dark brown, auburn, mid brown, blonde, grey, white
var PAX_HAIR = ["#141414","#241a12","#5a2f1c","#4a3526","#9a7a44","#8d8d93",
                "#d6d2cb"];
var PAX_WOOL = ["#8c4a4a","#3d6b7a","#6a6a3d","#54406b","#9a6a36","#2f6b57"];
/* Where a passenger's feet go and how big they are, both off the hero's own
   sprite rather than guessed. The bake pads every sprite by 14 on each side,
   so the hero's VISIBLE figure is (h - 28) * 0.92 tall and his soles are
   14 * 0.92 above the bottom of the image that drawRider places, which puts
   them on CAR_FLOOR. Everything
   here is expressed against a base figure 102 units tall and then scaled, so
   the people in the car are the same height as the man walking through it
   and standing on the same floor. */
function paxFit(){
  return { tall:carVis(), feet:carSole() };
}
function drawPax(cx2, feetY, seed, lit, sway, k){
  var coat = PAX_COAT[seed % 8], skin = PAX_SKIN[(seed * 3) % 7];
  var hair = PAX_HAIR[(seed * 5) % 7], wool = PAX_WOOL[(seed * 2) % 6];
  var doing = (seed * 7) % 5;                 // phone, bag, cans, scarf, asleep
  /* Six ways of wearing your hair and a coat that may or may not be a skirt.
     Between those, seven skin tones and seven hair colours there are enough
     people here that nobody has to stand for a category. */
  var style = (seed * 11) % 6;                // 0 cropped 1 short 2 long
                                              // 3 top knot 4 beanie 5 wrap
  var skirt = ((seed * 13) % 3) === 0;
  var tights = (seed % 2) === 0;
  var longCoat = (seed % 2) === 0;
  /* Four percent either side of the hero's height, which is enough that a
     carriage is not a row of identical people and not enough that anybody
     looks like they belong to a different game. */
  var H = 102 * (0.96 + (seed % 3) * 0.04);
  var headH = 26, headW = 28, bodyW = 50;
  var top = -(H - headH);                     // the shoulder line, feet-relative
  var hem = -(skirt ? 40 : (longCoat ? 30 : 46));
  var slump = doing === 4 ? 4 : 0;            // asleep: the head goes forward

  ctx.save();
  ctx.translate(Math.round(cx2 + sway), feetY);
  ctx.scale(k, k);
  function R3(rx, ry, rw, rh, c){ ctx.fillStyle = c; ctx.fillRect(rx, ry, rw, rh); }

  ctx.globalAlpha = lit ? 0.92 : 0.52;

  if (doing === 1){                            // a backpack, behind the shoulder
    R3(-bodyW/2 - 13, top + 12, 14, 46, shade(coat, -0.30));
    R3(-bodyW/2 - 13, top + 12, 14, 6,  shade(coat, -0.12));
  }
  // legs, and whether there is a skirt over them
  if (skirt){
    var leg = tights ? shade(coat, -0.45) : skin;
    R3(-12, -34, 10, 30, leg);
    R3(  2, -34, 10, 30, leg);
    R3(-19, -42, 38, 10, shade(coat, -0.14));  // the hem, wider than the hips
    R3(-16, -52, 32, 12, shade(coat, -0.08));
  } else {
    R3(-15, -40, 13, 36, shade(coat, -0.38));
    R3(  2, -40, 13, 36, shade(coat, -0.38));
  }
  R3(-19, -9, 19, 9, "#15181e");
  R3(  0, -9, 19, 9, "#15181e");
  // the coat
  R3(-bodyW/2, top, bodyW, hem - top, coat);
  R3(-bodyW/2, top, bodyW, 8, shade(coat, 0.14));            // light on the shoulders
  R3(-1.5, top + 9, 3, hem - top - 9, shade(coat, -0.22));   // the opening
  R3(-bodyW/2 - 9, top + 6, 9, (hem - top) - 13, shade(coat, -0.24));   // arms
  R3( bodyW/2,     top + 6, 9, (hem - top) - 13, shade(coat, -0.24));
  if (longCoat && !skirt) R3(-bodyW/2, hem - 5, bodyW, 5, shade(coat, -0.16));

  // head, and whatever is on it
  var hy = top - headH + slump;
  /* Long hair goes on BEFORE the face, so it sits behind the head and
     reads as falling past it rather than across it. */
  if (style === 2){
    R3(-headW/2 - 6, hy - 5, headW + 12, headH + 26, hair);
  }
  R3(-headW/2, hy, headW, headH, skin);
  if (style === 4){                                          // a beanie
    R3(-headW/2 - 2, hy - 8, headW + 4, 13, wool);
    R3(-headW/2 - 2, hy - 8, headW + 4, 4,  shade(wool, 0.16));
  } else if (style === 5){                                   // a headwrap
    R3(-headW/2 - 3, hy - 7, headW + 6, 14, wool);
    R3(-headW/2 - 3, hy + 5, 6, headH - 2, wool);
    R3( headW/2 - 3, hy + 5, 6, headH - 2, wool);
    R3(-headW/2 - 3, hy - 7, headW + 6, 4, shade(wool, 0.14));
  } else {
    R3(-headW/2 - 2, hy - (style === 0 ? 4 : 6), headW + 4,
       style === 0 ? 7 : 10, hair);
    if (style === 1 || style === 2){
      R3(-headW/2 - 2, hy + 4, 4, 9, hair);                  // sideburns
      R3( headW/2 - 2, hy + 4, 4, 9, hair);
    }
    if (style === 3){                                        // a top knot
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(0, hy - 11, 9, 0, Math.PI*2); ctx.fill();
    }
  }
  if (doing !== 4){                                           // eyes, if awake
    ctx.globalAlpha *= 0.85;
    R3(-8, hy + 12, 4, 4, "#1d1510");
    R3( 4, hy + 12, 4, 4, "#1d1510");
    ctx.globalAlpha = lit ? 0.92 : 0.52;
  } else {
    R3(-8, hy + 14, 5, 2, "#1d1510");                         // shut
    R3( 3, hy + 14, 5, 2, "#1d1510");
  }

  if (doing === 0){                            // a phone, and the light off it
    R3(3, top + 18, 12, 17, "#0d1117");
    R3(4, top + 19, 10, 15, "#9fd8ff");
    ctx.globalAlpha *= 0.30; R3(-10, hy + 15, 20, 9, "#9fd8ff");
    ctx.globalAlpha = lit ? 0.92 : 0.52;
  } else if (doing === 2){                     // headphones
    R3(-headW/2 - 5, hy + 4, 5, 11, "#1d2026");
    R3( headW/2,     hy + 4, 5, 11, "#1d2026");
    ctx.strokeStyle = "#1d2026"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, hy + 2, headW/2 + 3, Math.PI, 0); ctx.stroke();
  } else if (doing === 3){                     // a scarf, and its tail
    R3(-15, top - 3, 30, 9, wool);
    R3(  5, top + 6, 8, 20, shade(wool, -0.12));
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* They hold their ground. The first version had them slide out of the way
   as he closed, which stopped the sprites overlapping and looked like
   nothing that happens on a New York pavement: people do not glide aside
   for you, they tell you about it.

   So the first attempt at their square is REFUSED, they say something, and
   the second attempt goes through - at which point they step aside with
   bad grace. That is also what keeps the generator's one guarantee intact,
   that no cell can ever be pinned: a blocker that always yields on the
   second tap cannot trap anybody. And it only applies while he is already
   on a pavement, so a man standing in traffic never loses a beat to a
   conversation.

   State per person: `blockAt` (when they last said no), `sayAt`/`line` (the
   bubble), and `slideAt`/`slideBack` (the step aside, eased out from a
   displacement rather than animated into one, so x0 can move immediately
   and the walk continues from the new line). */
var FOLK_SAY = 2.1, FOLK_GRACE = 2.6, FOLK_ASIDE = 1.15, FOLK_SLIDE = 0.5;
var FOLK_LINES = [
  "Hey! I'm walkin' here!",
  "Step back, Jack.",
  "Comedy show tonight?",
  "You see me standin' here?",
  "Where's the fire, pal?",
  "Not today, buddy.",
  "Watch it!",
  "Showtime! \u2026 no? Fine.",
  "This is my block.",
  "Easy, killer.",
  "Excuse YOU.",
  "Sidewalk's that way.",
  "Got a dollar?",
  "Yeah, yeah, movin'."
];
function folkRaw(f){
  var span = COLS + 3;
  return ((f.x0 + f.v * G.t) % span + span) % span - 1.5;
}
function folkX(f){
  var x = folkRaw(f);
  var sl = G.t - (f.slideAt || -9);
  if (sl < FOLK_SLIDE){                      // easing out of the step aside
    var k = 1 - sl / FOLK_SLIDE;
    x += (f.slideBack || 0) * k * k;
  }
  return x;
}
function folkLift(f){
  var sl = G.t - (f.slideAt || -9);
  if (sl >= FOLK_SLIDE) return 0;
  return Math.sin((sl / FOLK_SLIDE) * Math.PI) * 6;
}

/* What somebody says, over their head, for FOLK_SAY seconds. Drawn after the
   props so a hot dog stand cannot sit on top of the words. */
function drawFolkSay(f, sy){
  var age = G.t - (f.sayAt || -99);
  if (age < 0 || age >= FOLK_SAY) return;
  var a = Math.min(1, age / 0.12) * Math.min(1, (FOLK_SAY - age) / 0.45);
  var x = folkX(f)*TILE + TILE*0.5 + FOLK_Y*SKEW;
  var y = sy - FOLK_Y*ROW_H - 112 - folkLift(f) - Math.min(8, age * 26);
  if (y < HORIZON + 6 || y > LOGICAL_H - 20) return;
  ctx.font = 'bold 19px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var w = ctx.measureText(f.line).width + 34, h = 40;
  var bx = Math.max(10, Math.min(LOGICAL_W - w - 10, x - w/2));
  ctx.globalAlpha = a;
  plate(bx, y - h, w, h, "rgba(246,239,226,0.94)", 10);
  ctx.fillStyle = "rgba(246,239,226,0.94)";   // the tail, pointing at them
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 2); ctx.lineTo(x + 9, y - 2); ctx.lineTo(x, y + 13);
  ctx.closePath(); ctx.fill();
  txt(f.line, bx + w/2, y - h/2 + 7, 19, "#1a1410");
  ctx.globalAlpha = 1;
}

/* The same people, on the pavement. Baked rather than drawn live: a couple on
   every sidewalk on screen is twenty-odd figures a frame and each one is
   twenty-odd fillRects, where the rest of the world puts a whole bus down
   with one drawImage. Twelve variants is enough that you do not notice the
   repeat at this size, and they are blitted like everything else.

   0.86 of the carriage scale, because they stand at the BACK of the pavement
   rather than on the line the player walks. */
var FOLK_N = 12, FOLK_K = 0.86, FOLK_Y = 0.86;
function bakeFolk(){
  var W = 150, H = 150, i;
  S.folk = [];
  for (i = 0; i < FOLK_N; i++){
    var off = document.createElement("canvas");
    off.width  = Math.max(1, Math.ceil(W * BAKE));
    off.height = Math.max(1, Math.ceil(H * BAKE));
    var g = off.getContext("2d");
    g.setTransform(BAKE, 0, 0, BAKE, 0, 0);
    var saved = ctx;
    ctx = g;
    drawPax(W / 2, H - 8, i * 7 + 5, true, 0, FOLK_K);
    ctx = saved;
    S.folk.push({ img:off, ox:W / 2, oy:H - 8, w:W, h:H });
  }
}

function drawCar(ox, rock, lit){
  var cy = 470 + rock, ch = 330, cx0 = 90 + ox, cw = LOGICAL_W - 180;
  ctx.globalAlpha = 0.4; ctx.fillStyle = "#000";
  ctx.fillRect(cx0, cy + ch, cw, 22); ctx.globalAlpha = 1;

  plate(cx0, cy, cw, ch, "#aab3bb", 22);                       // shell
  plate(cx0+9, cy+9, cw-18, ch-18, "#333a42", 18);
  ctx.fillStyle = "#1b4fa8"; ctx.fillRect(cx0+9, cy+ch-62, cw-18, 14);
  ctx.fillStyle = "#c8ccd2"; ctx.fillRect(cx0+9, cy+ch-48, cw-18, 6);

  // roll sign
  plate(cx0+30, cy+16, 230, 34, "#0d1117", 6);
  txt("UPTOWN  \u00B7  LOCAL", cx0+145, cy+34, 19, "#ffd24a");
  // route bullet
  ctx.beginPath(); ctx.arc(cx0+cw-62, cy+34, 22, 0, Math.PI*2);
  ctx.fillStyle = C.brand; ctx.fill();
  txt("1", cx0+cw-62, cy+41, 26, "#1a0a02");

  var R2 = G.ride || {}, wn = RIDE_SLOTS, ww = (cw - 90) / wn;
  if (R2.swing > 0) drawSwing(rideSlotX(rideManX(R2), cx0, cw), cy, R2);
  for (var i = 0; i < wn; i++){
    var wx = cx0 + 45 + i*ww, mx = wx + (ww-30)/2;
    plate(wx, cy+66, ww-30, 132, "#0b0f14", 10);
    plate(wx+5, cy+71, ww-40, 122, lit ? "#1d3d4e" : "#121c24", 8);
    // grab pole
    ctx.fillStyle = "#8e969e"; ctx.fillRect(mx - 3, cy+66, 6, 132);
    /* Everybody stays where they are. The old rule emptied the slot he was
       heading for AND the one he was leaving, so a stranger blinked out in
       front of him and another blinked in behind - which read as the two of
       them swapping places every time he moved. He is drawn after the loop,
       so he simply passes in front of them, which is what happens on a
       train. */
    if (i === R2.cash && !R2.cashGot){
      // a roll of Chuck Bucks nobody has noticed yet
      var bob = Math.sin(G.t * 3.4) * 5, pul = 0.5 + 0.5*Math.sin(G.t * 5);
      ctx.globalAlpha = 0.16 + 0.12*pul; ctx.fillStyle = POWERS.chuck.col;
      ctx.beginPath(); ctx.arc(mx, cy+150 + bob, 40, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(mx, cy+150 + bob); ctx.rotate(-0.12);
      plate(-30, -19, 60, 38, "#3f8f5a", 4);
      plate(-24, -13, 48, 26, "#57a76f", 3);
      txt("$", 0, 9, 26, "#eaf6ee");
      ctx.restore();
      txt("CHUCK", mx, cy+150 + bob + 38, 15, POWERS.chuck.col);
    } else {
      /* One rider, standing at the hero's own scale, swaying with the car.
         Each on a slightly different phase down the length of it, the way
         the straps are, or a carriage of people looks welded together. */
      var psw = Math.sin(G.t * 1.9 + i * 1.37) * (R2.phase === "run" ? 2.4 : 0.8);
      /* Off the pole, alternate sides. Centred, the pole came up through the
         middle of their heads. Height and floor line both come off the
         hero's sprite, so everybody in the car is the same size as him. */
      var pfit = paxFit();
      drawPax(mx + ((i % 2) ? 36 : -36), cy + pfit.feet, i * 7 + 3, lit, psw,
              pfit.tall / 102);
    }
    /* Straps, swinging with the car and each on its own slight delay down the
       length of it - a carriage of straps moving in lockstep looks welded. */
    for (var k = 0; k < 3; k++){
      var swg = Math.sin(G.t * 2.3 + i * 0.5 + k * 0.3) * (R2.phase === "run" ? 4 : 1.2);
      var bx2 = wx + 18 + k*((ww-60)/2);
      ctx.fillStyle = "#6e767e";
      ctx.fillRect(bx2, cy+66, 4, 12);
      ctx.fillRect(bx2 + swg * 0.5, cy+78, 4, 10);
      ctx.strokeStyle = "#8e969e"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(bx2 + 2 + swg, cy+94, 7, 0, Math.PI*2); ctx.stroke();
    }
  }
  /* Him last, so he passes in FRONT of the people standing in the slots. He
     is not standing in one - he is walking down the car. */
  drawRider(cx0, cw, cy);
  drawShady(cx0, cw, cy);

  // doors between windows
  for (var d = 1; d < wn; d++){
    var dx = cx0 + 45 + d*ww - 16;
    ctx.fillStyle = "#8e969e"; ctx.fillRect(dx, cy+60, 5, ch-120);
  }

  /* The band of card advertising above the windows, which is most of what you
     actually look at on a subway car. Real-shaped, unreadable at this size,
     and one of them is ours. */
  /* Card stock under fluorescent light, not light boxes. The first pass used
     near-white and the four of them became the brightest thing in the car,
     which is not where anybody should be looking. */
  var adY = cy + 26, adW = (cw - 90) / 4, ADS = ["#6d6a62", "#5f6b6f", "#1a1208", "#6a6158"];
  for (var ad = 0; ad < 4; ad++){
    var ax = cx0 + 45 + ad * adW;
    plate(ax + 6, adY, adW - 16, 28, ADS[ad], 3);
    ctx.globalAlpha = 0.55;
    if (ad === 2){
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.brand; ctx.fillRect(ax + 12, adY + 6, 4, 16);
      txt("TE", ax + 32, adY + 20, 14, C.brand);
      ctx.fillStyle = "rgba(255,217,184,0.40)";
      ctx.fillRect(ax + 50, adY + 10, adW - 78, 3);
      ctx.fillRect(ax + 50, adY + 17, adW - 100, 3);
    } else {
      ctx.fillStyle = "#2b2f33";
      ctx.fillRect(ax + 14, adY + 7, adW - 44, 3);
      ctx.fillRect(ax + 14, adY + 14, adW - 64, 3);
      ctx.fillRect(ax + 14, adY + 21, adW - 54, 3);
    }
    ctx.globalAlpha = 1;
  }

  /* The strip map over the doors, with a bullet creeping along it. */
  var mpX = cx0 + cw - 300, mpY = cy + ch - 46;
  plate(mpX, mpY, 270, 26, "#0d1117", 5);
  ctx.fillStyle = "#39434b"; ctx.fillRect(mpX + 14, mpY + 12, 242, 3);
  for (var stp = 0; stp < 7; stp++){
    ctx.fillStyle = "#6e767e";
    ctx.beginPath(); ctx.arc(mpX + 18 + stp * 40, mpY + 13, 4, 0, Math.PI*2); ctx.fill();
  }
  var prog = R2.phase === "run" ? Math.min(1, R2.t / RIDE_PHASES.run) : (R2.phase === "arrive" ? 1 : 0);
  ctx.fillStyle = C.brand;
  ctx.beginPath(); ctx.arc(mpX + 18 + prog * 240, mpY + 13, 6, 0, Math.PI*2); ctx.fill();

  /* The floor, and the dirt on it. A carriage with a clean floor is not one
     anybody has been in. */
  ctx.fillStyle = "#4a5159"; ctx.fillRect(cx0 + 9, cy + ch - 72, cw - 18, 12);
  ctx.globalAlpha = 0.18; ctx.fillStyle = "#1a1f25";
  for (var sp2 = 0; sp2 < 22; sp2++)
    ctx.fillRect(cx0 + 30 + (sp2 * 137) % (cw - 80), cy + ch - 70 + (sp2 * 31) % 8, 11, 3);
  ctx.globalAlpha = 1;

  /* The lights flicker when the car is working hardest. Two frames out of a
     hundred, so it is a glimpse rather than a strobe. */
  if (lit && R2.phase === "run" && ((G.t * 60) | 0) % 97 < 2){
    ctx.globalAlpha = 0.34; ctx.fillStyle = "#05070a";
    ctx.fillRect(cx0 + 9, cy + 9, cw - 18, ch - 18);
    ctx.globalAlpha = 1;
  }
}

/* ====================== ARRIVAL SCENES ===================================
   Reaching a landmark crossing stops the walk for a beat and shows you where
   you are, in the same register as the subway ride. Flat rects again - these
   run over the top of a frozen world, so the budget is the same as a frame.
   Each plays once per run. */
var SCENE_SECS = 2.9;
function sceneFrame(title, sub, body){
  var R = G.scene, t = R.t;
  var fin = Math.min(1, t/0.3), fout = Math.min(1, (R.len - t)/0.35);
  var a = Math.max(0, Math.min(fin, fout));
  ctx.globalAlpha = a * 0.93; ctx.fillStyle = "#07080c";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.globalAlpha = a;
  body(t, a);
  // letterbox and titles
  ctx.globalAlpha = a; ctx.fillStyle = "#07080c";
  ctx.fillRect(0, 0, LOGICAL_W, 150); ctx.fillRect(0, LOGICAL_H-190, LOGICAL_W, 190);
  ctx.fillStyle = C.brand; ctx.fillRect(LOGICAL_W/2 - 180, LOGICAL_H-150, 360, 4);
  txt(title, LOGICAL_W/2, LOGICAL_H-104, 56, C.text);
  txt(sub, LOGICAL_W/2, LOGICAL_H-58, 26, C.textDim);
  ctx.globalAlpha = 1;
}
/* Times Square. Billboards of mixed sizes each running their own moving
   content, the ticker band, the red steps with people on them, cabs streaming
   past below, steam off a grate and a crowd three ranks deep. What sells the
   place is the clutter, so nothing here sits on a grid. */
function sceneTimes(t, a){
  var BB = [
    [  30, 162, 500, 148, "#c9243f"], [ 556, 162, 300,  94, "#1b4fd0"],
    [ 882, 162, 420, 116, "#e0a81e"], [1330, 162, 560, 148, "#12a05c"],
    [ 556, 282, 300, 134, "#7b2fd0"], [ 882, 302, 420, 114, "#d8431f"],
    [  30, 336, 500,  80, "#1f7fd8"], [1330, 336, 560,  80, "#e8c12a"]
  ];
  for (var i = 0; i < BB.length; i++){
    var b = BB[i];
    ctx.globalAlpha = a * (0.80 + 0.20 * Math.sin(t * 5 + i * 1.7));
    ctx.fillStyle = b[4]; ctx.fillRect(b[0], b[1], b[2], b[3]);
    /* Each board runs a different loop, so the wall reads as many screens
       rather than one tiled pattern. */
    ctx.globalAlpha = a * 0.34; ctx.fillStyle = "#ffffff";
    if (i % 3 === 0){
      var sw = Math.max(0, (t * 200 + i * 90) % (b[2] + 120) - 120);
      ctx.fillRect(b[0] + sw, b[1], Math.min(100, b[2] - sw), b[3]);
    } else if (i % 3 === 1){
      for (var q = 0; q < 4; q++){
        if (((q + ((t * 4) | 0)) % 3) === 0)
          ctx.fillRect(b[0] + 16 + q * (b[2] / 4), b[1] + 14,
                       b[2] / 4 - 28, b[3] - 28);
      }
    } else {
      ctx.fillRect(b[0] + 14, b[1] + b[3] * 0.5 - 9 + Math.sin(t * 4 + i) * 12,
                   b[2] - 28, 18);
    }
    ctx.globalAlpha = a * 0.22; ctx.fillStyle = "#000";          // scanlines
    for (var sy = 0; sy < b[3]; sy += 7) ctx.fillRect(b[0], b[1] + sy, b[2], 2);
    ctx.globalAlpha = a * 0.55; ctx.fillStyle = "#0b0a10";       // bezel
    ctx.fillRect(b[0] - 6, b[1] - 6, b[2] + 12, 6);
    ctx.fillRect(b[0] - 6, b[1] + b[3], b[2] + 12, 6);
    ctx.globalAlpha = a * 0.09; ctx.fillStyle = b[4];            // light spill
    ctx.fillRect(b[0] - 30, b[1] + b[3], b[2] + 60, 120);
    ctx.globalAlpha = a;
  }
  // the ticker band
  ctx.fillStyle = "#0c0a10"; ctx.fillRect(0, 424, LOGICAL_W, 44);
  var tk = (t * 500) % (LOGICAL_W + 900);
  ctx.fillStyle = "#e8c12a"; ctx.fillRect(LOGICAL_W - tk,        435, 330, 22);
  ctx.fillStyle = "#d8431f"; ctx.fillRect(LOGICAL_W - tk + 420,  435, 240, 22);
  ctx.fillStyle = "#1f7fd8"; ctx.fillRect(LOGICAL_W - tk + 740,  435, 170, 22);

  /* Broadway runs BEHIND the steps, so the traffic goes down before they do -
     drawn after, the crowd swallowed it whole. */
  ctx.fillStyle = "#15171c"; ctx.fillRect(0, 468, LOGICAL_W, 64);
  for (var c = 0; c < 7; c++){
    var cx = ((t * 330 + c * 390) % (LOGICAL_W + 340)) - 170;
    var dark = c % 3 === 0, paint = dark ? "#2b2f36" : "#f2c021";
    ctx.fillStyle = paint;              ctx.fillRect(cx, 492, 150, 36);
    ctx.fillStyle = shade(paint, 0.12); ctx.fillRect(cx + 32, 470, 78, 24);
    ctx.fillStyle = "#0d1014";
    ctx.fillRect(cx + 16, 524, 26, 10); ctx.fillRect(cx + 106, 524, 26, 10);
    ctx.fillStyle = dark ? "#f4f6f8" : "#1b1d22";   // placard, or the medallion
    ctx.fillRect(cx + 52, 476, 34, 11);
  }

  /* The red steps.

     They used to be a symmetric trapezoid that was WIDER at the top than the
     bottom, which is perspective backwards: the top of a flight is further
     away, so it is the end that should be narrower. Now there is one vanishing
     point straight ahead and the flight widens as it comes towards you, and
     each step is drawn as two faces - the tread you can see the top of and the
     riser below it - instead of one flat bar. That is what makes it read as
     stairs rather than as stripes. */
  var STN = 9, stTop = 520, stRow = 30, stMid = 960;
  var hwFar = 250, hwNear = 430;                 // half-widths, far and near
  function stepHW(i){ return hwFar + (hwNear - hwFar) * (i / STN); }
  // the booth at the top of the flight, where the steps start
  ctx.fillStyle = "#7d1420";
  ctx.fillRect(stMid - hwFar - 14, stTop - 46, (hwFar + 14) * 2, 46);
  ctx.fillStyle = "#e8333f";
  ctx.fillRect(stMid - hwFar - 14, stTop - 10, (hwFar + 14) * 2, 10);
  ctx.fillStyle = "#2a1013";
  ctx.fillRect(stMid - 150, stTop - 38, 300, 24);
  txt("TKTS", stMid, stTop - 19, 21, "#ff6b74");

  for (var st = 0; st < STN; st++){
    var hwT = stepHW(st), hwB = stepHW(st + 1);
    var yT = stTop + st * stRow, yTread = yT + 11, yB = yT + stRow;

    // the tread: a trapezoid, because its near edge is closer than its far one
    ctx.fillStyle = st % 2 ? "#e2323f" : "#d82b38";
    ctx.beginPath();
    ctx.moveTo(stMid - hwT, yT);      ctx.lineTo(stMid + hwT, yT);
    ctx.lineTo(stMid + hwB, yTread);  ctx.lineTo(stMid - hwB, yTread);
    ctx.closePath(); ctx.fill();

    // the riser below it, in shadow
    ctx.fillStyle = st % 2 ? "#9d1a26" : "#8e141f";
    ctx.fillRect(stMid - hwB, yTread, hwB * 2, yB - yTread);
    // the lit nosing the real steps have along every edge
    ctx.fillStyle = "#ff5a66";
    ctx.fillRect(stMid - hwB, yTread - 3, hwB * 2, 3);

    // people, bigger the nearer the step - back rows first so near ones overlap
    if (st % 2 === 0){
      var sc = 0.74 + st * 0.045, n = 4 + (st >> 1);
      for (var pz = 0; pz < n; pz++){
        var px = stMid - hwT + 26 + pz * ((hwT * 2 - 52) / Math.max(1, n - 1));
        ctx.fillStyle = ["#2a3038", "#39302c", "#2c3340", "#332b36"][pz % 4];
        ctx.fillRect(px, yT - 30 * sc, 26 * sc, 32 * sc);
        ctx.fillStyle = ["#c79a74", "#a87f5f", "#8d6243"][pz % 3];
        ctx.fillRect(px + 5 * sc, yT - 48 * sc, 17 * sc, 19 * sc);
      }
    }
  }
  /* Steam off a grate. One big ellipse read as a grey disc stuck to the
     steps, so each puff is a cluster of small ones at low alpha - overlapping
     soft edges are the only way to get a soft edge without a blur filter. */
  for (var sm = 0; sm < 4; sm++){
    var sp = (t * 0.5 + sm * 0.25) % 1;
    ctx.globalAlpha = a * (1 - sp) * (1 - sp) * 0.13; ctx.fillStyle = "#cfd8de";
    for (var pf = 0; pf < 5; pf++){
      var px2 = 300 + Math.sin(sm * 2.1 + pf * 1.7) * (18 + sp * 46);
      ctx.beginPath();
      ctx.ellipse(px2, 812 - sp * 180 - pf * 9, 26 + sp * 30, 16 + sp * 20,
                  0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = a;
  // the pavement they are all standing on
  ctx.fillStyle = "#1a1c21"; ctx.fillRect(0, 822, LOGICAL_W, 68);
  ctx.fillStyle = "#23262c"; ctx.fillRect(0, 822, LOGICAL_W, 7);
  // the crowd, back rank first so the near one overlaps it
  for (var rk = 2; rk >= 0; rk--){
    for (var c2 = 0; c2 < 25; c2++){
      var cx2 = -40 + c2 * 82 + rk * 36 + Math.sin(t * 1.7 + c2 + rk) * 5;
      var sc = 1 - rk * 0.17, by = 848 + rk * 10;
      ctx.fillStyle = ["#242a33", "#33282c", "#232d34", "#2e2733"][(c2 + rk) % 4];
      ctx.fillRect(cx2, by - 88 * sc, 34 * sc, 88 * sc);
      ctx.fillStyle = ["#c79a74", "#a87f5f", "#8d6243"][(c2 + rk) % 3];
      ctx.fillRect(cx2 + 7 * sc, by - 112 * sc, 20 * sc, 24 * sc);
    }
  }
}

/* Rockefeller: the sunken plaza, the fountains, the flags */
/* The slab was a flat wall of window rects filling the top of the frame, which
   could have been any office block in any city. 30 Rock is recognised by its
   SHAPE: a narrow limestone tower with symmetric setbacks stepping in as it
   rises, and unbroken vertical piers running the whole height. So it is built
   as a silhouette first - setbacks, then the piers, then the lit windows
   between them - and the plaza furniture is staged in front of it. */
function sceneRock(t, a){
  var MID = 960;
  // the lower blocks either side, so the tower has something to be taller than
  ctx.fillStyle = "#17120f";
  ctx.fillRect(0, 388, 560, 260);
  ctx.fillRect(1360, 388, 560, 260);
  ctx.fillStyle = "#1d1714";
  ctx.fillRect(0, 436, 360, 212);
  ctx.fillRect(1560, 436, 360, 212);
  for (var lw = 0; lw < 26; lw++){
    ctx.globalAlpha = a * (((lw * 7) % 5) < 2 ? 0.35 : 0.08);
    ctx.fillStyle = "#ffbd6a";
    ctx.fillRect(22 + (lw % 13) * 40, 414 + ((lw / 13) | 0) * 110, 20, 68);
    ctx.fillRect(1382 + (lw % 13) * 40, 414 + ((lw / 13) | 0) * 110, 20, 68);
  }
  ctx.globalAlpha = a;

  /* The tower, bottom tier first. Each tier is half-width and the y it rises
     to; stepping in on the way up is the whole silhouette. */
  /* First attempt stepped 330 -> 268 -> 214 -> 168 over four tiers and read as
     a ziggurat. 30 Rock is a SLAB: far taller than it is wide, and the
     setbacks are slight notches near the top, not a pyramid. Narrower, much
     taller, and the steps are a few per cent each. */
