  var TIERS = [[232, 648, 392], [216, 392, 268], [202, 268, 168], [188, 168, 58]];
  for (var tr = 0; tr < TIERS.length; tr++){
    var hw = TIERS[tr][0], yB = TIERS[tr][1], yT = TIERS[tr][2];
    // limestone, a shade paler as it goes up and catches more sky
    ctx.fillStyle = ["#3b352c", "#423b31", "#484036", "#4e463b"][tr];
    ctx.fillRect(MID - hw, yT, hw * 2, yB - yT);
    // the shadowed return on the left, which is what gives it a corner
    ctx.fillStyle = ["#2c271f", "#312b23", "#363028", "#3b342b"][tr];
    ctx.fillRect(MID - hw, yT, 34, yB - yT);
    // the coping line on top of each setback
    ctx.fillStyle = "#5e5649";
    ctx.fillRect(MID - hw, yT, hw * 2, 7);

    /* Vertical piers and the window ribbons between them, run the full height
       of the tier. This is the detail that says Art Deco rather than curtain
       wall: the glass is recessed in continuous strips, never a grid. */
    var pitch = 36, x0 = MID - hw + 40, x1 = MID + hw - 12;
    for (var px = x0; px < x1; px += pitch){
      ctx.fillStyle = "#231f19";
      ctx.fillRect(px, yT + 12, 20, yB - yT - 16);
      // lit floors inside the ribbon
      for (var fy = yT + 20; fy < yB - 14; fy += 26){
        var on = ((px * 3 + fy * 5) % 11) < 5;
        ctx.globalAlpha = a * (on ? 0.62 : 0.10);
        ctx.fillStyle = on ? "#ffc478" : "#6d6a63";
        ctx.fillRect(px + 2, fy, 16, 15);
      }
      ctx.globalAlpha = a;
    }
  }
  // the mast light at the top, blinking
  ctx.globalAlpha = a * (0.45 + 0.55 * Math.abs(Math.sin(t * 2)));
  ctx.fillStyle = "#ff6a6a"; ctx.fillRect(MID - 5, 48, 10, 12);
  ctx.globalAlpha = a;

  // the granite wall of the sunken plaza, and the flags along its parapet
  ctx.fillStyle = "#211c19"; ctx.fillRect(0, 630, LOGICAL_W, 52);
  ctx.fillStyle = "#2b2521"; ctx.fillRect(0, 630, LOGICAL_W, 6);
  for (var f = 0; f < 11; f++){
    var fx = 120 + f * 168;
    ctx.fillStyle = "#6b6257"; ctx.fillRect(fx, 520, 5, 112);
    ctx.fillStyle = ["#d8431f", "#e8c12a", "#2f6fc4"][f % 3];
    var fl = Math.sin(t * 2.4 + f) * 4;
    ctx.fillRect(fx + 5, 522 + fl, 40, 26);
  }

  // Prometheus, gilded, against the wall - the thing everyone photographs
  ctx.fillStyle = "#8a6a14";
  ctx.beginPath(); ctx.ellipse(MID, 690, 128, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c9a227";
  ctx.fillRect(MID - 34, 600, 66, 86);                       // body
  ctx.fillRect(MID - 16, 566, 30, 36);                       // head and shoulders
  ctx.fillRect(MID + 26, 572, 58, 13);                       // the outflung arm
  ctx.fillStyle = "#e8c558";
  ctx.fillRect(MID + 78, 556, 17, 32);                       // the flame
  ctx.fillRect(MID - 72, 614, 42, 12);                       // trailing arm
  ctx.fillStyle = "#a07f18";
  ctx.fillRect(MID - 34, 672, 66, 14);

  // the rink below, and skaters going round on it
  ctx.fillStyle = "#1b2a33"; ctx.fillRect(200, 700, 1520, 150);
  ctx.globalAlpha = a * 0.45; ctx.fillStyle = "#8fc6de";
  ctx.fillRect(200, 700, 1520, 16);
  ctx.globalAlpha = a * 0.22;
  for (var sl = 0; sl < 7; sl++)
    ctx.fillRect(240 + sl * 210, 724 + (sl % 3) * 34, 150, 4);
  ctx.globalAlpha = a;
  for (var sk = 0; sk < 9; sk++){
    var ph = t * 0.42 + sk * 0.7;
    var sx3 = MID + Math.cos(ph) * (560 - (sk % 3) * 130);
    var sy3 = 772 + Math.sin(ph) * (46 - (sk % 3) * 11);
    var ss = 0.78 + Math.sin(ph) * 0.12;
    ctx.fillStyle = ["#d8431f", "#2f6fc4", "#e8c12a", "#d7dbe0"][sk % 4];
    ctx.fillRect(sx3, sy3 - 44 * ss, 20 * ss, 32 * ss);
    ctx.fillStyle = "#c79a74";
    ctx.fillRect(sx3 + 4 * ss, sy3 - 60 * ss, 13 * ss, 17 * ss);
    ctx.globalAlpha = a * 0.3; ctx.fillStyle = "#cfe8f4";
    ctx.fillRect(sx3 - 6, sy3 - 6 * ss, 32 * ss, 4);
    ctx.globalAlpha = a;
  }
}
/* Central Park South. The view everybody actually photographs is not trees -
   it is the POND, with Midtown standing over the treeline behind it and the
   little stone arch at the south end. So the scene is built in planes, back to
   front: skyline, treeline, water with the skyline upside down in it, the
   bridge, then the drive with the carriage on it. */
function scenePark(t, a){
  var TREE = 430, WATER = 596, BANK = 742;

  // ---- Midtown over the treeline, lit -------------------------------------
  /* A continuous wall of towers. The first pass left the middle empty, which
     was meant to be the park opening up and instead read as a hole punched in
     the skyline - from the Pond looking south it is buildings the whole way
     across. */
  var sk = [[0,116,250],[112,84,318],[192,104,214],[292,70,286],[358,96,232],
            [450,124,294],[570,78,206],[644,108,262],[748,90,340],[834,132,228],
            [962,86,288],[1044,110,206],[1150,74,264],[1220,120,330],
            [1336,92,224],[1424,104,286],[1524,80,246],[1600,128,196],
            [1724,96,272],[1816,110,236]];
  for (var k = 0; k < sk.length; k++){
    var bx = sk[k][0], bw = sk[k][1], bh = sk[k][2], by = TREE - bh;
    ctx.fillStyle = k % 2 ? "#191317" : "#1e171b";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#241c21"; ctx.fillRect(bx, by, bw, 5);
    for (var wy = by + 16; wy < TREE - 20; wy += 26){
      for (var wx = bx + 9; wx < bx + bw - 12; wx += 22){
        var on = ((wx * 7 + wy * 13 + k * 5) % 17) < 6;
        ctx.globalAlpha = a * (on ? 0.55 : 0.07);
        ctx.fillStyle = on ? "#ffc478" : "#7d7a76";
        ctx.fillRect(wx, wy, 11, 13);
      }
    }
    ctx.globalAlpha = a;
  }

  // ---- the treeline: three ranks, darkest at the back ---------------------
  var RANKS = [[TREE - 34, "#13271a", 86, 150, 0],
               [TREE - 8,  "#17311f", 98, 132, 42],
               [TREE + 22, "#1d3f28", 112, 118, 86]];
  for (var rk = 0; rk < RANKS.length; rk++){
    var ry = RANKS[rk][0], rc = RANKS[rk][1], rr = RANKS[rk][2],
        pitch = RANKS[rk][3], off = RANKS[rk][4];
    for (var i = -1; i * pitch + off < LOGICAL_W + pitch; i++){
      var cx = i * pitch + off + Math.sin(t * 0.7 + i + rk) * 3;
      ctx.fillStyle = "#2a1e15";
      ctx.fillRect(cx - 8, ry, 16, 90);
      ctx.fillStyle = rc;
      ctx.beginPath(); ctx.ellipse(cx, ry - 6, rr*0.62, rr*0.46, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx - rr*0.28, ry + 14, rr*0.40, rr*0.32, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + rr*0.30, ry + 10, rr*0.42, rr*0.33, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = shade(rc, 0.16);
      ctx.beginPath(); ctx.ellipse(cx + rr*0.10, ry - 20, rr*0.34, rr*0.24, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- the pond -----------------------------------------------------------
  ctx.fillStyle = "#14303d"; ctx.fillRect(0, WATER, LOGICAL_W, BANK - WATER);
  /* The skyline again, upside down and chopped into slats that wobble. Flat
     colour reads as a floor; a broken reflection is the only thing that reads
     as water without a blur filter to lean on. */
  ctx.globalAlpha = a * 0.26; ctx.fillStyle = "#ffbd6a";
  for (var k2 = 0; k2 < sk.length; k2++){
    var rx = sk[k2][0], rw = sk[k2][1];
    for (var ry2 = WATER + 6; ry2 < BANK - 8; ry2 += 9){
      var wob = Math.sin(t * 1.6 + ry2 * 0.09 + k2) * 7;
      ctx.fillRect(rx + 12 + wob, ry2, rw - 24, 4);
    }
  }
  ctx.globalAlpha = a * 0.30; ctx.fillStyle = "#9fd3e8";
  for (var w = 0; w < 9; w++)
    ctx.fillRect(40 + w * 220, WATER + 16 + Math.sin(t*1.9 + w) * 8, 150, 4);
  ctx.globalAlpha = a;
  for (var dk = 0; dk < 4; dk++){                      // ducks
    var dx = 300 + dk * 260 + Math.sin(t * 0.5 + dk * 2) * 40;
    var dy = WATER + 56 + (dk % 2) * 26;
    ctx.fillStyle = "#2c2622";
    ctx.fillRect(dx, dy, 26, 12); ctx.fillRect(dx + 20, dy - 11, 8, 12);
    ctx.globalAlpha = a * 0.35; ctx.fillStyle = "#9fd3e8";
    ctx.fillRect(dx - 10, dy + 13, 48, 3);
    ctx.globalAlpha = a;
  }

  /* ---- Gapstow Bridge. Drawn as a solid deck with the arch CUT OUT of it,
     because an arch is the hole and not the stone - outlining it the other way
     round left a rainbow sitting on the water. */
  var BX = 1180, BW = 560, BTOP = WATER - 56, BBOT = BANK - 4;
  ctx.fillStyle = "#4a4138";
  ctx.beginPath();
  ctx.moveTo(BX, BBOT); ctx.lineTo(BX, BTOP + 30);
  ctx.quadraticCurveTo(BX + BW/2, BTOP - 24, BX + BW, BTOP + 30);
  ctx.lineTo(BX + BW, BBOT); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5b5147";                           // coping along the top
  ctx.beginPath();
  ctx.moveTo(BX, BTOP + 30);
  ctx.quadraticCurveTo(BX + BW/2, BTOP - 24, BX + BW, BTOP + 30);
  ctx.lineTo(BX + BW, BTOP + 44);
  ctx.quadraticCurveTo(BX + BW/2, BTOP - 10, BX, BTOP + 44);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0e2029";                           // the arch, cut through
  ctx.beginPath();
  ctx.moveTo(BX + 168, BBOT);
  ctx.quadraticCurveTo(BX + BW/2, BTOP + 6, BX + BW - 168, BBOT);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = a * 0.22; ctx.fillStyle = "#9fd3e8";
  ctx.fillRect(BX + 200, BBOT - 26, BW - 400, 22);     // daylight under it
  ctx.globalAlpha = a;
  for (var st2 = 0; st2 < 9; st2++){                   // stone courses
    ctx.fillStyle = st2 % 2 ? "#443c34" : "#4e453b";
    ctx.fillRect(BX + 14 + st2 * 62, BTOP + 46, 54, 10);
  }

  // ---- the near bank and the drive ---------------------------------------
  ctx.fillStyle = "#1b3322"; ctx.fillRect(0, BANK, LOGICAL_W, LOGICAL_H - BANK);
  ctx.fillStyle = "#172c1d"; ctx.fillRect(0, BANK, LOGICAL_W, 8);
  ctx.fillStyle = "#3b3a37"; ctx.fillRect(0, BANK + 56, LOGICAL_W, 96);
  ctx.fillStyle = "#57544d"; ctx.fillRect(0, BANK + 56, LOGICAL_W, 5);
  ctx.globalAlpha = a * 0.5; ctx.fillStyle = "#6a665e";
  for (var g2 = 0; g2 < 90; g2++)
    ctx.fillRect((g2 * 137) % LOGICAL_W, BANK + 66 + (g2 * 29) % 80, 4, 3);
  ctx.globalAlpha = a;

  for (var lp = 0; lp < 7; lp++){                      // the cast-iron lamps
    var lx = 90 + lp * 290;
    ctx.fillStyle = "#15181c"; ctx.fillRect(lx, BANK - 94, 9, 152);
    ctx.fillRect(lx - 9, BANK + 52, 27, 8);
    ctx.fillStyle = "#1d2127"; ctx.fillRect(lx - 11, BANK - 112, 33, 22);
    ctx.globalAlpha = a * (0.72 + 0.1 * Math.sin(t * 3 + lp));
    ctx.fillStyle = "#ffd98f"; ctx.fillRect(lx - 7, BANK - 108, 25, 15);
    ctx.globalAlpha = a * 0.13;
    ctx.beginPath(); ctx.ellipse(lx + 5, BANK - 96, 64, 46, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = a;
  }

  ctx.fillStyle = "#3b2c1e";                           // a bench, occupied

/* ===================== STEAK DINNER, 81st ==================================
   The whole walk is for this, so it is staged rather than shown: they talk,
   the paper comes out, the game CUTS IN to the signature being written, and
   then back out for the handshake and the stamp. The cut is the point - a
   signature read at the scale of two 110-pixel figures at a bar is a smudge,
   and the one thing the player has to actually see is the pen moving.

   Beats (seconds):
     0.0  wide - talking, glasses up
     2.0  wide - the order slides across the bar
     3.8  CLOSE - the purchase order, full frame
     4.4  CLOSE - the pen starts writing
     7.6  wide - the handshake
     9.4  wide - he holds it up, SIGNED comes down
*/
function barFigure(x, face, coat, skin, reach, talk){
  var hand = face > 0 ? x + 110 + reach - 34 : x - reach;
  ctx.fillStyle = coat;                                        // torso
  ctx.fillRect(x, 496, 110, 218);
  ctx.fillStyle = shade(coat, 0.14);                           // lapels
  ctx.fillRect(x + 36, 496, 38, 128);
  ctx.fillStyle = "#f2f4f6"; ctx.fillRect(x + 46, 496, 18, 80);
  ctx.fillStyle = shade(coat, -0.20);                          // tie
  ctx.fillRect(x + 50, 514, 11, 66);
  ctx.fillStyle = skin;                                        // neck, head
  ctx.fillRect(x + 43, 462, 24, 38);
  ctx.fillRect(x + 27, 400 + (talk || 0), 56, 66);
  ctx.fillStyle = "#2b2219"; ctx.fillRect(x + 25, 392 + (talk || 0), 60, 22);
  ctx.fillStyle = coat;                                        // the arm
  ctx.fillRect(face > 0 ? x + 110 : x - reach, 572, reach, 30);
  ctx.fillStyle = skin; ctx.fillRect(hand, 566, 34, 42);
}

/* The signature, built once: a leaning capital loop, a run of cursive humps,
   then a flourish that sweeps back underneath the name. Revealed a point at a
   time, which is what makes it read as being written rather than appearing. */
var SIG = null;
function signature(){
  if (SIG) return SIG;
  SIG = [];
  var i, u, ang;
  for (i = 0; i <= 34; i++){                        // the capital
    u = i / 34; ang = -0.5 + u * 6.8;
    SIG.push([26 + Math.cos(ang) * 30 + u * 30, -Math.sin(ang) * 52 - u * 12]);
  }
  for (i = 1; i <= 104; i++){                       // the body
    u = i / 104;
    SIG.push([92 + u * 330,
              -Math.sin(u * Math.PI * 7.5) * (30 - u * 13) - Math.sin(u * Math.PI) * 16]);
  }
  for (i = 1; i <= 54; i++){                        // the flourish
    u = i / 54;
    SIG.push([422 + Math.sin(u * Math.PI) * 132 - u * 338,
              -40 + u * 86 - Math.sin(u * Math.PI) * 30]);
  }
  return SIG;
}

/* The close-up: the order itself, and the pen writing on it. */
function barClose(t, a){
  var ct = t - 3.8;
  ctx.fillStyle = "#17100d"; ctx.fillRect(0, 150, LOGICAL_W, 740);
  ctx.globalAlpha = a * 0.16; ctx.fillStyle = "#ffcf7a";        // the lamp above
  ctx.beginPath(); ctx.ellipse(960, 300, 520, 220, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = a;

  ctx.save();
  /* Barely any tilt. At -0.035 the page lifted its right edge far enough that
     every right-aligned amount sat visibly above its left-aligned label - the
     line was straight on the page and crooked to the eye. */
  ctx.translate(960, 520); ctx.rotate(-0.012);
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(-636, -300, 1280, 620);
  ctx.fillStyle = "#f6efe2";          ctx.fillRect(-640, -306, 1280, 620);

  ctx.fillStyle = C.brand; ctx.fillRect(-640, -306, 1280, 14);   // the header rule
  txt("PURCHASE ORDER", -600, -240, 46, "#1d1a16", "left");
  txt("ThousandEyes  \u00B7  Enterprise Agreement  \u00B7  36 months",
      -600, -194, 25, "#6b655c", "left");
  txt(poNumber(), 600, -240, 28, "#6b655c", "right");

  ctx.fillStyle = "#cfc7b6"; ctx.fillRect(-600, -160, 1200, 2);
  var items = [["Cloud & Enterprise Agents", "480"],
               ["Endpoint Agents", "2,500"],
               ["Internet Insights", "Global"],
               ["BGP & Path Visualization", "Included"]];
  for (var k = 0; k < items.length; k++){
    txt(items[k][0], -600, -116 + k * 46, 26, "#3d3932", "left");
    txt(items[k][1], 600, -116 + k * 46, 26, "#3d3932", "right");
    ctx.fillStyle = "#e3dccd"; ctx.fillRect(-600, -98 + k * 46, 1200, 1);
  }
  ctx.fillStyle = "#1d1a16"; ctx.fillRect(-600, 84, 1200, 3);
  txt("TOTAL", -600, 124, 30, "#1d1a16", "left");
  /* The number on the paper is the number he actually built. A flat million
     made the whole walk decorative: it said the same thing whether he had
     crossed twenty blocks or two hundred. */
  txt(cash(pipeline()), 600, 126, 40, "#1d1a16", "right");

  // the signature line
  ctx.fillStyle = "#1d1a16"; ctx.fillRect(-600, 268, 620, 3);
  txt("AUTHORISED SIGNATURE", -600, 296, 22, "#6b655c", "left");
  txt("DATE", 180, 296, 22, "#6b655c", "left");
  ctx.fillStyle = "#1d1a16"; ctx.fillRect(180, 268, 420, 3);
  if (ct > 2.9) txt(poDate(), 250, 250, 30, "#1a3a7a", "left");

  /* The pen writes. The stroke is revealed a point at a time and the nib sits
     on the head of it, so the hand and the ink stay married. */
  var pts = signature(), sp = Math.max(0, Math.min(1, (ct - 0.6) / 2.4));
  var n = Math.max(2, Math.floor(pts.length * sp));
  ctx.save();
  ctx.translate(-560, 236);
  ctx.strokeStyle = "#1a3a7a"; ctx.lineWidth = 7;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var q = 1; q < n; q++) ctx.lineTo(pts[q][0], pts[q][1]);
  if (sp > 0) ctx.stroke();
  if (sp > 0 && sp < 1){
    var h = pts[n - 1];
    ctx.strokeStyle = "#1b1d22"; ctx.lineWidth = 13;   // the barrel
    ctx.beginPath(); ctx.moveTo(h[0] + 10, h[1] - 14);
    ctx.lineTo(h[0] + 108, h[1] - 150); ctx.stroke();
    ctx.strokeStyle = "#c9a227"; ctx.lineWidth = 9;    // the band
    ctx.beginPath(); ctx.moveTo(h[0] + 62, h[1] - 80);
    ctx.lineTo(h[0] + 82, h[1] - 108); ctx.stroke();
    ctx.fillStyle = "#1b1d22";                          // the nib
    ctx.beginPath(); ctx.moveTo(h[0], h[1]);
    ctx.lineTo(h[0] + 18, h[1] - 20); ctx.lineTo(h[0] + 4, h[1] - 24);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9b98c";                          // the hand
    plate(h[0] + 86, h[1] - 220, 110, 86, "#e9b98c", 22);
    ctx.fillStyle = "#d8a77c"; ctx.fillRect(h[0] + 96, h[1] - 150, 88, 18);
  }
  ctx.restore();
  ctx.restore();

  if (ct > 3.2){                                       // the ink settles
    ctx.globalAlpha = a * Math.max(0, 1 - (ct - 3.2) / 0.5);
    ctx.fillStyle = "#f6efe2"; ctx.fillRect(0, 150, LOGICAL_W, 740);
    ctx.globalAlpha = a;
  }
}

/* Today, off the device clock. Both of these were frozen strings - a paper
   dated the 6th of October and numbered 0081 was going to look stale on a
   panel the following week, and the walk is meant to be happening now. */
var PO_MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN",
                 "JUL","AUG","SEP","OCT","NOV","DEC"];
function poDate(){
  var d = new Date();
  return d.getDate() + " " + PO_MONTHS[d.getMonth()];

function poNumber(){
  var d = new Date();

}

/* The way home. The streets count down and every landmark comes back in the
   opposite order, because both are keyed on the street number. */
var SCENES_BACK = {
  34: { title:"PENN 1",             sub:"Thirty-fourth and Seventh",  draw:scenePenn,
        secs:5.2, music:"city", win:true }
};

/* A scene can fire on the step that lands him in the middle of a road, and a
   cutscene several seconds long is exactly long enough to forget where you
   were standing. The world is frozen behind it, so the traffic he is standing
   in is still there when the scene lifts and he gets flattened by something he
   never saw move. Step him back to the pavement first.

   Backwards rather than forwards: forwards would hand him a free crossing for
   reaching a landmark. maxRow is untouched either way, so nothing he has
   already earned is taken off him. */
function sceneStepBack(){
  var cur = rows[G.row];
  if (!cur || cur.type === "safe") return;
  var to = null, i;
  for (i = G.row - 1; i >= Math.max(0, G.row - 8); i--)
    if (rows[i] && rows[i].type === "safe"){ to = i; break; }
  if (to === null)
    for (i = G.row + 1; i <= G.row + 8; i++)
      if (rows[i] && rows[i].type === "safe"){ to = i; break; }
  if (to === null) return;

  var row = rows[to], col = G.col;
  if (row.blocked && row.blocked[col]){
    for (var d = 1; d < COLS; d++){
      if (col - d >= 0    && !row.blocked[col - d]){ col -= d; break; }
      if (col + d < COLS  && !row.blocked[col + d]){ col += d; break; }
    }
  }
  G.row = G.fromRow = to; G.col = G.fromCol = col; G.hop = 1;
  G.camRow = to;
  // and a beat of grace, because the lane he was in is moving again
  G.invulnT = Math.max(G.invulnT, 1.2);
}

function startScene(st){
  sceneStepBack();
  var sc = (G.leg > 0 ? SCENES : SCENES_BACK)[st];
  /* The scene carries its own definition, because the leg can flip while it is
     still on screen - looking it up again on the way out would find the wrong
     table and lose the instruction the player is waiting for. */
  G.scene = { st:st, t:0, len:(sc && sc.secs) || SCENE_SECS, sc:sc, fired:{} };
  G.scenesSeen["L" + G.leg + "_" + st] = true;
  if (sc && sc.sound === "deal") AUDIO.deal(); else AUDIO.stage();
  if (sc && sc.music){
    var tune = { city:AUDIO.cityTheme, rock:AUDIO.rockTheme,
                 park:AUDIO.parkTheme, dinner:AUDIO.dinnerTheme }[sc.music];
    (tune || AUDIO.cityTheme)();
  }
}
function updateScene(dt){
  G.scene.t += dt;
  /* A long scene is scored rather than stung: each beat names a cue and fires
     once as the clock passes it, so the sound follows the picture instead of
     everything landing on the cut. */
  var bs = G.scene.sc && G.scene.sc.beats;
  if (bs){
    for (var i = 0; i < bs.length; i++){
      if (G.scene.t >= bs[i][0] && !G.scene.fired[i]){
        G.scene.fired[i] = true;
        if (AUDIO[bs[i][1]]) AUDIO[bs[i][1]]();
      }
    }
  }
  if (G.scene.t < G.scene.len) return;
  /* Take the street off the scene before dropping it - `sc` is the table
     entry and does not carry one, and the turn below needs to know where it
     happened. */
  var sc = G.scene.sc, sceneSt = G.scene.st;
  G.scene = null;
  if (!sc) return;
  /* Some scenes leave you holding an instruction, and two of them change the
     game: the signing turns the city round, and Penn 1 ends it. */
  if (sc.turn){
    /* The scene opens on the pavement BEFORE the street, so by the numbers he
       has not reached it yet. He has - that is where the restaurant is - so
       the countdown home starts from the scene's own street rather than from
       the kerb he happens to be standing on. */
    G.street = Math.max(G.street, sceneSt || G.street);
    G.leg = -1; G.po = true;
    /* He has just sat down to a steak. Forty-seven blocks back to Penn 1 is a
       second run in all but name, and starting it on whatever was left of the
       first one was a tax on having got there at all. */
    G.hp = HP_MAX; G.hpGain = { life:1.5, amt:0 };
    /* The TAM's job ends with the signature. No more wins, no more payouts,
       and no new TAM on the way home - the walk back is yours. */
    G.tam = false; G.tamLeft = 0; G.tamT = 0; G.tamWin = null;
    turnBack();
  }
  if (sc.after)
    notice(sc.after[0], sc.after[1], sc.after[2], 9.5, C.good,
           sc.turn ? "downtown" : null);
  if (sc.win) winGame();
}

function winGame(){
  G.won = true; G.missedTrain = false;
  G.state = ST_DEAD; G.deadFor = 0;
  saveBest(G.maxRow); endRun();
  AUDIO.win();
}
function drawScene(){
  if (!G.scene) return;
  var sc = G.scene.sc;
  if (!sc){ G.scene = null; return; }
  sceneFrame(sc.title, sc.sub, sc.draw);
}

function drawRide(){
  var R = G.ride;
  if (!R) return;
  var rock = Math.sin(R.rock * 13) * 3 + Math.sin(R.rock * 7.3) * 2;

  if (R.phase === "down" || R.phase === "up"){
    var dur = R.phase === "down" ? RIDE_PHASES.down : RIDE_PHASES.up;
    var f = Math.min(1, R.t / dur), a = (R.phase === "down") ? f : 1 - f;
    ctx.globalAlpha = a; ctx.fillStyle = "#05070a";
    ctx.fillRect(0, HORIZON, LOGICAL_W, LOGICAL_H - HORIZON);
    // the daylight slot above you narrowing as you go down, widening coming up
    ctx.globalAlpha = a * 0.5;
    var slot = (1 - a) * 420 + 40;
    ctx.fillStyle = "#2a1d12";
    ctx.fillRect(0, HORIZON, LOGICAL_W/2 - slot/2, 90);
    ctx.fillRect(LOGICAL_W/2 + slot/2, HORIZON, LOGICAL_W/2 - slot/2, 90);
    ctx.globalAlpha = a;
    txt(R.phase === "down" ? "DOWNTOWN STAIRS" : "STREET LEVEL",
        LOGICAL_W/2, LOGICAL_H*0.52, 34, "#ffd24a");
    ctx.globalAlpha = 1;
    return;
  }

  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, HORIZON, LOGICAL_W, LOGICAL_H - HORIZON);

  if (R.phase === "platform"){
    var f2 = R.t / RIDE_PHASES.platform;
    // platform edge and columns
    ctx.fillStyle = "#15181d"; ctx.fillRect(0, 760, LOGICAL_W, LOGICAL_H-760);
    ctx.fillStyle = "#2a2f36"; ctx.fillRect(0, 752, LOGICAL_W, 10);
    for (var c = 0; c < 7; c++){
      ctx.fillStyle = "#1d2228";
      ctx.fillRect(60 + c*280, 430, 34, 330);
    }
    tunnelLights(900, 380, 54);
    // headlight growing out of the tunnel
    var hr = 20 + f2*f2*520;
    ctx.globalAlpha = Math.min(1, 0.25 + f2);
    ctx.fillStyle = "#fff4cf";
    ctx.beginPath(); ctx.ellipse(LOGICAL_W*0.5, 600, hr*1.25, hr*0.75, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = Math.min(1, f2*1.4); ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.ellipse(LOGICAL_W*0.5, 600, hr*0.45, hr*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    txt("TRAIN APPROACHING", LOGICAL_W/2, 330, 30, "#ffd24a");
    return;
  }

  if (R.phase === "run"){
    tunnelLights(1900, 300, 86);
    // speed streaks
    ctx.globalAlpha = 0.22; ctx.fillStyle = "#6f5a33";
    for (var k2 = 0; k2 < 14; k2++){
      var sy2 = 320 + ((k2*61 + (G.t*1500) % 520) % 520);
      ctx.fillRect(0, sy2, LOGICAL_W, 2);
    }
    ctx.globalAlpha = 1;
    drawCar(0, rock, true);
    // stations tearing past
    var st = (G.t * 420) % 900;
    ctx.globalAlpha = 0.5;
    plate(LOGICAL_W - st, 330, 150, 46, "#0d1117", 5);
    txt("EXPRESS", LOGICAL_W - st + 75, 358, 20, "#8d99a6");
    ctx.globalAlpha = 1;
    var left = Math.max(0, R.toRow - Math.round(G.camRow));
    txt(R.streets + " STREETS  \u00B7  " + left + " TO GO", LOGICAL_W/2, 300, 26, "#ffd24a");
    ctx.globalAlpha = 0.45 + 0.25*Math.sin(G.t*3);
    txt("TAP OR SWIPE TO WALK THROUGH THE CAR", LOGICAL_W/2, 862, 22, "#8d99a6");
    ctx.globalAlpha = 1;
    return;
  }

  // arrive: brakes, sign, doors
  var f3 = R.t / RIDE_PHASES.arrive;
  tunnelLights(1900 * (1 - f3), 300, 86);
  ctx.fillStyle = "#15181d"; ctx.fillRect(0, 760, LOGICAL_W, LOGICAL_H-760);
  drawCar(0, rock * (1 - f3), true);
  // station sign sliding in
  var sx = LOGICAL_W * (1 - Math.min(1, f3*1.6)) + 140;
  plate(sx, 300, 420, 70, "#0b1016", 8);
  ctx.fillStyle = "#1b4fa8"; ctx.fillRect(sx, 300, 10, 70);
  txt("W " + streetAt(R.toRow) + " ST", sx + 215, 344, 38, "#f2f5f8");
  // doors parting at the middle window
  var open = Math.min(1, Math.max(0, (f3 - 0.35) / 0.65)) * 150;
  var cy2 = 470 + rock*(1-f3), cw2 = LOGICAL_W - 180, cx2 = 90;
  var mid = cx2 + cw2/2;
  ctx.fillStyle = "#c3cad1";
  ctx.fillRect(mid - 150 - open, cy2+60, 150, 210);
  ctx.fillRect(mid + open, cy2+60, 150, 210);
  ctx.globalAlpha = 0.5; ctx.fillStyle = "#ffd24a";
  ctx.fillRect(mid - open - 4, cy2+60, 4, 210);
  ctx.fillRect(mid + open, cy2+60, 4, 210);
  ctx.globalAlpha = 1;
}

function landFromFlight(){
  var row = rows[G.row];
  if (row && row.blocked && row.blocked[G.col]){
    for (var d = 1; d < COLS; d++){
      if (G.col + d <= COLS - 1 && !row.blocked[G.col + d]){ G.col += d; break; }
      if (G.col - d >= 0        && !row.blocked[G.col - d]){ G.col -= d; break; }
    }
    G.fromCol = G.col; G.hop = 1;
  }
  G.invulnT = Math.max(G.invulnT, 0.85);
  AUDIO.hiss();
}

function hitPlayer(kind, pp){
  if (G.invulnT > 0) return;
  if (G.shield > 0){
    /* Taking the hit should land, not just tick a counter: a hard shake, a
       hit-stop that freezes the world for a beat, a red wash, and the figure
       flickering while he recovers. */
    G.shield = (G.shield | 0) - 1;
    G.invulnT = 1.3; G.shake = 30; G.hurtT = 0.6;
    AUDIO.hurt();
    flash("OBJECTION ABSORBED",
          G.shield > 0 ? "Down to the blue one. One more is still free."
                       : "That one cost you the shield.",
          G.shield > 0 ? BLAZER2 : BLAZER);
    burst(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 40, "#ff5e6e");
  } else {
    /* An objection used to end the run outright. Now it takes a bite out of
       him and he can carry on - once. The shield still absorbs completely,
       which is what keeps it worth having. */
    var dmg = hazDamage(kind);
    G.hp -= dmg;
    if (G.hp <= 0){ G.hp = 0; die(kind); return; }
    /* The shake scales with the hit, so a bus and a pedicab do not land the
       same way even before you read the number. */
    G.invulnT = 1.6; G.shake = 16 + dmg * 0.26; G.hurtT = 0.4 + dmg * 0.005;
    AUDIO.hurt();
    flash("THAT ONE LANDED", hazName(kind) + "  −" + dmg + "%  ·  " +
          Math.round(G.hp) + "% left. Find something to eat.", C.danger);
    burst(pp.col*TILE + TILE/2, rowScreenY(pp.row) - 40, "#ff5e6e");
  }
}

function update(dt){
  G.t += dt;
  if (G.scene){ updateScene(dt); if (G.scene) return; }
  if (G.ticker){
    G.ticker.t += dt;
    if (G.ticker.t >= TICKER_SECS) G.ticker = null;
    if (G.ticker) return;
  }
  if (G.ride){ updateRide(dt); if (G.ride) return; } G.sweep += dt*0.4; if (G.sweep > 1.7) G.sweep -= 1.7;
  if (G.hop < 1){
    /* Tired legs. Up to 40% longer on a step once he is nearly out, which is
       a real cost - the crossing windows do not get any wider to match - but
       it is the point: he is supposed to be struggling, and the fix for it is
       lunch. Flight overrides it, since he is not walking. */
    /* Sluggish once he is in the red. The ramp alone started at nothing, so
       crossing into the worn band changed the handling by a figure nobody
       could feel; there is a step of 0.15 the moment he goes under HP_WORN
       and then it climbs. 135ms a step becomes 155ms at the threshold and
       250ms on his last point of health, which is slow enough that a gap
       you would have taken at full strength is not there any more. */
    var wk2 = wornK();
    var drag = (G.flyT > 0) ? 1 : (wk2 > 0 ? 1 + 0.15 + wk2 * 0.70 : 1);
    G.hop += dt*1000 / (HOP_MS * (1 - 0.32*G.flyA) * drag);   // airborne is quicker
    if (G.hop >= 1){ G.hop = 1; collect(); }
  }
  if (G.slowT   > 0) G.slowT   = Math.max(0, G.slowT - dt);
  if (G.riskT > 0) G.riskT = Math.max(0, G.riskT - dt);
  if (G.hurtT > 0) G.hurtT = Math.max(0, G.hurtT - dt);
  if (G.nahT > 0)  G.nahT  = Math.max(0, G.nahT - dt);
  if (G.yumT > 0){
    G.yumT = Math.max(0, G.yumT - dt);
    /* Bite sounds fire from the clock, not from the renderer: the drawing code
       runs every frame and would chomp sixty times a second. */
    var ea = EAT_SECS - G.yumT;
    var want = (ea <= EAT_BITE0) ? 0 :
               Math.min(EAT_BITES, Math.floor((ea - EAT_BITE0) / EAT_BITE_EV) + 1);
    while (G.yumBite < want){ G.yumBite++; AUDIO.chomp(); }
  }
  if (G.wowT > 0)  G.wowT  = Math.max(0, G.wowT - dt);
  if (G.sadT > 0)  G.sadT  = Math.max(0, G.sadT - dt);
  if (G.needFood > 0) G.needFood = Math.max(0, G.needFood - dt);
  if (G.booth){
    G.booth.t += dt;
    if (!G.booth.rang && G.booth.t > 0.05){ G.booth.rang = 1; AUDIO.boothIn(); }
    if (!G.booth.open && G.booth.t >= BOOTH_OUT){
      /* The doors come off and the TAM is handed over: flight, the engagement
         clock, and the first win scheduled for just after the flight ends so
         the SKU is seen delivering rather than silently sitting there. */
      G.booth.open = 1;
      G.flyT = Math.min(FLY_MAX, Math.max(G.flyT, FLY_SECS));
      G.tamLeft = TAM_DURATION;
      G.tamT = 3 + Math.random()*3;
      AUDIO.boothOut();
    }
    if (G.booth.t >= BOOTH_SECS) G.booth = null;
  }
  if (G.cheerT > 0) G.cheerT = Math.max(0, G.cheerT - dt);
  if (G.revealT > 0){
    G.revealT = Math.max(0, G.revealT - dt);
    if (G.revealT === 0) G.trace = null;
  }
  if (G.invulnT > 0) G.invulnT = Math.max(0, G.invulnT - dt);

  /* Flight. The ascent and descent are eased off a single 0..1 value, so the
     lift, the faster hop and the shadow all stay in sync. */
  /* and a beep that quickens and rises with it */
  if (G.flyT > 0 && G.flyT < FLY_WARN && G.state === ST_PLAY){
    G.flyBeep -= dt;
    if (G.flyBeep <= 0){
      AUDIO.flyWarn(G.flyT / FLY_WARN);
      G.flyBeep = 0.11 + (G.flyT / FLY_WARN) * 0.25;
    }
  } else G.flyBeep = 0;

  var wasFlying = G.flyT > 0;
  if (G.flyT > 0) G.flyT = Math.max(0, G.flyT - dt);
  if (wasFlying && G.flyT <= 0) landFromFlight();
  G.flyA += ((G.flyT > 0 ? 1 : 0) - G.flyA) * Math.min(1, dt * 7);
  if (G.flyA < 0.002) G.flyA = 0;

  /* Flight used to breathe once a square. Both the arc and the pitch ran
     off the sine of the step, so they went to nothing at every square edge
     and the whole thing flapped. They run off how long he has been MOVING
     now - a value that eases in when he sets off, HOLDS while he keeps
     going and eases out when he stops - which is the difference between
     flying and being thrown repeatedly.

     The tilt is smoothed separately rather than being read straight off
     the current step, so stepping left after stepping right rolls him
     through level instead of snapping. */
  var movingNow = (G.state === ST_PLAY && G.hop < 1 && G.flyA > 0.05) ? 1 : 0;
  G.flyMove += (movingNow - G.flyMove) * Math.min(1, dt * (movingNow ? 8 : 4));
  if (G.flyMove < 0.002) G.flyMove = 0;
  /* The gait runs on its own clock rather than on the step. Tying the cycle
     to G.hop made every square its own little animation - the legs came up,
     went down, snapped to attention, and then the next tap started the whole
     thing again from zero, which is what was reading as stiff. A phase that
     only advances while he is moving, and an amplitude that eases in and out
     around it, chains the steps into one walk instead of a row of them.

     HALF a cycle per square - one footfall - so the rate is pi over the step
     time. A full cycle per square was two footfalls in 135ms, which is a
     sprint, and worse: the phase advanced exactly 2pi every step and came
     back to where it started, so he led with the same leg every single time
     and the continuity bought nothing. Half means the legs alternate for
     free. The amplitude rises fast and settles slower, which is how legs
     work. */
  var stepping = (G.state === ST_PLAY && G.hop < 1 && !G.ride && G.flyA <= 0.05)
                 ? 1 : 0;
  if (stepping) G.walkPh += dt * (Math.PI / (HOP_MS / 1000));
  G.walkAmt += (stepping - G.walkAmt) * Math.min(1, dt * (stepping ? 24 : 9));
  if (G.walkAmt < 0.002) G.walkAmt = 0;

  var fdx = G.col - G.fromCol;
  var fdir = fdx > 0 ? 1 : (fdx < 0 ? -1 : (G.facing > 0 ? 1 : -1));
  var ftar = fdir * (fdx !== 0 ? FLY_PITCH_SIDE : FLY_PITCH_FWD)
             * G.flyMove * G.flyA;
  G.flyTilt += (ftar - G.flyTilt) * Math.min(1, dt * 9);

  /* An engaged TAM keeps delivering for the rest of the run. */
  if (G.tam && G.state === ST_PLAY){
    G.tamLeft -= dt;
    if (G.tamLeft <= 0){
      G.tam = false; G.tamLeft = 0;
      flash("TAM ENGAGEMENT ENDED", "Sixty seconds. Find another.", C.pw5);
    }
  }
  if (G.tam && G.state === ST_PLAY){
    G.tamT -= dt;
    if (G.tamT <= 0){
      /* 16-28s. It was 8-14, which paid out so often that the banner was
         more or less permanent and stopped reading as an event at all. Half
         the rate, same payouts, each one actually noticed. */
      G.tamT = 16 + Math.random()*12;
      G.tamWins++;
      /* No more flight after the opening five seconds. An engaged TAM is not
         a movement power-up, it is a revenue one: every payout is an outcome
         with a number on it, and the number goes on the board. */
      var win = TAM_WINS[(Math.random()*TAM_WINS.length)|0];
      G.bonus += win[2]; G.bonusTam += win[2];
      G.tamWin = { life:4.4, max:4.4, name:win[0], line:win[1], amt:win[2] };
      G.flash = null;                      // the banner replaces it
      AUDIO.tamWin();
    }
  }

  var pp = playerPos();
  G.camRow += (pp.row - G.camRow) * Math.min(1, dt*11);

  // the commute clock: only forward progress buys time back
  if (G.state === ST_PLAY){
    G.trainT -= dt;
    if (G.trainT <= 0){ G.trainT = 0; missTrain(); }
  }

  // hit-stop - the world holds for a beat on impact
  if (G.hurtT > 0.46){ G.camRow += (pp.row - G.camRow) * Math.min(1, dt*11); return; }

  var lo = Math.floor(G.camRow) - ROWS_BEHIND, hi = Math.floor(G.camRow) + ROWS_AHEAD, r, i;
  /* Traffic Insights does not just colour the risk, it answers it: while it is
     up, whatever is bearing down on the lane he is STANDING IN turns around
     rather than run him over. It flips the whole lane, the same way the path
     trace does, because reversing one vehicle inside a moving stream is what
     used to drive cars through each other. */
  var pRow = (G.hop < 0.5) ? G.fromRow : G.row;
  var deter = G.riskT > 0 && G.state === ST_PLAY && G.flyT <= 0;
  var slowK = (G.slowT > 0) ? SLOW_K : 1;  // Internet Insights slows the grid

  if (G.state !== ST_DEAD){
    for (r = lo; r <= hi; r++){
      var row = rows[r];
      if (!row) continue;

      if (row.type === "sweep"){
        row.t += dt;
        if (row.phase === "idle" && row.t >= row.idleFor){
          row.phase = "warn"; row.t = 0;
          if (Math.abs(r - G.row) < 9) AUDIO.siren();
        } else if (row.phase === "warn" && row.t >= 2.0){
          row.phase = "sweep"; row.t = 0;
          row.cars = [];
          var convoyW = HAZ.motorcade.w;
          for (i=0;i<4;i++) row.cars.push({ p: -(i*(convoyW+0.5)) - convoyW, stop:0 });
          row.eff = convoyW;
        } else if (row.phase === "sweep"){
          for (i=0;i<row.cars.length;i++) row.cars[i].p += row.speed * slowK * dt;
          if (row.cars.length && row.cars[0].p > SPAN + 2){
            row.phase = "idle"; row.t = 0; row.cars = [];
            row.idleFor = 3.4 + Math.random()*3.2;
          }
        }
        continue;
      }

      if (row.type !== "road") continue;
      var spec = HAZ[row.kind];
      for (i=0;i<row.cars.length;i++){
        var car = row.cars[i];
        if (spec.stops){
          /* Moves 3.6s, halts 1.6s - the bus rhythm. The CYCLE is slowed too,
             not just the rolling: a bus that crawls at a quarter speed and
             still slams to a halt on the normal beat is not in slow motion,
             it is broken. It also meant the two stopping vehicles were the
             only ones in the game not actually running at SLOW_K. */
          car.stop += dt * slowK;
          var cyc = car.stop % 5.2;
          var wasStopped = car.stopped;
          car.stopped = (cyc > 3.6);
          if (car.stopped && !wasStopped && Math.abs(r - G.row) < 6) AUDIO.hiss();
        }
        /* While a trace is live, anything that reaches it turns around. The
           player is already immune on the route; this exists to make that
           unmistakable. Guard is !(bounce > 0), not bounce <= 0: bounce starts
           undefined and `undefined <= 0` is false, which silently disabled the
           whole effect first time round. */
        /* The trace turns the LANE around, not one car in it. Reversing a
           single vehicle inside a stream moving the other way guarantees a
           head-on, and the old code simply drove it through its neighbours -
           which is most of what "cars pass through each other" was. Flipping
           the whole lane preserves every gap exactly. */
        if (G.revealT > 0 && G.trace && !(row.bounce > 0) &&
            traceBlocks(r, carX(row, car), row.eff || 1)){
          row.rv = -(row.rv || 1);
          row.bounce = 1.4;
        }
        /* Traffic Insights, two behaviours in order of preference. A driver
           who sees him in time steers round him; one who is already on top of
           him has no room for that and turns the lane around instead. Trying
           to swerve at two tiles would just be a sprite sliding through him. */
        var want = 0, overlap = false;
        if (deter && r === pRow && !car.stopped){
          var cx0 = carX(row, car), go = row.dir * (row.rv || 1);
          var carA = cx0, carB = cx0 + (row.eff || 1);
          var manA = pp.col, manB = pp.col + 1;
          overlap = carA < manB && carB > manA;
          /* How much road is left before the two spans meet, measured on the
             LEADING edge. It has to be the whole body and not just that edge:
             measuring the front of a bus meant the swerve collapsed the moment
             the nose was past him while nine feet of bus was still over his
             head, and he was run down on the way out. */
          var approach = go > 0 ? (manA - carB) : (carA - manB);
          var near = overlap ? 1
                   : (approach > 0 && approach < SWERVE_FROM
                      ? Math.min(1, (SWERVE_FROM - approach) / 1.9) : 0);
          want = -SWERVE_PX * near * (go > 0 ? 1 : -1);

          /* Anything that cannot get round him STOPS. It used to turn the
             whole lane around, which worked - gaps were preserved exactly -
             but a street full of traffic reversing on the spot is a strange
             thing to watch and it threw the cars he had already judged safe
             back across his path. Brakes are the obvious reading of "that
             driver has seen me", and halting the whole row keeps every gap
             exactly as it was for nothing.

             It re-arms every frame while he is still in front of them, so the
             lane stays stopped for as long as he stands there and rolls again
             half a second after he is clear. */
          var clear = Math.abs(car.sw || 0) >= SWERVE_CLEAR;
          if (!clear && (overlap || (approach > -0.2 && approach < DETER_TILES))){
            if (!(row.halt > 0)){
              row.flinch = 0.55;
              burst(pp.col*TILE + TILE/2, rowScreenY(r) - 26, POWERS.traffic.col);
              AUDIO.brakes();
            }
            row.halt = 0.5;
          }
        }
        /* Fast out, slow back: a driver commits to the swerve and drifts back
           afterwards. Snapping out on an overlap is what covers the case of
           him stepping off the kerb straight into a moving lane. */
        var cur = car.sw || 0;
        if (overlap && Math.abs(want) > Math.abs(cur)) cur = want;
        else cur += (want - cur) * Math.min(1, dt * (Math.abs(want) > Math.abs(cur) ? 16 : 5));
        car.sw = Math.abs(cur) < 0.4 ? 0 : cur;
        if (!car.stopped && !(row.halt > 0)){
          /* He drives at his own pace until he catches the one in front, and
             then he drives at that one's. Without the catch-up test a quick
             driver closes on a slow one and separate() snaps him back every
             frame, which reads as shunting. */
          var kk = car.k || 1;
          var ahead = row.cars[(i + ((row.rv || 1) * row.dir > 0 ? 1 : -1) +
                                row.cars.length) % row.cars.length];
          if (ahead && ahead !== car){
            var gapA = ((row.rv || 1) * row.dir > 0 ? ahead.p - car.p : car.p - ahead.p);
            if (gapA < 0) gapA += SPAN;
            gapA -= (row.eff || 1);
            if (gapA < 1.7) kk = Math.min(kk, (ahead.stopped ? 0 : (ahead.k || 1)));
          }
          car.p += row.speed * kk * slowK * dt * (row.rv || 1);
          if (car.p >= SPAN) car.p -= SPAN;
          if (car.p < 0) car.p += SPAN;
        }
      }
      if (row.bounce > 0) row.bounce -= dt;
      if (row.halt > 0) row.halt -= dt;
      if (row.flinch > 0) row.flinch -= dt;
      separate(row);
      if (row.rogue && !(row.halt > 0)){
        // against the posted direction, which is the whole joke
        row.rogue.p += row.rogue.speed * slowK * dt;
        if (row.rogue.p >= SPAN) row.rogue.p -= SPAN;
      }
    }
  }

  if (G.state === ST_PLAY && G.flyT <= 0){
    var cr = (G.hop < 0.5) ? G.fromRow : G.row;
    var crow = rows[cr];
    if (crow && (crow.type === "road" || crow.type === "sweep")){
      var p0 = pp.col+0.14, p1 = pp.col+0.86, hitKind = null;
      /* Which way the thing that got him was travelling, so he can be thrown
         the way he was actually hit rather than the way he happened to be
         facing. Lanes carry their own direction, and a trace can have turned
         one round. */
      var push = 0;
      for (i=0;i<crow.cars.length;i++){
        // a car far enough off the lane centre has gone round him, not through
        if (Math.abs(crow.cars[i].sw || 0) >= SWERVE_CLEAR) continue;
        var cx = carX(crow, crow.cars[i]);
        if (cx < p1 && cx + (crow.eff || HAZ[crow.kind].w) > p0){
          hitKind = crow.kind;
          push = (crow.dir * (crow.rv || 1)) > 0 ? 1 : -1;
          break;
        }
      }
      if (!hitKind && crow.parked){
        for (i=0;i<crow.parked.length;i++){
          var px0 = crow.parked[i].col;
          if (px0 < p1 && px0 + HAZ.boxtruck.w > p0){
            hitKind = "boxtruck";
            /* Nothing hit him - he walked into a parked truck - so he goes
               over backwards, away from the way he was going. */
            push = G.facing > 0 ? -1 : 1;
            break;
          }
        }
      }
      if (!hitKind && crow.rogue){
        var rx = rogueX(crow);
        if (rx < p1 && rx + HAZ.ebike.w > p0){
          hitKind = "ebike";
          push = crow.dir > 0 ? -1 : 1;     // the wrong-way bike, by definition
        }
      }
      // the traced route is genuine safe passage, not a hint
      if (hitKind && G.revealT > 0 && onTrace(cr, G.col)) hitKind = null;
      if (hitKind){ G.deathPush = push; hitPlayer(hitKind, pp); }
    }
  }

  if (G.state === ST_DEAD || G.state === ST_BOARD) G.deadFor += dt;
  /* The tally clock does not start until the screen is actually up, or the
     first rows would be half counted by the time anybody saw them. */
  if (G.state === ST_DEAD && G.tally && G.deadFor >= DEATH_HOLD){
    G.tally.t += dt; tallyAudio(dt);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*46);

  if (G.toast){
    G.toast.life -= dt;
    G.toast.a += ((G.toast.life > 0.5 ? 1 : 0) - G.toast.a) * Math.min(1, dt*7);
    if (G.toast.life < -0.4) G.toast = null;
  }
  if (G.flash){ G.flash.life -= dt; if (G.flash.life <= 0) G.flash = null; }
  if (G.tamWin){ G.tamWin.life -= dt; if (G.tamWin.life <= 0) G.tamWin = null; }
  if (G.addonWin){ G.addonWin.life -= dt; if (G.addonWin.life <= 0) G.addonWin = null; }
  if (G.notice){ G.notice.life -= dt; if (G.notice.life <= 0) G.notice = null; }
  if (G.hpGain){ G.hpGain.life -= dt; if (G.hpGain.life <= 0) G.hpGain = null; }

  for (i=0;i<G.parts.length;i++){
    var pt = G.parts[i];
    if (pt.life <= 0) continue;
    pt.life -= dt;
    if (pt.bill){
      pt.vy += BILL_G*dt;
      var drag = Math.max(0, 1 - BILL_DRAG*dt);
      pt.vx *= drag; pt.vy *= drag;
      pt.rot += pt.spin*dt;
      // the sideways wander a flat thing does on the way down
      pt.x += pt.vx*dt + Math.sin(pt.rot*0.9) * 46 * dt;
      pt.y += pt.vy*dt;
    } else {
      pt.vy += 1500*dt;
      pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    }
  }
  pruneRows(Math.floor(G.camRow) - ROWS_BEHIND - 4);
}

/* -------------------------------------------------------------------- draw */
function rowScreenY(r){ return BASE_Y - (r - G.camRow) * ROW_H; }

/* =============================================================== SKYLINE ===
   Three layers above the horizon: a static far band, a nearer band, and a
   LANDMARK layer that changes as you walk uptown. Everything is plain rects,
   drawn fresh each frame (~400 fills) rather than baked, because a 1920x250
   bake per landmark set would have cost ~2MB each.

   Window lighting is hashed from integer pixel coords, so a given window is
   lit consistently every frame instead of strobing.
   ========================================================================= */
function winGrid(x, y, w, h, seed, a, stepX, stepY){
  if (w < 22 || h < 22) return;
  stepX = stepX || 18; stepY = stepY || 20;
  ctx.globalAlpha = a;
  ctx.fillStyle = "#ffae55";
  for (var wy = y + 9; wy < y + h - 11; wy += stepY){
    for (var wx = x + 7; wx < x + w - 9; wx += stepX){
      if ((((wx | 0) * 7 + (wy | 0) * 13 + seed * 31) % 17) < 6){
        ctx.fillRect(wx | 0, wy | 0, 6, 8);
      }
    }
  }
  ctx.globalAlpha = 1;
}
/* one box sitting on the skyline baseline */
function bldg(x, w, h, tone, a, seed, winA){
  ctx.globalAlpha = a; ctx.fillStyle = tone;
  ctx.fillRect(x, SKY_BASE - h, w, h);
  ctx.globalAlpha = 1;
  if (winA > 0) winGrid(x, SKY_BASE - h, w, h, seed, winA * a);
}
/* a box stacked at an arbitrary height, for setbacks and crowns */
function slab(x, y, w, h, tone, a){
  ctx.globalAlpha = a; ctx.fillStyle = tone;
  ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
}

               [790,130,140],[950,160,88],[1130,110,126],[1280,180,72],
               [1460,130,134],[1620,150,92],[1780,160,116]];
var SKY_MID = [[60,96,150],[230,72,186],[380,110,124],[540,84,168],[700,120,110],

/* ---- LANDMARKS -----------------------------------------------------------
   Street-level facades filling the band between the far skyline and the kerb,
   fading in and out by cross street so the city changes as you walk. All flat
   rects - no gradients, no per-pixel work - because fill rate is the scarce
   resource on a Board, not geometry. Two or three are up at once.
   ------------------------------------------------------------------------ */
function bandA(st, from, to, fade){
  if (st < from - fade || st > to + fade) return 0;
  if (st < from) return (st - (from - fade)) / fade;
  if (st > to)   return 1 - (st - to) / fade;
  return 1;
}
var LA = 1;                                   // alpha of the landmark being drawn
var LX = 0;                                   // lane base x of the landmark being drawn
function lr(x, y, w, h, col){
  ctx.globalAlpha = LA; ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
}
function lrA(x, y, w, h, col, a){
  ctx.globalAlpha = LA * a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
}
function lwin(x, y, w, h, cols, rws, seed, col){
  ctx.globalAlpha = LA * 0.75; ctx.fillStyle = col || "#ffae55";
  var cw = w/cols, ch = h/rws;
  for (var i = 0; i < cols; i++) for (var j = 0; j < rws; j++){
    if (((i*7 + j*13 + seed*31) % 17) < 7)
      ctx.fillRect(x + i*cw + cw*0.22, y + j*ch + ch*0.22, cw*0.56, ch*0.56);
  }
  ctx.globalAlpha = LA;
}
function ltxt(t, cx, y, size, col){
  ctx.globalAlpha = LA; ctx.fillStyle = col;
  ctx.font = "bold " + size + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign = "center"; ctx.fillText(t, cx, y);
}

function drawSky(){
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // warm glow behind the skyline, brightest right at the street
  var gl = ctx.createLinearGradient(0, SKY_BASE - 150, 0, SKY_BASE);
  gl.addColorStop(0, "rgba(201,72,10,0)");
  gl.addColorStop(1, "rgba(201,72,10,0.30)");
  ctx.fillStyle = gl;
  ctx.fillRect(0, SKY_BASE - 150, LOGICAL_W, 150);

  var i;
  for (i = 0; i < SKY_FAR.length; i++){
    bldg(SKY_FAR[i][0], SKY_FAR[i][1], SKY_FAR[i][2], "#1a1316", 0.85, i, 0.16);
  }
  for (i = 0; i < LANDMARKS.length; i++){
    var a = bandA(G.street, LANDMARKS[i].from, LANDMARKS[i].to, LANDMARKS[i].fade);
    if (a > 0.01){
      LA = Math.min(1, a);
      LX = LANDMARKS[i].lane < 0 ? 0 : LANE[LANDMARKS[i].lane];
      LANDMARKS[i].draw();
    }
  }
  LA = 1; ctx.globalAlpha = 1;
  for (i = 0; i < SKY_MID.length; i++){
    bldg(SKY_MID[i][0], SKY_MID[i][1], SKY_MID[i][2], "#231a1d", 0.92, i + 50, 0.30);
  }

  ctx.globalAlpha = 0.55; ctx.fillStyle = C.horizon;
  ctx.fillRect(0, SKY_BASE, LOGICAL_W, 3);
  ctx.globalAlpha = 1;
}
/* which landmarks are on screen right now - used by the tests */
function visibleLandmarks(){
  var out = [];
  for (var i = 0; i < LANDMARKS.length; i++){
    var a = bandA(G.street, LANDMARKS[i].from, LANDMARKS[i].to, LANDMARKS[i].fade);
    if (a > 0.01) out.push(LANDMARKS[i].draw.name + "@" + a.toFixed(2));
  }
  return out;
}

/* Draws the trace in the grammar of a ThousandEyes path view: nodes joined by
   links, hop ticks along each link, a pulsing destination, and a packet
   running the route. Branches are drawn behind and dimmer than the main line,
   the way an alternate route reads in the product. */
function traceScreenPts(path){
  var pts = [];
  for (var i = 0; i < path.length; i++){
    var sy = rowScreenY(path[i].r);
    if (sy < HORIZON - 40) continue;
    pts.push([ path[i].c*TILE + TILE*0.5, sy - ROW_H*0.46 ]);
  }
  return pts;
}
/* The trace is green end to end - line, hop ticks, nodes, destination and the
   packet halo. One block so it is a single swap point, the way BRAND is. */
var TRACE = { line:"#35d07f", pale:"#bff3d4", dest:"#19b35f", node:"#0d1a12" };

/* The glow is stacked strokes of the SAME path, not a blur. shadowBlur and
   ctx.filter are both off the table on RoomOS - they are the two things that
   put this canvas on the software rasteriser - so a bloom has to be built out
   of what is cheap: one path, four widths, four alphas. */
var TRACE_GLOW = [[46, 0.055], [31, 0.085], [19, 0.140], [10, 0.230]];

/* Where a fraction k through the polyline lands. */
function tracePointAt(pts, k){
  var span = pts.length - 1;
  var pos = Math.max(0, Math.min(span, k * span));
  var seg = Math.min(span - 1, Math.floor(pos)), f = pos - seg;
  return [ pts[seg][0] + (pts[seg+1][0] - pts[seg][0]) * f,
           pts[seg][1] + (pts[seg+1][1] - pts[seg][1]) * f ];
}
/* The points up to k, with the last one interpolated. The route draws itself
   on from his feet outwards instead of appearing whole, which is what a
   traceroute actually looks like resolving. */
function tracePartial(pts, k){
  if (k >= 1) return pts;
  var span = pts.length - 1, upto = k * span;
  var n = Math.floor(upto), f = upto - n;
  if (n >= span) return pts;
  var out = pts.slice(0, n + 1);
  out.push([ pts[n][0] + (pts[n+1][0] - pts[n][0]) * f,
             pts[n][1] + (pts[n+1][1] - pts[n][1]) * f ]);
  return out;
}
function tracePoly(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
}
/* A hop's latency, derived from the cell so it is stable frame to frame. A
   number that flickers is a number nobody reads, and the point of putting
   them on at all is that a path view without per-hop figures is just a line. */
function hopMs(p){ return 4 + ((p.r * 7 + p.c * 13 + 11) % 46); }

/* One packet and its tail. Seven samples behind the head along the route
   itself rather than a straight streak, so it bends through the corners. */
function drawPacket(mp, k, fade){
  for (var i = 7; i >= 1; i--){
    var kk = k - i * 0.011;
    if (kk < 0) continue;
    var tp = tracePointAt(mp, kk), a = 1 - i / 8;
    ctx.globalAlpha = fade * 0.55 * a * a;
    ctx.fillStyle = TRACE.pale;
    ctx.beginPath(); ctx.arc(tp[0], tp[1], 2.5 + 4.5 * a, 0, Math.PI*2); ctx.fill();
  }
  var h = tracePointAt(mp, k);
  ctx.globalAlpha = fade * 0.30; ctx.fillStyle = TRACE.pale;
  ctx.beginPath(); ctx.arc(h[0], h[1], 15, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = fade * 0.55;
  ctx.beginPath(); ctx.arc(h[0], h[1], 9, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = fade; ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(h[0], h[1], 4.5, 0, Math.PI*2); ctx.fill();
}

function drawTrace(){
  if (G.revealT <= 0 || !G.trace || !G.trace.paths.length) return;
  var fade = Math.min(1, G.revealT / 1.2);
  /* Resolving. The power-up runs for POWERS.path.secs, so the time since it
     landed is what is left subtracted from that; the first six tenths of a
     second of it are spent drawing the route on. */
  var grow = Math.max(0, Math.min(1, (POWERS.path.secs - G.revealT) / 0.6));
  var pulse = 0.5 + 0.5*Math.sin(G.t*4);
  var i, q;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // branches first so the main line sits on top
  for (var pi = G.trace.paths.length - 1; pi >= 0; pi--){
    var main = (pi === 0);
    var path = G.trace.paths[pi];
    var full = traceScreenPts(path);
    if (full.length < 2) continue;
    var pts = tracePartial(full, grow);
    if (pts.length < 2) continue;
    var w = main ? 1 : 0.58;
    var dim = main ? 1 : 0.5;

    tracePoly(pts);
    ctx.strokeStyle = TRACE.line;
    for (i = 0; i < TRACE_GLOW.length; i++){
      ctx.globalAlpha = fade * TRACE_GLOW[i][1] * dim;
      ctx.lineWidth = TRACE_GLOW[i][0] * w;
      ctx.stroke();
    }
    ctx.globalAlpha = fade * 0.95 * dim;
    ctx.lineWidth = 3.4 * w; ctx.strokeStyle = TRACE.pale; ctx.stroke();
    ctx.globalAlpha = fade * 0.85 * dim;
    ctx.lineWidth = 1.5 * w; ctx.strokeStyle = "#ffffff"; ctx.stroke();

    /* A marching dash over the core. Nothing else on the line says the
       traffic is moving rather than the route merely existing. */
    ctx.setLineDash([9 * w, 21 * w]);
    ctx.lineDashOffset = -((G.t * 130) % 30);
    ctx.globalAlpha = fade * 0.60 * dim;
    ctx.lineWidth = 6 * w; ctx.strokeStyle = TRACE.pale; ctx.stroke();
    ctx.setLineDash([]);

    /* The tip, while it is still resolving: a bright head at the live end. */
    if (grow < 1){
      var tip = pts[pts.length - 1];
      ctx.globalAlpha = fade * 0.5; ctx.fillStyle = TRACE.pale;
      ctx.beginPath(); ctx.arc(tip[0], tip[1], 16, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = fade; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(tip[0], tip[1], 6, 0, Math.PI*2); ctx.fill();
    }

    // only the hops the route has actually reached get a node
    var resolved = grow >= 1 ? full.length : Math.max(0, pts.length - 1);
    for (i = 0; i < resolved; i++){
      var x = full[i][0], y = full[i][1];
      var last = main && (i === full.length - 1) && grow >= 1;
      var first = (i === 0);
      var rad = (last ? 17 : (first ? 13 : 11)) * w;

      ctx.globalAlpha = fade * 0.20 * dim;
      ctx.fillStyle = TRACE.line;
      ctx.beginPath(); ctx.arc(x, y, rad + 13, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = fade * 0.95 * dim;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2);
      ctx.fillStyle = last ? TRACE.dest : TRACE.node; ctx.fill();
      ctx.lineWidth = 3 * w;
      ctx.strokeStyle = last ? TRACE.pale : TRACE.line; ctx.stroke();
      if (!last){
        ctx.globalAlpha = fade * 0.9 * dim;
        ctx.beginPath(); ctx.arc(x, y, rad * 0.34, 0, Math.PI*2);
        ctx.fillStyle = TRACE.pale; ctx.fill();
      }

      /* Per-hop latency, every other node, main route only. All of them was
         a wall of numbers over the lanes he still has to cross. */
      if (main && !last && !first && (i % 2 === 1)){
        ctx.globalAlpha = fade * 0.55;
        txt(hopMs(path[i]) + " ms", x + rad + 26, y + 6, 16, TRACE.pale);
      }

      if (first && main){
        ctx.globalAlpha = fade * 0.55;
        txt("ORIGIN", x, y - rad - 14, 15, TRACE.pale);
        // an origin ring that breathes, so the route has two ends
        ctx.globalAlpha = fade * (0.18 + 0.22 * pulse);
        ctx.lineWidth = 2.5; ctx.strokeStyle = TRACE.line;
        ctx.beginPath(); ctx.arc(x, y, rad + 7 + 6 * pulse, 0, Math.PI*2); ctx.stroke();
      }

      if (last){
        // concentric rings leaving the target, three of them out of phase
        for (q = 0; q < 3; q++){
          var kq = (G.t * 0.75 + q / 3) % 1;
          ctx.globalAlpha = fade * 0.40 * (1 - kq);
          ctx.lineWidth = 2.6; ctx.strokeStyle = TRACE.pale;
          ctx.beginPath(); ctx.arc(x, y, rad + 4 + kq * 34, 0, Math.PI*2); ctx.stroke();
        }
        // a crosshair, which is the one mark that says "this is the target"
        ctx.globalAlpha = fade * 0.75; ctx.lineWidth = 2.4;
        ctx.strokeStyle = TRACE.pale;
        ctx.beginPath();
        ctx.moveTo(x - rad - 14, y); ctx.lineTo(x - rad - 5, y);
        ctx.moveTo(x + rad + 5, y);  ctx.lineTo(x + rad + 14, y);
        ctx.moveTo(x, y - rad - 14); ctx.lineTo(x, y - rad - 5);
        ctx.moveTo(x, y + rad + 5);  ctx.lineTo(x, y + rad + 14);
        ctx.stroke();
        // the total, which is the figure the product puts in the corner
        var tot = 0;
        for (q = 0; q < path.length; q++) tot += hopMs(path[q]);
        ctx.globalAlpha = fade * 0.75;
        txt("TARGET  \u00B7  " + tot + " ms  \u00B7  " + path.length + " hops",
            x, y - rad - 20, 17, TRACE.pale);
      }
    }
  }

  // packets run the main route, three of them, once it has resolved
  var mp = traceScreenPts(G.trace.paths[0]);
  if (mp.length >= 2 && grow >= 1){
    for (q = 0; q < 3; q++) drawPacket(mp, (G.t * 0.5 + q / 3) % 1, fade);
  }

  /* The headline. The route is not just drawn, it is the claim - this is
     the one to take - and a line on its own does not say that.

     It hangs off the BOTTOM of the route, under his feet, not the top. At
     the far end it sat straight on top of the destination's own readout,
     which is the one label on the whole trace carrying a figure. Down here
     there is nothing but pavement behind it. Clamped inboard and off the
     HUD so it never hangs over an edge. */
  /* It does not stay up for the whole fourteen seconds. The claim is worth
     making once; after that it is a sign standing in the road. Half the
     reveal, and the last two of those seconds it fades out reading
     TE-ADDON instead - the badge signs off with who did it rather than
     simply vanishing. */
  var age = POWERS.path.secs - G.revealT;
  var bLife = POWERS.path.secs * 0.5, bTail = 2;
  if (mp.length >= 2 && grow > 0.35 && age < bLife){
    var tail = Math.max(0, (age - (bLife - bTail)) / bTail);   // 0..1 over the last two
    var top = mp[0];
    var lab = tail > 0 ? "TE-ADDON" : "BEST PATH!";
    ctx.font = 'bold 30px "Helvetica Neue",Helvetica,Arial,sans-serif';
    var lw2 = ctx.measureText(lab).width + 46;
    var bx = Math.max(lw2/2 + 16, Math.min(LOGICAL_W - lw2/2 - 16, top[0]));
    var by = Math.min(LOGICAL_H - 170, top[1] + 74);
    var bob = Math.sin(G.t * 3) * 4;
    var bA = fade * (1 - tail);
    ctx.globalAlpha = bA * 0.92;
    plate(bx - lw2/2, by - 28 + bob, lw2, 52, "rgba(6,22,14,0.90)", 12);
    rr(bx - lw2/2, by - 28 + bob, lw2, 52, 12);
    ctx.strokeStyle = TRACE.line; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.globalAlpha = bA * (0.72 + 0.28 * pulse);
    txt(lab, bx, by + 8 + bob, 30, TRACE.pale);
  }
  ctx.globalAlpha = 1;
}

/* green-and-white street sign on the corner of every crossing */
function drawStreetSign(row, sy){
  if (!row.streetNo) return;
  var label = "W " + row.streetNo + " ST";
  var y = sy - ROW_H - 26;
  if (y < HORIZON || y > LOGICAL_H - 40) return;
  ctx.font = 'bold 19px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var w = ctx.measureText(label).width + 30;
  plate(12, y - 15, w, 30, C.signGreen, 5);
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5;
  rr(14, y - 13, w - 4, 26, 4); ctx.stroke();
  txt(label, 12 + w/2, y + 1, 19, "#f2f7f4");
  if (!isTwoWay(row.streetNo)){
    plate(12 + w + 8, y - 13, 62, 26, "#141013", 4);
    txt(row.dir > 0 ? "ONE WAY ▶" : "◀ ONE WAY", 12 + w + 39, y + 1, 11, C.textDim);
  } else {
    plate(12 + w + 8, y - 13, 62, 26, "#141013", 4);
    txt("TWO WAY", 12 + w + 39, y + 1, 11, C.amber);
  }
}

function drawWorld(){
  var lo = Math.floor(G.camRow) - ROWS_BEHIND, hi = Math.floor(G.camRow) + ROWS_AHEAD;
  var r, row, sy, i;

  /* Clip the whole world to below the horizon. Without this a tall vehicle in
     the farthest row paints up over the skyline and appears to float in the
     sky; the ground strips are culled at HORIZON but a bus is 150px tall. */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HORIZON, LOGICAL_W, LOGICAL_H - HORIZON); ctx.clip();

  for (r = hi; r >= lo; r--){
    row = rows[r]; if (!row) continue;
    sy = rowScreenY(r);
    if (sy < HORIZON || sy - ROW_H > LOGICAL_H) continue;
    var strip = row.park ? (row.type === "safe" ? S.grass : S.parkPath)
                         : (row.type === "safe" ? S.walk0
                                                : (r % 2 ? S.road1 : S.road0));
    ctx.drawImage(strip.img, 0, sy - ROW_H, LOGICAL_W, ROW_H + 2);

    // motorcade warning: the whole street flashes before it clears
    if (row.type === "sweep" && row.phase === "warn"){
      var f = Math.sin(row.t * 16) > 0;
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = f ? "#ff3b5c" : "#3bb0ff";
      ctx.fillRect(0, sy - ROW_H, LOGICAL_W, ROW_H);
      ctx.globalAlpha = 1;
    }
  }

  drawRisk();

  var pp = playerPos();
  for (r = hi; r >= lo; r--){
    row = rows[r]; if (!row) continue;
    sy = rowScreenY(r);
    if (sy < HORIZON - 60 || sy - ROW_H > LOGICAL_H + 80) continue;

    if (row.type === "safe"){
      /* Before the props, so a hot dog stand stands in front of them. */
      if (row.folk && S.folk){
        for (i=0;i<row.folk.length;i++){
          var fk = row.folk[i];
          blit(S.folk[fk.seed % FOLK_N],
               folkX(fk)*TILE + TILE*0.5 + FOLK_Y*SKEW,
               sy - FOLK_Y*ROW_H - folkLift(fk));
        }
      }
      for (i=0;i<row.props.length;i++){
        var pr2 = row.props[i];
        if (pr2.kind === "kiosk"){ drawKiosk(pr2.col, sy, pr2.used); continue; }
        blit(S["pr_"+pr2.kind], pr2.col*TILE, sy);
      }
      if (row.pickup){
        if (row.pickup.kind === "tam") drawTamPickup(row.pickup.col, sy);
        else {
          var bob = Math.sin(G.t*2.6 + row.pickup.col) * 7;
          blit(S["pw_"+row.pickup.kind], row.pickup.col*TILE, sy - 10 - bob);
          drawPickupLabel(row.pickup.kind, row.pickup.col, sy - bob);
        }
      }
      /* And what anybody is saying goes on last, so a hot dog stand cannot
         sit on top of the words. */
      if (row.folk){
        for (i=0;i<row.folk.length;i++) drawFolkSay(row.folk[i], sy);
      }
    } else {
      // a lane turned around by a trace drives, and faces, the other way
      var faceR = (row.dir * (row.rv || 1)) > 0;
      var sprite = S[(row.skin || row.kind) + (faceR ? "_r" : "_l")];
      for (i=0;i<row.cars.length;i++){
        var x = carX(row, row.cars[i]);
        if (x + (row.eff||1) < -1.6 || x > COLS + 1.6) continue;
        var ysw = sy + (row.cars[i].sw || 0);      // steering round the player
        if (row.cars[i].uber >= 0){
          blit(S["uber" + row.cars[i].uber + (faceR ? "_r" : "_l")], x*TILE, ysw);
        } else if (row.packN > 1){
          for (var q=0;q<row.packN;q++){
            blit(sprite, (x + q*(HAZ[row.kind].w + row.packGap))*TILE, ysw);
          }
        } else blit(sprite, x*TILE, ysw);
      }
      /* The double-parked truck goes LAST, and at the kerb rather than on
         the lane centre. It used to be drawn first, on the centre line, so
         every car in the row drove straight over the top of it - which is
         the one thing a parked truck never does. Dropping it PARK_KERB px
         toward the camera puts it in the parking lane and lets the traffic
         pass on the far side of it, which is what is actually happening.

         20px is inside the range the lane already moves things through: a
         car swerving round the player travels up to SWERVE_PX, 26. */
      for (i=0;i<row.parked.length;i++){
        blit(S.boxtruck_r, row.parked[i].col*TILE, sy + PARK_KERB);
      }
      if (row.rogue){
        var rx = rogueX(row);
        if (rx + HAZ.ebike.w > -1.6 && rx < COLS + 1.6){
          blit(S["ebike" + (row.dir > 0 ? "_l" : "_r")], rx*TILE, sy);
        }
      }
      /* One sign per crossing, on the far lane - the one with pavement behind
         it. Every lane drawing its own put four identical "42" signs stacked
         up the screen on a four-lane crossing. */
      var beyond = rows[r+1];
      if (!beyond || beyond.type === "safe") drawStreetSign(row, sy);
    }

  }

  /* The route and the man who is walking it go on top of the traffic, not
     into it. Both used to be painted in depth order: the trace went down
     before any vehicle, so the line you are being told is safe was buried
     under the cars crossing it, and the player was tucked into his own row,
     so a car in the lane he had just left was drawn over him and he looked
     like he was wading through it.

     Strict depth is the more correct answer and the worse one. These two are
     the things the player is actually reading. */
  drawTrace();
  /* He stays on screen through the hold, so you can see what hit him. */
  if (G.state !== ST_DEAD || G.deadFor < DEATH_HOLD){ drawPlayer(pp); drawEatOverlay(); }
  if (G.booth && G.state !== ST_DEAD) drawBooth(pp);

  if (G.state === ST_DEAD){
    for (i=0;i<G.parts.length;i++){
      var p = G.parts[i];
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2));
      if (p.bill){ drawBill(p); continue; }
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* One note, tumbling. The flip is faked with a horizontal squash - cos of
   the angle takes it edge-on and back again - which is the whole reason it
   reads as paper rather than as a green square. The pale panel and the dark
   centre only go on while the note is wide enough for them to be more than
   one pixel; edge-on it is a bare sliver, which is correct. */
function drawBill(p){
  var w = p.s, h = p.s*0.56;
  var fl = Math.abs(Math.cos(p.rot*0.8)) * 0.86 + 0.14;
  var bw = w*fl;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot*0.3);
  ctx.fillStyle = p.c;
  ctx.fillRect(-bw/2, -h/2, bw, h);
  if (bw > 7){
    ctx.fillStyle = "#d4ead6";
    ctx.fillRect(-bw/2 + 1.4, -h/2 + 1.4, bw - 2.8, h - 2.8);
    ctx.fillStyle = p.c;
    ctx.fillRect(-bw*0.13, -h*0.19, bw*0.26, h*0.38);
  }
  ctx.restore();
}

/* The TAM is the headline SKU, so it is staged rather than just placed: a
   beam of light up into the sky band (visible from several blocks away), a
   glow pool on the pavement, two pulsing rings, rising sparks, and the brand
   mark floating above it. All of it is live per-frame work, but only while a
   TAM is actually on screen - typically one pickup, a few dozen fills. */
/* Every pickup names itself. A coloured letter on a cube taught a first-time
   player nothing, and on a shared device most plays are a first play. */
/* Terminals get the same floating label the pickups do, so it is obvious they
   are usable and not just scenery. */
/* The terminal is the best thing you can walk into on the whole pavement -
   a route and a hundred and fifty thousand - and it was drawn like a parking
   meter with a caption. It gets the TAM's staging now, in its own colour: a
   beam into the sky band so you can see it coming from blocks away, a pool
   and two rings on the ground, and a card that says what it is worth rather
   than only what it is called.

   The sparks climbing out of it are the TRACE green, not the amber. They are
   a preview of the thing it hands you, and they are the only green on the
   street until you take it. */
function drawKiosk(col, sy, used){
  var cx = col*TILE + TILE*0.5, ground = sy - ROW_H*0.46;
  if (used){                                   // spent: a box on the pavement
    ctx.globalAlpha = 0.4;
    blit(S.pr_kiosk, col*TILE, sy);
    ctx.globalAlpha = 1;
    return;
  }
  var phase = col * 1.7, pul = 0.5 + 0.5*Math.sin(G.t*2.6 + phase), i;
  var bob = Math.sin(G.t*2.1 + phase) * 9;

  ctx.save();
  ctx.translate(cx, ground);
  ctx.globalAlpha = 0.74 + 0.26*pul;
  ctx.fillStyle = addonBeamGrad;
  ctx.fillRect(-44, -300, 88, 300);
  ctx.globalAlpha = 0.28 + 0.22*pul;
  ctx.fillRect(-13, -300, 26, 300);
  ctx.restore();

  ctx.globalAlpha = 0.20 + 0.14*pul; ctx.fillStyle = C.pw3;
  ctx.beginPath();
  ctx.ellipse(cx, ground, 52 + 8*pul, 20 + 3*pul, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.lineWidth = 3;
  for (i = 0; i < 2; i++){
    var ph = (G.t*0.6 + i*0.5) % 1;
    ctx.globalAlpha = (1 - ph) * 0.55;
    ctx.strokeStyle = i ? TRACE.line : C.pw3;
    ctx.beginPath();
    ctx.ellipse(cx, ground, 25 + ph*44, 9 + ph*17, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  blit(S.pr_kiosk, col*TILE, sy - bob);

  // packets leaving the pack, in the colour of the route it hands you
  ctx.fillStyle = TRACE.pale;
  for (i = 0; i < 6; i++){
    var t = ((G.t*0.5) + i/6) % 1;
    var sz = 8 - t*4;
    ctx.globalAlpha = (1 - t) * 0.85;
    ctx.fillRect(cx + Math.sin(i*2.3 + G.t*0.7) * 26 - sz/2,
                 ground - 70 - t*120 - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;

  /* The eye over the top of it, exactly as the TAM has, and then the card
     over the eye. Everything is stacked up the screen from the ground now
     rather than measured down from the row: the card used to be pinned
     182px above sy, which is where the box is, and the two of them sat on
     top of each other. */
  var eyeY = ground - 128 - bob * 0.6;
  ctx.globalAlpha = 0.88 + 0.12*pul;
  drawEye(cx, eyeY, 23 + 3*pul, C.pw3, "#2a1400", C.brand);
  ctx.globalAlpha = 1;
  drawKioskLabel(col, eyeY - 34, bob);
}

/* `botY` is where the BOTTOM of the card goes, so it can be stacked above
   whatever is under it rather than guessing a clearance. */
function drawKioskLabel(col, botY, bob){
  var cx = col*TILE + TILE*0.5, top = botY - 76 + bob * 0.4;
  if (top < HORIZON - 6 || top > LOGICAL_H - 40) return;
  var pulse = 0.80 + 0.20*Math.sin(G.t*3 + col);
  ctx.font = 'bold 22px "Helvetica Neue",Helvetica,Arial,sans-serif';
  var w = ctx.measureText("TE-ADDON PACK").width + 44;
  ctx.globalAlpha = pulse;
  plate(cx - w/2, top, w, 76, "rgba(8,5,3,0.90)", 9);
  rr(cx - w/2, top, w, 76, 9);
  ctx.strokeStyle = C.pw3; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = C.pw3; ctx.fillRect(cx - w/2, top, 5, 76);
  txt("TE-ADDON PACK", cx + 2, top + 26, 22, C.pw3);
  txt("+" + cash(ADDON_BONUS) + "   \u00B7   BEST PATH",
      cx + 2, top + 58, 19, C.good);
  ctx.globalAlpha = 1;
}

function drawPickupLabel(kind, col, sy){
  var k = POWERS[kind];
  if (!k) return;
  var cx = col*TILE + TILE*0.5, y = sy - 132;
  if (y < HORIZON + 10 || y > LOGICAL_H - 30) return;
  ctx.font = 'bold 15px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textAlign = "center";
  var w = ctx.measureText(k.name).width + 28;
