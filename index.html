<script>
"use strict";
/* ============================================================================
   THE LAST MILE  —  Penn 1 to the meeting, uptown through Midtown.
   A ThousandEyes / Cisco-sales game for Cisco RoomOS devices.

   DESIGN NOTE ON OBSTACLES
     Earlier versions labelled generic cars with objections ("NO BUDGET" on a
     money truck). The label did all the work and taught the player nothing.
     Here every hazard is a real Midtown hazard whose BEHAVIOUR already is the
     sales obstacle: the M34 stops at every block the way a PO sits in
     procurement; the sanitation truck is enormous and already full; the
     carriage is ancient and somehow still allowed. Vehicles carry real
     signage, and the sales parallel lands on the death screen, where a player
     is actually reading.

   GEOGRAPHY
     You walk north. Each road row is a numbered cross street starting at 35th.
     Midtown cross streets are one-way and alternate direction, so lane
     direction is derived from the real street grid (even = eastbound).
     34th / 42nd / 57th are two-way, generated as paired rows with opposite
     directions - the wide dangerous ones land where a Penn 1 seller expects.

   RENDERER
     Cabinet projection with a small camera yaw; every cuboid shows three faces
     (top / front / right) from one light direction plus an emissive rim.
       screenX = x*TILE + y*SKEW
       screenY = -(y*ROW_H) - (z*ZH)
     Models are built from small cuboids and BAKED once into offscreen
     canvases, so a frame is ~50 drawImage blits rather than ~2000 polygon
     fills. Rim lights, multi-pass glow and contact shadows are all bake-time.

   CONSTRAINTS (RoomOS WebEngine)
     canvas 2D only - no WebGL, no filter/blur/shadowBlur at runtime, no
     external assets, no network calls, touch-first, DPR capped, bake capped at
     1:1 to keep sprite memory near 6MB, instant restart.

   POWER-UPS
     Four common ThousandEyes capabilities, plus the TAM as the headline tier:
     5 seconds of flight, and unlike every other power-up it does not expire -
     once engaged it keeps paying out another 2 seconds every 8-14s,
     announcing something a real TAM actually did. Flight is the only thing in
     the game that ignores both traffic and solid props, so the landing is
     handled carefully (see landFromFlight) and total flight is capped.

     The TAM pickup is staged rather than just placed - beam, glow pool,
     rings, sparks and the brand mark overhead (see drawTamPickup) - so it
     reads as the premium item from several blocks away.

   ?fps=1   perf overlay
   ?safe=1  guest-safe mode: network hazards instead of sales objections
   ?mute=1  deploy silent
   Palette is a stand-in until official brand assets are approved.
   ========================================================================= */

/* ---------------------------------------------------------------- geometry */
var LOGICAL_W = 1920, LOGICAL_H = 1080;
var COLS = 16, TILE = LOGICAL_W / COLS;
var ROW_H = 72, SKEW = 27, ZH = 100;
/* The player sits low on screen so there is room for both a real skyline and
   enough readable rows ahead. Raising BASE_Y buys lookahead for free, where
   weakening the haze would have cost the horizon fade. */
/* Messages sit above the horizon so they never cover the road; chips sit
   below the player, over rows already crossed. */
var MSG_Y = 134, CHIP_Y = 892;
var BASE_Y = 858, HORIZON = 250;   // rows are culled above this; sky above it
var SKY_BASE = 254;                // skyline baseline, just under the cull line
var PAD = 4, SPAN = COLS + PAD * 2;
var ROWS_AHEAD = 15, ROWS_BEHIND = 6;
var HOP_MS = 135, DOLLARS_PER_ROW = 15000;   // row 70 ~= $1.05M

var SHOW_FPS  = /[?&]fps=1/.test(location.search);
var SAFE_MODE = /[?&]safe=1/.test(location.search);

/* ================================================================= BRAND ===
   Every ThousandEyes colour in the game resolves from this one block. The HUD,
   street grid, power-ups, kiosks, shield ring, stage banners, title and death
   screen all derive from it, so dropping the official hexes in here reskins
   the whole game in one edit.

   THESE ARE APPROXIMATIONS. They were picked to read correctly as a family on
   a dark Board at ten feet; they are NOT taken from an official brand sheet,
   because I have no way to verify the real values from here. Replace them.

   p1..p4 are the four power-up colours. They walk a red-orange -> gold ramp so
   the set reads as one branded family while staying tellable apart at a
   glance, and all four are light enough to carry dark text in the HUD chips. */
var BRAND = {
  core:  "#ff6a13",   // primary ThousandEyes orange
  deep:  "#c9480a",   // darker step: horizon, depth, environment glow
  light: "#ffa552",
  pale:  "#ffd9b8",   // warm near-white, for body copy on dark
  amber: "#ffc23d",
  p1:    "#ff5a1f",   // ENDPOINT AGENT
  p2:    "#ff8c2b",   // INTERNET INSIGHTS
  p3:    "#ffc23d",   // PATH VISUALIZATION
  p4:    "#ffe08a",   // EXECUTIVE SPONSOR
  p5:    "#fff0bd",   // TAM - brightest in the ramp, it is the premium tier
  cisco: "#00bceb"    // Cisco cyan, used once, for the attribution line
};

/* ------------------- palette: Midtown at dusk, ThousandEyes orange --------
   The ground stays neutral-dark and only warms toward the horizon. Orange is
   a warm hue, so it reads loudest against a cool/neutral field - warming the
   asphalt too would have muted the thing the brand is carried by. */
var C = {
  sky0:"#0a0708", sky1:"#161014", sky2:"#2a1b16",
  horizon:BRAND.deep,
  walk:"#9a999d",                           // one flat light grey, no banding
  grass:"#3c7a46", grassB:"#346b3e",        // the park, ten blocks of it
  parkPath:"#3b3a37", parkEdge:"#57544d",
  curb:"#423630",
  road:"#0c0c0e", roadB:"#111113",          // asphalt
  lane:"#c9b24a",                            // NYC yellow lane line - stays
  laneGlow:"rgba(201,178,74,0.16)",
  gridGlow:"rgba(255,106,19,0.10)", gridCore:"rgba(255,106,19,0.36)",
  amber:BRAND.amber, amberGlow:"rgba(255,140,43,0.14)",
  brand:BRAND.core, brandDeep:BRAND.deep, brandLight:BRAND.light,
  brandPale:BRAND.pale, cisco:BRAND.cisco,
  pw1:BRAND.p1, pw2:BRAND.p2, pw3:BRAND.p3, pw4:BRAND.p4, pw5:BRAND.p5,
  signGreen:"#1f6b4a",                       // real NYC street-sign green
  good:"#8fe388", danger:"#ff4f7e",
  text:"#fdf4ee", textDim:"rgba(253,244,238,0.58)",
  ink:"rgba(10,6,4,0.76)"
};

/* ======================================================= procedural audio */

   requirements for a shared RoomOS device:
     1. The AudioContext is created inside a real user gesture (autoplay
        policy); nothing is touched until the first tap.
     2. If Web Audio is missing or throws, `failed` latches and every call
        becomes a no-op. The game must behave identically with no audio at all.
     3. Low master gain and no music bed - this lives in an office hallway
        next to rooms that are in calls.
   Mute persists; ?mute=1 forces silence for a whole deployment. */

    /* ROCKEFELLER - a slow waltz for the rink. Three beats to the bar, a bell

/* ------------------------------------------------------------------ canvas */
var cv = document.getElementById("c");
var ctx = cv.getContext("2d", { alpha:false });
var scale = 1, BAKE = 1, ready = false;
var skyGrad = null, hazeGrad = null, tamBeamGrad = null, addonBeamGrad = null;

function layout(){
  var vw = window.innerWidth || LOGICAL_W, vh = window.innerHeight || LOGICAL_H;
  var sFit = Math.min(vw / LOGICAL_W, vh / LOGICAL_H), s = sFit;
  /* A screen wider than 16:9 fits with bars down both sides. The world uses
     every one of its 1920 columns but only y=40..1040 of its height, so
     growing to fill the width and letting the spare vertical margin crop is
     free - capped at 6% of overflow, which keeps the top message row and the
     bottom chip row inside the frame on any screen. Cropping horizontally is
     never allowed: that would eat playable columns. */
  var sFill = vw / LOGICAL_W;
  if (sFill > sFit && sFill * LOGICAL_H <= vh * 1.06) s = sFill;
  var cssW = Math.max(1, Math.floor(LOGICAL_W * s));
  var cssH = Math.max(1, Math.floor(LOGICAL_H * s));
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  cv.style.left = Math.floor((vw - cssW) / 2) + "px";
  cv.style.top  = Math.floor((vh - cssH) / 2) + "px";
  cv.width = Math.floor(cssW * dpr); cv.height = Math.floor(cssH * dpr);

  scale = (cssW * dpr) / LOGICAL_W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.textBaseline = "middle";

  skyGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
  skyGrad.addColorStop(0, C.sky0);
  skyGrad.addColorStop(0.40, C.sky1);
  skyGrad.addColorStop(1, C.sky2);

  /* Street-level haze, and it earns its keep three ways: it hides the hard
     line where ground rows are culled, it veils the flat top of a tall vehicle
     clipped at the horizon, and it gives distance. Strong early then decaying
     fast, so as many near rows as possible stay fully readable. */
  hazeGrad = ctx.createLinearGradient(0, HORIZON - 16, 0, HORIZON + 230);
  hazeGrad.addColorStop(0,    "rgba(32,21,19,0.96)");
  hazeGrad.addColorStop(0.22, "rgba(32,21,19,0.80)");
  hazeGrad.addColorStop(0.55, "rgba(32,21,19,0.34)");
  hazeGrad.addColorStop(1,    "rgba(32,21,19,0)");

  // capped at 1:1 so sprite memory stays near 6MB on a 4K Board. HUD text
  // still renders at full device resolution; only sprites are upscaled.
  /* Beam gradient for the TAM pickup. Gradients are transformed by the CTM,
     so this is defined at the origin and translated into place per pickup. */
  tamBeamGrad = ctx.createLinearGradient(0, 0, 0, -360);
  tamBeamGrad.addColorStop(0,    "rgba(255,240,189,0.34)");
  tamBeamGrad.addColorStop(0.35, "rgba(255,170,60,0.16)");
  tamBeamGrad.addColorStop(1,    "rgba(255,170,60,0)");
  /* The terminal gets its own, shorter and in the path amber. Same trick,
     same reason: a gradient is transformed by the CTM, so it is built at the
     origin and translated into place. */
  addonBeamGrad = ctx.createLinearGradient(0, 0, 0, -300);
  addonBeamGrad.addColorStop(0,    "rgba(255,217,135,0.30)");
  addonBeamGrad.addColorStop(0.35, "rgba(255,194,61,0.15)");
  addonBeamGrad.addColorStop(1,    "rgba(255,194,61,0)");

  var nb = Math.max(0.5, Math.min(1, scale));
  /* Mid-burst, take the new scale but hold the re-bake. The settled call that
     follows does it once. */
  if (!ready || Math.abs(nb - BAKE) > 0.02){
    BAKE = nb;
    if (ready && !reflowT) bakeAll();
  }
}
/* ------------------------------------------------------------ full screen */
var fsBtn = document.getElementById("fs");
function fsNow(){
  return document.fullscreenElement || document.webkitFullscreenElement ||
         document.msFullscreenElement || null;
}
function fsCan(){
  var d = document.documentElement;
  return !!(d.requestFullscreen || d.webkitRequestFullscreen || d.msRequestFullscreen);
}
function fsToggle(){
  var d = document.documentElement;
  try {
    if (fsNow()){
      var exit = document.exitFullscreen || document.webkitExitFullscreen ||
                 document.msExitFullscreen;
      if (exit){ var r = exit.call(document); if (r && r.catch) r.catch(function(){}); }
    } else {
      var req = d.requestFullscreen || d.webkitRequestFullscreen ||
                d.msRequestFullscreen;
      if (req){ var q = req.call(d); if (q && q.catch) q.catch(function(){}); }
    }
  } catch (e) {}
}
function fsSync(){
  fsBtn.lastChild.textContent = fsNow() ? "EXIT FULL SCREEN" : "FULL SCREEN";
  layout();                      // the viewport just changed size
}
if (fsCan()){
  fsBtn.className = "on";
  /* The canvas owns "tap anywhere to step forward", so the button has to stop
     its own click from reaching it - otherwise going full screen also moves. */
  fsBtn.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); AUDIO.ui(); fsToggle();
  });
  fsBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  document.addEventListener("fullscreenchange", fsSync);
  document.addEventListener("webkitfullscreenchange", fsSync);
  document.addEventListener("msfullscreenchange", fsSync);
}

/* Resize fires in bursts - a panel bringing up its own UI can send a dozen in
   a second - and layout() re-bakes all 96 sprites whenever the scale moves far
   enough. At 1:1 that is thirteen megabytes of canvas allocated and thrown
   away per burst. The view still follows immediately; only the re-bake waits
   for the resizing to stop. */
var reflowT = null;
function onReflow(){
  layout();
  if (reflowT) clearTimeout(reflowT);
  reflowT = setTimeout(function(){ reflowT = null; layout(); }, 180);
}
window.addEventListener("resize", onReflow);
window.addEventListener("orientationchange", onReflow);

/* ------------------------------------------------------- voxel draw kernel */
function proj(x, y, z){ return [ x * TILE + y * SKEW, -(y * ROW_H) - z * ZH ]; }

function shade(hex, amt){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  if (amt > 0){ r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  else        { r *= (1+amt);     g *= (1+amt);     b *= (1+amt); }
  function h2(v){ v = Math.max(0, Math.min(255, v|0)).toString(16); return v.length<2 ? "0"+v : v; }
  return "#" + h2(r) + h2(g) + h2(b);
}
function quad(g, a, b, c, d, col){
  g.beginPath();
  g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.lineTo(d[0],d[1]);
  g.closePath(); g.fillStyle = col; g.fill();
}
function glowLine(g, a, b, col, core){
  g.lineCap = "round";
  g.globalAlpha = 0.18; g.lineWidth = 9; g.strokeStyle = col;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  g.globalAlpha = 0.34; g.lineWidth = 5;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
  g.globalAlpha = 1;    g.lineWidth = 2; g.strokeStyle = core || col;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
}
function glowRect(g, x, y, w, h, col, core){
  g.globalAlpha = 0.14; g.fillStyle = col; g.fillRect(x-4, y-4, w+8, h+8);
  g.globalAlpha = 0.30;                    g.fillRect(x-2, y-2, w+4, h+4);
  g.globalAlpha = 1;    g.fillStyle = core || col; g.fillRect(x, y, w, h);
}
/* three visible faces; the left face is provably hidden at this yaw */
function cuboid(g, p){
  var x0=p.x, x1=p.x+p.w, y0=p.y, y1=p.y+p.d, z0=p.z, z1=p.z+p.h;
  quad(g, proj(x1,y0,z0), proj(x1,y1,z0), proj(x1,y1,z1), proj(x1,y0,z1), shade(p.c,-0.40));
  quad(g, proj(x0,y0,z1), proj(x1,y0,z1), proj(x1,y1,z1), proj(x0,y1,z1), shade(p.c, 0.18));
  quad(g, proj(x0,y0,z0), proj(x1,y0,z0), proj(x1,y0,z1), proj(x0,y0,z1), p.c);
  if (p.emit){
    glowLine(g, proj(x0,y0,z1), proj(x1,y0,z1), p.c, shade(p.c, 0.70));
  } else if (p.rim !== false && p.w > 0.12){
    var a = proj(x0,y0,z1), b = proj(x1,y0,z1);
    g.globalAlpha = 0.55; g.lineWidth = 2; g.strokeStyle = shade(p.c, 0.58);
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    g.globalAlpha = 1;
  }
}
function decal(g, d){
  var a = proj(d.x, d.y, d.z + d.h), b = proj(d.x + d.w, d.y, d.z);
  if (d.glow) glowRect(g, a[0], a[1], b[0]-a[0], b[1]-a[1], d.bg, d.core || d.bg);
  else { g.fillStyle = d.bg; g.fillRect(a[0], a[1], b[0]-a[0], b[1]-a[1]); }
  if (d.text){
    g.fillStyle = d.fg;
    g.font = "bold " + (d.size||20) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    g.textAlign = "center";
    g.fillText(d.text, (a[0]+b[0])/2, (a[1]+b[1])/2 + 1, (b[0]-a[0]) * 0.9);
  }
}
function bake(model){
  var pad = 14, minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9, i, a, b, c, p, q;
  function acc(pt){
    if (pt[0]<minX) minX=pt[0]; if (pt[0]>maxX) maxX=pt[0];
    if (pt[1]<minY) minY=pt[1]; if (pt[1]>maxY) maxY=pt[1];
  }
  var sh = null;
  if (model.shadow !== false){
    var x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
    for (i=0;i<model.parts.length;i++){
      p = model.parts[i];
      if (p.z > 0.25) continue;
      if (p.x < x0) x0 = p.x; if (p.x+p.w > x1) x1 = p.x+p.w;
      if (p.y < y0) y0 = p.y; if (p.y+p.d > y1) y1 = p.y+p.d;
    }
    if (x1 > x0){
      var ctr = proj((x0+x1)/2, (y0+y1)/2, 0);
      sh = { cx:ctr[0], cy:ctr[1], rx:(x1-x0)*TILE*0.54, ry:Math.max(6,(y1-y0)*ROW_H*0.46) };
      acc([sh.cx-sh.rx, sh.cy-sh.ry]); acc([sh.cx+sh.rx, sh.cy+sh.ry]);
    }
  }
  for (i=0;i<model.parts.length;i++){
    p = model.parts[i];
    var xs=[p.x,p.x+p.w], ys=[p.y,p.y+p.d], zs=[p.z,p.z+p.h];
    for (a=0;a<2;a++) for (b=0;b<2;b++) for (c=0;c<2;c++) acc(proj(xs[a],ys[b],zs[c]));
  }
  if (model.decals) for (i=0;i<model.decals.length;i++){
    q = model.decals[i];
    acc(proj(q.x, q.y, q.z)); acc(proj(q.x+q.w, q.y, q.z+q.h));
  }
  var lw = (maxX-minX)+pad*2, lh = (maxY-minY)+pad*2;
  var off = document.createElement("canvas");
  off.width  = Math.max(1, Math.ceil(lw*BAKE));
  off.height = Math.max(1, Math.ceil(lh*BAKE));
  var g = off.getContext("2d");
  g.setTransform(BAKE, 0, 0, BAKE, (-minX+pad)*BAKE, (-minY+pad)*BAKE);
  g.textBaseline = "middle"; g.lineJoin = "round";
  if (sh){
    g.globalAlpha = 0.34; g.fillStyle = "#000";
    g.beginPath(); g.ellipse(sh.cx, sh.cy, sh.rx, sh.ry, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;
  }
  var parts = model.parts.slice().sort(function(u,v){
    return (v.y+v.d) - (u.y+u.d) || u.z - v.z;
  });
  for (i=0;i<parts.length;i++) cuboid(g, parts[i]);
  if (model.decals) for (i=0;i<model.decals.length;i++) decal(g, model.decals[i]);
  return { img:off, ox:(-minX+pad), oy:(-minY+pad), w:lw, h:lh };
}
function blit(s, sx, sy){ ctx.drawImage(s.img, sx - s.ox, sy - s.oy, s.w, s.h); }
function blitScaled(s, sx, sy, kx, ky){
  ctx.drawImage(s.img, sx - s.ox*kx, sy - s.oy*ky, s.w*kx, s.h*ky);
}
function P(x,y,w,d,z,h,c){ return { x:x, y:y, w:w, d:d, z:z, h:h, c:c }; }
function E(x,y,w,d,z,h,c){ return { x:x, y:y, w:w, d:d, z:z, h:h, c:c, emit:true }; }
function flip(model, W){
  function fx(o){ var r={}; for (var k in o) r[k]=o[k]; r.x = W - o.x - o.w; return r; }
  return { parts:model.parts.map(fx), decals:(model.decals||[]).map(fx), shadow:model.shadow };
}

  parts.push(P(1.24, 0.42, 0.11, 0.11, 0, 0.25, TYRE));
  return { parts:parts, decals:[], W:1.55 };
}

/* ----------------------------------------------------------- model: player */
/* Luminance steps between adjacent parts or the figure blobs:
   trousers 0.21 -> shirt 0.47 -> skin 0.74, dark collar between the two. */
/* SHARED PROPORTIONS
   The first pass gave both figures a head about a third of their height and
   nearly as wide as the torso, which made them read as blocks with a beige box
   on top. Head is now ~17% of height, there is a neck, the legs are longer and
   the shoulders are wider than the hips.

   Body depth is kept shallow (y+d = 0.58) for a second reason: the painter
   sort is far-edge-first, so the cape must sit at a greater y than the torso.
   The shallower the torso, the closer the cape can sit behind it, and the less
   the projection shoves the cape up the screen. */
/* `shielded` is the Endpoint Agent look: blue blazer and sunglasses. Only the
   jacket, shoulders, sleeves and lapels change colour - the trousers stay dark,
   the way a blazer actually differs from the rest of a suit. */
/* He wears his health on his face. The reactions - chewing, the sad one for a
   cart that has nothing left - still win, but the resting face now says where
   he is: pleased above 75, level to 50, going downhill to 25, and finished
   below that.

   FACE_SAD is the reaction and keeps its angled brows; FACE_MEH is the resting
   version of the same idea, which has to be milder or a man on 60% health
   looks as if something has just gone wrong. */
var FACE_SMILE = 1, FACE_CHEW = 2, FACE_SAD = 3, FACE_WORN = 4,
    FACE_FLAT = 5, FACE_MEH = 6, FACE_OK = 7;
var HP_HAPPY = 75, HP_LEVEL = 50;
/* `shielded` is a LEVEL now, not a flag: 0 bare, 1 the blue Endpoint blazer
   and sunglasses, 2 the purple coat with the hat and the cane. The old
   boolean still works at the call sites that pass one, because 1 is truthy
   and true coerces to 1. */
function playerModel(dir, shielded, face){
  var skin = "#e9b98c";
  var HAIR = "#2b1d14";
  var lvl = shielded === true ? 1 : (shielded | 0);
  var suit = lvl >= 2 ? BLAZER2 : (lvl ? BLAZER : "#232f44");
  var suitDark = lvl >= 2 ? "#4e2375" : "#19222f";
  var parts = [
    P(0.28, 0.46, 0.16, 0.13, 0,     0.06,  "#12151a"),      // shoes
    P(0.56, 0.46, 0.16, 0.13, 0,     0.06,  "#12151a"),
    P(0.30, 0.45, 0.17, 0.14, 0.05,  0.29,  suitDark),       // trouser legs
    P(0.53, 0.45, 0.17, 0.14, 0.05,  0.29,  suitDark),
    P(0.24, 0.42, 0.52, 0.16, 0.33,  0.26,  suit),           // jacket
    P(0.21, 0.41, 0.58, 0.17, 0.53,  0.09,  shade(suit,0.07)),// shoulders, wider
    P(0.16, 0.45, 0.08, 0.12, 0.34,  0.21,  shade(suit,-0.24)),// sleeves
    P(0.76, 0.45, 0.08, 0.12, 0.34,  0.21,  shade(suit,-0.24)),
    P(0.42, 0.44, 0.16, 0.14, 0.615, 0.04,  shade(skin,-0.30)),// neck
    /* 0.200 tall. It was 0.145, then 0.170, and this is the third pass at
       the same problem: the eyes sit at 0.742-0.766 and the mouth is below
       them, so the only place a forehead can come from is above the eyes,
       and the only way to get more of it is a taller skull. Every bit of
       the extra 5.5px goes up there - a minifig keeps its head that way
       anyway, and at 31px wide against 20 tall it is still wider than it is
       high. */
    P(0.37, 0.43, 0.26, 0.15, 0.655, 0.200, skin),           // head
    /* Parts are sorted on their BACK edge, y+d, and ties are broken by z.
       The hair used to reach 0.59 against the head's 0.58, which made it one
       step further away and put it behind him - a dark slab hanging off the
       back of his skull. Matching the head's back edge drops it onto the z
       tiebreak, and a higher z is what "on top" means here.

       It is a moulded cap rather than a block of hair, and it is cut short
       and swept back: a thin crown sitting ON the skull rather than over the
       brow, and a sideburn down each side. One colour throughout, so the
       cuboid shading is the only thing separating the faces - which is what
       makes a minifig's hair read as a piece clicked on rather than paint.

       The crown is flush with the front of the head (0.424 against 0.430 is
       a sixth of a pixel) on purpose. Standing it forward gave a lit ledge
       over the brow and the whole thing read as a board balanced on him; a
       flush front leaves one crisp horizontal hairline instead.

       And the hairline is at 0.848 against a skull that stops at 0.855, so
       there is no fringe at all: the forehead is the whole 0.766-0.848
       band, 8.2px of it, against 5.2 at the last size and 1.4 when the hair
       still came down to 0.78. The sideburns are what stop that reading as
       a receding hairline - they run from the hairline past the eye line,
       so the hair is short, not absent. */
    P(0.362, 0.424, 0.276, 0.156, 0.848, 0.048, HAIR),       // the crown
    P(0.362, 0.424, 0.024, 0.156, 0.730, 0.118, HAIR),       // sideburns
    P(0.614, 0.424, 0.024, 0.156, 0.730, 0.118, HAIR)
  ];
  parts.push(P(dir > 0 ? 0.82 : 0.05, 0.46, 0.15, 0.13, 0.17, 0.14, "#17202c"));
  var dec = [
    { x:0.405, y:0.42, w:0.19, z:0.33,  h:0.25,  bg:"#f4f7fa" },   // shirt
    { x:0.455, y:0.42, w:0.09, z:0.33,  h:0.21,  bg:C.brand },     // tie
    { x:0.44,  y:0.42, w:0.12, z:0.565, h:0.035, bg:"#ffffff" },   // collar
    { x:0.30,  y:0.42, w:0.10, z:0.35,  h:0.22,  bg:shade(suit,0.10) },
    { x:0.60,  y:0.42, w:0.10, z:0.35,  h:0.22,  bg:shade(suit,0.10) }
  ];
  if (lvl >= 2){
    /* The hat. A brim wide enough to read at this size, a tall crown, a band
       and one feather - and the cane in his outside hand, which is the hand
       the projection shows. Both are parts rather than decals so the painter
       sort puts them in front of and behind him correctly. */
    var felt = "#6a2fa0", band = "#2a1540", gold = "#e8c558";
    /* Every piece shares the head's back edge of 0.58, so they sort against
       it on z alone and stack upwards instead of standing behind him. The
       brim is allowed to reach further FORWARD - smaller y - because that is
       the only direction a brim can overhang without going behind his head. */
    parts.push(P(0.275, 0.40, 0.45, 0.18, 0.904, 0.032, felt));        // brim
    parts.push(P(0.360, 0.43, 0.28, 0.15, 0.936, 0.100, shade(felt, 0.10))); // crown
    parts.push(P(0.360, 0.43, 0.28, 0.15, 0.936, 0.026, band));        // hatband
    parts.push(P(0.600, 0.43, 0.05, 0.15, 1.024, 0.075, gold));        // the feather
    var cx2 = dir > 0 ? 0.845 : 0.11;
    parts.push(P(cx2, 0.455, 0.035, 0.05, 0.02, 0.46, "#2b1a12"));    // the cane
    parts.push(P(cx2 - 0.012, 0.45, 0.06, 0.06, 0.47, 0.045, gold));  // its head
  }
  if (lvl){
    /* Two separate lenses with skin showing between them and a narrow bridge
       at eye height. One continuous bar across the face read as a visor. */
    dec.push({ x:0.378, y:0.43, w:0.104, z:0.704, h:0.052, bg:"#0a0d12" });  // L lens
    dec.push({ x:0.518, y:0.43, w:0.104, z:0.704, h:0.052, bg:"#0a0d12" });  // R lens
    dec.push({ x:0.378, y:0.43, w:0.104, z:0.752, h:0.013, bg:"#39434f" });  // L frame
    dec.push({ x:0.518, y:0.43, w:0.104, z:0.752, h:0.013, bg:"#39434f" });  // R frame
    dec.push({ x:0.482, y:0.43, w:0.036, z:0.734, h:0.014, bg:"#39434f" });  // bridge
    dec.push({ x:0.390, y:0.43, w:0.034, z:0.726, h:0.018, bg:"#6f93bd" });  // glints
    dec.push({ x:0.530, y:0.43, w:0.034, z:0.726, h:0.018, bg:"#6f93bd" });
  }
  /* Eating puts a face on him rather than a bubble over his head. Baked as a
     sprite variant instead of painted on in screen space, because then the
     projection places the mouth on the face for free - the head sits at
     y=0.43, the same plane the sunglasses use, and guessing at a screen offset
     would have drifted the moment anything about the camera changed.

     The curve is three rects: the middle one lower than its ends. At this size
     that reads as a smile and an arc would not survive the voxel grid. */
  /* Three expressions, all drawn on the same plane as the sunglasses (y=0.43),
     all baked as sprite variants so the projection places them for free. The
     eyes are shared; only the mouth changes, which is what makes the chew read
     as the same man rather than a different sprite.

     The step between the ends and the middle of a curved mouth has to be worth
     about 3px on a head 14.5px tall, or the three rects line up and read as a
     straight bar. The first attempt used a 1.3px step and did exactly that. */
  if (face){
    if (!lvl){
      var eyeZ = face === FACE_SAD ? 0.738 : 0.742;
      if (face === FACE_WORN){
        // half shut: wider and flatter, sitting low, under a heavy brow
        dec.push({ x:0.414, y:0.43, w:0.042, z:0.734, h:0.013, bg:"#241a12" });
        dec.push({ x:0.546, y:0.43, w:0.042, z:0.734, h:0.013, bg:"#241a12" });
        dec.push({ x:0.410, y:0.43, w:0.046, z:0.756, h:0.012, bg:"#2b1f16" });
        dec.push({ x:0.544, y:0.43, w:0.046, z:0.756, h:0.012, bg:"#2b1f16" });
      } else {
        dec.push({ x:0.420, y:0.43, w:0.030, z:eyeZ, h:0.024, bg:"#241a12" });
        dec.push({ x:0.552, y:0.43, w:0.030, z:eyeZ, h:0.024, bg:"#241a12" });
      }
      if (face === FACE_SAD){
        // brows angled in, the only thing that stops a frown reading as a pout
        dec.push({ x:0.414, y:0.43, w:0.034, z:0.772, h:0.013, bg:"#2b1f16" });
        dec.push({ x:0.554, y:0.43, w:0.034, z:0.766, h:0.013, bg:"#2b1f16" });
      }
    }
    if (face === FACE_SMILE){
      dec.push({ x:0.448, y:0.43, w:0.026, z:0.706, h:0.018, bg:"#6d3b2a" });
      dec.push({ x:0.474, y:0.43, w:0.052, z:0.682, h:0.018, bg:"#6d3b2a" });
      dec.push({ x:0.526, y:0.43, w:0.026, z:0.706, h:0.018, bg:"#6d3b2a" });
    } else if (face === FACE_OK){
      /* Fine. Not pleased - the full smile is what he does when he has just
         eaten, and wearing it for the whole top half of the health bar made a
         man walking to a meeting look delighted about nothing. This is the
         flat mouth with about a pixel of lift at the ends, and no cheeks. */
      dec.push({ x:0.452, y:0.43, w:0.028, z:0.698, h:0.017, bg:"#6d3b2a" });
      dec.push({ x:0.478, y:0.43, w:0.046, z:0.692, h:0.017, bg:"#6d3b2a" });
      dec.push({ x:0.522, y:0.43, w:0.028, z:0.698, h:0.017, bg:"#6d3b2a" });
    } else if (face === FACE_FLAT){
      // a level mouth and nothing else going on
      dec.push({ x:0.452, y:0.43, w:0.096, z:0.694, h:0.017, bg:"#6d3b2a" });
    } else if (face === FACE_MEH){
      // the same three rects as the frown, with half the step in them
      dec.push({ x:0.450, y:0.43, w:0.028, z:0.690, h:0.017, bg:"#6d3b2a" });
      dec.push({ x:0.476, y:0.43, w:0.048, z:0.701, h:0.017, bg:"#6d3b2a" });
      dec.push({ x:0.522, y:0.43, w:0.028, z:0.690, h:0.017, bg:"#6d3b2a" });
    } else if (face === FACE_CHEW){
      // jaw down: a taller, narrower mouth, with the lower lip below it
      dec.push({ x:0.462, y:0.43, w:0.076, z:0.676, h:0.042, bg:"#5a2c1e" });
      dec.push({ x:0.470, y:0.43, w:0.060, z:0.680, h:0.024, bg:"#3d1b12" });
      dec.push({ x:0.462, y:0.43, w:0.076, z:0.668, h:0.010, bg:"#b8745c" });
    } else if (face === FACE_WORN){
      /* Running on empty. The mouth hangs open to breathe, the brows go flat
         and heavy, and there is colour in the face that is nothing to do with
         being pleased about anything. */
      dec.push({ x:0.466, y:0.43, w:0.068, z:0.676, h:0.030, bg:"#5a2c1e" });
      dec.push({ x:0.472, y:0.43, w:0.056, z:0.680, h:0.018, bg:"#3d1b12" });
      dec.push({ x:0.372, y:0.43, w:0.036, z:0.702, h:0.030, bg:"#d08a74" });
      dec.push({ x:0.592, y:0.43, w:0.036, z:0.702, h:0.030, bg:"#d08a74" });
    } else {
      // the frown: the same three rects with the middle RAISED instead
      dec.push({ x:0.448, y:0.43, w:0.026, z:0.684, h:0.018, bg:"#6d3b2a" });
      dec.push({ x:0.474, y:0.43, w:0.052, z:0.706, h:0.018, bg:"#6d3b2a" });
      dec.push({ x:0.526, y:0.43, w:0.026, z:0.684, h:0.018, bg:"#6d3b2a" });
    }
    if (face === FACE_SMILE || face === FACE_CHEW){
      // a little colour in the cheeks, so it is not only the mouth that moved
      dec.push({ x:0.386, y:0.43, w:0.028, z:0.706, h:0.022, bg:"#e09a7e" });
      dec.push({ x:0.586, y:0.43, w:0.028, z:0.706, h:0.022, bg:"#e09a7e" });
    }
  }
  return { parts:parts, decals:dec, shadow:false, W:1 };
}

/* TAM engaged: the suit comes off. Orange rather than red, T rather than S.

   Making the cape read took three things:
   1. A RED-ORANGE cape against the bright orange suit. The first attempt used
      a dark shade of the same orange and read as shadow, not fabric.
   2. FLARE: narrow at the collar, widest at the hem, so the silhouette says
      cape rather than slab.
   3. The hem drops to NEGATIVE z. Depth projects upward here, so a cape at the
      torso's depth with its hem at ground level floats ~16px above the boots.
      Letting it hang below the ground plane puts the hem back at the feet. */
function heroModel(dir, flying){
  var skin = "#e9b98c";
  var suit = "#ff7a1f", trim = "#d14a09";
  var cape = "#c22d08", capeIn = "#9d2206";
  var parts = [];

  /* Only the parts of the cape WIDER than the body are ever visible - the
     torso occludes the middle. So every section is wider than the body part it
     sits behind (shoulders span 0.19-0.81, chest 0.23-0.77, legs 0.30-0.70),
     which leaves a continuous red band down each side that widens toward the
     hem. The previous collar was narrower than the shoulders and so was
     invisible, leaving two disconnected panels that read as crates. */
  if (flying){
    /* Each row of depth pushes a part 72px UP the screen, so a cape trailed
       backwards at constant height climbs over the head - which is exactly
       what the first version did, reading as a mane. Dropping z by ~0.72 per
       unit of y cancels that; dropping it slightly faster makes the cape
       trail away and down, which is what a cape in flight does. */
    parts.push(P(0.10, 0.59, 0.80, 0.12, 0.42, 0.16, cape));
    parts.push(P(0.06, 0.70, 0.88, 0.12, 0.34, 0.15, capeIn));
    parts.push(P(0.09, 0.81, 0.82, 0.12, 0.26, 0.14, cape));
    parts.push(P(0.16, 0.92, 0.68, 0.11, 0.18, 0.12, capeIn));
    parts.push(P(0.26, 1.02, 0.48, 0.10, 0.11, 0.10, cape));
    parts.push(P(0.36, 1.11, 0.28, 0.09, 0.05, 0.08, capeIn));
  } else {
    // a real triangular flare: narrow at the collar, full width at the hem
    parts.push(P(0.15, 0.59, 0.70, 0.05, 0.46, 0.17, cape));      // collar
    parts.push(P(0.10, 0.60, 0.80, 0.05, 0.26, 0.21, capeIn));    // upper
    parts.push(P(0.05, 0.61, 0.90, 0.05, 0.08, 0.19, cape));      // lower
    parts.push(P(0.02, 0.62, 0.96, 0.05, -0.05, 0.14, capeIn));   // hem
  }

  parts.push(P(0.28, 0.46, 0.17, 0.13, 0,     0.15,  trim));      // tall boots
  parts.push(P(0.55, 0.46, 0.17, 0.13, 0,     0.15,  trim));
  parts.push(P(0.30, 0.45, 0.17, 0.14, 0.14,  0.19,  suit));      // legs
  parts.push(P(0.53, 0.45, 0.17, 0.14, 0.14,  0.19,  suit));
  parts.push(P(0.29, 0.44, 0.42, 0.15, 0.31,  0.08,  trim));      // trunks
  parts.push(P(0.23, 0.42, 0.54, 0.16, 0.38,  0.24,  suit));      // chest
  parts.push(P(0.22, 0.41, 0.56, 0.17, 0.55,  0.09,  shade(suit,0.08))); // shoulders
  if (flying){
    /* Arms up. Standing with his hands at his sides and a cape on is a man
       in a costume; both fists over the head is the one silhouette that
       reads as flight at this size and at this angle.

       They sit a hair nearer the camera than the shoulders - back edge 0.57
       against 0.58 - so they pass in FRONT of him rather than behind, and
       they clear the head on both sides, which spans 0.37 to 0.63. */

function foodValue(kind){ return HP_FOOD[kind] || 0; }
/* What it costs, and how many times the same stand will serve you. A hot dog

var FOOD_PRICE = { pizza:5, hotdog:3, bagel:7 };

function foodPrice(kind){ return FOOD_PRICE[kind] || 0; }
function foodSpent(pr){ return (pr.served || 0) >= (FOOD_SERVES[pr.kind] || 1); }

/* What a given hazard actually costs, worked out from what it is rather than
   set by hand. Damage scales with the WIDTH of the thing and the square root
   of its speed: a bus crushing you slowly is worse than a cab clipping you
   quickly, so size leads and speed is deliberately sub-linear. The yellow cab

/* ------------------------------------------------------------ ground strips */
function bakeStrip(kind, alt){
  var h = ROW_H + 2;
  var off = document.createElement("canvas");
  off.width = Math.ceil(LOGICAL_W*BAKE); off.height = Math.ceil(h*BAKE);
  var g = off.getContext("2d");
  g.setTransform(BAKE, 0, 0, BAKE, 0, 0);

  if (kind === "walk"){
    /* One tone for every pavement. The old alternating pair banded the whole
       walk uptown into light/dark stripes, which read as a pattern in the
       world rather than as concrete. */
    g.fillStyle = C.walk;
    g.fillRect(0, 0, LOGICAL_W, h);
    // concrete paver joints - dark now, since white vanishes on light grey
    g.strokeStyle = "rgba(0,0,0,0.13)"; g.lineWidth = 2;
    g.beginPath();
    for (var j=0;j<=COLS;j++){ g.moveTo(j*TILE, 0); g.lineTo(j*TILE, h); }
    g.moveTo(0, h*0.5); g.lineTo(LOGICAL_W, h*0.5);
    g.stroke();
    // amber streetlight pools
    for (var p=0;p<5;p++) glowRect(g, 180+p*400, h*0.1, 240, h*0.8, C.amberGlow, "rgba(255,176,46,0.05)");
    // the curb: raised lip on the street side
    g.fillStyle = C.curb;              g.fillRect(0, h-9, LOGICAL_W, 6);
    g.fillStyle = "rgba(255,255,255,0.10)"; g.fillRect(0, h-9, LOGICAL_W, 2);
    g.fillStyle = "rgba(0,0,0,0.45)";  g.fillRect(0, h-3, LOGICAL_W, 3);
    glowRect(g, 0, 0, LOGICAL_W, 2, C.gridGlow, C.gridCore);
  } else if (kind === "grass"){
    g.fillStyle = C.grass; g.fillRect(0, 0, LOGICAL_W, h);
    // mown patchwork, then tufts, so it is not a flat green bar
    for (var m = 0; m < 26; m++){
      g.fillStyle = (m % 2) ? C.grassB : shade(C.grass, 0.06);
      g.fillRect((m * 149) % LOGICAL_W, (m % 3) * (h / 3), 96, h / 3);
    }
    g.fillStyle = "rgba(0,0,0,0.16)";
    for (var t = 0; t < 120; t++){
      g.fillRect((t * 97 + (t % 5) * 13) % LOGICAL_W, (t * 29) % h, 3, 7);
    }
    g.fillStyle = "rgba(255,255,255,0.05)";
    for (var t2 = 0; t2 < 90; t2++){
      g.fillRect((t2 * 131 + 40) % LOGICAL_W, (t2 * 37 + 9) % h, 2, 5);
    }
    // soft kerb where the grass meets the path, not a concrete lip
    g.fillStyle = shade(C.grass, -0.30); g.fillRect(0, h-7, LOGICAL_W, 5);
    g.fillStyle = "rgba(0,0,0,0.35)";    g.fillRect(0, h-3, LOGICAL_W, 3);
  } else if (kind === "parkPath"){
    g.fillStyle = C.parkPath; g.fillRect(0, 0, LOGICAL_W, h);
    // gravel, and pale edging instead of painted lanes
    g.fillStyle = "rgba(255,255,255,0.055)";
    for (var v = 0; v < 240; v++){
      g.fillRect((v * 83 + (v % 7) * 11) % LOGICAL_W, (v * 53) % h, 3, 3);
    }
    g.fillStyle = "rgba(0,0,0,0.22)";
    for (var v2 = 0; v2 < 140; v2++){
      g.fillRect((v2 * 109 + 31) % LOGICAL_W, (v2 * 67 + 5) % h, 4, 2);
    }
    g.fillStyle = C.parkEdge; g.fillRect(0, 2, LOGICAL_W, 4);
    g.fillRect(0, h - 8, LOGICAL_W, 4);
    g.fillStyle = "rgba(0,0,0,0.40)"; g.fillRect(0, h - 4, LOGICAL_W, 4);
  } else {
    g.fillStyle = alt ? C.roadB : C.road;
    g.fillRect(0, 0, LOGICAL_W, h);
    g.fillStyle = "rgba(255,255,255,0.014)";
    g.fillRect(0, h*0.24, LOGICAL_W, h*0.14);
    g.fillRect(0, h*0.62, LOGICAL_W, h*0.14);
    // crosswalk ladder stripes - tells you this is a place you cross
    g.fillStyle = "rgba(235,242,250,0.085)";
    for (var x=0;x<LOGICAL_W;x+=TILE) g.fillRect(x+16, 4, TILE-32, h-10);
    g.fillStyle = "#1a222c"; g.fillRect(0, 0, LOGICAL_W, 3);
    g.fillStyle = "rgba(0,0,0,0.50)"; g.fillRect(0, h-3, LOGICAL_W, 3);
    for (var d=14;d<LOGICAL_W;d+=112) glowRect(g, d, h*0.48, 54, 3, C.laneGlow, C.lane);
  }
  return { img:off, ox:0, oy:0, w:LOGICAL_W, h:h };
}

/* ------------------------------------------------------------- world build */
var rows = {};
var genCursor = 0, roadRun = 0, safeRun = 0, lastPower = 0, lastTam = -99, nextStreet = START_ST + 1;
var curStreet = START_ST, curLane = 0;
/* +1 walking uptown to the meeting, -1 carrying the signed PO back to Penn 1.
   The player always walks UP the screen; what reverses is the city around him,
   so the street numbers count down and every landmark comes back in the
   opposite order for free - they are keyed on the street number, not on
   distance travelled. */
var legDir = 1;
/* On the way back he is facing downtown, so the whole grid is mirrored: a
   street that ran left-to-right on the way up runs right-to-left now. */
function laneDir(no){ return streetDir(no) * legDir; }
var lastSweep = -99, prevWasSafe = true;

/* MIN_WINDOW is the shortest time a column may stay clear. A hop is 135ms, so
   0.60s leaves room to read the gap and commit. MAX_SPEED keeps traffic
   trackable by eye on a Board at ten feet. */
var MIN_WINDOW = 0.60, MAX_SPEED = 6.2, SWEEP_SPEED = 16;

function difficulty(r){
  var t = Math.min(1, r/150);
  return { speed:1.5 + 3.1*t, gap:5.6 - 2.9*t, group:1 + Math.floor(Math.min(3.9, 1 + r/26)) };
}

/* Blocker columns, used by BOTH sidewalk props and parked trucks.
   A player at (R,c) is pinned when forward, left and right are all blocked:
     interior c -> needs blockers at c-1 AND c+1, i.e. two exactly 2 apart
     c = 0      -> needs a blocker at column 1
     c = COLS-1 -> needs a blocker at column COLS-2
   Minimum separation of 3 plus never using columns 1 and COLS-2 makes both
   unreachable, for any row type, with no backtracking required. Without this,
   generation soft-locked roughly 1 run in 4. */
var BLOCK_COLS = (function(){
  var a = []; for (var c=0;c<COLS;c++) if (c!==1 && c!==COLS-2) a.push(c); return a;
})();
var MIN_SEP = 3;
function placeBlockers(n, seed){
  var chosen = seed ? seed.slice() : [], tries = 0, taken = chosen.length;
  while (chosen.length < n && tries++ < 40){
    var col = BLOCK_COLS[(Math.random()*BLOCK_COLS.length)|0], ok = true;
    for (var j=0;j<chosen.length;j++){
      if (Math.abs(chosen[j]-col) < MIN_SEP){ ok = false; break; }
    }
    if (ok) chosen.push(col);
  }
  return chosen.slice(taken);        // only the ones added here
}

function pickFleet(r, park){
  /* Inside the park nothing has an engine: a carriage, a pedicab, or people. */
  if (park) return ["carriage","rickshaw","rickshaw","crowd","crowd"][(Math.random()*5)|0];
  if (r < 8) return "cab";                           // tutorial: one type, slow
  var pool = ["cab","cab","parcel"];
  if (r > 14) pool.push("bus","suv");
  if (r > 26) pool.push("dsny","ebike","cab");
  if (r > 40) pool.push("carriage","crowd","bus");
  if (r > 60) pool.push("crowd","dsny","ebike");
  return pool[(Math.random()*pool.length)|0];
}

function makeRoad(r, streetNo, dir){
  var park = inPark(streetNo);
  var d = difficulty(r), kind = pickFleet(r, park), spec = HAZ[kind];
  /* Two lanes of the same thing should not run at the same pace. The spread
     was +-15%, which is not enough to see; it is +-28% now. The crossing
     guarantee below adapts on its own - the gap is expressed in TIME, so a
     faster lane is given a proportionally bigger one. */
  var speed = Math.min(MAX_SPEED, d.speed * spec.spd * (0.72 + Math.random()*0.56));

  /* A pack is placed as one super-vehicle so the minimum-gap guarantee still
     holds; the riders are drawn inside its footprint. */
  var packN = spec.pack || 1, packGap = 0.42;
  var eff = packN * spec.w + (packN - 1) * packGap;

  /* The gap has to be expressed in TIME, not tiles. Ramping speed up while
     ramping the tile gap down compounds: at depth the e-bike hit ~9 tiles/s
     against a 2.7 tile gap, which left zero landable columns on 75% of
     sampled instants. Requiring gap >= speed * MIN_WINDOW keeps the crossing
     window at any column from ever falling below MIN_WINDOW seconds, which
     only binds at high speed - mid-game spacing is unchanged. */
  var gap = Math.max(d.gap, speed * MIN_WINDOW);
  var n = Math.max(1, Math.floor(SPAN / (eff + gap)));
  var slot = SPAN / n, cars = [];
  for (var i=0;i<n;i++){
    cars.push({ uber: (kind === "cab" && Math.random() < 0.34) ? ((Math.random()*4)|0) : -1,
                p: i*slot + Math.random()*(slot-eff)*0.5,
                /* Each driver has his own foot. Within a lane this is small -
                   +-14% - because the one in front sets the pace anyway; it is
                   enough to stop a row looking like a conveyor belt. */
                k: 0.86 + Math.random()*0.28,
                stop: spec.stops ? (Math.random()*5.2) : 0 });
  }

  var row = { type:"road", streetNo:streetNo, dir:dir, speed:speed, kind:kind,
              cars:cars, eff:eff, packN:packN, packGap:packGap,
              parked:[], blocked:{}, rogue:null, rv:1, bounce:0, halt:0, park:park,
              /* Which livery this row wears. Only buses differ; everything
                 else falls back to the one sprite for its kind. */
              skin: kind === "bus"
                    ? ("bus" + ((Math.random()*BUS_ROUTES.length)|0)) : null };

  /* Double-parked box truck: a permanent blocker you route around.
     It is 2 tiles wide, so it blocks BOTH columns it covers - otherwise the
     player could legally step into the second one and die on arrival. A
     contiguous 2-wide run cannot satisfy the min-separation rule, so the
     invariant here is the more general one it was protecting: never leave a
     single free column with blocked neighbours on both sides, and keep
     columns 1 and COLS-2 free. Exactly one truck, starting in [2, COLS-4],
     satisfies both with gaps of >= 2 on each side. */
  if (r > 20 && Math.random() < 0.22){
    var tc = 2 + ((Math.random() * (COLS - 5)) | 0);     // 2 .. COLS-4
    row.parked.push({ col:tc });
    row.blocked[tc] = true;
    row.blocked[tc + 1] = true;
  }
  /* One wrong-way delivery bike, against the posted direction. It is an EXTRA
     hazard on top of the fleet, so it only rides slower fleets - adding it to
     fast traffic stacked two tight windows on one row. */
  if (r > 24 && spec.spd <= 1.2 && Math.random() < 0.26){
    row.rogue = { p: Math.random()*SPAN,
                  speed: Math.min(MAX_SPEED, d.speed * HAZ.ebike.spd * 1.05) };
  }
  return row;
}

/* Motorcade row: empty, then warning lights, then the street is gone.
   Generation requires a sidewalk immediately south so retreat always exists. */
function makeSweep(r, streetNo, dir){
  // absolute speed, not difficulty-scaled: the scaled version reached 29
  // tiles/s, which crossed the screen faster than the eye tracks
  return { type:"sweep", streetNo:streetNo, dir:dir, kind:"motorcade",
           phase:"idle", t:0, idleFor:3.4 + Math.random()*3.2,
           cars:[], parked:[], blocked:{}, rogue:null, speed:SWEEP_SPEED };
}

function makeWalk(r, park){
  var props = [], blocked = {}, chosen = [];
  /* Frontage goes down first and is seeded into the separation list, because a
     building at column 0 plus a prop at column 2 would strand column 1 between
     two blockers - exactly the pin the placement rules exist to prevent. */
  /* Trees at the park edge, buildings everywhere else. A tower in the middle
     of Central Park reads as a bug, which is what it was. */
  var edge = park ? ["tree","tree2"] : FACADE_KINDS;
  var edgeOdds = park ? 0.62 : 0.34;
  if (r >= 6 && Math.random() < edgeOdds){
    var side = Math.random() < 0.5 ? 0 : COLS-1;
    blocked[side] = true; chosen.push(side);
    props.push({ col:side, kind:edge[(Math.random()*edge.length)|0] });
    if (Math.random() < (park ? 0.55 : 0.28)){
      var other = side === 0 ? COLS-1 : 0;
      blocked[other] = true; chosen.push(other);
      props.push({ col:other, kind:edge[(Math.random()*edge.length)|0] });
    }
  }
  if (r >= 5){
    var n = [1,1,2,2,3][(Math.random()*5)|0];
    var cols = placeBlockers(n, chosen), hasSub = false;
    for (var i=0;i<cols.length;i++){
      blocked[cols[i]] = true;
      /* One entrance per pavement. Subway is weighted twice in the pool and
         each prop draws independently, so a three-prop sidewalk could come up
         with three staircases to the same station - re-roll until it is
         something else. */
      /* No station entrances in the park - you are inside it, they are all
         around the edge. */
      var kinds = park ? PARK_PROPS : PROP_KINDS;
      var pk = kinds[(Math.random()*kinds.length)|0];
      for (var g=0; g<8 && pk === "subway" && hasSub; g++){
        pk = kinds[(Math.random()*kinds.length)|0];
      }
      if (pk === "subway"){ if (hasSub) pk = "newsstand"; else hasSub = true; }
      props.push({ col:cols[i], kind:pk });
    }
  }
  var pickup = null;
  /* Pickups land more often now. Metrocards were already 62% of the pool and
     could not get meaningfully more common by taking a bigger share - the
     ceiling is how often a pickup spawns at all. Raising the density lifts
     every power-up's absolute rate, which is what doubling actually needs. */
  if (r >= 7 && r - lastPower >= 6 && Math.random() < 0.48){
    for (var t=0;t<14;t++){
      var pc = (Math.random()*COLS)|0;
      if (!blocked[pc]){
        // the TAM is the rare drop, gated by its own long cooldown
        var kind = (legDir > 0 && r > 7 && r - lastTam >= TAM_COOLDOWN_ROWS &&
                    Math.random() < TAM_CHANCE)
                   ? "tam" : POWER_POOL[(Math.random()*POWER_POOL.length)|0];
        if (kind === "tam") lastTam = r;
        pickup = { col:pc, kind:kind };
        lastPower = r; break;
      }
    }
  }
  /* Nought to two people on the pavement, walking. They carry no state: the
     position is `x0 + v * G.t` wrapped, so nothing has to be stepped and a
     row that scrolls off and comes back is in the same place it would have
     been. They are purely the city - they block nothing and collide with
     nothing, because they are at the back of the pavement and he walks in
     front of them. */
  var folk = [];
  if (r >= 4){
    var nf = [0,1,1,2,2][(Math.random()*5)|0];
    for (var fq = 0; fq < nf; fq++){
      folk.push({ x0: Math.random() * COLS,
                  v: (Math.random() < 0.5 ? -1 : 1) * (0.14 + Math.random()*0.26),
                  seed: (Math.random()*9999)|0 });
    }
  }
  return { type:"safe", park:!!park, props:props, blocked:blocked,
           pickup:pickup, folk:folk };
}

/* whatever is standing in a cell, or null */
function propAt(row, col){
  if (!row || !row.props) return null;
  for (var i = 0; i < row.props.length; i++)
    if (row.props[i].col === col) return row.props[i].kind;
  return null;
}

/* the kind of food cart standing in a cell, or null */
/* Returns the PROP, not the kind, because the caller has to be able to mark
   it eaten. One cart, one meal: walking into a stand is a free move - the step
   was already refused - so without this you could stand next to a hot dog cart
   tapping into it and never run out of stamina again. */
/* A cart that has already served him. Distinguished from "not food at all"
   because walking into the two should not feel the same. */
function eatenFoodAt(row, col){
  if (!row || !row.props) return false;
  for (var i = 0; i < row.props.length; i++){
    var pr = row.props[i];
    if (pr.col !== col) continue;
    if ((pr.kind === "bagel" || pr.kind === "pizza" || pr.kind === "hotdog") &&
        foodSpent(pr)) return true;
  }
  return false;
}
function foodPropAt(row, col){
  if (!row || !row.props) return null;
  for (var i = 0; i < row.props.length; i++){
    var pr = row.props[i];
    if (pr.col !== col || foodSpent(pr)) continue;
    if (pr.kind === "bagel" || pr.kind === "pizza" || pr.kind === "hotdog") return pr;
  }
  return null;
}

/* He has the paper. Everything ahead of him was generated counting up, so it
   is thrown away and regenerated counting down - the city he walked through is
   now the city he has to walk back. Only rows he has not reached are dropped,
   and the scene has the world frozen while this runs. */
function turnBack(){
  legDir = -1;
  /* Strictly past him. Keeping two rows left the one in front of his face
     holding the number it was given on the way up. */
  var keep = G.maxRow + 1;
  for (var r = keep; r < genCursor; r++) delete rows[r];
  genCursor = keep;
  var tail = rows[keep - 1];
  prevWasSafe = !tail || tail.type === "safe";
  safeRun = prevWasSafe ? 1 : 0;
  roadRun = prevWasSafe ? 0 : 1;
  /* Count down from where he is standing, not from the constant. They are
     the same street in every ordinary run, but if anything ever does put him
     past 81 the walk home still starts next door instead of jumping. */
  curStreet = Math.max(START_ST, streetAt(G.maxRow));
  curLane = 0;
  nextStreet = Math.max(START_ST, curStreet - 1);
  lastSweep = -99;
  ensureRows(G.maxRow + ROWS_AHEAD);
}

function pushRow(row){ rows[genCursor++] = row; }

function ensureRows(upTo){
  while (genCursor <= upTo){
    var r = genCursor;
    if (r < 3){ pushRow(makeWalk(r, false)); safeRun++; prevWasSafe = true; continue; }

    var d = difficulty(r), wantRoad;
    /* Which street the next road row would belong to: the one being crossed if
       we are mid-crossing, otherwise the one about to start. The park drives
       are two lanes, never the four-lane canyons of Midtown, so the cap has to
       know where the NEXT row lands rather than where the last one did. */
    var upcoming = prevWasSafe ? nextStreet : curStreet;
    var cap = inPark(upcoming) ? 2 : d.group;
    if (roadRun >= cap)      wantRoad = false;
    else if (safeRun >= 3)   wantRoad = true;
    else                     wantRoad = Math.random() < 0.62;

    if (!wantRoad){
      pushRow(makeWalk(r, inPark(curStreet)));
      safeRun++; roadRun = 0; prevWasSafe = true;
      continue;
    }

    /* A street is every lane between one pavement and the next, so the number
       only advances after a sidewalk break. Consecutive road rows are extra
       lanes of the SAME crossing and share its number - walking across four
       lanes of 42nd should not read as crossing 42nd, 43rd, 44th and 45th. */
    if (prevWasSafe){
      curStreet = nextStreet;
      /* Penn 1 is the end of the return leg, so the numbers stop there rather
         than walking off into Chelsea. */
      nextStreet = legDir > 0 ? nextStreet + 1
                              : Math.max(START_ST, nextStreet - 1);
      curLane = 0;
    }
    else curLane++;
    var no = curStreet;

    // motorcade only on bigger streets, never back to back, and only with a
    // sidewalk behind it so stepping back is always possible
    if (no >= 40 && !inPark(no) && prevWasSafe && (no - lastSweep) >= 6 && Math.random() < 0.15){
      pushRow(makeSweep(r, no, laneDir(no)));
      lastSweep = no; roadRun = 99; safeRun = 0; prevWasSafe = false;
      continue;
    }

    /* One-way streets run every lane the same way. Two-way streets alternate
       lane by lane, which is what makes 42nd and 57th the dangerous ones. */
    var dir = isTwoWay(no) ? (curLane % 2 ? -legDir : legDir) : laneDir(no);
    pushRow(makeRoad(r, no, dir));
    roadRun++; safeRun = 0; prevWasSafe = false;
  }
}
function pruneRows(below){ for (var k in rows) if (+k < below) delete rows[k]; }
function carX(row, car){ return (row.dir > 0 ? car.p : SPAN - car.p) - PAD; }

/* Nothing in a lane may sit inside anything else in it.
   Every vehicle in a lane shares a speed, so left alone they hold their
   spacing forever - but two things broke that. A bus halts on its own cycle
   while the one behind keeps rolling, and a path trace used to spin one car
   around inside the stream. Both drove straight through a neighbour.
   After everything has moved, each vehicle is pushed back to at least a
   vehicle length behind whatever is directly in front of it, which turns a
   stopped bus into a queue instead of a collision. Spawn order is position
   order and stays that way, so "in front" is just the next index around the
   loop - no sorting, and two passes are enough to settle a full chain.
   n * (eff + gap) <= SPAN by construction at spawn, so the clamp can never
   chase its own tail. */
function separate(row){
  var cars = row.cars, n = cars.length;
  if (n < 2) return;
  var clear = (row.eff || 1) + 0.14;
  if (n * clear >= SPAN) return;
  var fwd = (row.rv || 1) > 0, pass, k, i, j, d;
  for (pass = 0; pass < 2; pass++){
    for (k = 0; k < n; k++){
      // i is the follower, j is whatever is directly ahead of it
      i = fwd ? (n - 2 - k + n * 2) % n : k % n;
      j = fwd ? (i + 1) % n : (i - 1 + n) % n;
      d = fwd ? cars[j].p - cars[i].p : cars[i].p - cars[j].p;
      if (d < 0) d += SPAN;
      if (d >= clear) continue;
      cars[i].p = fwd ? cars[j].p - clear : cars[j].p + clear;
      if (cars[i].p < 0) cars[i].p += SPAN;
      if (cars[i].p >= SPAN) cars[i].p -= SPAN;
    }
  }
}
function rogueX(row){ return (row.dir > 0 ? SPAN - row.rogue.p : row.rogue.p) - PAD; }

/* -------------------------------------------------------------- game state */

var INI_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
var RANKS = [[0,"SDR INTERN"],[18,"AE IN RAMP"],[40,"QUOTA CARRIER"],

    tally:null, booth:null, deathPush:0,
    flyT:0, flyA:0, flyBeep:0, flyMove:0, flyTilt:0, walkPh:0, walkAmt:0, tam:false, tamT:0, tamWins:0, tamWin:null, hurtT:0, nahT:0,
    yumT:0, yumKind:null, yumDir:0, yumBite:0, wowT:0, cheerT:0,
    metro:0, ride:null, trace:null, rides:0, bonus:0, tamLeft:0, riskT:0,
    scene:null, scenesSeen:{}, ticker:null, notice:null, leg:1, po:false, won:false,
    trainT:TRAIN_MAX, trainLine:tr[0], trainDest:tr[1],
    trainHH:16 + ((Math.random()*3)|0), trainMM:(Math.random()*60)|0,
    missedTrain:false,
    shake:0, parts:[], deathName:"", deathObj:"", deathFix:"", deadFor:0,
    steps:0, got:blankPowers(), startedAt:Date.now(), logged:false,
    ini:[0,0,0], iniAt:0,
    t:0, sweep:0
  };
  for (var i=0;i<30;i++) G.parts.push({ life:0, x:0, y:0, vx:0, vy:0, s:0,

/* ====================== SCORES, STATS, LEADERBOARD ========================
   What is collected, exactly: the numbers this game itself produced - score,
   rows walked, streets crossed, power-ups picked up by kind, subway rides, TAM
   wins, whether the run was won and what ended it - plus a random id generated
   on this device so repeat plays can be counted without counting a person
   twice.

   What is NOT collected, deliberately: no name beyond the three initials the
   player types, no user agent, no screen size, no language, no timezone, no
   location. Those need no permission, which is exactly why they are a
   fingerprint, and a hallway game does not need one.

   Everything works with no network at all. If BOARD_API is empty the board is
   this device's own, held in localStorage. Point it at an endpoint and the
   same board becomes everyone's; the local copy stays as the cache and the
   offline fallback. See leaderboard-worker.js for a server that implements the
   four-line contract. */

/* The shared board. An HTTP val (leaderboard/valtown.ts); empty this string
   and the game never opens a socket, which is the RoomOS-safe default. */
var BOARD_API = "https://lucidium2000--be403ca8c25711f194891607ee4eb77e.web.val.run";
var BOARD_MAX = 25;                 // rows kept locally
var BOARD_SHOW = 10;                // rows on screen
var LS_BOARD = "lastmile.board.v1", LS_STATS = "lastmile.stats.v1",
    LS_WHO   = "lastmile.who.v1";
var OFFLINE = /[?&]offline=1/.test(location.search);

/* localStorage is not always there: private windows, blocked site data, and
   kiosk shells that refuse it outright all throw on access. When it does
   throw everything falls back to this object, so the board still fills up for
   as long as the page is open - it just forgets when you leave. */
var MEM = {};
function lsGet(k, d){
  try {
    var v = localStorage.getItem(k);
    if (v !== null) return JSON.parse(v);
    return (k in MEM) ? MEM[k] : d;
  } catch (e){ return (k in MEM) ? MEM[k] : d; }
}
function lsSet(k, v){
  MEM[k] = v;
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e){}
}

/* A random id for this browser. Not derived from anything about the machine -
   it is just a number we made up and wrote down, and clearing site data
   forgets it. */
function playerId(){
  var w = lsGet(LS_WHO, null);
  if (!w || !w.id){
    var id;
    try { id = crypto.randomUUID(); }
    catch (e){ id = "x" + Math.random().toString(36).slice(2) + Date.now().toString(36); }
    w = { id:id, ini:"" };
    lsSet(LS_WHO, w);
  }
  return w;
}
function lastInitials(){ var w = playerId(); return w.ini || ""; }
function rememberInitials(ini){
  var w = playerId(); w.ini = ini; lsSet(LS_WHO, w);
}

var POWER_ORDER = ["tam","chuck","metro","path","agent","insight","traffic","sponsor"];
function blankPowers(){
  var o = {}, i;
  for (i = 0; i < POWER_ORDER.length; i++) o[POWER_ORDER[i]] = 0;
  return o;
}
function statsRead(){
  var st = lsGet(LS_STATS, null);
  if (!st || !st.powers){
    st = { plays:0, wins:0, deaths:0, bestScore:0, bestRows:0,
           steps:0, rows:0, rides:0, tamWins:0, addons:0, secs:0,
           powers:blankPowers(), first:Date.now(), last:0 };
  }
  return st;
}

/* The record for one completed run. */
function runRecord(ini){
  return {
    ini:   ini || "---",
    score: pipeline(),
    rows:  G.maxRow,
    steps: G.steps,
    streets: Math.abs(G.street - START_ST),
    rides: G.rides,
    tamWins: G.tamWins,
    addons: G.addons,
    powers: G.got,
    won:   !!G.won,
    cause: G.won ? "" : (G.missedTrain ? "MISSED TRAIN" : G.deathName),
    secs:  Math.round((Date.now() - G.startedAt) / 1000),
    at:    Date.now()
  };
}

/* Every finished run bumps the counters, whether or not it makes the board. */
function statsBump(rec){
  var st = statsRead(), i, k;
  st.plays++;
  if (rec.won) st.wins++; else st.deaths++;
  if (rec.score > st.bestScore) st.bestScore = rec.score;
  if (rec.rows  > st.bestRows)  st.bestRows  = rec.rows;
  st.steps += rec.steps; st.rows += rec.rows; st.rides += rec.rides;
  st.tamWins += rec.tamWins; st.addons += (rec.addons || 0);
  st.secs += rec.secs; st.last = rec.at;
  for (i = 0; i < POWER_ORDER.length; i++){
    k = POWER_ORDER[i];
    st.powers[k] = (st.powers[k] || 0) + (rec.powers[k] || 0);
  }
  lsSet(LS_STATS, st);
  return st;
}

function boardRead(){ var b = lsGet(LS_BOARD, null); return (b && b.length) ? b : []; }
function boardInsert(rec){
  var b = boardRead();
  b.push(rec);
  b.sort(function(x, y){ return y.score - x.score || x.at - y.at; });
  b = b.slice(0, BOARD_MAX);
  lsSet(LS_BOARD, b);
  return b;
}
/* Where a score would land, 1-based, or 0 if it misses the board entirely. */
function boardRank(score, list){
  var b = list || BOARD.rows, i;
  for (i = 0; i < b.length; i++) if (score > b[i].score) return i + 1;
  return b.length < BOARD_MAX ? b.length + 1 : 0;
}

/* ---- the one place that talks to a network, if there is one to talk to --- */
var BOARD = { rows:boardRead(), state:(BOARD_API && !OFFLINE) ? "…" : "LOCAL",
              global:null, busy:false };

function boardLive(){ return !!BOARD_API && !OFFLINE; }

function boardGET(){
  if (!boardLive() || BOARD.busy) return;
  BOARD.busy = true;
  var done = false, give = function(state){
    if (done) return; done = true; BOARD.busy = false; BOARD.state = state;
  };
  setTimeout(function(){ give(BOARD.state === "…" ? "OFFLINE" : BOARD.state); }, 6000);
  try {
    fetch(BOARD_API + "/top?n=" + BOARD_MAX, { method:"GET", mode:"cors" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (j && j.rows){
          BOARD.rows = j.rows; BOARD.global = j.stats || null;
          lsSet(LS_BOARD, j.rows.slice(0, BOARD_MAX));
          give("LIVE");
        } else give("OFFLINE");
      })
      .catch(function(){ give("OFFLINE"); });
  } catch (e){ give("OFFLINE"); }
}

function boardPOST(rec){
  // local first, always - the board must work with the cable unplugged
  BOARD.rows = boardInsert(rec);
  if (!boardLive()) return;
  try {
    fetch(BOARD_API + "/score", {
      method:"POST", mode:"cors",
      headers:{ "Content-Type":"text/plain" },   // text/plain keeps it a simple
      body: JSON.stringify({                     // request: no CORS preflight
        id: playerId().id, ini: rec.ini, score: rec.score, rows: rec.rows,
        steps: rec.steps, streets: rec.streets, rides: rec.rides,
        tamWins: rec.tamWins, addons: rec.addons, powers: rec.powers, won: rec.won,
        cause: rec.cause, secs: rec.secs
      })
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (j && j.rows){ BOARD.rows = j.rows; BOARD.global = j.stats || null; BOARD.state = "LIVE"; }
      })
      .catch(function(){ BOARD.state = "OFFLINE"; });
  } catch (e){ BOARD.state = "OFFLINE"; }
}

function best(){
  try { return parseInt(localStorage.getItem("lastmile.best") || "0", 10) || 0; }
  catch (e){ return 0; }
}
function saveBest(v){ try { if (v > best()) localStorage.setItem("lastmile.best", String(v)); } catch (e){} }
function rankFor(r){ var n = RANKS[0][1]; for (var i=0;i<RANKS.length;i++) if (r >= RANKS[i][0]) n = RANKS[i][1]; return n; }
function money(r){ return "$" + (r*DOLLARS_PER_ROW).toLocaleString("en-US"); }
/* Signed, because lunch is the one line on the end screen that goes the
   other way and "$-12" is not how anybody writes it. */
function cash(v){
  var n = Math.round(v);
  return (n < 0 ? "\u2212$" : "$") + Math.abs(n).toLocaleString("en-US");
}
/* rows walked, plus whatever Chuck handed over */
/* Floored at nothing. Lunch comes off the number now, and a man who buys a
   bagel on the first block should not owe the company seven dollars. */
function pipeline(){ return Math.max(0, G.maxRow*DOLLARS_PER_ROW + G.bonus); }
function flash(name, line, col){ G.flash = { life:2.2, name:name, line:line, col:col }; }
/* A flash lives in the top strip and lasts two seconds. Some things need the
   middle of the screen and seven. */
function notice(title, line, body, secs, col, art){
  G.notice = { life:secs, max:secs, title:title, line:line, body:body,
               col:col || C.brand, art:art || null };
}

/* current street number, from the furthest road row crossed */
function streetAt(r){
  for (var i=r;i>=0;i--){ var w = rows[i]; if (w && w.streetNo) return w.streetNo; }
  return START_ST;
}
/* A scene used to fire the moment the street number ticked over, which is the
   moment he steps OFF the kerb into the first lane of that crossing. The world
   is frozen behind a cutscene, so he spent it standing in live traffic and
   sceneStepBack had to haul him out afterwards.

   Now it looks one row ahead instead: standing on a pavement, if the next
   crossing belongs to a street with a scene he has not seen, it opens here,
   with the kerb under his feet. The sweep in progress() stays as the backstop
   for arrivals that skip the pavement entirely - a subway ride, or a sponsor
   carrying him three rows at once. */
function sceneLookahead(){
  if (G.state !== ST_PLAY || G.scene || G.ride) return;
  var here = rows[G.maxRow];
  if (!here || here.type !== "safe") return;

  var next = null;
  for (var r = G.maxRow + 1; r <= G.maxRow + 8; r++){
    var w = rows[r];
    if (!w) return;                       // not generated yet; try again later
    if (w.type === "safe") continue;      // still pavement
    next = w.streetNo; break;
  }
  if (next === null) return;

  var table = G.leg > 0 ? SCENES : SCENES_BACK;
  if (table[next] && !G.scenesSeen["L" + G.leg + "_" + next]) startScene(next);
}

function progress(){
  sceneLookahead();
  var st = streetAt(G.maxRow);
  if (st !== G.street){
    var prev = G.street, step = st > prev ? 1 : -1, n;
    G.street = st;
    /* Every street PASSED, not just the one landed on. A subway ride covers
       ten to twenty crossings at once and a sponsor carries three rows, so
       testing only the arrival street silently skipped whatever was in
       between - including, before the cap above, the dinner itself. Scenes
       are one to a jump: the first one found plays, and the walk is not
       long enough for that to matter twice.

       Walking the PO home is its own stretch, so it gets its own scenes and
       its own coaching - the uptown ones are all about getting the meeting,
       which has already happened. */
    for (n = prev + step; ; n += step){
      /* Three percent a crossing - but only for crossings he actually walked.
         A subway ride covers ten to twenty streets sitting down, which is the
         opposite of tiring, and charging him for them made the ride a trap.
         progress() is called from the ride while G.ride is still set, so that
         is the test. */
      if (G.state === ST_PLAY && !G.ride){
        /* A point a street instead of three in two cases. Below 5%, because
           the last few blocks are where a run is lost and a hard floor of two
           crossings turned "nearly out" into "already out" with no chance of
           reaching the next cart. And while he is in the air on a TAM, because
           being carried over the traffic is not walking. */
        var tiring = !(G.hp < HP_CRAWL || G.flyT > 0);
        G.hp -= tiring ? HP_PER_STREET : 1;
        /* Once, the first time he drops into the worn band. The red pulse and
           the face say he is in trouble but neither says what to do about it,
           and the one thing a new player will not work out on their own is
           that walking into a food cart is the fix. */
        if (!G.saidFood && G.hp < HP_WORN && G.hp > 0){
          G.saidFood = true; G.needFood = 2.6; AUDIO.nope();
        }
        if (G.hp <= 0){ G.hp = 0; dieTired(); return; }
      }
      var table = G.leg > 0 ? SCENES : SCENES_BACK;
      if (table[n] && !G.scenesSeen["L" + G.leg + "_" + n] &&
          G.state === ST_PLAY && !G.scene) startScene(n);
      var ms = (G.leg > 0 ? MILESTONES : MILESTONES_BACK)[n];
      if (ms){
        AUDIO.stage();
        G.toast = { a:0, life:3.0, name:ord(n) + " \u2014 " + ms[0], stage:ms[1], line:ms[2] };
      }
      if (n === st) break;
    }
  }
  /* Rebuttals are the payload, but they live on the death screen - and the
     widest, slowest hazards get routed around rather than died to. Coaching
     lines fire between milestones so every objection gets read regardless of
     what kills you. */
  var m = Math.floor((G.maxRow - 6) / 12);
  if (G.maxRow >= 6 && m !== G.coach){
    G.coach = m;
    var k = ALL_HAZ[(Math.random()*ALL_HAZ.length)|0];
    AUDIO.coach();
    flash(lineOf(k)[0], lineOf(k)[1], C.good);
  }
}

/* ------------------------------------------------------------------- input */
function act(dir){
  if (G.state === ST_TITLE){ G.state = ST_PLAY; AUDIO.ui(); return; }
  // nobody takes a call mid-change
  if (G.booth && G.state === ST_PLAY) return;
  if (G.state === ST_DEAD){
    if (G.deadFor > DEATH_HOLD + 0.25){
      /* First tap runs the tally out, second one moves on. Making the player
         sit through four seconds of counting every single death would turn the
         best part of the screen into the worst. */
      if (G.tally && !tallyOver()){ G.tally.rush = true; AUDIO.ui(); }
      else { G.state = ST_NAME; G.iniAt = 0; AUDIO.ui(); }
    }
    return;
  }
  if (G.state === ST_NAME){
    if (dir === "l"){ G.iniAt = (G.iniAt + 2) % 3; AUDIO.step(); }
    else if (dir === "r"){ G.iniAt = (G.iniAt + 1) % 3; AUDIO.step(); }
    else if (dir === "f"){ iniStep(1); }
    else if (dir === "b"){ iniStep(-1); }
    return;
  }
  if (G.state === ST_BOARD){
    if (G.deadFor > DEATH_HOLD + 0.25){ reset(); G.state = ST_PLAY; AUDIO.ui(); }
    return;
  }
  if (G.ride){ rideAct(dir); return; }
  if (G.hop < 1) return;

  var nr = G.row, nc = G.col;
  if (dir === "f") nr++;
  else if (dir === "b") nr--;
  else if (dir === "l"){ nc--; G.facing = -1; }
  else if (dir === "r"){ nc++; G.facing = 1; }

  if (nc < 0 || nc > COLS-1){ AUDIO.bump(); return; }
  if (nr < 0 || nr < G.maxRow - 6){ AUDIO.bump(); return; }
  var target = rows[nr];
  /* A TE-ADDON terminal runs a trace for you. You do not step into
     it - you use it from where you stand - so the kiosk stays solid and is
     spent afterwards. */
  if (target && target.props){
    for (var ki = 0; ki < target.props.length; ki++){
      var kp = target.props[ki];
      if (kp.kind === "kiosk" && kp.col === nc && !kp.used){
        kp.used = true;
        G.revealT = Math.max(G.revealT, POWERS.path.secs);
        G.trace = buildTrace();
        /* The attach. Same money shape as a TAM payout - straight onto the
           pipeline, with a banner that says so - because that is what it
           is. The trace is the feature; the 150k is the deal. */
        G.addons++;
        G.bonus += ADDON_BONUS; G.bonusAddon += ADDON_BONUS;
        G.addonWin = { life:4.4, max:4.4 };
        G.flash = null;                    // the banner replaces it
        AUDIO.deal();
        burst(nc*TILE + TILE/2, rowScreenY(nr) - 40, POWERS.path.col);
        return;
      }
    }
  }
  /* A card lets you swipe in at any subway entrance. Without one, say so -
     walking into a staircase and getting a dull thud told the player nothing
     about why it would not open. */
  if (!G.ride && target && target.props){
    for (var pi = 0; pi < target.props.length; pi++){
      var sw = target.props[pi];
      if (sw.kind === "subway" && sw.col === nc){
        if (sw.exit){
          G.nahT = 0.85;
          AUDIO.bump(); AUDIO.nope();
          flash("YOU JUST CAME UP THOSE",
                "Walk a few blocks. There is another station.", "#ffd24a");
          return;
        }
        if (G.metro > 0){ startRide(nr, nc); return; }
        G.nahT = 0.85;                       // he looks at the turnstile and no
        AUDIO.bump();
        flash("NO METROCARD", "Find one to ride the subway.", "#ffd24a");
      AUDIO.nope();
        return;
      }
    }
  }
  // flying carries you over scaffolding, parked trucks, everything solid
  if (G.flyT <= 0 && target && target.blocked && target.blocked[nc]){
    /* Walk into a bagel cart, a slice counter or a hot dog stand and he stops,
       pays and eats. It costs nothing - the step was already refused - and it
       is the only time anything on the pavement answers back. */
    var foodPr = foodPropAt(target, nc);
    if (propAt(target, nc) === "newsstand"){
      G.wowT = 1.3; AUDIO.wow();
    } else if (eatenFoodAt(target, nc)){
      /* He already bought from this one. The cart is still there, so without
         saying something the refusal looks like the controls ignoring him. */
      G.sadT = 1.1; AUDIO.nope();
    } else if (foodPr){
      foodPr.served = (foodPr.served || 0) + 1;  // that is one off the cart
      G.yumT = EAT_SECS; G.yumKind = foodPr.kind; G.yumBite = 0;
      G.yumDir = nc > G.col ? 1 : (nc < G.col ? -1 : 0);
      // the only thing in the game that puts health back
      var was = G.hp;
      G.hp = Math.min(HP_MAX, G.hp + foodValue(foodPr.kind));
      G.meals = (G.meals || 0) + 1;
      /* And he pays for it. Three dollars against a seven-figure pipeline is
         not a mechanic, it is a joke that lands because the last three digits
         of the headline number stop being zeroes. */
      var price = foodPrice(foodPr.kind);
      G.bonus -= price; G.bonusFood -= price;
      G.hpGain = { life:1.5, amt:Math.round(G.hp - was) };
      AUDIO.pay();
    } else AUDIO.bump();
    return;
  }

  /* The route has its own footsteps. Checked against the square he is
     arriving at, not the one he is leaving, so the note lands with him. */
  var onPath = G.revealT > 0 && G.trace && onTrace(nr, nc);
  if (dir === "f"){
    if (onPath) AUDIO.traceHop(); else AUDIO.hop();
    G.trainT = Math.min(TRAIN_MAX, G.trainT + TRAIN_PER_HOP);
  } else if (onPath) AUDIO.traceStep(); else AUDIO.step();

  /* Somebody is already standing there. The first attempt gets a mouthful
     and no step; the second one goes through and they move. Only while he
     is on a pavement already - a man halfway across 42nd does not stop for
     a conversation, and a refused tap out there would be a death. */
  if (target && target.folk && rows[G.row] && rows[G.row].type === "safe"){
    for (var fb = 0; fb < target.folk.length; fb++){
      var fo = target.folk[fb];
      if (Math.abs(folkRaw(fo) - nc) >= 0.62) continue;
      if (G.t - (fo.blockAt || -99) > FOLK_GRACE){
        fo.blockAt = G.t;
        fo.sayAt = G.t;
        fo.line = FOLK_LINES[(Math.random()*FOLK_LINES.length)|0];
        AUDIO.jostle();
        return;                              // he does not get the square
      }
      /* Second go. They give it up, and shuffle over about it. */
      var away = folkRaw(fo) >= nc ? 1 : -1;
      fo.x0 += away * FOLK_ASIDE;
      fo.slideAt = G.t; fo.slideBack = -away * FOLK_ASIDE;
      fo.blockAt = -99;
      AUDIO.jostle();
      break;
    }
  }

  G.steps++;
  G.fromRow = G.row; G.fromCol = G.col;
  G.row = nr; G.col = nc; G.hop = 0;
  if (nr > G.maxRow){ G.maxRow = nr; progress(); }
  ensureRows(G.maxRow + ROWS_AHEAD);
}

/* On-screen arrows. A cross in the bottom centre, below the player's row so
   it only ever covers blocks already crossed. 92px buttons are ~58mm on a 55"
   Board and ~16mm on a Desk Mini, both comfortably above the ~9mm minimum.
   Swipes and the invisible tap zones still work; the pad simply takes
   priority wherever it is hit. */
/* Top right, not bottom right: the full-screen control is a DOM button in
   the bottom-right corner and the two were drawn on top of each other. */
var MUTE_BTN = { x:LOGICAL_W - 146, y:38, w:114, h:114 };
function muteBtnActive(){
  return G.state === ST_TITLE || G.state === ST_DEAD || G.state === ST_BOARD;
}

/* The run is over: count it once, then go and get three letters for it. A run
   worth nothing still counts as a play - the counter is of games started and
   finished, not of games that went well. */
/* ------------------------------------------------------------- THE TALLY ---
   The end screen used to print one number and stop. A run is twenty minutes of
   decisions and it deserves to be read back: where the money came from, line by
   line, counting up, with the total landing last.

   Built once here rather than in the draw, so the figures cannot drift between
   frames and the audio and the rendering are reading the same object. */
/* A full second between the hit and the paperwork. The end screen used to
   drop over the top of the frame he died on, so the one thing the player most
   wants to see - what actually got him - was covered before he could see it.
   The world keeps running underneath: the money, the shake and the figure all
   stay up.

   It has been lengthened three times. 0.50 was enough to register the hit;
   0.85 got the fall onto the ground; 1.00 let the notes come back down;
   1.50 lets them land and fade out where they fall. The fall finishes at
   0.55 and the longest-lived note at about 1.50, so this is the length of
   the whole thing rather than a pause bolted on the end of it. */
var DEATH_HOLD = 1.50;
var TALLY_T0 = 1.15, TALLY_GAP = 0.80, TALLY_RUN = 0.66, TALLY_TOTAL = 1.15;
function buildTally(){
  var base = G.maxRow * DOLLARS_PER_ROW;
  var rows = [
    { label:"GROUND COVERED", note:G.maxRow + (G.maxRow === 1 ? " block" : " blocks"),
      amt:base, col:C.text },
    { label:"CHUCK BUCKS", note:(G.got.chuck || 0) + " collected",
      amt:G.bonusChuck, col:"#7fd49a" },
    { label:"TAM PAYOUTS", note:G.tamWins + (G.tamWins === 1 ? " win" : " wins"),
      amt:G.bonusTam, col:C.pw5 },
    { label:"TE-ADDONS", note:G.addons + (G.addons === 1 ? " terminal" : " terminals"),
      amt:G.bonusAddon, col:POWERS.path.col },
    { label:"LUNCH", note:G.meals + (G.meals === 1 ? " bought" : " bought"),
      amt:G.bonusFood, col:C.textDim }
  ];
  var powers = 0;
  for (var k in G.got) powers += G.got[k];
  G.tally = {
    t:0, rush:false, tick:0, done:{},
    rows:rows, total:pipeline(),
    stats:[
      ["STEPS", G.steps],
      ["SUBWAY", G.rides],
      ["ADD-ONS", G.addons],
      ["MEALS", G.meals],
      ["POWER-UPS", powers],
      ["FURTHEST", "W " + Math.max(START_ST, G.street) + " ST"]
    ],
    was:best()
  };
}
/* How far through a row's count we are, 0..1. `rush` is a tap landing before
   the tally has finished: it should not be a wall the player has to wait out. */
function tallyAt(i){
  var T = G.tally;
  if (!T) return 0;
  if (T.rush) return 1;
  var start = TALLY_T0 + i * TALLY_GAP;
  return Math.max(0, Math.min(1, (T.t - start) / TALLY_RUN));
}
function tallyTotalAt(){
  var T = G.tally;
  if (!T) return 0;
  if (T.rush) return 1;
  var start = TALLY_T0 + T.rows.length * TALLY_GAP + 0.25;
  return Math.max(0, Math.min(1, (T.t - start) / TALLY_TOTAL));
}
function tallyOver(){
  var T = G.tally;
  return !T || T.rush || tallyTotalAt() >= 1;
}
/* The counting noise, scheduled from update so the renderer stays silent. One
   tick every 55ms while anything is still climbing, and a cue as each line
   lands - a run of ticks with nothing at the end of it is a stuck machine. */
function tallyAudio(dt){
  var T = G.tally;
  if (!T) return;
  var i, climbing = false;
  for (i = 0; i < T.rows.length; i++){
    var k = tallyAt(i);
    if (T.rows[i].amt > 0 && k > 0 && k < 1) climbing = true;
